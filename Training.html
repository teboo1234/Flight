<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<title>G-STRONG Training Log</title>
<meta name="theme-color" content="#12161d" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="G-STRONG" />
<meta name="mobile-web-app-capable" content="yes" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=B612:wght@400;700&family=B612+Mono:wght@400;700&display=swap" rel="stylesheet" />
<style>
  :root{
    --accent:#c9922a; --teal:#3a9e82; --navy-line:#5b7bb8;
    --bg:#12161d; --panel:#181e28; --panel-border:#2a3341; --text-dim:#7c8798;
    --ink:#f4f6f9;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; padding:0; background:var(--bg); color:var(--ink);
    font-family:'B612', -apple-system, sans-serif; }
  body{ padding-bottom:env(safe-area-inset-bottom); }
  #app{ max-width:480px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column; }
  input::placeholder{ color:#4a5568; }
  button{ font-family:inherit; cursor:pointer; border:none; background:none; color:inherit; }
  input{ font-family:inherit; }
  .mono{ font-family:'B612 Mono', monospace; }
  .blip{ font-family:'B612 Mono', monospace; letter-spacing:0.08em; color:var(--text-dim); font-size:11px; text-transform:uppercase; }
  .row{ display:flex; align-items:center; }
  .between{ justify-content:space-between; }
  .gap2{ gap:8px; } .gap1{ gap:4px; }
  .px4{ padding-left:16px; padding-right:16px; }
  .header{ padding:20px 16px 12px; border-bottom:1px solid var(--panel-border); flex-shrink:0; }
  .tag{ font-family:'B612 Mono', monospace; color:var(--accent); font-size:11px; letter-spacing:0.15em; }
  .title{ font-size:22px; margin-top:2px; }
  .day-scroll{ display:flex; gap:8px; padding:16px 16px 10px; overflow-x:auto; }
  .day-chip{ padding:8px 12px; border-radius:6px; font-size:12px; letter-spacing:0.04em; white-space:nowrap;
    border:1px solid var(--panel-border); color:var(--text-dim); display:flex; align-items:center; gap:6px; flex-shrink:0; }
  .day-chip.active{ background:var(--accent); color:#1a1206; border-color:var(--accent); }
  .content{ padding:0 16px 24px; flex:1; }
  .card{ background:var(--panel); border:1px solid var(--panel-border); border-radius:10px; padding:12px; }
  .lastweek-banner{ background:var(--panel); border:1px solid var(--panel-border); border-radius:10px; padding:10px 12px; margin-bottom:14px; }
  .checkbox-row{ display:flex; align-items:center; gap:8px; margin-bottom:16px; padding:10px 12px; border-radius:10px;
    background:var(--panel); border:1px solid var(--panel-border); cursor:pointer; }
  .checkbox-row.done{ border-color:var(--teal); }
  .checkbox-row input{ width:18px; height:18px; accent-color:var(--teal); }
  .exercise-card{ margin-bottom:10px; }
  .ex-name-btn{ display:flex; align-items:center; gap:8px; }
  .dot{ width:5px; height:5px; border-radius:99px; background:var(--teal); }
  input.set-input{ width:60px; border-radius:6px; padding:6px 8px; background:#0e1218; border:1px solid var(--panel-border);
    color:#fff; font-size:13px; }
  .diagram-wrap{ display:flex; flex-direction:column; align-items:center; justify-content:center; padding:10px 8px; margin-bottom:8px;
    background:#0e1218; border-radius:6px; border:1px solid var(--panel-border); }
  .frame{ display:flex; flex-direction:column; align-items:center; }
  .frame-label{ font-family:'B612 Mono', monospace; font-size:9px; letter-spacing:0.1em; color:var(--text-dim); margin-top:-4px; }
  .save-btn{ width:100%; margin-top:18px; padding:13px; border-radius:10px; display:flex; align-items:center; justify-content:center;
    gap:8px; font-size:14px; letter-spacing:0.04em; background:var(--accent); color:#12161d; }
  .save-btn.disabled{ background:var(--panel); color:var(--text-dim); border:1px solid var(--panel-border); }
  .save-btn.saved{ background:var(--teal); }
  .add-set-btn{ display:flex; align-items:center; gap:5px; margin-top:6px; padding:5px 8px; color:var(--teal); font-size:12px; }
  .remove-set-btn{ margin-left:auto; padding:6px; color:var(--text-dim); }
  .dashed-btn{ width:100%; padding:11px; border-radius:10px; border:1px dashed var(--panel-border); color:var(--text-dim);
    font-size:12px; display:flex; align-items:center; justify-content:center; gap:6px; }
  .add-form{ border:1px solid var(--accent); border-radius:10px; padding:12px; display:flex; flex-direction:column; gap:8px; }
  .add-form input{ width:100%; border-radius:6px; padding:8px; background:#0e1218; border:1px solid var(--panel-border); color:#fff; font-size:13px; }
  .form-btns{ display:flex; gap:8px; }
  .form-btns button{ flex:1; padding:8px; border-radius:6px; font-size:12px; }
  .btn-primary{ background:var(--accent); color:#1a1206; }
  .btn-secondary{ border:1px solid var(--panel-border); color:var(--text-dim); }
  .set-line{ display:flex; align-items:center; gap:8px; margin-bottom:6px; }
  .idx{ color:var(--text-dim); font-size:11px; width:14px; }
  .x{ color:var(--text-dim); font-size:11px; }
  .bottom-nav{ display:flex; background:#0e1218; border-top:1px solid var(--panel-border); position:sticky; bottom:0; flex-shrink:0; }
  .nav-btn{ flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; padding:10px 0 12px; color:var(--text-dim); border-top:2px solid transparent; }
  .nav-btn.active{ color:var(--accent); border-top-color:var(--accent); background:rgba(201,146,42,0.06); }
  .nav-btn svg{ width:18px; height:18px; }
  .nav-label{ font-size:10px; letter-spacing:0.06em; }
  .history-card{ margin-bottom:10px; }
  .history-ex-row{ display:flex; justify-content:space-between; font-size:12px; margin-bottom:2px; }
  .guide-section{ margin-bottom:20px; }
  .guide-head{ display:flex; align-items:center; gap:8px; margin-bottom:8px; }
  .day-pill{ font-size:12px; color:#1a1206; background:var(--accent); padding:2px 7px; border-radius:4px; }
  .guide-card{ margin-bottom:8px; }
  .empty{ text-align:center; padding:40px 0; }
  .progress-chip{ padding:6px 10px; border-radius:6px; font-size:11px; white-space:nowrap; border:1px solid var(--panel-border); color:var(--text-dim); flex-shrink:0; }
  .progress-chip.active{ background:var(--accent); color:#1a1206; border-color:var(--accent); }
  .chip-scroll{ display:flex; gap:8px; overflow-x:auto; margin:8px 0 14px; }
  .big-number{ font-size:28px; color:#fff; margin-top:4px; }
  @media (prefers-reduced-motion: reduce){ *{ transition:none!important; animation:none!important; } }
</style>

        name: "G-STRONG Training Log",

        background_color: "#12161d",
        theme_color: "#12161d",

      var blob = new Blob([JSON.stringify(manifest)], { type: "application/json" });
      var manifestLink = document.createElement('link');
      manifestLink.rel = 'manifest';
      manifestLink.href = URL.createObjectURL(blob);
      document.head.appendChild(manifestLink);

  }

    try{ localStorage.setItem(key, JSON.stringify(value)); }catch(e){ /* storage full or unavailable */ }

  function escapeHtml(str){
    return String(str).replace(/[&<>"']/g, function(c){
      return { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c];
    });
  }

  function todayISO(){ return new Date().toISOString().slice(0,10); }

  function getWeekKey(d){
    d = d || new Date();
    var date = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
    var dayNum = (date.getUTCDay() + 6) % 7;
    date.setUTCDate(date.getUTCDate() - dayNum + 3);
    var firstThursday = new Date(Date.UTC(date.getUTCFullYear(), 0, 4));
    var weekNum = 1 + Math.round(((date - firstThursday) / 86400000 - 3 + ((firstThursday.getUTCDay() + 6) % 7)) / 7);
    return date.getUTCFullYear() + "-W" + String(weekNum).padStart(2, "0");
  }
  function prevWeekDate(){ return new Date(Date.now() - 7*86400000); }
  function fmtDate(iso){

  function equipmentSvg(type, at, stroke){
    if(!type || !at) return "";
    var x = at[0], y = at[1];
    if(type === "db"){
      return '<g stroke="'+stroke+'" stroke-width="2.75" fill="none" stroke-linecap="round">' +
        '<line x1="'+(x-7)+'" y1="'+y+'" x2="'+(x+7)+'" y2="'+y+'"/>' +
        '<rect x="'+(x-10.5)+'" y="'+(y-4)+'" width="5" height="8" rx="1.5" fill="#12161d"/>' +
        '<rect x="'+(x+5.5)+'" y="'+(y-4)+'" width="5" height="8" rx="1.5" fill="#12161d"/></g>';
    }
    if(type === "kb"){
      return '<g stroke="'+stroke+'" stroke-width="2.75" fill="none" stroke-linecap="round">' +
        '<path d="M '+(x-4)+' '+(y-3)+' q 4 -6 8 0"/>' +
        '<circle cx="'+x+'" cy="'+(y+5)+'" r="7" fill="#12161d"/></g>';
    }
    return "";
  }

  function stickFigureSvg(pose, opts){
    opts = opts || {};
    var size = 100;
    var p = pose;
    var hasBackLeg = p.backKnee && p.backFoot;
    var joints = [p.shoulder, p.elbow, p.hip, p.knee];
    var g = '<g' + (opts.mirror ? ' transform="translate('+size+',0) scale(-1,1)"' : '') + '>';
    if(hasBackLeg){
      g += '<polyline points="'+p.hip[0]+','+p.hip[1]+' '+p.backKnee[0]+','+p.backKnee[1]+' '+p.backFoot[0]+','+p.backFoot[1]+
        '" fill="none" stroke="#7c8798" stroke-width="3.5" stroke-linecap="round"/>';
    }
    g += '<polyline points="'+p.foot[0]+','+p.foot[1]+' '+p.knee[0]+','+p.knee[1]+' '+p.hip[0]+','+p.hip[1]+' '+p.shoulder[0]+','+p.shoulder[1]+
      '" fill="none" stroke="#f4f6f9" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>';
    g += '<polyline points="'+p.shoulder[0]+','+p.shoulder[1]+' '+p.elbow[0]+','+p.elbow[1]+' '+p.hand[0]+','+p.hand[1]+
      '" fill="none" stroke="#c9922a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>';
    g += '<circle cx="'+p.head[0]+'" cy="'+p.head[1]+'" r="7.5" fill="#12161d" stroke="#f4f6f9" stroke-width="3.5"/>';
    joints.forEach(function(j, i){
      g += '<circle cx="'+j[0]+'" cy="'+j[1]+'" r="2.2" fill="#12161d" stroke="'+(i===1 ? '#c9922a' : '#f4f6f9')+'" stroke-width="2"/>';
    });
    g += equipmentSvg(opts.equipment, p.hand, "#3a9e82");
    if(opts.mirrorEquipment){
      g += '<g transform="translate('+size+',0) scale(-1,1)">' + equipmentSvg(opts.equipment, p.hand, "#3a9e82") + '</g>';
    }
    g += '</g>';
    return g;
  }

  // ---------------------------------------------------------------------
  // Front-view figures — a single face-on pose per exercise, showing
  // stance width and left/right symmetry that the side view can't.
  // Templates are authored for the right side; the left side is produced
  // by mirroring x around the centre line (x=50).
  // ---------------------------------------------------------------------
  var ARM_R = {
    down:{ elbow:[66,40], hand:[68,52] },
    up:{ elbow:[66,14], hand:[66,2] },
    out:{ elbow:[81,22], hand:[95,20] },
    bentLow:{ elbow:[66,40], hand:[58,32] },
    overheadBent:{ elbow:[56,13], hand:[63,19] },
    overheadExt:{ elbow:[58,9], hand:[58,1] },
    forward:{ elbow:[68,28], hand:[56,26] },
    rack:{ elbow:[60,32], hand:[54,24] }
  };
  var LEG_R = {
    normal:{ hip:[58,50], knee:[58,66], foot:[58,80] },
    wide:{ hip:[58,50], knee:[68,66], foot:[74,80] },
    narrow:{ hip:[54,50], knee:[54,66], foot:[54,80] },
    staggeredFront:{ hip:[58,50], knee:[58,64], foot:[58,78] },
    staggeredBack:{ hip:[58,50], knee:[66,58], foot:[76,48] },
    liftedBack:{ hip:[58,50], knee:[66,58], foot:[72,50] },
    raisedForward:{ hip:[58,50], knee:[58,34], foot:[58,20] }
  };
  var RIGHT_SHOULDER = [62,26], LEFT_SHOULDER = [38,26];

  function mirrorPt(p){ return [100 - p[0], p[1]]; }

  function frontFigureSvg(cfg){
    var rArm = ARM_R[cfg.rightArm], lArmR = ARM_R[cfg.leftArm];
    var rLeg = LEG_R[cfg.rightLeg], lLegR = LEG_R[cfg.leftLeg];
    var lArm = { elbow: mirrorPt(lArmR.elbow), hand: mirrorPt(lArmR.hand) };
    var lLeg = { hip: mirrorPt(lLegR.hip), knee: mirrorPt(lLegR.knee), foot: mirrorPt(lLegR.foot) };

    function legLine(leg, dim){
      return '<polyline points="'+leg.foot[0]+','+leg.foot[1]+' '+leg.knee[0]+','+leg.knee[1]+' '+leg.hip[0]+','+leg.hip[1]+
        '" fill="none" stroke="'+(dim ? '#5b6472' : '#f4f6f9')+'" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>';
    }
    function armLine(shoulder, arm, dim){
      return '<polyline points="'+shoulder[0]+','+shoulder[1]+' '+arm.elbow[0]+','+arm.elbow[1]+' '+arm.hand[0]+','+arm.hand[1]+
        '" fill="none" stroke="'+(dim ? '#8a7550' : '#c9922a')+'" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>';
    }

    var svg = "";
    svg += legLine(rLeg, cfg.dimRightLeg) + legLine(lLeg, cfg.dimLeftLeg);
    svg += '<polygon points="'+LEFT_SHOULDER.join(",")+' '+RIGHT_SHOULDER.join(",")+' '+rLeg.hip.join(",")+' '+lLeg.hip.join(",")+
      '" fill="#20293a" stroke="#f4f6f9" stroke-width="3"/>';
    svg += armLine(RIGHT_SHOULDER, rArm, cfg.dimRightArm) + armLine(LEFT_SHOULDER, lArm, cfg.dimLeftArm);
    svg += '<circle cx="50" cy="13" r="8.5" fill="#12161d" stroke="#f4f6f9" stroke-width="3.5"/>';
    [RIGHT_SHOULDER, LEFT_SHOULDER, rLeg.hip, lLeg.hip].forEach(function(j){
      svg += '<circle cx="'+j[0]+'" cy="'+j[1]+'" r="2.2" fill="#12161d" stroke="#f4f6f9" stroke-width="2"/>';
    });

    var equip = cfg.equipment;
    if(equip){
      if(cfg.equipSide === "both" || !cfg.equipSide){
        svg += equipmentSvg(equip, rArm.hand, "#3a9e82") + equipmentSvg(equip, lArm.hand, "#3a9e82");
      } else if(cfg.equipSide === "right"){
        svg += equipmentSvg(equip, rArm.hand, "#3a9e82");
      } else if(cfg.equipSide === "left"){
        svg += equipmentSvg(equip, lArm.hand, "#3a9e82");
      } else if(cfg.equipSide === "center"){
        var mid = [(rArm.hand[0] + lArm.hand[0]) / 2, (rArm.hand[1] + lArm.hand[1]) / 2];
        svg += equipmentSvg(equip, mid, "#3a9e82");
      }
    }
    return svg;
  }

  var FRONT_CONFIGS = {
    "DB Bench Press":{ leftArm:"bentLow", rightArm:"bentLow", leftLeg:"normal", rightLeg:"normal", equipment:"db", equipSide:"both" },
    "DB Shoulder Press":{ leftArm:"up", rightArm:"up", leftLeg:"normal", rightLeg:"normal", equipment:"db", equipSide:"both" },
    "Ring Dips":{ leftArm:"down", rightArm:"down", leftLeg:"narrow", rightLeg:"narrow", equipment:null },
    "DB Lateral Raise":{ leftArm:"out", rightArm:"out", leftLeg:"normal", rightLeg:"normal", equipment:"db", equipSide:"both" },
    "DB Tricep Extension":{ leftArm:"overheadBent", rightArm:"overheadBent", leftLeg:"normal", rightLeg:"normal", equipment:"db", equipSide:"both" },
    "DB Goblet Squat":{ leftArm:"rack", rightArm:"rack", leftLeg:"wide", rightLeg:"wide", equipment:"db", equipSide:"center" },
    "KB Single-Leg RDL":{ leftArm:"down", rightArm:"down", leftLeg:"liftedBack", rightLeg:"normal", equipment:"kb", equipSide:"right", dimLeftLeg:true },
    "DB Bulgarian Split Squat":{ leftArm:"down", rightArm:"down", leftLeg:"staggeredBack", rightLeg:"staggeredFront", equipment:"db", equipSide:"both", dimLeftLeg:true },
    "KB Swings":{ leftArm:"down", rightArm:"down", leftLeg:"wide", rightLeg:"wide", equipment:"kb", equipSide:"center" },
    "Hanging Leg Raises":{ leftArm:"up", rightArm:"up", leftLeg:"raisedForward", rightLeg:"raisedForward", equipment:null },
    "Ring Pull-Ups":{ leftArm:"up", rightArm:"up", leftLeg:"narrow", rightLeg:"narrow", equipment:null },
    "DB Bent-Over Row":{ leftArm:"down", rightArm:"down", leftLeg:"normal", rightLeg:"normal", equipment:"db", equipSide:"both" },
    "DB Single-Arm Row":{ leftArm:"rack", rightArm:"down", leftLeg:"normal", rightLeg:"normal", equipment:"db", equipSide:"right", dimLeftArm:true },
    "Band Pull-Apart":{ leftArm:"out", rightArm:"out", leftLeg:"normal", rightLeg:"normal", equipment:null },
    "Standing DB Biceps Curl":{ leftArm:"bentLow", rightArm:"bentLow", leftLeg:"normal", rightLeg:"normal", equipment:"db", equipSide:"both" },
    "KB Clean & Press":{ leftArm:"down", rightArm:"rack", leftLeg:"normal", rightLeg:"normal", equipment:"kb", equipSide:"right", dimLeftArm:true },
    "DB Thruster":{ leftArm:"up", rightArm:"up", leftLeg:"wide", rightLeg:"wide", equipment:"db", equipSide:"both" },
    "Swing→Squat Complex":{ leftArm:"down", rightArm:"down", leftLeg:"wide", rightLeg:"wide", equipment:"kb", equipSide:"center" },
    "Ring Inverted Row":{ leftArm:"up", rightArm:"up", leftLeg:"narrow", rightLeg:"narrow", equipment:null },
    "Single-Arm Elbow-Out DB Row":{ leftArm:"rack", rightArm:"out", leftLeg:"normal", rightLeg:"normal", equipment:"db", equipSide:"right", dimLeftArm:true },
    "Decline Weighted Sit-Up":{ leftArm:"bentLow", rightArm:"bentLow", leftLeg:"wide", rightLeg:"wide", equipment:"db", equipSide:"center" },
    "Side Plank":{ leftArm:"down", rightArm:"up", leftLeg:"narrow", rightLeg:"narrow", equipment:null },
    "Front Plank":{ leftArm:"bentLow", rightArm:"bentLow", leftLeg:"narrow", rightLeg:"narrow", equipment:null },
    "DB Fly":{ leftArm:"out", rightArm:"out", leftLeg:"normal", rightLeg:"normal", equipment:"db", equipSide:"both" },
    "Arnold Press":{ leftArm:"rack", rightArm:"rack", leftLeg:"normal", rightLeg:"normal", equipment:"db", equipSide:"both" },
    "Seated DB Press":{ leftArm:"up", rightArm:"up", leftLeg:"normal", rightLeg:"normal", equipment:"db", equipSide:"both" },
    "TRX Row":{ leftArm:"forward", rightArm:"forward", leftLeg:"normal", rightLeg:"normal", equipment:null },
    "TRX Chest Press":{ leftArm:"forward", rightArm:"forward", leftLeg:"normal", rightLeg:"normal", equipment:null },
    "TRX Squat":{ leftArm:"forward", rightArm:"forward", leftLeg:"wide", rightLeg:"wide", equipment:null },
    "TRX Pike":{ leftArm:"down", rightArm:"down", leftLeg:"narrow", rightLeg:"narrow", equipment:null },
    "Farmer Carry":{ leftArm:"down", rightArm:"down", leftLeg:"normal", rightLeg:"normal", equipment:"db", equipSide:"both" }
  };

  function exerciseDiagramHtml(name){
    var cfg = EXERCISE_DIAGRAMS[name];
    if(!cfg) return "";
    var poseA = POSES[cfg.frames[0]], poseB = POSES[cfg.frames[1]];
    var showGround = !cfg.rings && !cfg.bar;
    function frame(pose, label){
      var extras = "";
      if(cfg.bench) extras += '<rect x="12" y="49" width="72" height="5" rx="1.5" fill="none" stroke="#5b7bb8" stroke-width="2.5"/>';
      if(cfg.bar) extras += '<line x1="8" y1="16" x2="92" y2="16" stroke="#5b7bb8" stroke-width="3"/>';
      if(cfg.rings) extras += '<line x1="50" y1="0" x2="50" y2="6" stroke="#5b7bb8" stroke-width="2.5"/>';
      if(showGround) extras += '<line x1="6" y1="82" x2="94" y2="82" stroke="#2a3341" stroke-width="2" stroke-dasharray="1 4"/>';
      return '<div class="frame"><svg viewBox="0 0 100 92" width="98" height="90">' + extras +
        stickFigureSvg(pose, { equipment:cfg.equipment, mirrorEquipment:cfg.dual }) +
        '</svg><span class="frame-label">' + label + '</span></div>';
    }
    var sideHtml = '<div class="row" style="gap:2px">' +
      frame(poseA, "START") +
      '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#c9922a" stroke-width="3" style="margin-bottom:12px;flex-shrink:0"><path d="M9 6l6 6-6 6"/></svg>' +
      frame(poseB, "FINISH") +
      '</div>';

    var frontCfg = FRONT_CONFIGS[name];
    var frontHtml = "";
    if(frontCfg){
      frontHtml = '<div class="frame" style="margin-top:2px"><svg viewBox="0 0 100 92" width="128" height="118">' +
        '<line x1="4" y1="82" x2="96" y2="82" stroke="#2a3341" stroke-width="2" stroke-dasharray="1 4"/>' +
        frontFigureSvg(frontCfg) +
        '</svg><span class="frame-label">FRONT</span></div>';
    }

    return '<div class="blip" style="margin-bottom:4px">SIDE</div>' + sideHtml +
      (frontHtml ? '<div class="blip" style="margin:8px 0 2px">FRONT</div><div class="row" style="justify-content:center">' + frontHtml + '</div>' : '');
  }

  // ---------------------------------------------------------------------
  // Icons (small inline SVGs, replacing lucide for a dependency-free file)
  // ---------------------------------------------------------------------
  var ICONS = {
    check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>',
    chevronDown:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>',
    plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>',
    minus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/></svg>',
    log:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01"/></svg>',
    guide:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20M4 4.5A2.5 2.5 0 0 1 6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15Z"/></svg>',
    history:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>',
    progress:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 6l-9.5 9.5-5-5L1 18"/></svg>',
    gauge:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 14l4-4M3 20a9 9 0 1 1 18 0"/></svg>'
  };

  // ---------------------------------------------------------------------
  // State
  // ---------------------------------------------------------------------
  function buildInitialExerciseLists(){
    var stored = loadJSON(KEYS.exercises, null);
    if(stored) return stored;
    // Seed from the built-in program, then fold in anything added under the
    // older "custom exercise" storage so nobody's additions are lost.
    var seeded = {};
    PROGRAM.forEach(function(day){ seeded[day.id] = day.exercises.map(function(e){ return Object.assign({}, e); }); });
    var legacy = loadJSON(KEYS.legacyCustom, null);
    if(legacy){
      Object.keys(legacy).forEach(function(dayId){
        if(!seeded[dayId]) seeded[dayId] = [];
        (legacy[dayId] || []).forEach(function(e){
          if(!seeded[dayId].some(function(x){ return x.name === e.name; })) seeded[dayId].push(e);
        });
      });
    }
    saveJSON(KEYS.exercises, seeded);
    return seeded;
  }

  var state = {
    tab: "session",
    dayId: "A",
    sessions: loadJSON(KEYS.sessions, []),
    exerciseLists: buildInitialExerciseLists(), // { A: [{name,target,key?}], B: [...], ... }
    dailyCompletions: loadJSON(KEYS.daily, {}), // { "2026-07-20": ["A","C"] }
    setsDraft: {}, // in-memory only: { dayId: { exerciseName: [{weight,reps}] } }
    shownDiagram: null,
    addingExercise: false,
    newExName: "",
    newExTarget: "",
    justSaved: false,
    progressExercise: null
  };

  function exercisesForDay(dayId){
    return state.exerciseLists[dayId] || [];
  }

  function addExercise(dayId, name, target){
    var next = Object.assign({}, state.exerciseLists);
    next[dayId] = (next[dayId] || []).concat([{ name:name, target:target }]);
    state.exerciseLists = next;
    saveJSON(KEYS.exercises, next);
  }

  function removeExercise(dayId, name){
    var next = Object.assign({}, state.exerciseLists);
    next[dayId] = (next[dayId] || []).filter(function(e){ return e.name !== name; });
    state.exerciseLists = next;
    saveJSON(KEYS.exercises, next);
  }

  function lastWeight(name){
    for(var i = state.sessions.length - 1; i >= 0; i--){
      var s = state.sessions[i];
      var ex = s.exercises.find(function(e){ return e.name === name; });
      if(ex && ex.sets.length){
        var max = Math.max.apply(null, ex.sets.map(function(x){ return Number(x.weight) || 0; }));
        if(max) return max;
      }
    }
    return null;
  }

  // Weekly tally derived from daily completions: for each day-type, whether
  // it was completed at least once in the given week, and the most recent date.
  function weekTally(weekKey){
    var result = {};
    PROGRAM.forEach(function(d){ result[d.id] = null; });
    Object.keys(state.dailyCompletions).forEach(function(dateStr){
      if(getWeekKey(new Date(dateStr + "T00:00:00")) !== weekKey) return;
      (state.dailyCompletions[dateStr] || []).forEach(function(dayId){
        if(!result[dayId] || result[dayId] < dateStr) result[dayId] = dateStr;
      });
    });
    return result;
  }

  function isDoneToday(dayId){
    return (state.dailyCompletions[todayISO()] || []).indexOf(dayId) !== -1;
  }

  function toggleToday(dayId){
    var t = todayISO();
    var arr = (state.dailyCompletions[t] || []).slice();
    var idx = arr.indexOf(dayId);
    if(idx === -1) arr.push(dayId); else arr.splice(idx, 1);
    var next = Object.assign({}, state.dailyCompletions);
    if(arr.length) next[t] = arr; else delete next[t];
    state.dailyCompletions = next;
    saveJSON(KEYS.daily, next);
    render();
  }

  // ---------------------------------------------------------------------
  // Rendering
  // ---------------------------------------------------------------------
  function render(){
    var app = document.getElementById("app");
    app.innerHTML =
      renderHeader() +
      '<div class="content">' + renderTabContent() + '</div>' +
      renderNav();
  }

  function renderHeader(){
    return '<div class="header"><div class="row between">' +
      '<div><div class="tag">G-STRONG</div><div class="title">Training Log</div></div>' +
      '<div style="text-align:right"><div class="blip">LEAN + STRENGTH</div>' +
      '<div class="mono" style="color:var(--teal);font-size:11px">4-DAY CYCLE</div></div>' +
      '</div></div>';
  }

  function renderNav(){
    var tabs = [
      { id:"session", icon:"log", label:"LOG" },
      { id:"guide", icon:"guide", label:"GUIDE" },
      { id:"history", icon:"history", label:"HISTORY" },
      { id:"progress", icon:"progress", label:"PROGRESS" }
    ];
    return '<div class="bottom-nav">' + tabs.map(function(t){
      return '<button class="nav-btn' + (state.tab === t.id ? ' active' : '') + '" data-action="switch-tab" data-tab="' + t.id + '">' +
        ICONS[t.icon] + '<span class="nav-label">' + t.label + '</span></button>';
    }).join("") + '</div>';
  }

  function renderTabContent(){
    if(state.tab === "session") return renderSessionTab();
    if(state.tab === "guide") return renderGuideTab();
    if(state.tab === "history") return renderHistoryTab();
    if(state.tab === "progress") return renderProgressTab();
    return "";
  }

  function renderSessionTab(){
    var day = PROGRAM.find(function(d){ return d.id === state.dayId; });
    var exercises = exercisesForDay(state.dayId);
    var daySets = state.setsDraft[state.dayId] || {};
    var loggedCount = Object.keys(daySets).reduce(function(a, name){
      return a + (daySets[name] || []).filter(function(s){ return s.weight !== "" || s.reps !== ""; }).length;
    }, 0);
    var currentWeekKey = getWeekKey();
    var prevWeekKey = getWeekKey(prevWeekDate());
    var thisWeek = weekTally(currentWeekKey);
    var lastWeek = weekTally(prevWeekKey);
    var hasLastWeekData = PROGRAM.some(function(d){ return !!lastWeek[d.id]; });

    var html = '<div class="day-scroll">';
    PROGRAM.forEach(function(d){
      var done = !!thisWeek[d.id];
      html += '<button class="day-chip' + (state.dayId === d.id ? ' active' : '') + '" data-action="switch-day" data-day="' + d.id + '">';
      if(done) html += '<span style="width:14px;height:14px;display:inline-flex">' + ICONS.check + '</span>';
      html += d.id + ' · ' + d.name + '</button>';
    });
    html += '</div>';

    html += '<div class="row between" style="margin-bottom:12px;align-items:baseline">' +
      '<div><div style="font-size:20px;color:#fff;letter-spacing:0.02em">' + day.name + '</div>' +
      '<div class="blip">' + todayISO() + ' · SESSION ' + day.id + '</div></div>' +
      '<div class="blip">' + loggedCount + ' SETS LOGGED</div></div>';

    if(hasLastWeekData){
      html += '<div class="lastweek-banner"><div class="blip" style="margin-bottom:6px">LAST WEEK\u2019S RESULTS</div><div class="row" style="flex-wrap:wrap;gap:10px">';
      PROGRAM.forEach(function(d){
        var date = lastWeek[d.id];
        html += '<div class="row gap1">' +
          '<span style="width:13px;height:13px;display:inline-flex;color:' + (date ? "var(--teal)" : "var(--panel-border)") + '">' + ICONS.check + '</span>' +
          '<span class="mono" style="font-size:11px;color:' + (date ? "#c3cad6" : "var(--text-dim)") + '">' + d.id + (date ? " · " + fmtDate(date) : "") + '</span>' +
          '</div>';
      });
      html += '</div></div>';
    }

    var todayDone = isDoneToday(state.dayId);
    html += '<label class="checkbox-row' + (todayDone ? ' done' : '') + '">' +
      '<input type="checkbox" ' + (todayDone ? 'checked' : '') + ' data-action="toggle-today" data-day="' + state.dayId + '"/>' +
      '<span style="font-size:13px;color:' + (todayDone ? "var(--teal)" : "#c3cad6") + '">Completed today</span>' +
      (todayDone ? '<span class="blip">· ' + fmtDate(todayISO()) + '</span>' : '') +
      '</label>';

    html += '<div>';
    exercises.forEach(function(ex){
      var ref = lastWeight(ex.name);
      var exSets = daySets[ex.name] || [];
      var hasDiagram = !!EXERCISE_DIAGRAMS[ex.name];
      var showDiagram = state.shownDiagram === ex.name && hasDiagram;

      html += '<div class="card exercise-card">';
      html += '<div class="row between" style="margin-bottom:8px">';
      html += '<button class="ex-name-btn" data-action="toggle-diagram" data-exercise="' + escapeHtml(ex.name) + '">';
      if(ex.key) html += '<span class="dot"></span>';
      html += '<span style="font-size:14px;color:#e8ecf1">' + escapeHtml(ex.name) + '</span>';
      if(hasDiagram) html += '<span style="width:13px;height:13px;display:inline-flex;transform:rotate(' + (showDiagram ? "180deg" : "0deg") + ')">' + ICONS.chevronDown + '</span>';
      html += '</button>';
      html += '<div class="row gap2">';
      html += '<span class="blip">' + escapeHtml(ex.target) + (ref ? " · LAST " + ref + "KG" : "") + '</span>';
      html += '<button data-action="remove-exercise" data-day="' + state.dayId + '" data-exercise="' + escapeHtml(ex.name) + '" style="color:var(--text-dim);width:13px;height:13px;display:inline-flex" aria-label="Remove exercise">' + ICONS.minus + '</button>';
      html += '</div></div>';

      if(showDiagram){
        html += '<div class="diagram-wrap">' + exerciseDiagramHtml(ex.name) + '</div>';
      }

      html += '<div>';
      exSets.forEach(function(s, idx){
        html += '<div class="set-line">' +
          '<span class="idx mono">' + (idx+1) + '</span>' +
          '<input class="set-input" inputmode="decimal" placeholder="kg" value="' + escapeHtml(s.weight) + '" data-role="set-weight" data-exercise="' + escapeHtml(ex.name) + '" data-idx="' + idx + '"/>' +
          '<span class="x">×</span>' +
          '<input class="set-input" inputmode="numeric" placeholder="reps" value="' + escapeHtml(s.reps) + '" data-role="set-reps" data-exercise="' + escapeHtml(ex.name) + '" data-idx="' + idx + '"/>' +
          '<button class="remove-set-btn" data-action="remove-set" data-exercise="' + escapeHtml(ex.name) + '" data-idx="' + idx + '" style="width:14px;height:14px;display:inline-flex">' + ICONS.minus + '</button>' +
          '</div>';
      });
      html += '<button class="add-set-btn" data-action="add-set" data-exercise="' + escapeHtml(ex.name) + '"><span style="width:13px;height:13px;display:inline-flex">' + ICONS.plus + '</span> Add set</button>';
      html += '</div></div>';
    });

    if(state.addingExercise){
      html += '<div class="add-form">' +
        '<input placeholder="Exercise name" value="' + escapeHtml(state.newExName) + '" data-role="new-ex-name" autofocus/>' +
        '<input placeholder="Target (e.g. 3×10)" value="' + escapeHtml(state.newExTarget) + '" data-role="new-ex-target"/>' +
        '<div class="form-btns">' +
          '<button class="btn-primary" data-action="confirm-add-exercise">Add</button>' +
          '<button class="btn-secondary" data-action="cancel-add-exercise">Cancel</button>' +
        '</div></div>';
    } else {
      html += '<button class="dashed-btn" data-action="show-add-exercise"><span style="width:14px;height:14px;display:inline-flex">' + ICONS.plus + '</span> Add custom exercise</button>';
    }
    html += '</div>';

    html += '<button class="save-btn' + (loggedCount === 0 ? ' disabled' : (state.justSaved ? ' saved' : '')) + '" data-action="save-session" ' + (loggedCount === 0 ? 'disabled' : '') + '>' +
      (state.justSaved ? '<span style="width:16px;height:16px;display:inline-flex">' + ICONS.check + '</span> LOGGED' : 'SAVE SESSION') +
      '</button>';

    return html;
  }

  function renderGuideTab(){
    var html = "";
    PROGRAM.forEach(function(day){
      var exercises = exercisesForDay(day.id);
      html += '<div class="guide-section"><div class="guide-head">' +
        '<span class="day-pill">' + day.id + '</span>' +
        '<span style="font-size:14px;color:#e8ecf1">' + day.name + '</span></div>';
      exercises.forEach(function(ex){
        html += '<div class="card guide-card"><div class="row between" style="align-items:baseline;margin-bottom:4px">' +
          '<span style="font-size:13px;color:#e8ecf1">' + escapeHtml(ex.name) + '</span>' +
          '<span class="blip">' + escapeHtml(ex.target) + '</span></div>';
        if(EXERCISE_DIAGRAMS[ex.name]){
          html += '<div class="row" style="justify-content:center;padding-top:4px">' + exerciseDiagramHtml(ex.name) + '</div>';
        } else {
          html += '<div style="text-align:center;padding:8px 0"><span class="blip">NO DIAGRAM FOR CUSTOM EXERCISE</span></div>';
        }
        html += '</div>';
      });
      html += '</div>';
    });
    html += '<div class="blip">START → FINISH POSITION SHOWN LEFT TO RIGHT</div>';
    return html;
  }

  function renderHistoryTab(){
    if(!state.sessions.length){
      return '<div class="empty"><span class="blip">NO SESSIONS LOGGED YET</span></div>';
    }
    var sorted = state.sessions.slice().sort(function(a,b){ return a.date < b.date ? 1 : -1; });
    var html = "";
    sorted.forEach(function(s){
      html += '<div class="card history-card">' +
        '<div class="row between" style="margin-bottom:8px;align-items:baseline">' +
        '<span style="font-size:14px;color:#e8ecf1">' + s.dayId + ' · ' + escapeHtml(s.dayName) + '</span>' +
        '<span class="blip">' + s.date + '</span></div>';
      s.exercises.filter(function(e){ return e.sets.length; }).forEach(function(e){
        html += '<div class="history-ex-row"><span style="color:#c3cad6">' + escapeHtml(e.name) + '</span>' +
          '<span class="mono" style="color:var(--text-dim)">' +
          e.sets.map(function(st){ return (st.weight || "\u2013") + "×" + (st.reps || "\u2013"); }).join("  ") +
          '</span></div>';
      });
      html += '</div>';
    });
    return html;
  }

  function renderProgressTab(){
    var keyLifts = [];
    PROGRAM.forEach(function(d){ d.exercises.forEach(function(e){ if(e.key) keyLifts.push(e.name); }); });
    if(!state.progressExercise) state.progressExercise = keyLifts[0];
    var selected = state.progressExercise;

    var data = state.sessions
      .filter(function(s){ return s.exercises.some(function(e){ return e.name === selected && e.sets.length; }); })
      .map(function(s){
        var ex = s.exercises.find(function(e){ return e.name === selected; });
        var top = Math.max.apply(null, ex.sets.map(function(x){ return Number(x.weight) || 0; }));
        return { date: s.date.slice(5), weight: top };
      });

    var html = '<div class="blip">KEY LIFT PROGRESSION</div><div class="chip-scroll">';
    keyLifts.forEach(function(name){
      html += '<button class="progress-chip' + (selected === name ? ' active' : '') + '" data-action="select-progress-exercise" data-exercise="' + escapeHtml(name) + '">' + escapeHtml(name) + '</button>';
    });
    html += '</div>';

    html += '<div class="card">';
    if(data.length < 2){
      html += '<div class="empty"><span style="width:22px;height:22px;display:inline-flex;color:var(--text-dim);margin:0 auto 8px">' + ICONS.gauge + '</span><br/><span class="blip">NEEDS 2+ SESSIONS TO PLOT</span></div>';
    } else {
      html += simpleLineChartSvg(data);
    }
    html += '</div>';

    html += '<div class="card" style="margin-top:16px"><div class="blip">TOTAL SESSIONS LOGGED</div><div class="big-number">' + state.sessions.length + '</div></div>';
    return html;
  }

  // Minimal dependency-free line chart (replaces recharts for the standalone file)
  function simpleLineChartSvg(data){
    var w = 400, h = 200, padL = 34, padR = 10, padT = 14, padB = 24;
    var weights = data.map(function(d){ return d.weight; });
    var minW = Math.min.apply(null, weights), maxW = Math.max.apply(null, weights);
    if(minW === maxW){ minW -= 5; maxW += 5; }
    var range = maxW - minW;
    var stepX = (w - padL - padR) / (data.length - 1);
    function xAt(i){ return padL + i * stepX; }
    function yAt(v){ return padT + (1 - (v - minW) / range) * (h - padT - padB); }

    var gridLines = "";
    for(var i = 0; i <= 3; i++){
      var gy = padT + i * (h - padT - padB) / 3;
      gridLines += '<line x1="' + padL + '" y1="' + gy + '" x2="' + (w - padR) + '" y2="' + gy + '" stroke="#2a3341" stroke-dasharray="3 3"/>';
    }

    var points = data.map(function(d, i){ return xAt(i) + "," + yAt(d.weight); }).join(" ");
    var dots = data.map(function(d, i){
      return '<circle cx="' + xAt(i) + '" cy="' + yAt(d.weight) + '" r="3.5" fill="#c9922a"/>';
    }).join("");
    var labels = data.map(function(d, i){
      if(data.length > 6 && i % Math.ceil(data.length / 6) !== 0 && i !== data.length - 1) return "";
      return '<text x="' + xAt(i) + '" y="' + (h - 6) + '" font-size="9" fill="#7c8798" text-anchor="middle" font-family="B612 Mono, monospace">' + d.date + '</text>';
    }).join("");
    var yLabels = "";
    for(var j = 0; j <= 3; j++){
      var val = Math.round(maxW - j * range / 3);
      var gy2 = padT + j * (h - padT - padB) / 3;
      yLabels += '<text x="' + (padL - 6) + '" y="' + (gy2 + 3) + '" font-size="9" fill="#7c8798" text-anchor="end" font-family="B612 Mono, monospace">' + val + 'kg</text>';
    }

    return '<svg viewBox="0 0 ' + w + ' ' + h + '" width="100%" style="display:block">' +
      gridLines + yLabels +
      '<polyline points="' + points + '" fill="none" stroke="#c9922a" stroke-width="2"/>' +
      dots + labels +
      '</svg>';
  }

  // ---------------------------------------------------------------------
  // Actions
  // ---------------------------------------------------------------------
  function handleAction(ds){
    switch(ds.action){
      case "switch-tab":
        state.tab = ds.tab;
        state.shownDiagram = null;
        render();
        break;
      case "switch-day":
        state.dayId = ds.day;
        state.shownDiagram = null;
        state.addingExercise = false;
        render();
        break;
      case "toggle-diagram":
        state.shownDiagram = state.shownDiagram === ds.exercise ? null : ds.exercise;
        render();
        break;
      case "toggle-today":
        toggleToday(ds.day);
        break;
      case "add-set": {
        var dayId = state.dayId;
        state.setsDraft[dayId] = state.setsDraft[dayId] || {};
        state.setsDraft[dayId][ds.exercise] = (state.setsDraft[dayId][ds.exercise] || []).concat([{ weight:"", reps:"" }]);
        render();
        break;
      }
      case "remove-set": {
        var d2 = state.dayId, idx = Number(ds.idx);
        if(state.setsDraft[d2] && state.setsDraft[d2][ds.exercise]){
          state.setsDraft[d2][ds.exercise] = state.setsDraft[d2][ds.exercise].filter(function(_, i){ return i !== idx; });
        }
        render();
        break;
      }
      case "save-session": {
        var day = PROGRAM.find(function(d){ return d.id === state.dayId; });
        var daySets = state.setsDraft[state.dayId] || {};
        var exList = exercisesForDay(state.dayId);
        var record = {
          date: todayISO(),
          dayId: day.id,
          dayName: day.name,
          exercises: exList.map(function(e){
            return { name: e.name, sets: (daySets[e.name] || []).filter(function(s){ return s.weight !== "" || s.reps !== ""; }) };
          })
        };
        state.sessions = state.sessions.concat([record]);
        saveJSON(KEYS.sessions, state.sessions);
        state.setsDraft[state.dayId] = {};
        state.justSaved = true;
        render();
        setTimeout(function(){ state.justSaved = false; render(); }, 2200);
        break;
      }
      case "show-add-exercise":
        state.addingExercise = true;
        state.newExName = ""; state.newExTarget = "";
        render();
        break;
      case "cancel-add-exercise":
        state.addingExercise = false;
        render();
        break;
      case "confirm-add-exercise": {
        var name = state.newExName.trim();
        if(!name) return;
        var target = state.newExTarget.trim() || "\u2014";
        addExercise(state.dayId, name, target);
        state.addingExercise = false;
        state.newExName = ""; state.newExTarget = "";
        render();
        break;
      }
      case "remove-exercise": {
        if(window.confirm('Remove "' + ds.exercise + '" from this day? This can\'t be undone, but past logged sessions keep their history.')){
          removeExercise(ds.day, ds.exercise);
          render();
        }
        break;
      }
      case "select-progress-exercise":
        state.progressExercise = ds.exercise;
        render();
        break;
    }
  }

  function handleInput(ds, value){
    if(ds.role === "set-weight" || ds.role === "set-reps"){
      var dayId = state.dayId;
      state.setsDraft[dayId] = state.setsDraft[dayId] || {};
      var arr = (state.setsDraft[dayId][ds.exercise] || []).slice();
      var idx = Number(ds.idx);
      if(!arr[idx]) arr[idx] = { weight:"", reps:"" };
      arr[idx] = Object.assign({}, arr[idx]);
      arr[idx][ds.role === "set-weight" ? "weight" : "reps"] = value;
      state.setsDraft[dayId][ds.exercise] = arr;
      // no render(): input already reflects the typed value in the DOM
      return;
    }
    if(ds.role === "new-ex-name"){ state.newExName = value; return; }
    if(ds.role === "new-ex-target"){ state.newExTarget = value; return; }
  }

  // ---------------------------------------------------------------------
  // Boot
  // ---------------------------------------------------------------------
  document.addEventListener("DOMContentLoaded", function(){
    try{
      setupPWA();
      render();
      var app = document.getElementById("app");
      app.addEventListener("click", function(e){
        var t = e.target.closest("[data-action]");
        if(!t) return;
        if(t.getAttribute("type") === "checkbox") return; // handled by 'change' below
        handleAction(t.dataset);
      });
      app.addEventListener("change", function(e){
        var t = e.target.closest("[data-action='toggle-today']");
        if(t && t.getAttribute("type") === "checkbox") handleAction(t.dataset);
      });
      app.addEventListener("input", function(e){
        var t = e.target.closest("[data-role]");
        if(!t) return;
        handleInput(t.dataset, t.value);
      });
    }catch(e){
      document.getElementById("app").innerHTML =
        '<div style="padding:24px;color:#f4f6f9;font-family:sans-serif">' +
        '<div style="color:#c9922a;font-weight:bold;margin-bottom:8px">Couldn\u2019t load the app</div>' +
        '<div style="font-size:13px;color:#7c8798">' + (e && e.message ? e.message : String(e)) + '</div>' +
        '<div style="font-size:12px;color:#7c8798;margin-top:12px">Try opening this file directly in Safari or Chrome rather than a preview pane.</div>' +
        '</div>';
    }
  });
})();
</script>
