<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hour Builder Club Checkout</title>
<style>
  @page { size: 210mm 297mm; margin: 0; }
  * { box-sizing: border-box; }
  html { background: #e6e6e6; }
  body {
    width: 210mm; height: 297mm; overflow: hidden; padding: 6mm;
    margin: 0 auto; background: #fff; color: #000;
    font-family: Calibri, "Segoe UI", Arial, sans-serif;
    display: flex; flex-direction: column;
    -webkit-print-color-adjust: exact; print-color-adjust: exact;
  }
  header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 3mm; }
  .logo {
    border: 2px solid #000; padding: 1.5mm 3mm; font-weight: 700; font-size: 10pt;
    letter-spacing: .5px; background: #000; color: #fff; white-space: nowrap;
  }
  h1 { margin: 0; font-size: 22pt; text-decoration: underline; font-weight: 600; }

  .details { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5mm 8mm; margin-bottom: 4mm; font-size: 10.5pt; }
  .details .full { grid-column: 1 / -1; }
  .field { display: flex; align-items: flex-end; gap: 2mm; }
  .field label { white-space: nowrap; }
  .field input {
    flex: 1; min-width: 0; border: 0; border-bottom: 1px solid #000; font: inherit;
    padding: 0 1mm; height: 6mm; background: transparent;
  }
  .fh { font-weight: 600; margin-top: 1mm; }

  .grid { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 0 3mm; }
  .col { display: flex; flex-direction: column; gap: 2.5mm; min-height: 0; }

  table { width: 100%; border-collapse: collapse; table-layout: fixed; border: 2px solid #000; }
  th, td { border: 1px solid #000; padding: 0.8mm 1.2mm; vertical-align: top; }
  th { font-size: 7.5pt; font-weight: 400; text-decoration: underline; text-align: left; line-height: 1.15; }
  th.sec { font-size: 10pt; font-weight: 700; width: 36%; }
  td.item { font-size: 8pt; line-height: 1.2; height: 10.5mm; }
  td.box { text-align: center; vertical-align: middle; padding: 0; }

  input.tick {
    appearance: none; -webkit-appearance: none; margin: 0; cursor: pointer;
    width: 5.5mm; height: 5.5mm; border: 1.4px solid #000; border-radius: 1px;
    background: #fff; position: relative; vertical-align: middle;
  }
  input.tick:checked::after {
    content: ""; position: absolute; left: 1.6mm; top: 0.3mm;
    width: 1.5mm; height: 3.2mm; border: solid #000; border-width: 0 2.2px 2.2px 0;
    transform: rotate(45deg);
  }
  input.tick.c2:checked { background: #fff1c2; }
  input.tick.c3:checked { background: #ffc9c9; }
  input.tick:focus-visible { outline: 2px solid #3b82f6; outline-offset: 1px; }

  .notes { flex: 1; display: flex; flex-direction: column; min-height: 0; font-size: 9pt; }
  .notes p { margin: 0 0 1.5mm; }
  .notes textarea {
    flex: 1; width: 100%; resize: none; border: 1px solid #000; font: inherit; font-size: 9.5pt;
    padding: 1.5mm; background-image: repeating-linear-gradient(transparent 0 6.5mm, #ccc 6.5mm calc(6.5mm + 1px));
    line-height: 6.5mm;
  }

  .toolbar { position: fixed; right: 12px; bottom: 12px; display: flex; gap: 8px; }
  .toolbar button {
    font: 600 14px system-ui, sans-serif; padding: 10px 14px; border-radius: 8px;
    border: 0; background: #1f4e9c; color: #fff; cursor: pointer; box-shadow: 0 2px 6px rgba(0,0,0,.25);
  }
  .toolbar button.alt { background: #666; }
  @media print { html { background: #fff; } .toolbar { display: none; } }
  @media screen and (max-width: 820px) { html { overflow-x: auto; } }
</style>
</head>
<body>
  <header>
    <div class="logo">LS AIRMOTIVE</div>
    <h1>Hour Builder Club Checkout</h1>
    <div class="logo">LS AIRMOTIVE</div>
  </header>

  <section class="details">
    <div class="field full" style="max-width:50%"><label>Student Name:</label><input></div>
    <div class="fh">Flight 1:</div>
    <div class="fh">Flight 2 (if applicable):</div>
    <div class="field"><label>Date:</label><input></div>
    <div class="field"><label>Date:</label><input></div>
    <div class="field"><label>Aircraft Reg:</label><input></div>
    <div class="field"><label>Aircraft Reg:</label><input></div>
    <div class="field"><label>Instructor name/signature:</label><input></div>
    <div class="field"><label>Instructor name/signature:</label><input></div>
  </section>

  <main class="grid">
    <div class="col" id="left"></div>
    <div class="col" id="right">
      <div class="notes" id="notes">
        <p>If any of the above exercises are marked as anything other than “Excellent” or “Satisfactory”, please detail below:</p>
        <textarea aria-label="Details"></textarea>
      </div>
    </div>
  </main>

  <div class="toolbar">
    <button class="alt" onclick="clearForm()">Clear</button>
    <button onclick="window.print()">Print</button>
  </div>

<script>
const sections = [
  { col: "left", title: "Section 1: Pre-flight/Departure", items: [
    "Pre-Flight brief, Notam, Weather, Mass/Balance, Performance",
    "A-Check/Servicing/ Proper use of fuel pumps",
    "SUTTO", "A/D Departure", "ATC Liaison"] },
  { col: "left", title: "Section 2: Airwork", items: [
    "ATC Liaison", "Straight/Level with speed changes",
    "Climbing (Best rate, Level-off, Climbing turns)", "Medium Level Turns",
    "Steep turns (45deg) and Spiral dive recognition and recovery",
    "Slow flight with/without flaps", "Stalling (clean, approach config)", "Descending"] },
  { col: "left", title: "Section 5: Emergency Procedures", items: [
    "Simulated Engine failure during cruise", "Simulated engine fire on start",
    "Simulated radio failure", "Simulated Alternator failure"] },
  { col: "right", title: "Section 3: Enroute", items: [
    "Flight Plan, dead reckoning", "Maintenance of altitude, heading speed",
    "Orientation", "Diversion", "Flight management checks (FREDA)", "ATC Compliance/Liaison"] },
  { col: "right", title: "Section 4: Approach and landing", items: [
    "Aerodrome arrival procedures", "Crosswind technique", "Flapless landing",
    "Glide approach", "Touch and go", "Go-around", "ATC compliance/liaison", "After-flight actions"] }
];
const grades = ["Excellent", "Satisfactory", "Further instruction needed", "Dangerous"];
const notes = document.getElementById("notes");
let n = 0;

sections.forEach(s => {
  const t = document.createElement("table");
  let h = `<thead><tr><th class="sec">${s.title}</th>${grades.map(g => `<th>${g}</th>`).join("")}</tr></thead><tbody>`;
  s.items.forEach(item => {
    n++;
    h += `<tr><td class="item">${item}</td>` +
      grades.map((g, i) => `<td class="box"><input type="radio" class="tick c${i}" name="r${n}" value="${g}" aria-label="${item}: ${g}"></td>`).join("") +
      `</tr>`;
  });
  t.innerHTML = h + "</tbody>";
  const col = document.getElementById(s.col);
  s.col === "right" ? col.insertBefore(t, notes) : col.appendChild(t);
});

// Allow a tick to be removed by tapping it again
document.addEventListener("pointerdown", e => {
  if (e.target.matches("input.tick")) e.target.dataset.was = e.target.checked;
});
document.addEventListener("click", e => {
  const el = e.target;
  if (el.matches("input.tick") && el.dataset.was === "true") el.checked = false;
  if (el.matches("input.tick")) delete el.dataset.was;
});

function clearForm() {
  if (!confirm("Clear all ticks and fields?")) return;
  document.querySelectorAll("input.tick").forEach(i => i.checked = false);
  document.querySelectorAll(".field input, textarea").forEach(i => i.value = "");
}
</script>
</body>
</html>
