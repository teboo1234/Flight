;A unique number for the treatment method<\/p> <p>L:&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;Likelihood (probability)<\/p> <p> C:&nbsp;&nbsp;&nbsp;&nbsp;Consequence<\/p> <p>&nbsp;<\/p> <p>(d) Template register A — Risk register<\/p> <table> <thead> <tr> <th> <p>Ref<\/p> <\/th> <th> <p>Operation/ Procedure<\/p> <\/th> <th> <p>Ref<\/p> <\/th> <th> <p>Generic hazard<\/p> <\/th> <th> <p>Ref<\/p> <\/th> <th> <p>Accidental event<\/p> <\/th> <th> <p>Treatment/ control<\/p> <\/th> <th> <p>L<\/p> <\/th> <th> <p>C<\/p> <\/th> <th> <p>Monitoring<\/p> <\/th> <\/tr> <\/thead> <tbody> <tr> <td> <p>&nbsp;<\/p> <\/td> <td> <p>&nbsp;<\/p> <\/td> <td> <p>&nbsp;<\/p> <\/td> <td> <p>&nbsp;<\/p> <\/td> <td> <p>&nbsp;<\/p> <\/td> <td> <p>&nbsp;<\/p> <\/td> <td> <p>&nbsp;<\/p> <\/td> <td> <p>&nbsp;<\/p> <\/td> <td> <p>&nbsp;<\/p> <\/td> <td> <p>&nbsp;<\/p> <\/td> <\/tr> <tr> <td> <p>&nbsp;<\/p> <\/td> <td> <p>&nbsp;<\/p> <\/td> <td> <p>&nbsp;<\/p> <\/td> <td> <p>&nbsp;<\/p> <\/td> <td> <p>&nbsp;<\/p> <\/td> <td> <p>&nbsp;<\/p> <\/td> <td> <p>&nbsp;<\/p> <\/td> <td> <p>&nbsp;<\/p> <\/td> <td> <p>&nbsp;<\/p> <\/td> <td> <p>&nbsp;<\/p> <\/td> <\/tr> <tr> <td> <p>&nbsp;<\/p> <\/td> <td> <p>&nbsp;<\/p> <\/td> <td> <p>&nbsp;<\/p> <\/td> <td> <p>&nbsp;<\/p> <\/td> <td> <p>&nbsp;<\/p> <\/td> <td> <p>&nbsp;<\/p> <\/td> <td> <p>&nbsp;<\/p> <\/td> <td> <p>&nbsp;<\/p> <\/td> <td> <p>&nbsp;<\/p> <\/td> <td> <p>&nbsp;<\/p> <\/td> <\/tr> <tr> <td> <p>&nbsp;<\/p> <\/td> <td> <p>&nbsp;<\/p> <\/td> <td> <p>&nbsp;<\/p> <\/td> <td> <p>&nbsp;<\/p> <\/td> <td> <p>&nbsp;<\/p> <\/td> <td> <p>&nbsp;<\/p> <\/td> <td> <p>&nbsp;<\/p> <\/td> <td> <p>&nbsp;<\/p> <\/td> <td> <p>&nbsp;<\/p> <\/td> <td> <p>&nbsp;<\/p> <\/td> <\/tr> <tr> <td> <p>&nbsp;<\/p> <\/td> <td> <p>&nbsp;<\/p> <\/td> <td> <p>&nbsp;<\/p> <\/td> <td> <p>&nbsp;<\/p> <\/td> <td> <p>&nbsp;<\/p> <\/td> <td> <p>&nbsp;<\/p> <\/td> <td> <p>&nbsp;<\/p> <\/td> <td> <p>&nbsp;<\/p> <\/td> <td> <p>&nbsp;<\/p> <\/td> <td> <p>&nbsp;<\/p> <\/td> <\/tr> <tr> <td> <p>&nbsp;<\/p> <\/td> <td> <p>&nbsp;<\/p> <\/td> <td> <p>&nbsp;<\/p> <\/td> <td> <p>&nbsp;<\/p> <\/td> <td> <p>&nbsp;<\/p> <\/td> <td> <p>&nbsp;<\/p> <\/td> <td> <p>&nbsp;<\/p> <\/td> <td> <p>&nbsp;<\/p> <\/td> <td> <p>&nbsp;<\/p> <\/td> <td> <p>&nbsp;<\/p> <\/td> <\/tr> <tr> <td> <p>&nbsp;<\/p> <\/td> <td> <p>&nbsp;<\/p> <\/td> <td> <p>&nbsp;<\/p> <\/td> <td> <p>&nbsp;<\/p> <\/td> <td> <p>&nbsp;<\/p> <\/td> <td> <p>&nbsp;<\/p> <\/td> <td> <p>&nbsp;<\/p> <\/td> <td> <p>&nbsp;<\/p> <\/td> <td> <p>&nbsp;<\/p> <\/td> <td> <p>&nbsp;<\/p> <\/td> <\/tr> <\/tbody> <\/table> <p>L:&nbsp;&nbsp;&nbsp;&nbsp;Likelihood (probability) <\/p> <p>C:&nbsp;&nbsp;&nbsp;&nbsp;Consequence<\/p> <p>&nbsp;<\/p>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/4%20GM/GM2%20NCO%20SPEC%20105%20Checklists.htm"}]},{"id":"r-NCO-SPEC-110","ref":"NCO.SPEC.110","title":"Pilot-in-command responsibilities and authority","h":"<h1>NCO.SPEC.110 Pilot-in-command responsibilities and authority <\/h1> <div> <p>Whenever crew members or task specialists are involved in the operation, the pilot-in-command shall<\/p> <p>(a)&nbsp;ensure compliance of crew members and task specialists with NCO.SPEC.115 and NCO.SPEC.120;<\/p> <p>(b)&nbsp;not commence a flight if any crew member or task specialist is incapacitated from performing duties by any cause such as injury, sickness, fatigue or the effects of any psychoactive substance;<\/p> <p>(c)&nbsp;not continue a flight beyond the nearest weather-permissible aerodrome or operating site when any crew member or task specialist’s capacity to perform duties is significantly reduced from causes such as fatigue, sickness or lack of oxygen;<\/p> <p>(d)&nbsp;ensure that crew members and task specialists comply with the laws, regulations and procedures of those States where operations are conducted;<\/p> <p>(e)&nbsp;ensure that all crew members and task specialists are able to communicate with each other in a common language; and<\/p> <p>(f)&nbsp;ensure that task specialists and crew members use supplemental oxygen continuously whenever he/she determines that at the altitude of the intended flight the lack of oxygen might result in impairment of the faculties of crew members or harmfully affect task specialists. If the pilot-in-command cannot determine how the lack of oxygen might affect the occupants on board, he/she shall ensure that task specialists and crew members use supplemental oxygen continuously whenever the cabin altitude exceeds 10000 ft for a period of more than 30 minutes and whenever the cabin altitude exceeds 13000 ft.<\/p> <p>&nbsp;<\/p> <\/div>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/2%20Regs/21370_NCOSPEC110_Pilot-in-command_responsibilities_and_authority.htm","sub":[{"id":"x-AMC1-NCO-SPEC-110-f","kind":"AMC","label":"AMC1 NCO.SPEC.110(f)","title":"AMC1 NCO.SPEC.110(f) Pilot-in-command responsibilities and authority","h":"<h3><a><\/a>AMC1 NCO.SPEC.110(f) Pilot-in-command responsibilities and authority&nbsp;&nbsp;&nbsp;&nbsp;<\/h3> <p>CAA ORS9 Decision No. 1<\/p> <p>DETERMINATION OF SUPPLEMENTAL OXYGEN NEED<\/p> <p>When determining the need for supplemental oxygen carriage and use, the pilot-in-command should:<\/p> <p>(a) in the preflight phase:<\/p> <ol> <p> <\/p><p>(1) be aware of hypoxia conditions and associated risks;<\/p> <p><\/p> <p> <\/p><p>(2) consider the following objective conditions for the intended flight:<\/p> <ol> <p> <\/p><p>(i) altitude;<\/p> <p><\/p> <p> <\/p><p>(ii) duration of the flight; and<\/p> <p><\/p> <p> <\/p><p>(iii) any other relevant operational conditions;<\/p> <p><\/p> <\/ol> <p><\/p> <p> <\/p><p>(3) consider individual conditions of flight crew members and task specialists in relation to:<\/p> <ol> <p> <\/p><p>(i) altitude of the place of residence;<\/p> <p><\/p> <p> <\/p><p>(ii) smoking;<\/p> <p><\/p> <p> <\/p><p>(iii) experience in flights at high altitudes;<\/p> <p><\/p> <p> <\/p><p>(iv) actual medical conditions and medications;<\/p> <p><\/p> <p> <\/p><p>(v) age;<\/p> <p><\/p> <p> <\/p><p>(vi) disabilities; and<\/p> <p><\/p> <p> <\/p><p>(vii) any other relevant factor that may be detected, or reported by the person; and<\/p> <p><\/p> <\/ol> <p><\/p> <p> <\/p><p>(4) when relevant, ensure that all flight crew members and task specialists are briefed on hypoxia conditions and symptoms, as well as on the usage of supplemental oxygen equipment.<\/p> <p><\/p> <\/ol> <p>(b) during flight:<\/p> <ol> <p> <\/p><p>(1) monitor for early symptoms of hypoxia conditions; and<\/p> <p><\/p> <p> <\/p><p>(2) if detecting early symptoms of hypoxia conditions:<\/p> <ol> <p> <\/p><p>(i) consider to return to a safe altitude, and<\/p> <p><\/p> <p> <\/p><p>(ii) ensure that supplemental oxygen is used, if available.<\/p> <p>&nbsp;<\/p> <p><\/p> <\/ol> <p><\/p> <\/ol>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/3%20AMC/AMC1%20NCO%20SPEC%20110%20f%20Pilot.htm"},{"id":"x-GM1-NCO-SPEC-110-f","kind":"GM","label":"GM1 NCO.SPEC.110(f)","title":"GM1 NCO.SPEC.110(f) Pilot-in-command responsibilities and authority","h":"<h4><a><\/a>GM1 NCO.SPEC.110(f) Pilot-in-command responsibilities and authority&nbsp;&nbsp;&nbsp;&nbsp;<\/h4> <p>CAA ORS9 Decision No. 1<\/p> <p>DETERMINATION OF SUPPLEMENTAL OXYGEN NEED<\/p> <p>(a) The responsibility of the pilot-in-command for safety of all persons on board, as required by NCO.GEN.105(a)(1), includes the determination of need for supplemental oxygen use.<\/p> <p>(b) The altitudes above which NCO.SPEC.110(f) requires oxygen to be available and used are applicable to those cases when the pilot-in-command cannot determine the need for supplemental oxygen. However, if the pilot-in-command is able to make this determination, he/she may elect in the interest of safety to require oxygen also for operations at or below such altitudes.<\/p> <p>(c) The pilot-in-command should be aware that flying below altitudes mentioned in NCO.SPEC.110(f) does not provide absolute protection against hypoxia symptoms, should individual conditions and aptitudes be prevalent.<\/p> <p>&nbsp;<\/p>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/4%20GM/GM1%20NCO%20SPEC%20110%20f%20Pilot%20in.htm"},{"id":"x-GM2-NCO-SPEC-110-f","kind":"GM","label":"GM2 NCO.SPEC.110(f)","title":"GM2 NCO.SPEC.110(f) Pilot-in-command responsibilities and authority","h":"<h4><a><\/a>GM2 NCO.SPEC.110(f) Pilot-in-command responsibilities and authority&nbsp;&nbsp;&nbsp;&nbsp;<\/h4> <p>CAA ORS9 Decision No. 1<\/p> <p>DETERMINATION OF OXYGEN NEED — BEFORE FLIGHT<\/p> <p>Detailed information and guidance on hypoxia conditions and symptoms, content of the briefing on hypoxia and assessment of individual conditions may be found in the EASA leaflet ‘Hypoxia’.<\/p> <p>DETERMINATION OF OXYGEN NEED — IN FLIGHT<\/p> <p>Several methods for monitoring hypoxia early symptoms may be used and some methods may be aided by personal equipment, such as finger-mounted pulse oximeters. Detailed information and guidance on entering hypoxia conditions, on hypoxia symptoms early detection, and on use of personal equipment such as finger-mounted pulse oximeters or equivalent may be found in the EASA leaflet ‘Hypoxia’.<\/p> <p>&nbsp;<\/p>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/4%20GM/GM2%20NCO%20SPEC%20110%20f%20Pilot%20in.htm"}]},{"id":"r-NCO-SPEC-115","ref":"NCO.SPEC.115","title":"Crew responsibilities","h":"<h1>NCO.SPEC.115 Crew responsibilities <\/h1> <div> <p>(a)&nbsp;The crew member shall be responsible for the proper execution of his/her duties. Crew duties shall be specified in the checklist.<\/p> <p>(b)&nbsp;During critical phases of the flight or whenever deemed necessary by the pilot-in-command in the interest of safety, the crew member shall be restrained at his/her assigned station, unless otherwise specified in the checklist.<\/p> <p>(c)&nbsp;During flight, the flight crew member shall keep his/her safety belt fastened while at his/her station.<\/p> <p>(d)&nbsp;During flight, at least one qualified flight crew member shall remain at the controls of the aircraft at all times.<\/p> <p>(e)&nbsp;The crew member shall not undertake duties on an aircraft:<\/p> <p>(1)&nbsp;&nbsp;if he/she knows or suspects that he/she is suffering from fatigue as referred to in 7.f. of Annex IV to Regulation (EC) No 216/2008 or feels otherwise unfit to perform his/her duties; or<\/p> <p>(2)&nbsp;&nbsp;when under the influence of psychoactive substances or alcohol or for other reasons as referred to in 7.g of Annex IV to Regulation (EC) No 216/2008.<\/p> <p>(f)&nbsp;The crew member who undertakes duties for more than one operator shall:<\/p> <p>(1)&nbsp;&nbsp;maintain his/her individual records regarding flight and duty times and rest periods as referred to in Annex III (Part-ORO), Subpart FTL to Regulation (EU) No 965/2012, if applicable; and<\/p> <p>(2)&nbsp;&nbsp;provide each operator with the data needed to schedule activities in accordance with the applicable FTL requirements.<\/p> <p>(g)&nbsp;The crew member shall report to the pilot-in-command:<\/p> <p>(1)&nbsp;&nbsp;any fault, failure, malfunction or defect, which he/she believes may affect the airworthiness or safe operation of the aircraft, including emergency systems; and<\/p> <p>(2)&nbsp;&nbsp;any incident that was endangering, or could endanger, the safety of the operation.<\/p> <p>&nbsp;<\/p> <\/div>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/2%20Regs/21400_NCOSPEC115_Crew_responsibilities.htm","sub":[{"id":"x-AMC1-NCO-SPEC-115-a","kind":"AMC","label":"AMC1 NCO.SPEC.115(a)","title":"AMC1 NCO.SPEC.115(a) Crew responsibilities","h":"<h3>AMC1 NCO.SPEC.115(a) Crew responsibilities<\/h3> <p>CAA ORS9 Decision No. 47<\/p> <p>PILOT DUTIES — RECORDING OF FLIGHT TIME<\/p> <ol> <li value=\"1\"> <p>The pilot should only record flight time for the purpose of meeting experience requirements in specialised operations defined in AMC1&nbsp;ORO.FC.146(f) and AMC1&nbsp;SPO.SPEC.HESLO.100 if NCO.SPEC applies. <\/p> <\/li> <li value=\"2\"> <p>The list of specialised operations in GM1&nbsp;NCO.SPEC.100 may be used for the purpose of (a).<\/p> <\/li> <\/ol> <p>&nbsp;<\/p>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/3%20AMC/AMC1%20NCO%20SPEC%20115%20a%20Crew%20responsibilities.htm"}]},{"id":"r-NCO-SPEC-120","ref":"NCO.SPEC.120","title":"Task specialists responsibilities","h":"<h1>NCO.SPEC.120 Task specialists responsibilities <\/h1> <div> <p>(a)&nbsp;The task specialist shall be responsible for the proper execution of his/her duties. Task specialists’ duties shall be specified in the checklist.<\/p> <p>(b)&nbsp;During critical phases of the flight or whenever deemed necessary by the pilot-in-command in the interest of safety, the task specialist shall be restrained at his/her assigned station, unless otherwise specified in the checklist.<\/p> <p>(c)&nbsp;The task specialist shall ensure that he/she is restrained when carrying out specialised tasks with external doors opened or removed.<\/p> <p>(d)&nbsp;The task specialist shall report to the pilot-in-command:<\/p> <p>(1)&nbsp;&nbsp;any fault, failure, malfunction or defect, which he/she believes may affect the airworthiness or safe operation of the aircraft, including emergency systems; and<\/p> <p>(2)&nbsp;&nbsp;any incident that was endangering, or could endanger, the safety of the operation.<\/p> <p>&nbsp;<\/p> <\/div>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/2%20Regs/21430_NCOSPEC120_Task_specialists_responsibilities.htm","sub":[]},{"id":"r-NCO-SPEC-125","ref":"NCO.SPEC.125","title":"Safety briefing","h":"<h1>NCO.SPEC.125 Safety briefing <\/h1> <div> <p>(a)&nbsp;Before take-off, the pilot-in-command shall brief task specialists on:<\/p> <p>(1)&nbsp;&nbsp;emergency equipment and procedures;<\/p> <p>(2)&nbsp;&nbsp;operational procedures associated with the specialised task before each flight or series of flights<\/p> <p>(b)&nbsp;The briefing referred to in (a)(2) may not be required if task specialists have been instructed on the operational procedures before the start of the operating season in that calendar year.<\/p> <p>&nbsp;<\/p> <\/div>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/2%20Regs/21460_NCOSPEC125_Safety_briefing.htm","sub":[{"id":"x-AMC1-NCO-SPEC-125","kind":"AMC","label":"AMC1 NCO.SPEC.125","title":"AMC1 NCO.SPEC.125 Safety briefing","h":"<h3><a><\/a>AMC1 NCO.SPEC.125 Safety briefing&nbsp;&nbsp;&nbsp;&nbsp;<\/h3> <p>CAA ORS9 Decision No. 1<\/p> <p>TASK SPECIALISTS<\/p> <p>(a) Safety briefings should ensure that task specialists are familiar with all aspects of the operation, including their responsibilities.<\/p> <p>(b) Such briefings should include, as appropriate:<\/p> <ol> <p> <\/p><p>(1) behaviour on the ground and in-flight, including emergency procedures;<\/p> <p><\/p> <p> <\/p><p>(2) procedures for boarding and disembarking;<\/p> <p><\/p> <p> <\/p><p>(3) procedures for loading and unloading the aircraft;<\/p> <p><\/p> <p> <\/p><p>(4) use of doors in normal and emergency operations;<\/p> <p><\/p> <p> <\/p><p>(5) use of communication equipment and hand signals;<\/p> <p><\/p> <p> <\/p><p>(6) precautions in case of a landing on sloping ground; and<\/p> <p><\/p> <p> <\/p><p>(7) in addition to the items listed from (b)(1) to (b)(6) before take-off:<\/p> <ol> <p> <\/p><p>(i) location of emergency exits;<\/p> <p><\/p> <p> <\/p><p>(ii) restrictions regarding smoking;<\/p> <p><\/p> <p> <\/p><p>(iii) restrictions regarding the use of portable electronic equipment; and<\/p> <p><\/p> <p> <\/p><p>(iv) stowage of tools and hand baggage.<\/p> <p><\/p> <\/ol> <p><\/p> <\/ol> <p>(c) Briefings may be given as a verbal presentation or by issuing the appropriate procedures and instructions in written form. Before commencement of the flight, their understanding should be confirmed.<\/p> <p>&nbsp;<\/p>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/3%20AMC/AMC1%20NCO%20SPEC%20125%20Safety%20briefing.htm"}]},{"id":"r-NCO-SPEC-130","ref":"NCO.SPEC.130","title":"Minimum obstacle clearance altitudes — IFR flights","h":"<h1>NCO.SPEC.130 Minimum obstacle clearance altitudes — IFR flights <\/h1> <div> <p>The pilot-in-command shall establish minimum flight altitudes for each flight providing the required terrain clearance for all route segments to be flown in IFR. The minimum flight altitudes shall not be lower than those published by the State overflown.<\/p> <p>&nbsp;<\/p> <\/div>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/2%20Regs/21490_NCOSPEC130_Minimum_obstacle_clearance_altitudes_IFR_flights.htm","sub":[]},{"id":"r-NCO-SPEC-145","ref":"NCO.SPEC.145","title":"Simulated situations in flight","h":"<h1>NCO.SPEC.145 Simulated situations in flight <\/h1> <div> <p>Unless a task specialist is on-board the aircraft for training, the pilot-in-command shall, when carrying task specialists, not simulate:<\/p> <p>(a)&nbsp;situations that require the application of abnormal or emergency procedures; or<\/p> <p>(b)&nbsp;flight in instrument meteorological conditions (IMC).<\/p> <p>&nbsp;<\/p> <\/div>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/2%20Regs/21590_NCOSPEC145_Simulated_situations_in_flight.htm","sub":[]},{"id":"r-NCO-SPEC-150","ref":"NCO.SPEC.150","title":"Ground proximity detection","h":"<h1>NCO.SPEC.150 Ground proximity detection <\/h1> <div> <p>If installed, the ground proximity warning system may be disabled during those specialised tasks, which by their nature require the aircraft to be operated within a distance from the ground below that which would trigger the ground proximity warning system.<\/p> <p>&nbsp;<\/p> <\/div>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/2%20Regs/21620_NCOSPEC150_Ground_proximity_detection.htm","sub":[]},{"id":"r-NCO-SPEC-155","ref":"NCO.SPEC.155","title":"Airborne collision avoidance system (ACAS II)","h":"<h1>NCO.SPEC.155 Airborne collision avoidance system (ACAS II) <\/h1> <div> <p>Notwithstanding NCO.OP.200, the ACAS II may be disabled during those specialised tasks, which by their nature require the aircraft to be operated within a distance from each other below that which would trigger the ACAS.<\/p> <p>&nbsp;<\/p> <\/div>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/2%20Regs/21650_NCOSPEC155_Airborne_collision_avoidance_system_ACAS_II.htm","sub":[]},{"id":"r-NCO-SPEC-160","ref":"NCO.SPEC.160","title":"Release of dangerous goods","h":"<h1>NCO.SPEC.160 Release of dangerous goods <\/h1> <div> <p>The pilot-in-command shall not operate an aircraft over congested areas of cities, towns or settlements or over an open-air assembly of persons when releasing dangerous goods.<\/p> <p>&nbsp;<\/p> <\/div>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/2%20Regs/21680_NCOSPEC160_Release_of_dangerous_goods.htm","sub":[]},{"id":"r-NCO-SPEC-165","ref":"NCO.SPEC.165","title":"Carriage and use of weapons","h":"<h1>NCO.SPEC.165 Carriage and use of weapons <\/h1> <div> <p>(a)&nbsp;The pilot-in-command shall ensure that, when weapons are carried on a flight for the purpose of a specialised task, these are secured when not in use.<\/p> <p>(b)&nbsp;The task specialist using the weapon shall take all necessary measures to prevent the aircraft and persons on board or on the ground from being endangered.<\/p> <p>&nbsp;<\/p> <\/div>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/2%20Regs/21710_NCOSPEC165_Carriage_and_use_of_weapons.htm","sub":[]},{"id":"r-NCO-SPEC-170","ref":"NCO.SPEC.170","title":"Performance and operating criteria — aeroplanes","h":"<h1>NCO.SPEC.170 Performance and operating criteria — aeroplanes <\/h1> <div> <p>When operating an aeroplane at a height of less than 150 m (500 ft) above a non-congested area, for operations of aeroplanes that are not able to sustain level flight in the event of a critical engine failure, the pilot-in-command shall have:<\/p> <p>(a)&nbsp;established operational procedures to minimise the consequences of an engine failure; and<\/p> <p>(b)&nbsp;briefed all crew members and task specialists on board on the procedures to be carried out in the event of a forced landing.<\/p> <p>&nbsp;<\/p> <\/div>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/2%20Regs/21740_NCOSPEC170_Performance_and_operating_criteria_aeroplanes.htm","sub":[]},{"id":"r-NCO-SPEC-175","ref":"NCO.SPEC.175","title":"Performance and operating criteria — helicopters","h":"<h1>NCO.SPEC.175 Performance and operating criteria — helicopters <\/h1> <div> <p>(a)&nbsp;The pilot-in-command may operate an aircraft over congested areas provided that:<\/p> <p>(1)&nbsp;&nbsp;the helicopter is certified in category A or B; and<\/p> <p>(2)&nbsp;&nbsp;safety measures are established to prevent undue hazard to persons or property on the ground<\/p> <p>(b)&nbsp;The pilot-in-command shall have:<\/p> <p>(1)&nbsp;&nbsp;established operational procedures to minimise the consequences of an engine failure; and<\/p> <p>(2)&nbsp;&nbsp;briefed all crew members and task specialists on board on the procedures to be carried out in the event of a forced landing.<\/p> <p>(c)&nbsp;The pilot-in-command shall ensure that the mass at take-off, landing or hover shall not exceed the maximum mass specified for:<\/p> <p>(1)&nbsp;&nbsp;a hover out of ground effect (HOGE) with all engines operating at the appropriate power rating; or<\/p> <p>(2)&nbsp;&nbsp;if conditions prevail that a HOGE is not likely to be established, the helicopter mass shall not exceed the maximum mass specified for a hover in ground effect (HIGE) with all engines operating at the appropriate power rating, provided prevailing conditions allow a hover in ground effect at the maximum specified mass.<\/p> <p>&nbsp;<\/p> <\/div>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/2%20Regs/21770_NCOSPEC175_Performance_and_operating_criteria_helicopters.htm","sub":[{"id":"x-GM1-NCO-SPEC-175-c","kind":"GM","label":"GM1 NCO.SPEC.175(c)","title":"GM1 NCO.SPEC.175(c) Performance and operating criteria – helicopters","h":"<h4><a><\/a>GM1 NCO.SPEC.175(c) Performance and operating criteria – helicopters&nbsp;&nbsp;&nbsp;&nbsp;<\/h4> <p>CAA ORS9 Decision No. 1<\/p> <p>GENERAL<\/p> <p>(a) Even when the surface allows a hover in ground effect (HIGE), the likelihood of, for example, dust or blowing snow may necessitate hover out of ground effect (HOGE) performance.<\/p> <p>(b) Wind conditions on some sites, particularly downdraft in mountainous areas, may require a reduction in the helicopter mass in order to ensure that an out of ground effect hover can be achieved at the operational site in the conditions prevailing.<\/p> <p>&nbsp;<\/p>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/4%20GM/GM1%20NCO%20SPEC%20175%20c%20Performance.htm"}]},{"id":"r-NCO-SPEC-HESLO-100","ref":"NCO.SPEC.HESLO.100","title":"Checklist","h":"<h1>NCO.SPEC.HESLO.100 Checklist <\/h1> <div> <p>The checklist for HESLO shall contain:<\/p> <p>(a)&nbsp;normal, abnormal and emergency procedures;<\/p> <p>(b)&nbsp;relevant performance data;<\/p> <p>(c)&nbsp;required equipment;<\/p> <p>(d)&nbsp;any limitations; and<\/p> <p>(e)&nbsp;responsibilities and duties of the pilot-in-command, and, if applicable, crew members and task specialists.<\/p> <p>&nbsp;<\/p> <\/div>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/2%20Regs/21810_NCOSPECHESLO100_Checklist.htm","sub":[{"id":"x-GM1-NCO-SPEC-HESLO-100","kind":"GM","label":"GM1 NCO.SPEC.HESLO.100","title":"GM1 NCO.SPEC.HESLO.100 Checklist","h":"<h4><a><\/a>GM1 NCO.SPEC.HESLO.100 Checklist&nbsp;&nbsp;&nbsp;&nbsp;<\/h4> <p>CAA ORS9 Decision No. 1<\/p> <p>REFERENCES<\/p> <p>The following references to the AMC and GM of Annex VIII (Part-SPO) provide further guidance for the development of checklists.<\/p> <p>(a) AMC1 SPO.SPEC.HESLO.100 provides a generic framework for the development of standard operating procedures (SOP) for HESLO operations. This AMC can be regarded as a good practice example for developing the checklist for HESLO operations.<\/p> <p>(b) GM1 SPO.SPEC.HESLO.100 provides guidance for initial pilot training for HESLO types 1, 2, 3 and 4.<\/p> <p>&nbsp;<\/p>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/4%20GM/GM1%20NCO%20SPEC%20HESLO%20100%20Checklist.htm"}]},{"id":"r-NCO-SPEC-HESLO-105","ref":"NCO.SPEC.HESLO.105","title":"Specific HESLO equipment","h":"<h1>NCO.SPEC.HESLO105 Specific HESLO equipment <\/h1> <div> <p>The helicopter shall be equipped with at least:<\/p> <p>(a)&nbsp;one cargo safety mirror or alternative means to see the hook(s)/load; and<\/p> <p>(b)&nbsp;one load meter, unless there is another method of determining the weight of the load.<\/p> <p>&nbsp;<\/p> <\/div>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/2%20Regs/21840_NCOSPECHESLO105_Specific_HESLO_equipment.htm","sub":[]},{"id":"r-NCO-SPEC-HESLO-110","ref":"NCO.SPEC.HESLO.110","title":"Transportation of dangerous goods","h":"<h1>NCO.SPEC.HESLO.110 Transportation of dangerous goods <\/h1> <div> <p>The operator transporting dangerous goods to or from unmanned sites or remote locations shall apply to the CAA for an exemption from the provisions of the Technical Instructions if they intend not to comply with the requirements of those Instructions.<\/p> <p>&nbsp;<\/p> <\/div>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/2%20Regs/21870_NCOSPECHESLO110_Transportation_of_dangerous_goods.htm","sub":[]},{"id":"r-NCO-SPEC-HEC-100","ref":"NCO.SPEC.HEC.100","title":"Checklist","h":"<h1>NCO.SPEC.HEC.100 Checklist <\/h1> <div> <p>The checklist for HEC shall contain:<\/p> <p>(a)&nbsp;normal, abnormal and emergency procedures;<\/p> <p>(b)&nbsp;relevant performance data;<\/p> <p>(c)&nbsp;required equipment;<\/p> <p>(d)&nbsp;any limitations; and<\/p> <p>(e)&nbsp;responsibilities and duties of the pilot-in-command, and, if applicable, crew members and task specialists.<\/p> <p>&nbsp;<\/p> <\/div>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/2%20Regs/21910_NCOSPECHEC100_Checklist.htm","sub":[{"id":"x-GM1-NCO-SPEC-HEC-100","kind":"GM","label":"GM1 NCO.SPEC.HEC.100","title":"GM1 NCO.SPEC.HEC.100 Checklist","h":"<h4><a><\/a>GM1 NCO.SPEC.HEC.100 Checklist&nbsp;&nbsp;&nbsp;&nbsp;<\/h4> <p>CAA ORS9 Decision No. 1<\/p> <p>REFERENCES<\/p> <p>AMC1 SPO.SPEC.HEC.100 of Annex VIII (Part-SPO) provides a generic framework for the development of SOP for HEC operations. This AMC can be regarded as a good practice example for developing the checklist for HEC operations.<\/p> <p>&nbsp;<\/p>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/4%20GM/GM1%20NCO%20SPEC%20HEC%20100%20Checklist.htm"}]},{"id":"r-NCO-SPEC-HEC-105","ref":"NCO.SPEC.HEC.105","title":"Specific HEC equipment","h":"<h1>NCO.SPEC.HEC.105 Specific HEC equipment <\/h1> <div> <p>(a)&nbsp;The helicopter shall be equipped with:<\/p> <p>(1)&nbsp;&nbsp;hoist operations equipment or cargo hook;<\/p> <p>(2)&nbsp;&nbsp;one cargo safety mirror or alternative means to see the hook; and<\/p> <p>(3)&nbsp;&nbsp;one load meter, unless there is another method of determining the weight of the load.<\/p> <p>(b)&nbsp;The installation of all hoist and cargo hook equipment other than a simple PCDS, and any subsequent modifications shall have an airworthiness approval appropriate to the intended function.<\/p> <p>&nbsp;<\/p> <\/div>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/2%20Regs/21940_NCOSPECHEC105_Specific_HEC_equipment.htm","sub":[]},{"id":"r-NCO-SPEC-PAR-100","ref":"NCO.SPEC.PAR.100","title":"Checklist","h":"<h1>NCO.SPEC.PAR..100 Checklist <\/h1> <div> <p>The checklist for PAR shall contain:<\/p> <p>(a)&nbsp;normal, abnormal and emergency procedures;<\/p> <p>(b)&nbsp;relevant performance data;<\/p> <p>(c)&nbsp;required equipment;<\/p> <p>(d)&nbsp;any limitations; and<\/p> <p>(e)&nbsp;responsibilities and duties of the pilot-in-command, and, if applicable, crew members and task specialists.<\/p> <p>&nbsp;<\/p> <\/div>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/2%20Regs/21980_NCOSPECPAR100_Checklist.htm","sub":[]},{"id":"r-NCO-SPEC-PAR-105","ref":"NCO.SPEC.PAR.105","title":"Carriage of crew members and task specialists","h":"<h1>NCO.SPEC.PAR.105 Carriage of crew members and task specialists <\/h1> <div> <p>The requirement laid down in NCO.SPEC.120(c) shall not be applicable for task specialists performing parachute jumping.<\/p> <p>&nbsp;<\/p> <\/div>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/2%20Regs/22010_NCOSPECPAR105_Carriage_of_crew_members_and_task_specialists.htm","sub":[]},{"id":"r-NCO-SPEC-PAR-110","ref":"NCO.SPEC.PAR.110","title":"Seats","h":"<h1>NCO.SPEC.PAR.110 Seats <\/h1> <div> <p>Notwithstanding NCO.IDE.A.140(a)(1) and NCO.IDE.H.140(a)(1), the floor of the aircraft may be used as a seat, provided means are available for the task specialist to hold or strap on.<\/p> <p>&nbsp;<\/p> <\/div>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/2%20Regs/22040_NCOSPECPAR110_Seats.htm","sub":[]},{"id":"r-NCO-SPEC-PAR-115","ref":"NCO.SPEC.PAR.115","title":"Supplemental oxygen","h":"<h1>NCO.SPEC.PAR.115 Supplemental oxygen <\/h1> <div> <p>Notwithstanding NCO.SPEC.110(f), the requirement to use supplemental oxygen shall not be applicable for crew members other than the pilot-in-command and for task specialists carrying out duties essential to the specialised task, whenever the cabin altitude:<\/p> <p>(a)&nbsp;exceeds 13000 ft, for a period of not more than 6 minutes;, or<\/p> <p>(b)&nbsp;exceeds 15000 ft, for a period of not more 3 minutes.<\/p> <p>&nbsp;<\/p> <\/div>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/2%20Regs/22070_NCOSPECPAR115_Supplemental_oxygen.htm","sub":[]},{"id":"r-NCO-SPEC-PAR-120","ref":"NCO.SPEC.PAR.120","title":"Transport and release of dangerous goods","h":"<h1>NCO.SPEC.PAR.120 Transport and release of dangerous goods <\/h1> <div> <p>Notwithstanding point NCO.SPEC.160, parachutists may carry smoke trail devices and exit the aircraft for the purpose of parachute display over congested areas of cities, towns or settlements or over an open-air assembly of persons, provided those devices are manufactured for that purpose.<\/p> <p>&nbsp;<\/p> <\/div>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/2%20Regs/22100_NCOSPECPAR120_Transport_and_release_of_dangerous_goods.htm","sub":[]},{"id":"r-NCO-SPEC-ABF-100","ref":"NCO.SPEC.ABF.100","title":"Checklist","h":"<h1>NCO.SPEC.ABF.100 Checklist <\/h1> <div> <p>The checklist for ABF shall contain:<\/p> <p>(a)&nbsp;normal, abnormal and emergency procedures;<\/p> <p>(b)&nbsp;relevant performance data;<\/p> <p>(c)&nbsp;required equipment;<\/p> <p>(d)&nbsp;any limitations; and<\/p> <p>(e)&nbsp;responsibilities and duties of the pilot-in-command, and, if applicable, crew members and task specialists.<\/p> <p>&nbsp;<\/p> <\/div>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/2%20Regs/22140_NCOSPECABF100_Checklist.htm","sub":[]},{"id":"r-NCO-SPEC-ABF-105","ref":"NCO.SPEC.ABF.105","title":"Documents and information","h":"<h1>NCO.SPEC.ABF.105 Documents and information <\/h1> <div> <p>The following documents and information listed in NCO.GEN.135(a) need not be carried during aerobatic flights:<\/p> <p>(a)&nbsp;details of the filed ATS flight plan, if applicable;<\/p> <p>(b)&nbsp;current and suitable aeronautical charts for the route/area of the proposed flight and all routes along which it is reasonable to expect that the flight may be diverted; and<\/p> <p>(c)&nbsp;procedures and visual signals information for use by intercepting and intercepted aircraft.<\/p> <p>&nbsp;<\/p> <\/div>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/2%20Regs/22170_NCOSPECABF105_Documents_and_information.htm","sub":[]},{"id":"r-NCO-SPEC-ABF-110","ref":"NCO.SPEC.ABF.110","title":"Equipment","h":"<h1>NCO.SPEC.ABF.110 Equipment <\/h1> <div> <p>The following equipment requirements need not be applicable to aerobatic flights:<\/p> <p>(a)&nbsp;first-aids kit as laid down in NCO.IDE.A.145 and NCO.IDE.H.145;<\/p> <p>(b)&nbsp;hand-fire extinguishers as laid down in NCO.IDE.A.160 and NCO.IDE.H.180; and<\/p> <p>(c)&nbsp;emergency locator transmitters or personal locator beacons as laid down in NCO.IDE.A.170 and NCO.IDE.H.170.<\/p> <p>&nbsp;<\/p> <\/div>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/2%20Regs/22200_NCOSPECABF110_Equipment.htm","sub":[]},{"id":"r-NCO-SPEC-MCF-100","ref":"NCO.SPEC.MCF.100","title":"Levels of maintenance check flights","h":"<h1>NCO.SPEC.MCF.100 Levels of maintenance check flights <\/h1> <div> <p>Before conducting a maintenance check flight, the operator shall determine the applicable level of the maintenance check flight as follows:<\/p> <p>(a)&nbsp;a ‘Level A’ maintenance check flight for a flight where the use of abnormal or emergency procedures, as defined in the aircraft flight manual, is expected, or where a flight is required to prove the functioning of a backup system or other safety devices;<\/p> <p>(b)&nbsp;a ‘Level B’ maintenance check flight for any maintenance check flight other than a ‘Level A’ maintenance check flight.<\/p> <p>&nbsp;<\/p> <\/div>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/2%20Regs/22240_NCOSPECMCF100_Levels_of_maintenance_check_flights.htm","sub":[]},{"id":"r-NCO-SPEC-MCF-105","ref":"NCO.SPEC.MCF.105","title":"Operational limitations","h":"<h1>NCO.SPEC.MCF.105 Operational limitations <\/h1> <div> <p>(a)&nbsp;By way of derogation from point NCO.GEN.105(a)(4) of this Annex, a maintenance check flight may be conducted with an aircraft that has been released to service with incomplete maintenance in accordance with point M.A.801(g) or point 145.A.50(e) of Annex I to Commission Regulation (EU) No 1321/2014.<\/p> <p>(b)&nbsp;By way of derogation from point NCO.GEN.105(a)(4) of this Annex, a maintenance check flight may be conducted with an aircraft that has been released to service with incomplete maintenance in accordance with points M.A.801(f) of Annex I (Part-M), 145.A.50(e) of Annex II (Part-145) or ML.A.801(f) of Annex Vb (Part-ML) to Commission Regulation (EU) No 1321/2014.<\/p> <p>&nbsp;<\/p> <\/div>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/2%20Regs/22270_NCOSPECMCF105_Operational_limitations.htm","sub":[]},{"id":"r-NCO-SPEC-MCF-110","ref":"NCO.SPEC.MCF.110","title":"Checklist and safety briefing","h":"<h1>NCO.SPEC.MCF.110 Checklist and safety briefing <\/h1> <div> <p>(a)&nbsp;The checklist referred to in point NCO.SPEC.105 shall be updated as needed before each maintenance check flight and shall consider the operating procedures that are planned to be followed during the particular maintenance check flight.<\/p> <p>(b)&nbsp;Notwithstanding point NCO.SPEC.125(b), a safety briefing of the task specialist shall be required before each maintenance check flight.<\/p> <p>&nbsp;<\/p> <\/div>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/2%20Regs/22300_NCOSPECMCF110_Checklist_and_safety_briefing.htm","sub":[{"id":"x-GM1-NCO-SPEC-MCF-110","kind":"GM","label":"GM1 NCO.SPEC.MCF.110","title":"GM1 NCO.SPEC.MCF.110 Checklist and safety briefing","h":"<h4><a><\/a>GM1 NCO.SPEC.MCF.110 Checklist and safety briefing&nbsp;&nbsp;&nbsp;&nbsp;<\/h4> <p>CAA ORS9 Decision No. 1<\/p> <p>SPECIFIC PROCEDURES<\/p> <p>Specific preparation for a maintenance check flight (MCF) is essential. In addition to the standard considerations before a typical flight (weather, aircraft weight and balance, pre-flight inspection, checklists, etc.), the pilot should:<\/p> <p>(a) inform ATC of the particular MCF;<\/p> <p>(b) if needed, agree on the appropriate airspace;<\/p> <p>(c) understand the airworthiness status of the aircraft;<\/p> <p>(d) assess the complexity of the flight; and<\/p> <p>(e) develop appropriate strategies to mitigate potential risks.<\/p> <p>The operator planning to conduct an MCF should develop checklists for the in-flight assessment of the unreliable systems, considering relevant abnormal and emergency procedures. When developing the checklists, the operator should consider the applicable documentation available from the type certificate holder or other valid documentation.<\/p> <p>The pilot-in-command should only allow on board the persons needed for the purpose of the flight and brief the crew and task specialist on abnormal and emergency procedures relevant for the MCF.<\/p> <p>&nbsp;<\/p>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/4%20GM/GM1%20NCO%20SPEC%20MCF%20110%20Checklist.htm"}]},{"id":"r-NCO-SPEC-MCF-120","ref":"NCO.SPEC.MCF.120","title":"Flight crew requirements","h":"<h1>NCO.SPEC.MCF.120 Flight crew requirements <\/h1> <div> <p>When selecting a flight crew member for a maintenance check flight, the operator shall consider the aircraft complexity and the level of the maintenance check flight as defined in point NCO.SPEC.MCF.100.<\/p> <p>&nbsp;<\/p> <\/div>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/2%20Regs/22330_NCOSPECMCF120_Flight_crew_requirements.htm","sub":[{"id":"x-AMC1-NCO-SPEC-MCF-120","kind":"AMC","label":"AMC1 NCO.SPEC.MCF.120","title":"AMC1 NCO.SPEC.MCF.120 Flight crew requirements","h":"<h3><a><\/a>AMC1 NCO.SPEC.MCF.120 Flight crew requirements&nbsp;&nbsp;&nbsp;&nbsp;<\/h3> <p>CAA ORS9 Decision No. 1<\/p> <p>SELECTION OF PILOT-IN-COMMAND FOR A LEVEL-A MCF<\/p> <p>The operator may select a flight instructor to act as pilot-in-command for a ‘Level A’ MCF on other than complex motor-powered aircraft.<\/p> <p>&nbsp;<\/p>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/3%20AMC/AMC1%20NCO%20SPEC%20MCF%20120%20Flight.htm"}]},{"id":"r-NCO-SPEC-MCF-125","ref":"NCO.SPEC.MCF.125","title":"Crew composition and persons on board","h":"<h1>NCO.SPEC.MCF.125 Crew composition and persons on board <\/h1> <div> <p>(a)&nbsp;The pilot-in-command shall identify the need for additional crew members or task specialists, or both, before each intended maintenance check flight, taking into consideration the expected flight crew member or task specialist workload and the risk assessment.<\/p> <p>(b)&nbsp;The pilot-in-command shall not allow persons on board other than those required under point (a) during a ‘Level A’ maintenance check flight.<\/p> <p>&nbsp;<\/p> <\/div>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/2%20Regs/22360_NCOSPECMCF125_Crew_composition_and_persons_on_board.htm","sub":[{"id":"x-GM1-NCO-SPEC-MCF-125","kind":"GM","label":"GM1 NCO.SPEC.MCF.125","title":"GM1 NCO.SPEC.MCF.125 Crew composition and persons on board","h":"<h4><a><\/a>GM1 NCO.SPEC.MCF.125 Crew composition and persons on board&nbsp;&nbsp;&nbsp;&nbsp;<\/h4> <p>CAA ORS9 Decision No. 1<\/p> <p>TASK SPECIALIST<\/p> <p>The task specialist should be trained as necessary in crew coordination procedures as well as emergency procedures and be appropriately equipped.<\/p> <p>&nbsp;<\/p>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/4%20GM/GM1%20NCO%20SPEC%20MCF%20125%20Crew.htm"}]},{"id":"r-NCO-SPEC-MCF-130","ref":"NCO.SPEC.MCF.130","title":"Simulated abnormal or emergency procedures in flight","h":"<h1>NCO.SPEC.MCF.130 Simulated abnormal or emergency procedures in flight <\/h1> <div> <p>By way of derogation from point NCO.SPEC.145, a pilot-in-command may simulate situations that require the application of abnormal or emergency procedures with a task specialist on board if the simulation is required to meet the intention of the flight and if it has been identified in the check list referred to in point NCO.SPEC.MCF.110 or in operating procedures.<\/p> <p>&nbsp;<\/p> <\/div>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/2%20Regs/22390_NCOSPECMCF130_Simulated_abnormal_or_emergency_procedures_in_flight.htm","sub":[]},{"id":"r-NCO-SPEC-MCF-140","ref":"NCO.SPEC.MCF.140","title":"Systems and equipment","h":"<h1>NCO.SPEC.MCF.140 Systems and equipment <\/h1> <div> <p>When a maintenance check flight is intended to check the proper functioning of a system or equipment, that system or equipment shall be identified as potentially unreliable, and appropriate mitigation measures shall be agreed prior to the flight in order to minimise risks to flight safety.<\/p> <p>&nbsp;<\/p> <\/div>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/2%20Regs/22420_NCOSPECMCF140_Systems_and_equipment.htm","sub":[]}]}</script>
<script>
const D=JSON.parse(document.getElementById('data').textContent);
const R=D.rules, byId={}, byRef={}, subById={};
R.forEach((r,i)=>{r.i=i;byId[r.id]=r;byRef[r.ref]=r;r.sub.forEach(s=>{s.parent=r;subById[s.id]=s;});});
const where={};
D.groups.forEach(g=>{g.rules.forEach(id=>where[id]={g});g.secs.forEach(s=>s.rules.forEach(id=>where[id]={g,s}));});
const $=s=>document.querySelector(s);
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const strip=h=>{const t=document.createElement('div');t.innerHTML=h;return t.textContent.replace(/\s+/g,' ').trim();};
R.forEach(r=>{r.txt=strip(r.h).toLowerCase();r.sub.forEach(s=>s.txt=strip(s.h).toLowerCase());});

// nav
function navHtml(){
 let h='';
 D.groups.forEach(g=>{
  h+=`<details class="sub" data-g="${g.id}"><summary>Subpart ${g.letter} · ${esc(g.name)}</summary>`;
  const link=id=>{const r=byId[id];return `<a href="#${r.id}" data-id="${r.id}"><span class="c">${r.sub.length?r.sub.length:''}</span><span class="r">${esc(r.ref)}</span>${esc(r.title)}</a>`;};
  g.rules.forEach(id=>h+=link(id));
  g.secs.forEach(s=>{h+=`<div class="sec">${esc(s.title.replace(/ /g,' '))}</div>`;if(!s.rules.length)h+=`<a style="color:var(--mut);font-style:italic" href="#${g.id}">Repealed</a>`;else s.rules.forEach(id=>h+=link(id));});
  h+='</details>';
 });
 $('#nav').innerHTML=h;
}
navHtml();

// cross-reference linking
const refRx=/\b(?:(AMC|GM)(\d+)\s+)?(NCO\.(?:[A-Z]+\.)*?[A-Z]+\.\d+)((?:\([a-z0-9]+\))*)/g;
function linkify(root,selfId){
 const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);const nodes=[];let n;
 while(n=w.nextNode()){if(n.parentElement.closest('a,h1,h2,h3'))continue;if(refRx.test(n.nodeValue))nodes.push(n);refRx.lastIndex=0;}
 nodes.forEach(n=>{
  const s=n.nodeValue;let out='',last=0;s.replace(refRx,(m,k,num,ref,sfx,off)=>{
   let tgt=null;
   if(k){const r=byRef[ref];if(r)tgt=r.sub.find(x=>x.label===k+num+' '+ref+(sfx||''))||r.sub.find(x=>x.label.startsWith(k+num+' '+ref));}
   else if(byRef[ref])tgt=byRef[ref];
   out+=esc(s.slice(last,off));
   out+=tgt&&tgt.id!==selfId?`<a class="x" href="#${tgt.id}">${esc(m)}</a>`:esc(m);
   last=off+m.length;});
  out+=esc(s.slice(last));
  const span=document.createElement('span');span.innerHTML=out;n.replaceWith(...span.childNodes);
 });
}
function highlight(root,term){
 if(!term)return;const t=term.toLowerCase();
 const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);const nodes=[];let n;
 const lw=x=>x.toLowerCase().replace(/\u00a0/g,' ');
 while(n=w.nextNode())if(lw(n.nodeValue).includes(t))nodes.push(n);
 nodes.forEach(n=>{const s=n.nodeValue,l=lw(s);let out='',i=0,j;while((j=l.indexOf(t,i))>-1){out+=esc(s.slice(i,j))+'<mark>'+esc(s.slice(j,j+t.length))+'</mark>';i=j+t.length;}out+=esc(s.slice(i));const sp=document.createElement('span');sp.innerHTML=out;n.replaceWith(...sp.childNodes);});
}
function body(h){return h.replace(/^\s*<h[1-4]>.*?<\/h[1-4]>\s*/,'');}

let term='';
function showRule(r,focus){
 const w=where[r.id]||{};
 const g=w.g,s=w.s;
 let h=`<div class="crumb">${g?`Subpart ${g.letter} · ${esc(g.name)}`:''}${s?' › '+esc(s.name):''}</div>`;
 h+=`<section class="rule" id="sec-${r.id}"><div class="bh"><div><div class="ref" style="font-size:18px">${esc(r.ref)}</div><h2 style="margin:2px 0 10px;font-size:17px">${esc(r.title)}</h2></div><a class="ext" href="${r.url}" target="_blank" rel="noopener">CAA ↗</a></div><div class="content">${body(r.h)}</div>`;
 if(r.sub.length)h+=`<div class="chips">${r.sub.map(x=>`<a class="${x.kind}" href="#${x.id}">${esc(x.label)}</a>`).join('')}</div>`;
 h+='</section>';
 if(r.sub.length){h+=`<div class="subhead">AMC &amp; GM to ${esc(r.ref)}</div>`;
  r.sub.forEach(x=>{h+=`<section class="blk ${x.kind}" id="sec-${x.id}"><div class="bh"><div><div class="tag">${esc(x.label)}</div><div style="font-size:14px;margin:2px 0 8px">${esc(x.title.replace(x.label,'').replace(/^[\s–—-]+/,''))}</div></div><a class="ext" href="${x.url}" target="_blank" rel="noopener">CAA ↗</a></div><div class="content">${body(x.h)}</div></section>`;});}
 const pv=R[r.i-1],nx=R[r.i+1];
 h+=`<div class="pn">${pv?`<a href="#${pv.id}">‹ Previous<span>${esc(pv.ref)}</span></a>`:'<span></span>'}${nx?`<a class="n" href="#${nx.id}">Next ›<span>${esc(nx.ref)}</span></a>`:''}</div>`;
 const doc=$('#doc');doc.innerHTML=h;
 doc.querySelectorAll('.content').forEach(c=>{linkify(c,r.id);});
 if(term)doc.querySelectorAll('.content').forEach(c=>highlight(c,term));
 document.querySelectorAll('.nav a.cur').forEach(a=>a.classList.remove('cur'));
 const a=document.querySelector(`.nav a[data-id="${r.id}"]`);
 if(a){a.classList.add('cur');a.closest('details').open=true;a.scrollIntoView({block:'nearest'});}
 const el=focus?document.getElementById('sec-'+focus):null;
 if(el){if(!showAG&&focus.startsWith('x-')){setAG(true);}requestAnimationFrame(()=>el.scrollIntoView({block:'start'}));}
 else if(term){const m=doc.querySelector('mark');if(m)requestAnimationFrame(()=>m.scrollIntoView({block:'center'}));else $('#main').scrollTop=0;}
 else $('#main').scrollTop=0;
 document.title=r.ref+' · UK Part-NCO';
}
function showGroup(g){
 let h=`<div class="home"><div class="crumb">Annex VII (Part-NCO)</div><h2>Subpart ${g.letter} · ${esc(g.name)}</h2><div class="grid">`;
 const card=id=>{const r=byId[id];return `<a href="#${r.id}"><b>${esc(r.ref)}</b>${esc(r.title)}</a>`;};
 g.rules.forEach(id=>h+=card(id));
 g.secs.forEach(s=>{h+=`</div><div class="subhead">${esc(s.title.replace(/ /g,' '))}</div><div class="grid">`;if(!s.rules.length)h+=`<div class="note">${strip(body(s.h))||'No provisions.'}</div>`;s.rules.forEach(id=>h+=card(id));});
 $('#doc').innerHTML=h+'</div></div>';$('#main').scrollTop=0;
}
function showHome(){
 const nA=R.reduce((a,r)=>a+r.sub.filter(x=>x.kind==='AMC').length,0),nG=R.reduce((a,r)=>a+r.sub.filter(x=>x.kind==='GM').length,0);
 let h=`<div class="home"><h2>Annex VII (Part-NCO)</h2><p style="margin:0">Non-commercial air operations with other-than complex motor-powered aircraft. UK Regulation (EU) No 965/2012, as amended, with the CAA's AMC and GM (ORS9).</p>
 <p class="note">${R.length} rules · ${nA} AMC · ${nG} GM · copied from the CAA Regulatory Library on ${new Date(D.fetched).toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'})}.</p><div class="grid">`;
 D.groups.forEach(g=>{const n=g.rules.length+g.secs.reduce((a,s)=>a+s.rules.length,0);h+=`<a href="#${g.id}"><b>Subpart ${g.letter}</b>${esc(g.name)}<div class="note">${n} rules</div></a>`;});
 h+=`</div><div class="subhead">Quick links</div><div class="chips">${['NCO.GEN.102','NCO.OP.110','NCO.OP.125','NCO.OP.140','NCO.OP.143','NCO.OP.160','NCO.OP.210','NCO.IDE.A.100'].filter(x=>byRef[x]).map(x=>`<a class="AMC" style="background:var(--pane);color:var(--acc);border:1px solid var(--line)" href="#${byRef[x].id}">${x}</a>`).join('')}</div>
 <div class="subhead">How to use</div><p class="note">Pick a rule from the contents. Its AMC and GM follow it on the same page, in green and amber. References in the text link to the right rule. Search covers every rule, AMC and GM. "CAA ↗" opens the official page. This is a reading copy for training: check the CAA Regulatory Library for the current legal text.</p></div>`;
 $('#doc').innerHTML=h;document.querySelectorAll('.nav a.cur').forEach(a=>a.classList.remove('cur'));$('#main').scrollTop=0;document.title='UK Part-NCO Reader';
}
function search(q){
 const t=q.toLowerCase().trim();const res=[];
 const refq=t.replace(/\s+/g,' ');
 R.forEach(r=>{
  const hitRef=(r.ref+' '+r.title).toLowerCase().includes(refq);
  if(hitRef||r.txt.includes(t))res.push({k:'R',lab:r.ref,ti:r.title,txt:r.txt,id:r.id,score:hitRef?0:1});
  r.sub.forEach(x=>{const hr=x.title.toLowerCase().includes(refq);if(hr||x.txt.includes(t))res.push({k:x.kind,lab:x.label,ti:x.title.replace(x.label,'').replace(/^[\s–—-]+/,''),txt:x.txt,id:x.id,score:hr?0:2});});
 });
 res.sort((a,b)=>a.score-b.score);
 const snip=s=>{const i=s.indexOf(t);if(i<0)return '';const a=Math.max(0,i-70);return (a?'…':'')+esc(s.slice(a,i))+'<mark>'+esc(s.slice(i,i+t.length))+'</mark>'+esc(s.slice(i+t.length,i+t.length+110))+'…';};
 let h=`<div class="crumb">${res.length} result${res.length===1?'':'s'} for “${esc(q)}”</div><ul class="res">`;
 res.slice(0,200).forEach(x=>h+=`<li data-id="${x.id}"><div class="k ${x.k}">${esc(x.lab)}</div><div style="font-size:14px">${esc(x.ti)}</div><div class="s">${snip(x.txt)}</div></li>`);
 $('#doc').innerHTML=h+'</ul>'+(res.length>200?'<p class="note">Showing the first 200. Narrow the search to see more.</p>':'');$('#main').scrollTop=0;
}
function route(){
 const h=decodeURIComponent(location.hash.slice(1));
 if(byId[h])return showRule(byId[h]);
 if(subById[h])return showRule(subById[h].parent,h);
 const g=D.groups.find(g=>g.id===h);if(g)return showGroup(g);
 showHome();
}
window.addEventListener('hashchange',()=>{$('#side').classList.remove('open');route();});
let tmr;$('#q').addEventListener('input',e=>{clearTimeout(tmr);const v=e.target.value;tmr=setTimeout(()=>{term=v.trim().length>=2?v.trim():'';if(term)search(term);else route();},180);});
$('#q').addEventListener('keydown',e=>{if(e.key==='Escape'){e.target.value='';term='';route();}});
$('#doc').addEventListener('click',e=>{const li=e.target.closest('.res li');if(li){location.hash=li.dataset.id;if(decodeURIComponent(location.hash.slice(1))===li.dataset.id)route();}});
$('#menuBtn').onclick=()=>$('#side').classList.toggle('open');
let showAG=true;function setAG(v){showAG=v;$('#doc').classList.toggle('hideAG',!v);$('#agBtn').classList.toggle('on',v);try{localStorage.setItem('ncoAG',v?'1':'0')}catch(e){}}
$('#agBtn').onclick=()=>setAG(!showAG);
const sizes=[14,16,18,20];let fi=1;
function setFs(i){fi=i;document.documentElement.style.setProperty('--fs',sizes[i]+'px');try{localStorage.setItem('ncoFs',i)}catch(e){}}
$('#fsBtn').onclick=()=>setFs((fi+1)%sizes.length);
try{const a=localStorage.getItem('ncoAG');if(a==='0')setAG(false);const f=localStorage.getItem('ncoFs');if(f!==null)setFs(+f);}catch(e){}
route();
</script>
</body>
</html>
