lications for the navigation system.<\/p> <p>(c) ‘Direct to’ clearances may be accepted to the IF provided that it is clear to the pilot-in-command that the aircraft will be established on the final approach track at least 2 NM before the FAF.<\/p> <p>(d) ‘Direct to’ clearance to the FAF should not be acceptable. Modifying the procedure to intercept the final approach track prior to the FAF should be acceptable for radar-vectored arrivals or otherwise only with ATC approval.<\/p> <p>(e) The final approach trajectory should be intercepted no later than the FAF in order for the aircraft to be correctly established on the final approach track before starting the descent (to ensure terrain and obstacle clearance).<\/p> <p>(f) ‘Direct to’ clearances to a fix that immediately precede an RF leg should not be permitted.<\/p> <p>(g) For parallel offset operations en route in RNP 4 and A-RNP, transitions to and from the offset track should maintain an intercept angle of no more than 45° unless specified otherwise by ATC.<\/p> <p>&nbsp;<\/p>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/3%20AMC/AMC5%20NCO%20OP%20116%20Performance.htm"},{"id":"x-AMC6-NCO-OP-116","kind":"AMC","label":"AMC6 NCO.OP.116","title":"AMC6 NCO.OP.116 Performance-based navigation – aeroplanes and helicopters","h":"<h3><a><\/a>AMC6 NCO.OP.116 Performance-based navigation – aeroplanes and helicopters&nbsp;&nbsp;&nbsp;&nbsp;<\/h3> <p>CAA ORS9 Decision No. 1<\/p> <p>ALERTING AND ABORT<\/p> <p>(a) Unless the pilot-in-command has sufficient visual reference to continue the approach operation to a safe landing, an RNP APCH operation should be discontinued if:<\/p> <ol> <p> <\/p><p>(1) navigation system failure is annunciated (e.g. warning flag);<\/p> <p><\/p> <p> <\/p><p>(2) lateral or vertical deviations exceed the tolerances; and<\/p> <p><\/p> <p> <\/p><p>(3) loss of the on-board monitoring and alerting system.<\/p> <p><\/p> <\/ol> <p>(b) Discontinuing the approach operation may not be necessary for a multi-sensor navigation system that includes demonstrated RNP capability without GNSS in accordance with the AFM/POH.<\/p> <p>(c) Where vertical guidance is lost while the aircraft is still above 1 000 ft AGL, the pilot-in- command may decide to continue the approach to LNAV minima, when supported by the navigation system.<\/p> <p>&nbsp;<\/p>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/3%20AMC/AMC6%20NCO%20OP%20116%20Performance.htm"},{"id":"x-AMC7-NCO-OP-116","kind":"AMC","label":"AMC7 NCO.OP.116","title":"AMC7 NCO.OP.116 Performance-based navigation – aeroplanes and helicopters","h":"<h3><a><\/a>AMC7 NCO.OP.116 Performance-based navigation – aeroplanes and helicopters&nbsp;&nbsp;&nbsp;&nbsp;<\/h3> <p>CAA ORS9 Decision No. 1<\/p> <p>CONTINGENCY PROCEDURES<\/p> <p>(a) The pilot-in-command should make the necessary preparation to revert to a conventional arrival procedure where appropriate. The following conditions should be considered:<\/p> <ol> <p> <\/p><p>(1) failure of the navigation system components including navigation sensors, and a failure effecting flight technical error (e.g. failures of the flight director or autopilot);<\/p> <p><\/p> <p> <\/p><p>(2) multiple system failures affecting aircraft performance;<\/p> <p><\/p> <p> <\/p><p>(3) coasting on inertial sensors beyond a specified time limit; and<\/p> <p><\/p> <p> <\/p><p>(4) RAIM (or equivalent) alert or loss of integrity function.<\/p> <p><\/p> <\/ol> <p>(b) In the event of loss of PBN capability, the pilot-in-command should invoke contingency procedures and navigate using an alternative means of navigation.<\/p> <p>(c) The pilot-in-command should notify ATC of any problem with PBN capability.<\/p> <p>(d) In the event of communication failure, the pilot-in-command should continue with the operation in accordance with published lost communication procedures.<\/p> <p>&nbsp;<\/p>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/3%20AMC/AMC7%20NCO%20OP%20116%20Performance.htm"},{"id":"x-AMC8-NCO-OP-116","kind":"AMC","label":"AMC8 NCO.OP.116","title":"AMC8 NCO.OP.116 Performance-based navigation – aeroplanes and helicopters","h":"<h3><a><\/a>AMC8 NCO.OP.116 Performance-based navigation – aeroplanes and helicopters&nbsp;&nbsp;&nbsp;&nbsp;<\/h3> <p>CAA ORS9 Decision No. 1<\/p> <p>RNAV 10<\/p> <p>(a) Operating procedures and routes should take account of the RNAV 10 time limit declared for the inertial system, if applicable, considering also the effect of weather conditions that could affect flight duration in RNAV 10 airspace.<\/p> <p>(b) The operator may extend RNAV 10 inertial navigation time by position updating. The operator should calculate, using statistically-based typical wind scenarios for each planned route, points at which updates can be made, and the points at which further updates will not be possible.<\/p> <p>&nbsp;<\/p>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/3%20AMC/AMC8%20NCO%20OP%20116%20Performance.htm"},{"id":"x-GM1-NCO-OP-116","kind":"GM","label":"GM1 NCO.OP.116","title":"GM1 NCO.OP.116 Performance-based navigation – aeroplanes and helicopters","h":"<h4><a><\/a>GM1 NCO.OP.116 Performance-based navigation – aeroplanes and helicopters&nbsp;&nbsp;&nbsp;&nbsp;<\/h4> <p>CAA ORS9 Decision No. 1<\/p> <p>DESCRIPTION<\/p> <p>(a) For both, RNP X and RNAV X designations, the ‘X’ (where stated) refers to the lateral navigation accuracy (total system error) in NM, which is expected to be achieved at least 95 % of the flight time by the population of aircraft operating within the airspace, route or procedure. For RNP APCH and A-RNP, the lateral navigation accuracy depends on the segment.<\/p> <p>(b) PBN may be required on notified routes, for notified procedures and in notified airspace.<\/p> <p>RNAV 10<\/p> <p>(c) For purposes of consistency with the PBN concept, this Regulation is using the designation ‘RNAV 10’ because this specification does not include on-board performance monitoring and alerting.<\/p> <p>(d) However, it should be noted that many routes still use the designation ‘RNP 10’ instead of ‘RNAV 10’. ‘RNP 10’ was used as designation before the publication of the fourth edition of ICAO Doc 9613 in 2013. The terms ‘RNP 10’ and ‘RNAV 10’ should be considered equivalent.<\/p> <p>&nbsp;<\/p>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/4%20GM/GM1%20NCO%20OP%20116%20Performance.htm"}]},{"id":"r-NCO-OP-120","ref":"NCO.OP.120","title":"Noise abatement procedures — aeroplanes and helicopters","h":"<h1>NCO.OP.120 Noise abatement procedures — aeroplanes and helicopters <\/h1> <div> <p>The pilot-in-command shall take into account published noise abatement procedures to minimise the effect of aircraft noise while ensuring that safety has priority over noise abatement.<\/p> <p>&nbsp;<\/p> <\/div>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/2%20Regs/19000_NCOOP120_Noise_abatement_procedures_aeroplanes_and_helicopters.htm","sub":[]},{"id":"r-NCO-OP-121","ref":"NCO.OP.121","title":"Noise abatement procedures — balloons","h":"<h1>NCO.OP.121 Noise abatement procedures — balloons <\/h1> <div> <p>Provision repealed before document was retained.<\/p> <p>&nbsp;<\/p> <\/div>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/2%20Regs/19030_NCOOP121_Noise_abatement_procedures_balloons.htm","sub":[]},{"id":"r-NCO-OP-125","ref":"NCO.OP.125","title":"Fuel, energy and oil supply — aeroplanes  or helicopters","h":"<h1>NCO.OP.125 – Fuel, energy and oil supply — aeroplanes or helicopters<\/h1> <p>SI 2024 No. 1290<\/p> <p>The pilot‑in‑command of an aircraft must:<\/p> <ol> <li value=\"1\">ensure that the aircraft carries a sufficient quantity of fuel or energy and oil, taking into account the weather conditions, any element affecting the performance of the aircraft, any delays that are expected in flight and any contingencies that may reasonably be expected to affect the flight;<\/li> <li value=\"2\"> <p>plan a quantity of fuel or energy to be protected as final reserve fuel or energy to ensure a safe landing, taking into account points (1) and (2), in that priority order, to determine the quantity of the final reserve fuel or energy:<\/p> <ol> <li value=\"1\">the severity of the hazard to persons or property that could result from an emergency landing after fuel or energy starvation;<\/li> <li value=\"2\">the likelihood of unexpected circumstances resulting in the final reserve fuel or energy may no longer be protected;<\/li> <\/ol> <\/li> <li value=\"3\"> <p>commence a flight only if the aircraft carries sufficient fuel or energy and oil:<\/p> <ol> <li value=\"1\">when no destination alternate aerodrome is required, to fly to the aerodrome or operating site of intended landing, plus the final reserve fuel or energy; or<\/li> <li value=\"2\">when a destination alternate aerodrome is required, to fly to the aerodrome or operating site of intended landing, and afterwards, to an alternate aerodrome, plus the final reserve fuel or energy.<\/li> <\/ol> <\/li> <\/ol> <p>&nbsp;<\/p>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/2%20Regs/19060_NCOOP125_Fuel_and_oil_supply_aeroplanes.htm","sub":[{"id":"x-AMC1-NCO-OP-125-b","kind":"AMC","label":"AMC1 NCO.OP.125(b)","title":"AMC1 NCO.OP.125(b) Fuel or energy and oil supply – aeroplanes and helicopters","h":"<h3>AMC1 NCO.OP.125(b) Fuel or energy and oil supply – aeroplanes and helicopters<\/h3> <p>CAA ORS9 Decision No. 47<\/p> <p>PLANNING CRITERIA – FINAL RESERVE FUEL OR ENERGY<\/p> <p>The final reserve fuel (FRF) or energy should be no less than the required fuel or energy to fly:<\/p> <ol> <li value=\"1\"> <p>for aeroplanes: <\/p> <ol> <li value=\"1\"> <p>for 10&nbsp;minutes at maximum continuous cruise power at 1&nbsp;500&nbsp;ft (450&nbsp;m) above the destination under VFR by day, taking off and landing at the same aerodrome&nbsp;/ landing site, and always remaining within sight of that aerodrome&nbsp;/ landing site;<\/p> <\/li> <li value=\"2\"> <p>for 30&nbsp;minutes at holding speed at 1&nbsp;500&nbsp;ft (450&nbsp;m) above the destination under VFR by day; and <\/p> <\/li> <li value=\"3\"> <p>for 45&nbsp;minutes at holding speed at 1&nbsp;500&nbsp;ft (450&nbsp;m) above the destination or destination alternate aerodrome under VFR flights by night and IFR; and<\/p> <\/li> <\/ol> <\/li> <li value=\"2\"> <p>for helicopters:<\/p> <ol> <li value=\"1\"> <p>for 10&nbsp;minutes at best-range speed under VFR by day, taking off and landing at the same aerodrome / landing site, and always remaining within 25&nbsp;NM of that aerodrome&nbsp;/ landing site, when needed for the purpose of specialised operations;<\/p> <\/li> <li value=\"2\"> <p>for 20&nbsp;minutes at best‑range speed for other VFR flights; and<\/p> <\/li> <li value=\"3\"> <p>for 30&nbsp;minutes at holding speed at 1&nbsp;500&nbsp;ft (450&nbsp;m) above the destination or destination alternate aerodrome under IFR.<\/p> <\/li> <\/ol> <\/li> <\/ol> <p>&nbsp;<\/p>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/3%20AMC/AMC1%20NCO%20OP%20125%20b%20Fuel%20energy.htm"},{"id":"x-AMC2-NCO-OP-125-b","kind":"AMC","label":"AMC2 NCO.OP.125(b)","title":"AMC2 NCO.OP.125(b) Fuel or energy and oil supply — aeroplanes and helicopters","h":"<h3>AMC2 NCO.OP.125(b) Fuel or energy and oil supply — aeroplanes and helicopters<\/h3> <p>CAA ORS9 Decision No. 47<\/p> <p>FINAL RESERVE FUEL OR ENERGY<\/p> <p>The quantity of the FRF or energy should be planned before flight and be an easily recalled figure against which the pilot‑in‑command can assess the current fuel or energy state of the aircraft.<\/p> <p>&nbsp;<\/p>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/3%20AMC/AMC2%20NCO%20OP%20125%20b%20Fuel%20energy.htm"},{"id":"x-AMC3-NCO-OP-125-b","kind":"AMC","label":"AMC3 NCO.OP.125(b)","title":"AMC3 NCO.OP.125(b) Fuel or energy and oil supply — aeroplanes and helicopters","h":"<h3>AMC3 NCO.OP.125(b) Fuel or energy and oil supply — aeroplanes and helicopters<\/h3> <p>CAA ORS9 Decision No. 47<\/p> <p>FINAL RESERVE FUEL OR ENERGY PROTECTION<\/p> <ol> <li value=\"1\"> <p>The planned FRF or energy should be protected as a reserve in normal operations. If the fuel or energy on board falls below the FRF or energy, the pilot‑in‑command should consider this to be an emergency. The FRF or energy should not be used as contingency fuel in normal operations.<\/p> <\/li> <li value=\"2\"> <p>When the FRF or energy can no longer be protected, then a fuel or energy emergency should be declared and any landing option explored, including deviating from rules, operational procedures, and methods in the interest of safety (as per point CAT.GEN.MPA.105(b)).<\/p> <\/li> <\/ol> <p>&nbsp;<\/p>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/3%20AMC/AMC3%20NCO%20OP%20125%20b%20Fuel%20energy.htm"},{"id":"x-GM1-NCO-OP-125-b","kind":"GM","label":"GM1 NCO.OP.125(b)","title":"GM1 NCO.OP.125(b) Fuel or energy and oil supply — aeroplanes and helicopters","h":"<h4>GM1 NCO.OP.125(b) Fuel or energy and oil supply — aeroplanes and helicopters<\/h4> <p>CAA ORS9 Decision No. 47<\/p> <p>LIKELIHOOD OF UNEXPECTED CIRCUMSTANCES TO INCREASE WITH FLIGHT DURATION<\/p> <p>The likelihood of unexpected circumstances arising after the aircraft is fuelled may increase with the duration of the planned flight (for example, during a long flight, a problem at the destination aerodrome or operating site is more likely to have occurred than during a short local flight).<\/p> <p>&nbsp;<\/p>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/4%20GM/GM1%20NCO%20OP%20125%20b%20Fuel%20energy.htm"},{"id":"x-GM2-NCO-OP-125-b","kind":"GM","label":"GM2 NCO.OP.125(b)","title":"GM2 NCO.OP.125(b) Fuel or energy and oil supply — aeroplanes and helicopters","h":"<h4>GM2 NCO.OP.125(b) Fuel or energy and oil supply — aeroplanes and helicopters<\/h4> <p>CAA ORS9 Decision No. 47<\/p> <p>PLANNING OF FUEL&nbsp;OR ENERGY QUANTITY - HOLDING<\/p> <p>When planning the fuel or energy quantity, in case of holding, and if the aircraft documentation does not provide approved data for the holding regime, the pilot should derive the fuel or energy flow data from the long‑range/best‑range cruise data or, if this is not provided, from the lowest available cruise data in power setting tables.<\/p> <p>&nbsp;<\/p>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/4%20GM/GM2%20NCO%20OP%20125%20b%20Fuel%20energy.htm"}]},{"id":"r-NCO-OP-127","ref":"NCO.OP.127","title":"Fuel and ballast supply and planning — balloons","h":"<h1>NCO.OP.127 Fuel and ballast supply and planning — balloons <\/h1> <div> <p>Provision repealed before document was retained.<\/p> <p>&nbsp;<\/p> <\/div>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/2%20Regs/19120_NCOOP127_Fuel_and_ballast_supply_and_planning_balloons.htm","sub":[]},{"id":"r-NCO-OP-130","ref":"NCO.OP.130","title":"Passenger briefing","h":"<h1>NCO.OP.130 Passenger briefing <\/h1> <div> <p>The pilot-in-command shall ensure that before or, where appropriate, during the flight, passengers are given a briefing on emergency equipment and procedures.<\/p> <p>&nbsp;<\/p> <\/div>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/2%20Regs/19150_NCOOP130_Passenger_briefing.htm","sub":[{"id":"x-AMC1-NCO-OP-130","kind":"AMC","label":"AMC1 NCO.OP.130","title":"AMC1 NCO.OP.130 Passenger briefing","h":"<h3><a><\/a>AMC1 NCO.OP.130 Passenger briefing&nbsp;&nbsp;&nbsp;&nbsp;<\/h3> <p>CAA ORS9 Decision No. 1<\/p> <p>GENERAL<\/p> <p>(a) The briefing should include the locations and use of seat belts and if applicable:<\/p> <ol> <p> <\/p><p>(1) emergency exits;<\/p> <p><\/p> <p> <\/p><p>(2) passenger emergency briefing cards;<\/p> <p><\/p> <p> <\/p><p>(3) life-jackets;<\/p> <p><\/p> <p> <\/p><p>(4) oxygen dispensing equipment;<\/p> <p><\/p> <p> <\/p><p>(5) life rafts; and<\/p> <p><\/p> <p> <\/p><p>(6) other emergency equipment provided for individual passenger use.<\/p> <p><\/p> <\/ol> <p>(b) The briefing should also include the location and general manner of use of the principal emergency equipment carried for collective use.<\/p> <p>&nbsp;<\/p>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/3%20AMC/AMC1%20NCO%20OP%20130%20Passenger.htm"}]},{"id":"r-NCO-OP-135","ref":"NCO.OP.135","title":"Flight preparation","h":"<h1>NCO.OP.135 Flight preparation <\/h1> <div> <p>(a)&nbsp;Before commencing a flight, the pilot-in-command shall ascertain by every reasonable means available that the space-based facilities, ground and/or water facilities, including communication facilities and navigation aids available and directly required on such flight, for the safe operation of the aircraft, are adequate for the type of operation under which the flight is to be conducted.<\/p> <p>(b)&nbsp;Before commencing a flight, the pilot-in-command shall be familiar with all available meteorological information appropriate to the intended flight. Preparation for a flight away from the vicinity of the place of departure, and for every flight under IFR, shall include:<\/p> <p>(1)&nbsp;&nbsp;a study of available current weather reports and forecasts; and<\/p> <p>(2)&nbsp;&nbsp;the planning of an alternative course of action to provide for the eventuality that the flight cannot be completed as planned, because of weather conditions.<\/p> <p>&nbsp;<\/p> <\/div>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/2%20Regs/19180_NCOOP135_Flight_preparation.htm","sub":[]},{"id":"r-NCO-OP-140","ref":"NCO.OP.140","title":"Destination alternate aerodromes — aeroplanes","h":"<h1>NCO.OP.140 Destination alternate aerodromes — aeroplanes <\/h1> <p>SI 2024 No. 1290<\/p> <p>For IFR flights, the pilot‑in‑command of an aeroplane must specify at least one destination alternate aerodrome in the flight plan, unless the latest available weather information for the destination, for the period from an hour before the ETA to an hour after the ETA or the period from the actual time of departure to an hour after the ETA, whichever is the shorter, indicates that there will be a ceiling of at least 1000&nbsp;ft above the DH or MDH for an IAP and a visibility of at least 5000&nbsp;metres.<\/p> <p>&nbsp;<\/p>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/2%20Regs/19210_NCOOP140_Destination_alternate_aerodromes_aeroplanes.htm","sub":[]},{"id":"r-NCO-OP-141","ref":"NCO.OP.141","title":"Destination alternate aerodromes — helicopters","h":"<h1>NCO.OP.141 Destination alternate aerodromes — helicopters <\/h1> <p>SI 2024 No. 1290<\/p> <p>For IFR flights, the pilot‑in‑command of a helicopter must specify at least one destination alternate aerodrome in the flight plan, unless the latest available weather information, for the period from an hour before the ETA to an hour after the ETA or the period from the actual time of departure to an hour after the ETA, whichever is the shorter, indicates that there will be a ceiling of at least 1000&nbsp;ft above the DH or MDH for an IAP and a visibility of at least 3000&nbsp;metres.<\/p> <p>&nbsp;<\/p>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/2%20Regs/19240_NCOOP141_Destination_alternate_aerodromes_helicopters.htm","sub":[]},{"id":"r-NCO-OP-142","ref":"NCO.OP.142","title":"Destination alternate aerodrome — instrument approach operations","h":"<h1>NCO.OP.142 Destination alternate aerodrome — instrument approach operations <\/h1> <p>SI 2024 No. 1290<\/p> <p>The pilot‑in‑command of an aircraft must only select an aerodrome as a destination alternate aerodrome if either:<\/p> <ol> <li value=\"1\">an IAP that does not rely on GNSS is available either at the destination aerodrome or at a destination alternate aerodrome; or<\/li> <li value=\"2\"> <p>all of the following conditions are met:<\/p> <ol> <li value=\"1\">the onboard GNSS equipment is SBAS capable;<\/li> <li value=\"2\">the destination aerodrome, any destination alternate aerodrome, and the route between them are within SBAS service area;<\/li> <li value=\"3\">ABAS is predicted to be available in the event of the unexpected unavailability of SBAS;<\/li> <li value=\"4\">an IAP is selected (either at destination or destination alternate aerodrome) that does not rely on the availability of SBAS;<\/li> <li value=\"5\">an appropriate contingency action allows the flight to be completed safely in the event of the unavailability of GNSS.<\/li> <\/ol> <\/li> <\/ol> <p>&nbsp;<\/p>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/2%20Regs/19241_NCOOP142_Destination_aerodromes_instrument_approach_operations.htm","sub":[{"id":"x-AMC1-NCO-OP-142-b-1","kind":"AMC","label":"AMC1 NCO.OP.142(b)(1)","title":"AMC1 NCO.OP.142(b)(1) Destination alternate aerodromes — instrument approach operations","h":"<h3>AMC1 NCO.OP.142(b)(1) Destination alternate aerodromes — instrument approach operations<\/h3> <p>CAA ORS9 Decision No. 47<\/p> <p>SBAS‑CAPABLE GNSS EQUIPMENT<\/p> <p>GNSS systems which are authorised under (E)TSO‑C145 or (E)TSO‑C146 or later revisions are SBAS‑capable. Aircraft certified for RNP APCH to LPV minima are considered compliant.<\/p> <p>&nbsp;<\/p>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/3%20AMC/AMC1%20NCO%20OP%20142%20b%201%20Destination.htm"},{"id":"x-AMC2-NCO-OP-142-b-3","kind":"AMC","label":"AMC2 NCO.OP.142(b)(3)","title":"AMC2 NCO.OP.142(b)(3) Destination alternate aerodromes — instrument approach operations","h":"<h3>AMC2 NCO.OP.142(b)(3) Destination alternate aerodromes — instrument approach operations<\/h3> <p>CAA ORS9 Decision No. 47<\/p> <p>USE OF RAIM FOR SBAS<\/p> <p>Where a receiver with RAIM is used to meet the requirement for SBAS, its availability should be predicted by a pre‑flight RAIM check, in accordance with AMC1&nbsp;NCO.GEN.105(c). <\/p> <p>&nbsp;<\/p>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/3%20AMC/AMC2%20NCO%20OP%20142%20b%203%20Destination.htm"},{"id":"x-AMC1-NCO-OP-142-b-5","kind":"AMC","label":"AMC1 NCO.OP.142(b)(5)","title":"AMC1 NCO.OP.142(b)(5) Destination alternate aerodromes — instrument approach operations","h":"<h3>AMC1 NCO.OP.142(b)(5) Destination alternate aerodromes — instrument approach operations<\/h3> <p>CAA ORS9 Decision No. 47<\/p> <p>APPROPRIATE CONTINGENCY ACTION<\/p> <ol> <li value=\"1\"> <p>An appropriate contingency action is an alternative offered in NCO.OP.142(b)(5) to completion of the planned flight to a safe landing, either at the planned destination or a destination alternate, using normal procedures and using navigation equipment meeting the requirements of NCO.IDE.A/H.100, installed for redundancy or as a backup.<\/p> <\/li> <li value=\"2\"> <p>The contingency action should be considered before flight and take into account the information identified by flight preparation according to NCO.OP.135. It may depend on the flight and availability of navigation solutions (satellites, ground navaids, etc.) and weather conditions (IMC, VMC) along the flight.<\/p> <\/li> <li value=\"3\"> <p>The contingency action addresses partial loss of navigation capability, such as:<\/p> <\/li> <\/ol> <ul> <li> <p>loss of the stand‑alone GNSS equipment;<\/p> <\/li> <li> <p>local loss of GNSS signal‑in‑space (e.g. local jamming at destination); and<\/p> <\/li> <li> <p>loss of GNSS signal‑in‑space. <\/p> <\/li> <\/ul> <ol> <li value=\"4\"> <p>It should take into account what options remain in case of loss of GNSS signal; for instance, (non‑GNSS‑based) radar vectoring by ATC, non‑GNSS‑based navigation systems or the possibility to reach VMC.<\/p> <\/li> <li value=\"5\"> <p>Examples of contingency actions include:<\/p> <\/li> <\/ol> <ul> <li> <p> seeking navigational assistance from ATS, using communication and surveillance systems that remain operational, to enable safe descent to VMC;<\/p> <\/li> <li> <p>the emergency use of navigation equipment not meeting the requirements of NCO.IDE.A/H.100 by making use of the provisions in NCO.GEN.105(e);<\/p> <\/li> <li> <p>descent over water or very flat terrain to levels with reduced (but reasonable) obstacle clearance; and<\/p> <\/li> <li> <p>unusually long periods of dead reckoning.<\/p> <\/li> <\/ul> <p>&nbsp;<\/p>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/3%20AMC/AMC1%20NCO%20OP%20142%20b%205%20Destination.htm"},{"id":"x-GM1-NCO-OP-142-b-4","kind":"GM","label":"GM1 NCO.OP.142(b)(4)","title":"GM1 NCO.OP.142(b)(4) Destination alternate aerodromes — instrument approach operations","h":"<h4>GM1 NCO.OP.142(b)(4) Destination alternate aerodromes — instrument approach operations<\/h4> <p>CAA ORS9 Decision No. 47<\/p> <p>IAPs THAT DO NOT RELY ON SBAS<\/p> <ol> <li value=\"1\"> <p>This instrument approach can be an RNP&nbsp;APCH to LNAV minima. It can also be an RNP&nbsp;APCH to LNAV/VNAV minima using Baro&nbsp;VNAV if the aircraft is equipped with a Baro&nbsp;VNAV function certified for APV.&nbsp; <\/p> <\/li> <li value=\"2\"> <p>This requirement is only used for planning purposes to cover the possibility of an SBAS loss; it does not prevent the pilot from flying an approach relying on SBAS if SBAS is available. <\/p> <\/li> <\/ol> <p>&nbsp;<\/p>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/4%20GM/GM1%20NCO%20OP%20142%20b%204%20Destination.htm"}]},{"id":"r-NCO-OP-143","ref":"NCO.OP.143","title":"Destination alternate aerodromes planning minima — aeroplanes","h":"<h1>NCO.OP.143 Destination alternate aerodromes planning minima — aeroplanes<\/h1> <p>SI 2024 No. 1290<\/p> <p>An aerodrome must not be specified as a destination alternate aerodrome for an aeroplane unless the latest available weather information indicates, for the period from an hour before until an hour after the ETA or the period from the actual time of departure to an hour after the ETA, whichever is the shorter, that:<\/p> <ol> <li value=\"1\"> <p>for an alternate aerodrome with an available instrument approach operation with DH less than 250&nbsp;ft, there will be:<\/p> <ol> <li value=\"1\">a ceiling of at least 200&nbsp;ft above the DH or MDH associated with the IAP, and<\/li> <li value=\"2\">a visibility of at least 1500&nbsp;m; or<\/li> <\/ol> <\/li> <li value=\"2\"> <p>for an alternate aerodrome with an instrument approach operation with DH or MDH 250&nbsp;ft or more, there will be:<\/p> <ol> <li value=\"1\">a ceiling of at least 400&nbsp;ft above the DH or MDH associated with the instrument approach operation; and<\/li> <li value=\"2\">a visibility of at least 3000m; or<\/li> <\/ol> <\/li> <li value=\"3\"> <p>for an alternate aerodrome without an IAP, there will be:<\/p> <ol> <li value=\"1\">a ceiling of at least the higher of 2000&nbsp;ft and the minimum safe IFR height; and<\/li> <li value=\"2\">a visibility of at least 5000&nbsp;m.<\/li> <\/ol> <\/li> <\/ol> <p>&nbsp;<\/p>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/2%20Regs/19245_NCOOP143_Destination%20alternate%20aerodromes%20planning%20minima%20-%20aeroplanes.htm","sub":[{"id":"x-GM1-NCO-OP-143","kind":"GM","label":"GM1 NCO.OP.143","title":"GM1 NCO.OP.143 Destination alternate aerodromes planning minima — aeroplanes","h":"<h4>GM1 NCO.OP.143 Destination alternate aerodromes planning minima — aeroplanes<\/h4> <p>CAA ORS9 Decision No. 47<\/p> <p>MINIMUM SAFE IFR HEIGHT<\/p> <p>For the purpose of NCO.OP.143, the minimum safe IFR height is the height above the aerodrome of the lowest level compatible with SERA.5015(b) for en‑route flight at a point from which visual flight to the aerodrome could reasonably be commenced.<\/p> <p>&nbsp;<\/p>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/4%20GM/GM1%20NCO%20OP%20143%20Destination.htm"}]},{"id":"r-NCO-OP-144","ref":"NCO.OP.144","title":"Destination alternate aerodromes planning minima — helicopters","h":"<h1>NCO.OP.144 Destination alternate aerodromes planning minima — helicopters<\/h1> <p>SI 2024 No. 1290<\/p> <p>An aerodrome must not be specified as a destination alternate aerodrome for a helicopter unless the available weather information indicates, for the period from 1&nbsp;hour before until 1&nbsp;hour after the ETA, or for the period from the actual time of departure to 1&nbsp;hour after the ETA, whichever is the shorter, that:<\/p> <ol> <li value=\"1\"> <p>for an alternate aerodrome with an available IAP, there is:<\/p> <ol> <li value=\"1\">a ceiling of at least 200&nbsp;ft above the DH or MDH associated with the IAP; and<\/li> <li value=\"2\">a visibility of at least 1500&nbsp;m by day or 3000&nbsp;m by night; or<\/li> <\/ol> <\/li> <li value=\"2\"> <p>for an alternate aerodrome without an IAP:<\/p> <ol> <li value=\"1\">a ceiling of at least the higher of 2000&nbsp;ft and the minimum safe IFR height; and<\/li> <li value=\"2\">a visibility of at least 1500&nbsp;m by day or 3000&nbsp;m by night.<\/li> <\/ol> <\/li> <\/ol> <p>&nbsp;<\/p>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/2%20Regs/19247_NCOOP144_Destination%20alternate%20aerodromes%20planning%20minima%20-%20helicopters.htm","sub":[{"id":"x-GM1-NCO-OP-144","kind":"GM","label":"GM1 NCO.OP.144","title":"GM1 NCO.OP.144 Destination alternate aerodromes planning minima — helicopters","h":"<h4>GM1 NCO.OP.144 Destination alternate aerodromes planning minima — helicopters<\/h4> <p>CAA ORS9 Decision No. 47<\/p> <p>MINIMUM SAFE IFR HEIGHT<\/p> <p>For the purpose of NCO.OP.144, the minimum safe IFR height is the height above the aerodrome of the lowest level compatible with SERA.5015(b) for en‑route flight at a point from which visual flight to the aerodrome could reasonably be commenced. <\/p> <p>&nbsp;<\/p>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/4%20GM/GM1%20NCO%20OP%20144%20Destination.htm"}]},{"id":"r-NCO-OP-145","ref":"NCO.OP.145","title":"Refuelling with passengers embarking, on board or disembarking","h":"<h1>NCO.OP.145 Refuelling with passengers embarking, on board or disembarking <\/h1> <p>SI 2024 No. 1290<\/p> <ol> <li value=\"1\">The aircraft shall not be refuelled with aviation gasoline (AVGAS) or wide‑cut type fuel or a mixture of these types of fuel, when passengers are embarking, on board or disembarking.<\/li> <li value=\"2\">For all other types of fuel or energy, the aircraft shall not be refuelled when passengers are embarking, on board or disembarking, unless it is attended by the pilot‑in‑command or other qualified personnel ready to initiate and direct an evacuation of the aircraft by the most practical and expeditious means available.<\/li> <\/ol> <p>&nbsp;<\/p>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/2%20Regs/19300_NCOOP145_Refuelling_with_passengers_embarking_on_board_or_disembarking.htm","sub":[{"id":"x-AMC1-NCO-OP-145","kind":"AMC","label":"AMC1 NCO.OP.145","title":"AMC1 NCO.OP.145 Refuelling with passengers embarking, on board or disembarking","h":"<h3><a><\/a>AMC1 NCO.OP.145 Refuelling with passengers embarking, on board or disembarking&nbsp;&nbsp;&nbsp;&nbsp;<\/h3> <p>CAA ORS9 Decision No. 1<\/p> <p>OPERATIONAL PROCEDURES<\/p> <p>If passengers are on board when refuelling with other than aviation gasoline (AVGAS), wide-cut type fuel or a mixture of these types of fuel, the following precautions should be taken:<\/p> <p>(a) the pilot-in-command should remain at a location during fuelling operations with passengers on board which allows him to handle emergency procedures concerning fire protection and fire- fighting and initiate and direct an evacuation;<\/p> <p>(b) personnel and passengers should be warned that refuelling will take place;<\/p> <p>(c) passengers should be instructed to unfasten their seat belts and refrain from smoking; and<\/p> <p>(d) if the presence of fuel vapour is detected inside the aircraft, or any other hazard arises during refuelling, fuelling should be stopped immediately.<\/p> <p>&nbsp;<\/p>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/3%20AMC/AMC1%20NCO%20OP%20145%20Refuelling.htm"}]},{"id":"r-NCO-OP-147","ref":"NCO.OP.147","title":"Refuelling with engine or rotors turning - helicopters","h":"<h1>NCO.OP.147 Refuelling with engine or rotors turning - helicopters<\/h1> <p>SI 2024 No. 1290<\/p> <p>Refuelling a helicopter with engine running or rotors turning must only be conducted where all the following conditions are met:<\/p> <ol> <li value=\"1\">it is not practical to shut down or restart the engine;<\/li> <li value=\"2\">it is conducted in accordance with any specific procedures and limitations in the aircraft flight manual (AFM);<\/li> <li value=\"3\">only JET A or JET A‑1 fuel types are being used;<\/li> <li value=\"4\">no passengers or task specialists are on board, embarking or disembarking;<\/li> <li value=\"5\">the operator of the aerodrome or operating site allows such operations;<\/li> <li value=\"6\">appropriate rescue and firefighting facilities or equipment are present; and<\/li> <li value=\"7\"> <p>it is conducted in accordance with a checklist that must contain:<\/p> <ol> <li value=\"1\">normal and contingency procedures;<\/li> <li value=\"2\">the required equipment;<\/li> <li value=\"3\">any limitations;<\/li> <li value=\"4\">responsibilities and duties of the pilot‑in‑command and, if applicable, crew members and task specialists.<\/li> <\/ol> <\/li> <\/ol> <p>&nbsp;<\/p>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/2%20Regs/19310_NCOOP147_Refuelling%20with%20engine%20or%20rotors%20turning%20-%20helicopters.htm","sub":[{"id":"x-AMC1-NCO-OP-147","kind":"AMC","label":"AMC1 NCO.OP.147","title":"AMC1 NCO.OP.147 Refuelling with engine(s) running and/or rotors turning — helicopters","h":"<h3>AMC1 NCO.OP.147 Refuelling with engine(s) running and/or rotors turning — helicopters<\/h3> <p>CAA ORS9 Decision No. 47<\/p> <p>CHECKLIST - HELICOPTERS<\/p> <ol> <li value=\"1\"> <p>Before commencing a refuelling with rotors turning, the pilot‑in‑command should conduct a risk assessment, assessing the complexity of the activity in order to determine the hazards and associated risks inherent in the operation, and establish mitigating measures.<\/p> <\/li> <li value=\"2\"> <p>Refuelling with rotors turning should be performed in accordance with a checklist. Based on the risk assessment, the pilot‑in‑command should establish a checklist appropriate to the activity and aircraft used, taking into account this AMC.<\/p> <\/li> <li value=\"3\"> <p>The checklist should cover relevant elements of GM1&nbsp;NCO.SPEC.105.<\/p> <\/li> <li value=\"4\"> <p>The checklist that is relevant to the duties of the pilot‑in‑command, crew members, and task specialists should be readily accessible.<\/p> <\/li> <li value=\"5\"> <p>The checklist should be regularly reviewed and updated, as appropriate.<\/p> <\/li> <\/ol> <p>&nbsp;<\/p>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/3%20AMC/AMC1%20NCO%20OP%20147%20Refuelling.htm"},{"id":"x-GM1-NCO-OP-147","kind":"GM","label":"GM1 NCO.OP.147","title":"GM1 NCO.OP.147 Refuelling with engine(s) running and/or rotors turning — helicopters","h":"<h4>GM1 NCO.OP.147 Refuelling with engine(s) running and/or rotors turning — helicopters<\/h4> <p>CAA ORS9 Decision No. 47<\/p> <p>PROCEDURES – HELICOPTERS<\/p> <p>AMC1&nbsp;SPO.OP.157 and GM1&nbsp;SPO.OP.157 provide a generic framework for the development of standard operating procedures (SOPs) for refuelling with the rotors turning.<\/p> <p>&nbsp;<\/p>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/4%20GM/GM1%20NCO%20OP%20147%20Refuelling.htm"}]},{"id":"r-NCO-OP-150","ref":"NCO.OP.150","title":"Carriage of passengers","h":"<h1>NCO.OP.150 Carriage of passengers <\/h1> <div> <p>The pilot-in-command shall ensure that, prior to and during taxiing, take-off and landing, and whenever deemed necessary in the interest of safety, each passenger on board occupies a seat or berth and has his/her safety belt or restraint device properly secured.<\/p> <p>&nbsp;<\/p> <\/div>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/2%20Regs/19330_NCOOP150_Carriage_of_passengers.htm","sub":[]},{"id":"r-NCO-OP-155","ref":"NCO.OP.155","title":"Smoking on board — aeroplanes and helicopters","h":"<h1>NCO.OP.155 Smoking on board — aeroplanes and helicopters <\/h1> <div> <p>The pilot-in-command shall not allow smoking on board:<\/p> <p>(a)&nbsp;whenever considered necessary in the interest of safety; and<\/p> <p>(b)&nbsp;during refuelling of the aircraft.<\/p> <p>&nbsp;<\/p> <\/div>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/2%20Regs/19360_NCOOP155_Smoking_on_board_aeroplanes_and_helicopters.htm","sub":[]},{"id":"r-NCO-OP-156","ref":"NCO.OP.156","title":"Smoking on board — sailplanes","h":"<h1>NCO.OP.156 Smoking on board — sailplanes <\/h1> <div> <p>Provision repealed before document was retained.<\/p> <p>&nbsp;<\/p> <\/div>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/2%20Regs/19390_NCOOP156_Smoking_on_board_sailplanes.htm","sub":[]},{"id":"r-NCO-OP-160","ref":"NCO.OP.160","title":"Meteorological conditions","h":"<h1>NCO.OP.160 Meteorological conditions <\/h1> <div> <p>(a)&nbsp;The pilot-in-command shall only commence or continue a VFR flight if the latest available meteorological information indicates that the weather conditions along the route and at the intended destination at the estimated time of use will be at or above the applicable VFR operating minima.<\/p> <p>(b)&nbsp;The pilot-in-command shall only commence or continue an IFR flight towards the planned destination aerodrome if the latest available meteorological information indicates that, at the estimated time of arrival, the weather conditions at the destination or at least one destination alternate aerodrome are at or above the applicable aerodrome operating minima.<\/p> <p>(c)&nbsp;If a flight contains VFR and IFR segments, the meteorological information referred to in (a) and (b) shall be applicable as far as relevant.<\/p> <p>&nbsp;<\/p> <\/div>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/2%20Regs/19420_NCOOP160_Meteorological_conditions.htm","sub":[{"id":"x-AMC1-NCO-OP-160","kind":"AMC","label":"AMC1 NCO.OP.160","title":"AMC1 NCO.OP.160 Meteorological conditions","h":"<h3><a><\/a>AMC1 NCO.OP.160 Meteorological conditions&nbsp;&nbsp;&nbsp;&nbsp;<\/h3> <p>CAA ORS9 Decision No. 1<\/p> <p>APPLICATION OF AERODROME FORECASTS (TAF &amp; TREND) — AEROPLANES AND HELICOPTERS<\/p> <p>Where a terminal area forecast (TAF) or meteorological aerodrome or aeronautical report (METAR) with landing forecast (TREND) is used as forecast, the following criteria should be used:<\/p> <p>(a) From the start of a TAF validity period up to the time of applicability of the first subsequent 'FM...' or 'BECMG' or, if no 'FM' or ‘BECMG' is given, up to the end of the validity period of the TAF, the prevailing weather conditions forecast in the initial part of the TAF should be applied.<\/p> <p>(b) From the time of observation of a METAR up to the time of applicability of the first subsequent 'FM...' or 'BECMG' or, if no 'FM' or ‘BECMG' is given, up to the end of the validity period of the TREND, the prevailing weather conditions forecast in the METAR should be applied.<\/p> <p>(c) Following FM (alone) or BECMG AT, any specified change should be applied from the time of the change.<\/p> <p>(d) Following BECMG (alone), BECMG FM, BECMG TL, BECMG FM TL:<\/p> <ol> <p> <\/p><p>(1) in the case of deterioration, any specified change should be applied from the start of the change; and<\/p> <p><\/p> <p> <\/p><p>(2) in the case of improvement, any specified change should be applied from the end of the change.<\/p> <p><\/p> <\/ol> <p>(e) In a period indicated by TEMPO (alone), TEMPO FM, TEMPO TL, TEMPO FM TL, PROB30/40 (alone):<\/p> <ol> <p> <\/p><p>(1) deteriorations associated with persistent conditions in connection with e.g. haze, mist, fog, dust/sandstorm, continuous precipitation should be applied;<\/p> <p><\/p> <p> <\/p><p>(2) deteriorations associated with transient/showery conditions in connection with short- lived weather phenomena, e.g. thunderstorms, showers may be ignored; and<\/p> <p><\/p> <p> <\/p><p>(3) improvements should in all cases be disregarded.<\/p> <p><\/p> <\/ol> <p>(f) In a period indicated by PROB30/40 TEMPO:<\/p> <ol> <p> <\/p><p>(1) deteriorations may be disregarded; and<\/p> <p><\/p> <p> <\/p><p>(2) improvements should be disregarded.<\/p> <p>Note: Abbreviations used in the context of this AMC are as follows:<\/p> <p>FM:&nbsp;&nbsp;&nbsp;&nbsp;from<\/p> <p>BECMG:&nbsp;&nbsp;&nbsp;&nbsp;becoming<\/p> <p>AT:&nbsp;&nbsp;&nbsp;&nbsp;at<\/p> <p>TL:&nbsp;&nbsp;&nbsp;&nbsp;till<\/p> <p>TEMPO:&nbsp;&nbsp;&nbsp;&nbsp;temporarily<\/p> <p>PROB:&nbsp;&nbsp;&nbsp;&nbsp;probability<\/p> <p><\/p> <\/ol> <p>&nbsp;<\/p>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/3%20AMC/AMC1%20NCO%20OP%20160%20Meteorological.htm"},{"id":"x-GM1-NCO-OP-160","kind":"GM","label":"GM1 NCO.OP.160","title":"GM1 NCO.OP.160 Meteorological conditions","h":"<h4><a><\/a>GM1 NCO.OP.160 Meteorological conditions&nbsp;&nbsp;&nbsp;&nbsp;<\/h4> <p>CAA ORS9 Decision No. 1<\/p> <p>CONTINUATION OF A FLIGHT — AEROPLANES AND HELICOPTERS<\/p> <p>In the case of in-flight re-planning, continuation of a flight refers to the point from which a revised flight plan applies.<\/p> <p>&nbsp;<\/p>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/4%20GM/GM1%20NCO%20OP%20160%20Meteorological.htm"},{"id":"x-GM2-NCO-OP-160","kind":"GM","label":"GM2 NCO.OP.160","title":"GM2 NCO.OP.160 Meteorological conditions","h":"<h4><a><\/a>GM2 NCO.OP.160 Meteorological conditions&nbsp;&nbsp;&nbsp;&nbsp;<\/h4> <p>CAA ORS9 Decision No. 1<\/p> <p>EVALUATION OF METEOROLOGICAL CONDITIONS — AEROPLANES AND HELICOPTERS<\/p> <p>It is recommended that the pilot-in-command carefully evaluates the available meteorological information relevant to the proposed flight, such as applicable surface observations, winds, temperatures aloft, terminal and area forecasts, air meteorological information reports (AIRMETs), significant meteorological information (SIGMET) and pilot reports. The ultimate decision whether, when, and where to make the flight rests with the pilot-in-command. The pilot-in-command also should continue to re-evaluate changing weather conditions.<\/p> <p>&nbsp;<\/p>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/4%20GM/GM2%20NCO%20OP%20160%20Meteorological.htm"}]},{"id":"r-NCO-OP-165","ref":"NCO.OP.165","title":"Ice and other contaminants — ground procedures","h":"<h1>NCO.OP.165 Ice and other contaminants — ground procedures <\/h1> <div> <p>The pilot-in-command shall only commence take-off if the aircraft is clear of any deposit that might adversely affect the performance or controllability of the aircraft, except as permitted in the AFM.<\/p> <p>&nbsp;<\/p> <\/div>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/2%20Regs/19450_NCOOP165_Ice_and_other_contaminants_ground_procedures.htm","sub":[]},{"id":"r-NCO-OP-170","ref":"NCO.OP.170","title":"Ice and other contaminants — flight procedures","h":"<h1>NCO.OP.170 Ice and other contaminants — flight procedures <\/h1> <div> <p>(a)&nbsp;The pilot-in-command shall only commence a flight or intentionally fly into expected or actual icing conditions if the aircraft is certified and equipped to cope with such conditions as referred to in 2.a.5 of Annex IV to Regulation (EC) No 216/2008.<\/p> <p>(b)&nbsp;If icing exceeds the intensity of icing for which the aircraft is certified or if an aircraft not certified for flight in known icing conditions encounters icing, the pilot-in-command shall exit the icing conditions without delay, by a change of level and/or route, and if necessary by declaring an emergency to ATC.<\/p> <p>&nbsp;<\/p> <\/div>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/2%20Regs/19480_NCOOP170_Ice_and_other_contaminants_flight_procedures.htm","sub":[{"id":"x-GM1-NCO-OP-170-b","kind":"GM","label":"GM1 NCO.OP.170(b)","title":"GM1 NCO.OP.170(b) Ice and other contaminants – flight procedures","h":"<h4><a><\/a>GM1 NCO.OP.170(b) Ice and other contaminants – flight procedures<\/h4> <p>CAA ORS9 Decision No. 1<\/p> <p>KNOWN ICING CONDITIONS<\/p> <p>Known icing conditions are conditions where actual ice is observed visually to be on the aircraft by the pilot or identified by on-board sensors.<\/p> <p>&nbsp;<\/p>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/4%20GM/GM1%20NCO%20OP%20170%20b%20Ice%20and%20other.htm"}]},{"id":"r-NCO-OP-175","ref":"NCO.OP.175","title":"Take-off conditions — aeroplanes and helicopters","h":"<h1>NCO.OP.175 Take‑off conditions — aeroplanes and helicopters <\/h1> <p>SI 2024 No. 1290<\/p> <p>Before commencing take‑off, the pilot‑in‑command shall be satisfied that:<\/p> <ol> <li value=\"1\">according to the information available, the weather at the aerodrome or operating site and the condition of the runway or FATO intended to be used would not prevent a safe take‑off and departure; and<\/li> <li value=\"2\"> <p>the selected aerodrome operating minima are consistent with all of the following:<\/p> <ol> <li value=\"1\">the operative ground equipment;<\/li> <li value=\"2\">the operative aircraft systems;<\/li> <li value=\"3\">the aircraft performance;<\/li> <li value=\"4\">flight crew qualifications.<\/li> <\/ol> <\/li> <\/ol> <p>&nbsp;<\/p>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/2%20Regs/19510_NCOOP175_Take-off_conditions_aeroplanes_and_helicopters.htm","sub":[{"id":"x-AMC1-NCO-OP-175","kind":"AMC","label":"AMC1 NCO.OP.175","title":"AMC1 NCO.OP.175 Take-off conditions — aeroplanes and helicopters","h":"<h3>AMC1 NCO.OP.175 Take‑off conditions — aeroplanes and helicopters<\/h3> <p>CAA ORS9 Decision No. 47<\/p> <p>METEOROLOGICAL CONDITIONS FOR TAKE‑OFF — AEROPLANES<\/p> <ol> <li value=\"1\"> <p>When the reported visibility is below that required for take‑off and RVR is not reported, a take‑off should only be commenced if the pilot‑in‑command can determine that the visibility along the take‑off runway/area is equal to or better than the required minimum. <\/p> <\/li> <li value=\"2\"> <p>When no reported visibility or RVR is available, a take‑off should only be commenced if the pilot‑in‑command can determine that the RVR or VIS along the take‑off runway/area is equal to or better than the required minimum. <\/p> <\/li> <\/ol> <p>&nbsp;<\/p>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/3%20AMC/AMC1%20NCO%20OP%20175%20Take%20off%20conditions.htm"}]},{"id":"r-NCO-OP-176","ref":"NCO.OP.176","title":"Take-off conditions — balloons","h":"<h1>NCO.OP.176 Take-off conditions — balloons <\/h1> <div> <p>Provision repealed before document was retained.<\/p> <p>&nbsp;<\/p> <\/div>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/2%20Regs/19540_NCOOP176_Take-off_conditions_balloons.htm","sub":[]},{"id":"r-NCO-OP-180","ref":"NCO.OP.180","title":"Simulated situations in flight","h":"<h1>NCO.OP.180 Simulated situations in flight <\/h1> <div> <p>(a)&nbsp;The pilot-in-command shall, when carrying passengers or cargo, not simulate:<\/p> <p>(1)&nbsp;&nbsp;situations that require the application of abnormal or emergency procedures; or<\/p> <p>(2)&nbsp;&nbsp;flight in instrument meteorological conditions (IMC).<\/p> <p>(b)&nbsp;Notwithstanding (a), when training flights are conducted by a training organisation referred to in Article 10a of Commission Regulation (EU) No 1178/2011, such situations may be simulated with student pilots on board.<\/p> <p>&nbsp;<\/p> <\/div>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/2%20Regs/19570_NCOOP180_Simulated_situations_in_flight.htm","sub":[{"id":"x-GM1-NCO-OP-180","kind":"GM","label":"GM1 NCO.OP.180","title":"GM1 NCO.OP.180 Simulated situations in flight","h":"<h4><a><\/a>GM1.NCO.OP.180 Simulated situations in flight&nbsp;&nbsp;&nbsp;&nbsp;<\/h4> <p>CAA ORS9 Decision No. 1<\/p> <p>DESIGNATION OF PERSONS AS CREW MEMBERS<\/p> <p>(a) The operator may designate any person as a crew member (including a task specialist) provided that:<\/p> <ol> <p> <\/p><p>(1) the role, according to the reasonable expectation of the operator, will enhance the safety of the flight or achieve an operational objective of the flight;<\/p> <p><\/p> <p> <\/p><p>(2) the person, according to the reasonable expectation of the operator, is capable of fulfilling the role;<\/p> <p><\/p> <p> <\/p><p>(3) the person has been briefed on the role as a crew member and informed that they are crew, not a passenger; and<\/p> <p><\/p> <p> <\/p><p>(4) the person agrees to the role as a crew member.<\/p> <p><\/p> <\/ol> <p>(b) Crew members are not considered to be passengers.<\/p> <p>(c) Crew members may be required, by specific provisions of this Regulation and other Implementing Rules, to hold licences, ratings or other personnel certificates to fulfil certain roles such as instructor, examiner or flight engineer in certain circumstances.<\/p> <p>&nbsp;<\/p>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/4%20GM/GM1%20NCO%20OP%20180%20Simulated%20situations.htm"}]},{"id":"r-NCO-OP-185","ref":"NCO.OP.185","title":"In-flight fuel management","h":"<h1>NCO.OP.185 In‑flight fuel management <\/h1> <p>SI 2024 No. 1290<\/p> <ol> <li value=\"1\">The pilot‑in‑command must monitor the amount of useable fuel or energy remaining on board to ensure that it is protected and not less than the fuel or energy that is required to proceed to an aerodrome or operating site where a safe landing can be made.<\/li> <li value=\"2\"> <p>The pilot‑in‑command of a controlled flight must advise air traffic control of a ‘minimum fuel or energy’ state by declaring “MINIMUM FUEL” when the pilot‑in‑command has: <\/p> <ol> <li value=\"1\">committed to land at a specific aerodrome or operating site; and<\/li> <li value=\"2\">calculated that any change to the existing clearance to that aerodrome or operating site, or other air traffic delays, may result in landing with less than the planned final reserve fuel or energy.<\/li> <\/ol> <\/li> <li value=\"3\">The pilot‑in‑command of a controlled flight must declare a situation of ‘fuel or energy emergency’ by broadcasting ‘MAYDAY, MAYDAY, MAYDAY FUEL’ when the usable fuel or energy estimated to be available upon landing at the nearest aerodrome or operating site where a safe landing can be made is less than the planned final reserve fuel or energy.<\/li> <\/ol> <p>&nbsp;<\/p>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/2%20Regs/19600_NCOOP185_In-flight_fuel_management.htm","sub":[{"id":"x-GM1-NCO-OP-185-b-c","kind":"GM","label":"GM1 NCO.OP.185(b);(c)","title":"GM1 NCO.OP.185(b);(c) In-flight fuel or energy management","h":"<h4>GM1 NCO.OP.185(b);(c) In-flight fuel or energy management<\/h4> <p>CAA ORS9 Decision No. 47<\/p> <p>‘MINIMUM FUEL’ DECLARATION<\/p> <ol> <li value=\"1\"> <p>The pilot‑in‑command may consider reporting the remaining fuel or energy endurance after a ‘MINIMUM FUEL’ or ‘MAYDAY MAYDAY MAYDAY FUEL’ declaration. Note:&nbsp;For Part‑NCO operators, the FRF or energy varies; therefore, the ATC may not be aware of the amount of the remaining fuel or energy endurance.<\/p> <\/li> <li value=\"2\"> <p>The ‘MINIMUM FUEL’ declaration informs the ATC that all planned landing options have been reduced to a specific aerodrome or operating site of intended landing, and that for helicopters, no other landing site is available. It also informs the ATC that any change to the existing clearance may result in landing with less than the planned FRF or energy. This is not an emergency situation but an indication that an emergency situation is possible, should any additional delay occur.<\/p> <\/li> <li value=\"3\"> <p>The pilot should not expect any form of priority handling as a result of a ‘MINIMUM FUEL’ declaration. However, the ATC should advise the flight crew of any additional expected delays, as well as coordinate with other ATC units when transferring the control of the aircraft, to ensure that the other ATC units are aware of the flight’s fuel or energy state.<\/p> <\/li> <li value=\"4\"> <p>The requirement for declaring ‘MINIMUM FUEL’ and ‘MAYDAY MAYDAY MAYDAY FUEL’ applies only to controlled flights; however, these declarations may also be made during uncontrolled flights if the pilot‑in‑command considers this advisable.<\/p> <\/li> <\/ol> <p>&nbsp;<\/p>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/4%20GM/GM1%20NCO%20OP%20185%20b%20c%20In%20flight.htm"}]},{"id":"r-NCO-OP-190","ref":"NCO.OP.190","title":"Use of supplemental oxygen","h":"<h1>NCO.OP.190 Use of supplemental oxygen <\/h1> <div> <p>(a)&nbsp;The pilot-in-command shall ensure that all flight crew members engaged in performing duties essential to the safe operation of an aircraft in flight use supplemental oxygen continuously whenever he/she determines that at the altitude of the intended flight the lack of oxygen might result in impairment of the faculties of crew members, and shall ensure that supplemental oxygen is available to passengers when lack of oxygen might harmfully affect passengers.<\/p> <p>(b)&nbsp;In any other case when the pilot-in-command cannot determine how the lack of oxygen might affect all occupants on board, he/she shall ensure that:<\/p> <p>(1)&nbsp;&nbsp;all crew members engaged in performing duties essential to the safe operation of an aircraft in flight use supplemental oxygen for any period in excess of 30 minutes when the pressure altitude in the the passenger compartment will be between 10000 ft and 13000 ft; and<\/p> <p>(2)&nbsp;&nbsp;all occupants use supplemental oxygen for any period that the pressure altitude in the the passenger compartment will be above 13000 ft.<\/p> <p>&nbsp;<\/p> <\/div>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/2%20Regs/19630_NCOOP190_Use_of_supplemental_oxygen.htm","sub":[{"id":"x-AMC1-NCO-OP-190-a","kind":"AMC","label":"AMC1 NCO.OP.190(a)","title":"AMC1 NCO.OP.190(a) Use of supplemental oxygen","h":"<h3><a><\/a>AMC1 NCO.OP.190(a) Use of supplemental oxygen&nbsp;&nbsp;&nbsp;&nbsp;<\/h3> <p>CAA ORS9 Decision No. 1<\/p> <p>DETERMINATION OF SUPPLEMENTAL OXYGEN NEED<\/p> <p>When determining the need for supplemental oxygen carriage and use, the pilot-in-command should:<\/p> <p>(a) in the preflight phase:<\/p> <ol> <p> <\/p><p>(1) be aware of hypoxia conditions and associated risks;<\/p> <p><\/p> <p> <\/p><p>(2) consider the following objective conditions for the intended flight:<\/p> <ol> <p> <\/p><p>(i) altitude;<\/p> <p><\/p> <p> <\/p><p>(ii) duration of the flight; and<\/p> <p><\/p> <p> <\/p><p>(iii) any other relevant operational conditions.<\/p> <p><\/p> <\/ol> <p><\/p> <p> <\/p><p>(3) consider individual conditions of flight crew members and passengers in relation to:<\/p> <ol> <p> <\/p><p>(i) altitude of the place of residence;<\/p> <p><\/p> <p> <\/p><p>(ii) smoking;<\/p> <p><\/p> <p> <\/p><p>(iii) experience in flights at high altitudes;<\/p> <p><\/p> <p> <\/p><p>(iv) actual medical conditions and medications;<\/p> <p><\/p> <p> <\/p><p>(v) age<\/p> <p><\/p> <p> <\/p><p>(vi) disabilities; and<\/p> <p><\/p> <p> <\/p><p>(vii) any other relevant factor that may be detected, or reported by the person; and<\/p> <p><\/p> <\/ol> <p><\/p> <p> <\/p><p>(4) when relevant, ensure that all flight crew members and passengers are briefed on hypoxia conditions and symptoms, as well as on the usage of supplemental oxygen equipment.<\/p> <p><\/p> <\/ol> <p>(b) during flight:<\/p> <ol> <p> <\/p><p>(1) monitor for early symptoms of hypoxia conditions; and<\/p> <p><\/p> <p> <\/p><p>(2) if detecting early symptoms of hypoxia conditions:<\/p> <ol> <p> <\/p><p>(i) consider to return to a safe altitude, and<\/p> <p><\/p> <p> <\/p><p>(ii) ensure that supplemental oxygen is used, if available.<\/p> <p><\/p> <\/ol> <p><\/p> <\/ol> <p>&nbsp;<\/p>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/3%20AMC/AMC1%20NCO%20OP%20190%20a%20Use%20of%20supplemental.htm"},{"id":"x-GM1-NCO-OP-190","kind":"GM","label":"GM1 NCO.OP.190","title":"GM1 NCO.OP.190 Use of supplemental oxygen","h":"<h4><a><\/a>GM1 NCO.OP.190 Use of supplemental oxygen&nbsp;&nbsp;&nbsp;&nbsp;<\/h4> <p>CAA ORS9 Decision No. 1<\/p> <p>GENERAL<\/p> <p>(a) The responsibility of the pilot-in-command for safety of all persons on board, as required by NCO.GEN.105(a)(1), includes the determination of need for supplemental oxygen use.<\/p> <p>(b) The altitudes above which NCO.OP.190(b) requires oxygen to be available and used are applicable to those cases when the pilot-in-command cannot determine the need for supplemental oxygen. However, if the pilot-in-command is able to make this determination, he/she may elect in the interest of safety to require oxygen also for operations at or below such altitudes.<\/p> <p>(c) The pilot-in-command should be aware that flying below altitudes mentioned in NCO.OP.190(b) does not provide absolute protection against hypoxia symptoms, should individual conditions and aptitudes be prevalent.<\/p> <p>&nbsp;<\/p>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/4%20GM/GM1%20NCO%20OP%20190%20Use%20of%20supplemental.htm"},{"id":"x-GM2-NCO-OP-190","kind":"GM","label":"GM2 NCO.OP.190","title":"GM2 NCO.OP.190 Use of supplemental oxygen","h":"<h4><a><\/a>GM2 NCO.OP.190 Use of supplemental oxygen&nbsp;&nbsp;&nbsp;&nbsp;<\/h4> <p>CAA ORS9 Decision No. 1<\/p> <p>DETERMINATION OF OXYGEN NEED — BEFORE FLIGHT<\/p> <p>Detailed information and guidance on hypoxia conditions and symptoms, content of the briefing on hypoxia and assessment of individual conditions may be found in the EASA leaflet ‘Hypoxia’.<\/p> <p>DETERMINATION OF OXYGEN NEED — IN FLIGHT<\/p> <p>Several methods for monitoring hypoxia early symptoms may be used and some methods may be aided by personal equipment, such as finger-mounted pulse oximeters. Detailed information and guidance on entering hypoxia conditions, on hypoxia symptoms early detection, and on use of personal equipment such as finger-mounted pulse oximeters or equivalent may be found in the EASA leaflet ‘Hypoxia’.<\/p> <p>&nbsp;<\/p>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/4%20GM/GM2%20NCO%20OP%20190%20Use%20of%20supplemental.htm"}]},{"id":"r-NCO-OP-195","ref":"NCO.OP.195","title":"Ground proximity detection","h":"<h1>NCO.OP.195 Ground proximity detection <\/h1> <div> <p>When undue proximity to the ground is detected by the pilot-in-command or by a ground proximity warning system, the pilot-in-command shall take corrective action immediately in order to establish safe flight conditions.<\/p> <p>&nbsp;<\/p> <\/div>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/2%20Regs/19660_NCOOP195_Ground_proximity_detection.htm","sub":[]},{"id":"r-NCO-OP-200","ref":"NCO.OP.200","title":"Airborne collision avoidance system (ACAS II)","h":"<h1>NCO.OP.200 Airborne collision avoidance system (ACAS II) <\/h1> <div> <p>When ACAS II is used, operational procedures and training shall be in accordance with Regulation (EU) No 1332/2011.<\/p> <p>&nbsp;<\/p> <\/div>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/2%20Regs/19690_NCOOP200_Airborne_collision_avoidance_system_ACAS_II.htm","sub":[]},{"id":"r-NCO-OP-205","ref":"NCO.OP.205","title":"Approach and landing conditions — aeroplanes and helicopters","h":"<h1>NCO.OP.205 Approach and landing conditions — aeroplanes and helicopters <\/h1> <p>SI 2024 No. 1290<\/p> <p>Before commencing an approach to land, the pilot‑in‑command of an aircraft must be satisfied that:<\/p> <ol> <li value=\"1\"> <p>according to the information available, the weather conditions at the aerodrome or the operating site and the condition of the runway intended to be used will not prevent a safe approach, landing or missed approach; and<\/p> <\/li> <li value=\"2\"> <p>the selected aerodrome operating minima take into consideration:<\/p> <ol> <li value=\"1\">the operative ground equipment;<\/li> <li value=\"2\">the operative aircraft system;<\/li> <li value=\"3\">the aircraft performance;<\/li> <li value=\"4\">flight crew qualifications.<\/li> <\/ol> <\/li> <\/ol> <p>&nbsp;<\/p>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/2%20Regs/19720_NCOOP205_Approach_and_landing_conditions_aeroplanes.htm","sub":[{"id":"x-AMC1-NCO-OP-205","kind":"AMC","label":"AMC1 NCO.OP.205","title":"AMC1 NCO.OP.205 Approach and landing conditions — aeroplanes","h":"<h3>AMC1 NCO.OP.205 Approach and landing conditions — aeroplanes<\/h3> <p>CAA&nbsp;ORS9 Decision No. 15<\/p> <p>LANDING DISTANCE ASSESSMENT<\/p> <ol> <li value=\"1\"> <p>The in‑flight landing distance should be based on the latest available weather report and runway condition report (RCR).<\/p> <\/li> <li value=\"2\"> <p>The assessment should be initially carried out when weather report and RCR, if available, are obtained, usually around top of descent. If the planned duration of the flight does not allow the flight crew to carry out the assessment in non‑critical phases of flight, the assessment should be carried out before departure.<\/p> <\/li> <li value=\"3\"> <p>When meteorological conditions may lead to a degradation of the runway surface condition, the assessment should include consideration of how much deterioration in runway surface friction characteristics may be tolerated, so that a quick decision can be made prior to landing.<\/p> <\/li> <li value=\"4\"> <p>Whenever the RCR is in use and the runway braking action encountered during the landing roll is not as good as reported by the aerodrome operator in the RCR, the pilot‑in‑command should notify the air traffic services (ATS) by means of a special air‑report (AIREP) as soon as practicable.<\/p> <\/li> <\/ol> <p>&nbsp;<\/p>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/3%20AMC/AMC1%20NCO%20OP%20205%20Approach%20and.htm"},{"id":"x-GM1-NCO-OP-205","kind":"GM","label":"GM1 NCO.OP.205","title":"GM1 NCO.OP.205 Approach and landing conditions — aeroplanes","h":"<h4>GM1 NCO.OP.205 Approach and landing conditions — aeroplanes<\/h4> <p>CAA&nbsp;ORS9 Decision No. 15<\/p> <p>RUNWAY CONDITION REPORT (RCR)<\/p> <p>When the aerodrome reports the runway conditions by means of an RCR, the information contained therein includes a runway condition code (RWYCC). The determination of the RWYCC is based on the use of the runway condition assessment matrix (RCAM). The RCAM correlates the RWYCC with the contaminants present on the runway and the braking action.<\/p> <p>A detailed description of the RCR format and content, the RWYCC and the RCAM may be found in Annex&nbsp;V (Part‑ADR.OPS) to Regulation (EU) No&nbsp;139/2014, in UK Regulation (EU)&nbsp;2017/373 and in UK Regulation (EU) No&nbsp;923/2012 (SERA). Further guidance may be found in the following documents:<\/p> <ol> <li value=\"1\"> <p>ICAO Doc&nbsp;9981 ‘PANS&nbsp;Aerodromes’;<\/p> <\/li> <li value=\"2\"> <p>ICAO Doc&nbsp;4444 ‘PANS&nbsp;ATM’;<\/p> <\/li> <li value=\"3\"> <p>ICAO Doc&nbsp;10064 ‘Aeroplane Performance Manual’; and<\/p> <\/li> <li value=\"4\"> <p>ICAO Circular&nbsp;355 ‘Assessment, Measurement and Reporting of Runway Surface Conditions’.<\/p> <\/li> <\/ol> <p>&nbsp;<\/p>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/4%20GM/GM1%20NCO%20OP%20205%20Approach%20and.htm"}]},{"id":"r-NCO-OP-206","ref":"NCO.OP.206","title":"Approach and landing conditions — helicopters [Repealed]","h":"<h1>NCO.OP.206 Approach and landing conditions — helicopters [Repealed]<\/h1> <div> <p>SI 2024 No. 1290<\/p> <p>Provision repealed.<\/p> <p>&nbsp;<\/p> <\/div>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/2%20Regs/19750_NCOOP206_Approach_and_landing_conditions_helicopters.htm","sub":[{"id":"x-AMC1-NCO-OP-206","kind":"AMC","label":"AMC1 NCO.OP.206","title":"AMC1 NCO.OP.206 Approach and landing conditions — helicopters","h":"<h3>AMC1 NCO.OP.206 Approach and landing conditions — helicopters<\/h3> <p>CAA&nbsp;ORS9 Decision No. 15<\/p> <p>FATO SUITABILITY<\/p> <p>The in-flight determination of the FATO suitability should be based on the latest available meteorological report.<\/p> <p>&nbsp;<\/p>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/3%20AMC/AMC1%20NCO%20OP%20206%20Approach%20and.htm"}]},{"id":"r-NCO-OP-210","ref":"NCO.OP.210","title":"Commencement and continuation of approach — aeroplanes and helicopters","h":"<h1>NCO.OP.210 Commencement and continuation of approach — aeroplanes and helicopters <\/h1> <p>SI 2024 No. 1290<\/p> <ol> <li value=\"1\"> <p>If the controlling RVR for the runway to be used for landing an aircraft is less than 550&nbsp;m (or any lower value established in accordance with an approval under SPA.LVO) then an instrument approach operation must not be continued:<\/p> <ol> <li value=\"1\">below 1000&nbsp;ft above the aerodrome elevation; or<\/li> <li value=\"2\">into the FAS if the DH or MDH is more than 1000&nbsp;ft above the aerodrome elevation.<\/li> <\/ol> <\/li> <li value=\"2\">If the required visual reference for an aircraft is not established, a missed approach must be executed at, or before, the DA or DH or the MDA or MDH.<\/li> <li value=\"3\">If the required visual reference for an aircraft is not maintained after DA or DH or MDA or MDH, a go‑around must be executed promptly.<\/li> <\/ol> <p>&nbsp;<\/p>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/2%20Regs/19780_NCOOP210_Commencement_and_continuation_of_approach_aeroplanes_and_heli.htm","sub":[{"id":"x-AMC1-NCO-OP-210","kind":"AMC","label":"AMC1 NCO.OP.210","title":"AMC1 NCO.OP.210 Commencement and continuation of approach – aeroplanes and helicopters","h":"<h3>AMC1 NCO.OP.210 Commencement and continuation of approach – aeroplanes and helicopters<\/h3> <p>CAA ORS9 Decision No. 47<\/p> <p>VISUAL REFERENCES<\/p> <ol> <li value=\"1\"> <p>For a straight-in approach, at DH or MDH, at least one of the visual references specified below should be distinctly visible and identifiable to the pilot:<\/p> <ol> <li value=\"1\"> <p>elements of the approach lighting system;<\/p> <\/li> <li value=\"2\"> <p>the threshold;<\/p> <\/li> <li value=\"3\"> <p>the threshold markings;<\/p> <\/li> <li value=\"4\"> <p>the threshold lights;<\/p> <\/li> <li value=\"5\"> <p>the threshold identification lights;<\/p> <\/li> <li value=\"6\"> <p>the visual glide path indicator;<\/p> <\/li> <li value=\"7\"> <p>the touchdown zone (TDZ) or TDZ markings;<\/p> <\/li> <li value=\"8\"> <p>the TDZ lights;<\/p> <\/li> <li value=\"9\"> <p>FATO/runway edge lights;<\/p> <\/li> <li value=\"10\"> <p>for helicopter PinS approaches, the identification beacon light and visual ground reference;<\/p> <\/li> <li value=\"11\"> <p>for helicopter PinS approaches, the identifiable elements of the environment defined on the instrument chart; or<\/p> <\/li> <li value=\"12\"> <p>for helicopter PinS approaches with instructions to ‘proceed VFR’, sufficient visual cues to determine that the conditions for VFR are met.<\/p> <\/li> <\/ol> <\/li> <li value=\"2\"> <p>For a circling approach, the required visual reference is the runway environment.<\/p> <\/li> <p> <\/p><p>&nbsp;<\/p> <p><\/p> <\/ol>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/3%20AMC/AMC1%20NCO%20OP%20210%20Commencement.htm"},{"id":"x-AMC2-NCO-OP-210","kind":"AMC","label":"AMC2 NCO.OP.210","title":"AMC2 NCO.OP.210 Commencement and continuation of approach — aeroplanes and helicopters","h":"<h3>AMC2 NCO.OP.210 Commencement and continuation of approach — aeroplanes and helicopters<\/h3> <p>CAA ORS9 Decision No. 47<\/p> <p>RVR MINIMA FOR CONTINUED APPROACH<\/p> <ol> <li value=\"1\"> <p>The controlling RVR should be the touchdown RVR.<\/p> <\/li> <li value=\"2\"> <p>If the touchdown RVR is not reported, then the midpoint RVR should be the controlling RVR.<\/p> <\/li> <li value=\"3\"> <p>If neither the touchdown RVR nor the midpoint RVR is reported, then NCO.OP.210(a) is not applicable.<\/p> <\/li> <\/ol> <p>&nbsp;<\/p>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/3%20AMC/AMC2%20NCO%20OP%20210%20Commencement.htm"},{"id":"x-GM1-NCO-OP-210","kind":"GM","label":"GM1 NCO.OP.210","title":"GM1 NCO.OP.210 Commencement and continuation of approach — aeroplanes and helicopters","h":"<h4>GM1 NCO.OP.210 Commencement and continuation of approach — aeroplanes and helicopters<\/h4> <p>CAA ORS9 Decision No. 47<\/p> <p>APPLICATION OF RVR REPORTS<\/p> <ol> <li value=\"1\"> <p>There is no prohibition on the commencement of an approach based on reported RVR. The restriction in NCO.OP.210 applies only if the RVR is reported and applies to the continuation of the approach past a point where the aircraft is 1&nbsp;000&nbsp;ft above the aerodrome elevation or into the final approach segment (FAS) as applicable.<\/p> <\/li> <li value=\"2\"> <p>If a deterioration in the RVR is reported once the aircraft is below 1&nbsp;000&nbsp;ft on the FAS, as applicable, then there is no requirement for the approach to be discontinued. In this situation, the normal visual reference requirements would apply at the DA/H.<\/p> <\/li> <li value=\"3\"> <p>Where additional RVR information is provided (e.g.&nbsp;midpoint and stop end), this is advisory; such information may be useful to the pilot in order to determine whether there will be sufficient visual reference to control the aircraft during roll‑out and taxi.<\/p> <\/li> <li value=\"4\"> <p>If the RVR is less than the RVR calculated in accordance with AMC3&nbsp;NCO.OP.110, a go‑around is likely to be necessary since visual reference may not be established at the DH, or at the MDH at a point where a stable approach to landing in the TDZ remains possible. Similarly, in the absence of an RVR report, the reported visibility may indicate that a go‑around is likely. The pilot‑in‑command should consider available options, based on a thorough assessment of risk, such as diverting to an alternate, before commencing the approach.<\/p> <\/li> <\/ol> <p>&nbsp;<\/p>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/4%20GM/GM1%20NCO%20OP%20210%20Commencement.htm"}]},{"id":"r-NCO-OP-215","ref":"NCO.OP.215","title":"Operational limitations — hot-air balloons","h":"<h1>NCO.OP.215 Operational limitations — hot-air balloons <\/h1> <div> <p>Provision repealed before document was retained.<\/p> <p>&nbsp;<\/p> <\/div>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/2%20Regs/19810_NCOOP215_Operational_limitations_hot-air_balloons.htm","sub":[]},{"id":"r-NCO-OP-220","ref":"NCO.OP.220","title":"Airborne collision avoidance system (ACAS II)","h":"<h1>NCO.OP.220 Airborne collision avoidance system (ACAS II) <\/h1> <div> <p>When ACAS II is used, pilot-in-command shall apply the appropriate operational procedures and be adequately trained.<\/p> <p>&nbsp;<\/p> <\/div>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/2%20Regs/19840_NCOOP220_Airborne_collision_avoidance_system_ACAS_II.htm","sub":[]},{"id":"r-NCO-POL-100","ref":"NCO.POL.100","title":"Operating limitations — all aircraft","h":"<h1>NCO.POL.100 Operating limitations — all aircraft <\/h1> <ol> <li value=\"1\"> <p>During any phase of operation, the loading, the mass and the centre of gravity (CG) position of the aircraft shall comply with any limitation specified in the AFM or equivalent document.<\/p> <\/li> <li value=\"2\"> <p>Placards, listings, instrument markings, or combinations thereof, containing those operating limitations prescribed by the AFM for visual presentation, shall be displayed in the aircraft.<\/p> <\/li> <\/ol> <p>&nbsp;<\/p>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/2%20Regs/19880_NCOPOL100_Operating_limitations_all_aircraft.htm","sub":[]},{"id":"r-NCO-POL-105","ref":"NCO.POL.105","title":"Weighing","h":"<h1>NCO.POL.105 Weighing <\/h1> <ol> <li value=\"1\"> <p>The operator shall ensure that the mass and the CG of the aircraft have been established by actual weighing prior to the initial entry into service of the aircraft. The accumulated effects of modifications and repairs on the mass and balance shall be accounted for and properly documented. Such information shall be made available to the pilot-in-command. The aircraft shall be reweighed if the effect of modifications on the mass and balance is not accurately known.<\/p> <\/li> <li value=\"2\"> <p>The weighing shall be accomplished by the manufacturer of the aircraft or by an approved maintenance organisation.<\/p> <\/li> <\/ol> <p>&nbsp;<\/p>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/2%20Regs/19910_NCOPOL105_Weighing.htm","sub":[{"id":"x-GM1-NCO-POL-105","kind":"GM","label":"GM1 NCO.POL.105","title":"GM1 NCO.POL.105 Weighing","h":"<h4><a><\/a>GM1 NCO.POL.105 Weighing&nbsp;&nbsp;&nbsp;&nbsp;<\/h4> <p>CAA ORS9 Decision No. 1<\/p> <p>GENERAL<\/p> <ol> <li value=\"1\"> <p>New aircraft that have been weighed at the factory may be placed into operation without reweighing if the mass records and, balance records have been adjusted for alterations or modifications to the aircraft. Aircraft transferred from one UK operator to another UK operator do not have to be weighed prior to use by the receiving operator, unless the mass and balance cannot be accurately established by calculation.<\/p> <\/li> <li value=\"2\"> <p>The mass and centre of gravity (CG) position should be revised whenever the cumulative changes to the dry operating mass exceed ± 0.5 % of the maximum landing mass or, for aeroplanes, the cumulative change in CG position exceeds 0.5 % of the mean aerodynamic chord. This may be done by weighing the aircraft or by calculation. If the AFM requires to record changes to mass and CG position below these thresholds, or to record changes in any case, and make them known to the pilot-in-command, mass and CG position should be revised accordingly and made known to the pilot-in-command.<\/p> <\/li> <\/ol> <p>&nbsp;<\/p>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/4%20GM/GM1%20NCO%20POL%20105%20Weighing.htm"}]},{"id":"r-NCO-POL-110","ref":"NCO.POL.110","title":"Performance — general","h":"<h1>NCO.POL.110 Performance — general <\/h1> <p>The pilot-in-command shall only operate the aircraft if the performance is adequate to comply with the applicable rules of the air and any other restrictions applicable to the flight, the airspace or the aerodromes or operating sites used, taking into account the charting accuracy of any charts and maps used.<\/p> <p>&nbsp;<\/p>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/2%20Regs/19940_NCOPOL110_Performance_general.htm","sub":[]},{"id":"r-NCO-IDE-A-100","ref":"NCO.IDE.A.100","title":"Instruments and equipment — general","h":"<h1>NCO.IDE.A.100 Instruments and equipment — general <\/h1> <div> <p>(a)&nbsp;Instruments and equipment required by this Subpart shall be approved in accordance with the applicable airworthiness requirements if they are:<\/p> <p>(1)&nbsp;&nbsp;used by the flight crew to control the flight path;<\/p> <p>(2)&nbsp;&nbsp;used to comply with NCO.IDE.A.190;<\/p> <p>(3)&nbsp;&nbsp;used to comply with NCO.IDE.A.195; or<\/p> <p>(4)&nbsp;&nbsp;installed in the aeroplane.<\/p> <p>(b)&nbsp;The following items, when required under this Subpart, do not need an equipment approval:<\/p> <p>(1)&nbsp;&nbsp;spare fuses;<\/p> <p>(2)&nbsp;&nbsp;independent portable lights;<\/p> <p>(3)&nbsp;&nbsp;an accurate time piece;<\/p> <p>(4)&nbsp;&nbsp;first-aid kit;<\/p> <p>(5)&nbsp;&nbsp;survival and signalling equipment;<\/p> <p>(6)&nbsp;&nbsp;sea anchor and equipment for mooring;<\/p> <p>(7)&nbsp;&nbsp;child restraint device;<\/p> <p>(8)&nbsp;&nbsp;a simple PCDS used by a task specialist as a restraint device.<\/p> <p>(c)&nbsp;Instruments and equipment not required under Annex VII (Part-NCO) as well as any other equipment that is not required under this Regulation, but is carried on a flight, shall comply with the following requirements:<\/p> <p>(1)&nbsp;&nbsp;the information provided by those instruments or equipment shall not be used by the flight crew members to comply with Annex II to Regulation (EU) 2018/1139 or points NCO.IDE.A.190 and NCO.IDE.A.195 of Annex VII;<\/p> <p>(2)&nbsp;&nbsp;the instruments and equipment shall not affect the airworthiness of the aeroplane, even in the case of failures or malfunction.<\/p> <p>(d)&nbsp;Instruments and equipment shall be readily operable or accessible from the station where the flight crew member that needs to use it is seated.<\/p> <p>(e)&nbsp;All required emergency equipment shall be easily accessible for immediate use.<\/p> <p>&nbsp;<\/p> <\/div>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/2%20Regs/19990_NCOIDEA100_Instruments_and_equipment_general.htm","sub":[{"id":"x-GM1-NCO-IDE-A-100-a","kind":"GM","label":"GM1 NCO.IDE.A.100(a)","title":"GM1 NCO.IDE.A.100(a) Instruments and equipment – general","h":"<h4><a><\/a>GM1 NCO.IDE.A.100(a) Instruments and equipment – general&nbsp;&nbsp;&nbsp;&nbsp;<\/h4> <p>CAA ORS9 Decision No. 1<\/p> <p>APPLICABLE AIRWORTHINESS REQUIREMENTS<\/p> <p>The applicable airworthiness requirements for approval of instruments and equipment required by this Part are the following:<\/p> <p>(a) Regulation (EU) No 748/2012 for aeroplanes registered in the EU; and<\/p> <p>(b) Airworthiness requirements of the State of registry for aeroplanes registered outside the EU.<\/p> <p>&nbsp;<\/p>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/4%20GM/GM1%20NCO%20IDE%20A%20100%20a%20Instruments.htm"},{"id":"x-GM1-NCO-IDE-A-100-b","kind":"GM","label":"GM1 NCO.IDE.A.100(b)","title":"GM1 NCO.IDE.A.100(b) Instruments and equipment – general","h":"<h4><a><\/a>GM1 NCO.IDE.A.100(b) Instruments and equipment – general&nbsp;&nbsp;&nbsp;&nbsp;<\/h4> <p>CAA ORS9 Decision No. 1<\/p> <p>REQUIRED INSTRUMENTS AND EQUIPMENT THAT DO NOT NEED TO BE APPROVED IN ACCORDANCE WITH THE APPLICABLE AIRWORTHINESS REQUIREMENTS<\/p> <p>The
