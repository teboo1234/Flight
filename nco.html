ould be attached to this report.<\/p> <p>4. Any further information, or any information not included in the initial report, should be sent as soon as possible to the authorities identified in NCO.GEN.140(d).<\/p> <p>5. Providing it is safe to do so, all dangerous goods, packaging, documents, etc. relating to the occurrence should be retained until after the initial report has been sent to the authorities identified in NCO.GEN.140(d), and they have indicated whether or not these should continue to be retained.<\/p> <p>&nbsp;<\/p>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/3%20AMC/AMC1%20NCO%20GEN%20140%20d%20Transport.htm"},{"id":"x-AMC1-NCO-GEN-140-f","kind":"AMC","label":"AMC1 NCO.GEN.140(f)","title":"AMC1 NCO.GEN.140(f) Transport of dangerous goods","h":"<h3><a><\/a>AMC1 NCO.GEN.140(f) Transport of dangerous goods&nbsp;&nbsp;&nbsp;&nbsp;<\/h3> <p>CAA ORS9 Decision No. 1<\/p> <p>GENERAL<\/p> <p>The quantities of DG carried for operational purposes should be reasonable considering the purposes for which they might be required before the aircraft is able to replenish its supplies, e.g. at its home base or, in the case of a long tour, at any aerodrome along the route where the aircraft is planned to land and where such supplies are available.<\/p> <p>&nbsp;<\/p>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/3%20AMC/AMC1%20NCO%20GEN%20140%20f%20Transport.htm"},{"id":"x-GM1-NCO-GEN-140-a","kind":"GM","label":"GM1 NCO.GEN.140(a)","title":"GM1 NCO.GEN.140(a) Transport of dangerous goods","h":"<h4><a><\/a>GM1 NCO.GEN.140(a) Transport of dangerous goods&nbsp;&nbsp;&nbsp;&nbsp;<\/h4> <p>CAA ORS9 Decision No. 1<\/p> <p>GENERAL<\/p> <p>(a) The requirement to transport dangerous goods by air in accordance with the Technical Instructions is irrespective of whether:<\/p> <ol> <p> <\/p><p>(1) the flight is wholly or partly within or wholly outside the territory of a State; or<\/p> <p><\/p> <p> <\/p><p>(2) an approval to carry dangerous goods in accordance with Annex V (Part-SPA), Subpart G is held.<\/p> <p><\/p> <\/ol> <p>(b) The Technical Instructions provide that in certain circumstances dangerous goods, which are normally forbidden on an aircraft, may be carried. These circumstances include cases of extreme urgency or when other forms of transport are inappropriate or when full compliance with the prescribed requirements is contrary to the public interest. In these circumstances all the States concerned may grant exemptions from the provisions of the Technical Instructions provided that an overall level of safety that is at least equivalent to that provided by the Technical Instructions is achieved. Although exemptions are most likely to be granted for the carriage of dangerous goods that are not permitted in normal circumstances, they may also be granted in other circumstances, such as when the packaging to be used is not provided for by the appropriate packing method or the quantity in the packaging is greater than that permitted. The Technical Instructions also make provision for some dangerous goods to be carried when an approval has been granted only by the State of origin and the CAA.<\/p> <p>(c) When an exemption is required, the States concerned are those of origin, transit, overflight and destination of the consignment and that of the operator. For the State of overflight, if none of the criteria for granting an exemption are relevant, an exemption may be granted based solely on whether it is believed that an equivalent level of safety in air transport has been achieved.<\/p> <p>(d) The Technical Instructions provide that exemptions and approvals are granted by the ‘appropriate national authority’, which is intended to be the authority responsible for the particular aspect against which the exemption or approval is being sought. The operator should ensure that all relevant conditions on an exemption or approval are met.<\/p> <p>(e) The exemption or approval referred to in (b) to (d) is in addition to the approval required by Annex V (Part-SPA), Subpart G.<\/p> <p>&nbsp;<\/p>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/4%20GM/GM1%20NCO%20GEN%20140%20a%20Transport.htm"},{"id":"x-GM1-NCO-GEN-140-f","kind":"GM","label":"GM1 NCO.GEN.140(f)","title":"GM1 NCO.GEN.140(f) Transport of dangerous goods","h":"<h4><a><\/a>GM1 NCO.GEN.140(f) Transport of dangerous goods&nbsp;&nbsp;&nbsp;&nbsp;<\/h4> <p>CAA ORS9 Decision No. 1<\/p> <p>GENERAL<\/p> <p>In addition to items authorised under paragraph 1;2.2.1(a) of the Technical Instructions, the articles and substances should be items such as, e.g. aircraft spare parts, components/substances needed for aircraft repair, oil (for aircraft engine/gearbox), aircraft fuel, de-icing fluid, aircraft battery, and air starter unit.<\/p> <p>&nbsp;<\/p>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/4%20GM/GM1%20NCO%20GEN%20140%20f%20Transport.htm"}]},{"id":"r-NCO-GEN-145","ref":"NCO.GEN.145","title":"Immediate reaction to a safety problem","h":"<h1>NCO.GEN.145 Immediate reaction to a safety problem <\/h1> <div> <p>The operator shall implement:<\/p> <p>(a)&nbsp;any safety measures mandated by the CAA in accordance with ARO.GEN.135(c).<\/p> <p>[...]<\/p> <p>&nbsp;<\/p> <\/div>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/2%20Regs/18660_NCOGEN145_Immediate_reaction_to_a_safety_problem.htm","sub":[]},{"id":"r-NCO-GEN-150","ref":"NCO.GEN.150","title":"Journey log","h":"<h1>NCO.GEN.150 Journey log <\/h1> <div> <p>Particulars of the aircraft, its crew and each journey shall be retained for each flight, or series of flights, in the form of a journey log, or equivalent.<\/p> <p>&nbsp;<\/p> <\/div>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/2%20Regs/18690_NCOGEN150_Journey_log.htm","sub":[{"id":"x-AMC1-NCO-GEN-150","kind":"AMC","label":"AMC1 NCO.GEN.150","title":"AMC1 NCO.GEN.150 Journey log","h":"<h3><a><\/a>AMC1 NCO.GEN.150 Journey log&nbsp;&nbsp;&nbsp;&nbsp;<\/h3> <p>CAA ORS9 Decision No. 1<\/p> <p>GENERAL<\/p> <p>(a) The aircraft journey log, or equivalent, should include the following items, where applicable:<\/p> <ol> <p> <\/p><p>(1) aircraft nationality and registration;<\/p> <p><\/p> <p> <\/p><p>(2) date;<\/p> <p><\/p> <p> <\/p><p>(3) name of crew member(s);<\/p> <p><\/p> <p> <\/p><p>(4) duty assignments of crew members, if applicable;<\/p> <p><\/p> <p> <\/p><p>(5) place of departure;<\/p> <p><\/p> <p> <\/p><p>(6) place of arrival;<\/p> <p><\/p> <p> <\/p><p>(7) time of departure;<\/p> <p><\/p> <p> <\/p><p>(8) time of arrival;<\/p> <p><\/p> <p> <\/p><p>(9) hours of flight;<\/p> <p><\/p> <p> <\/p><p>(10) nature of flight;<\/p> <p><\/p> <p> <\/p><p>(11) incidents and observations (if any); and<\/p> <p><\/p> <p> <\/p><p>(12) signature of the pilot-in-command.<\/p> <p><\/p> <\/ol> <p>(b) The information or parts thereof may be recorded in a form other than on printed paper. Accessibility, usability and reliability should be assured.<\/p> <p>&nbsp;<\/p>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/3%20AMC/AMC1%20NCO%20GEN%20150%20Journey%20log.htm"}]},{"id":"r-NCO-GEN-155","ref":"NCO.GEN.155","title":"Minimum equipment list","h":"<h1>NCO.GEN.155 Minimum equipment list <\/h1> <div> <p>(a)&nbsp;An MEL may be established taking into account the following:<\/p> <p>(1)&nbsp;&nbsp;the document shall provide for the operation of the aircraft, under specified conditions, with particular instruments, items of equipment or functions inoperative at the commencement of the flight;<\/p> <p>(2)&nbsp;&nbsp;the document shall be prepared for each individual aircraft, taking account of the operator’s relevant operational and maintenance conditions; and<\/p> <p>(3)&nbsp;&nbsp;the MEL shall be based on the relevant Master Minimum Equipment List (MMEL), as defined in the data established in accordance with Commission Regulation (EU) No 748/2012, and shall not be less restrictive than the MMEL.<\/p> <p>(b)&nbsp;The MEL and any amendment thereto shall be notified to the CAA.<\/p> <p>&nbsp;<\/p> <\/div>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/2%20Regs/18720_NCOGEN155_Minimum_equipment_list.htm","sub":[{"id":"x-AMC1-NCO-GEN-155","kind":"AMC","label":"AMC1 NCO.GEN.155","title":"AMC1 NCO.GEN.155 Minimum equipment list","h":"<h3><a><\/a>AMC1 NCO.GEN.155 Minimum equipment list&nbsp;&nbsp;&nbsp;&nbsp;<\/h3> <p>CAA ORS9 Decision No. 1<\/p> <p>CONTENT AND APPROVAL OF THE MEL<\/p> <p>(a) When an MEL is established, the operator should amend the MEL after any applicable change to the MMEL within the acceptable timescales. The following are applicable changes to the MMEL that require amendment of the MEL:<\/p> <ol> <p> <\/p><p>(1) a reduction of the rectification interval;<\/p> <p><\/p> <p> <\/p><p>(2) change of an item, only when the change is applicable to the aircraft or type of operations and is more restrictive;<\/p> <p><\/p> <p> <\/p><p>(3) reduced timescales for the implementation of safety-related amendments may be required by the CAA.<\/p> <p><\/p> <\/ol> <p>(b) An acceptable timescale for notifying the amended MEL to the CAA is 90 days from the effective date specified in the approved change to the MMEL.<\/p> <p>(c) In addition to the list of items and related dispatch conditions, the MEL should contain:<\/p> <ol> <p> <\/p><p>(1) a preamble, including guidance and definitions for flight crew members and maintenance personnel using the MEL. The MEL preamble should:<\/p> <ol> <p> <\/p><p>(i) reflect the content of the MMEL preamble as applicable to the MEL scope and extent;<\/p> <p><\/p> <p> <\/p><p>(ii) contain terms and definitions used in the MEL;<\/p> <p><\/p> <p> <\/p><p>(iii) contain any other relevant specific information for the MEL scope and use that is not originally provided in the MMEL;<\/p> <p><\/p> <p> <\/p><p>(iv) provide guidance on how to identify the origin of a failure or malfunction to the extent necessary for appropriate application of the MEL;<\/p> <p><\/p> <p> <\/p><p>(v) provide guidance on the management of multiple unserviceabilities, based on the guidance given in the MMEL; and<\/p> <p><\/p> <p> <\/p><p>(vi) provide guidance on placarding of inoperative items to inform crew members of equipment condition as appropriate. In particular, when such items are accessible to the crew during flight, the control(s) and indicator(s) related to inoperative unit(s) should be clearly placarded.<\/p> <p><\/p> <\/ol> <p><\/p> <p> <\/p><p>(2) the revision status of the MMEL upon which the MEL is based and the revision status of the MEL;<\/p> <p><\/p> <p> <\/p><p>(3) the scope, extent and purpose of the MEL;<\/p> <p><\/p> <p> <\/p><p>(4) operational and maintenance procedures as part of the MEL or by means of reference to another appropriate document, based on the operational and maintenance procedures referenced in the MMEL; and<\/p> <p><\/p> <p> <\/p><p>(5) the dispatch conditions associated with flights conducted in accordance with special approvals held by the operator in accordance with Part-SPA.<\/p> <p><\/p> <\/ol> <p>(d) The operator should:<\/p> <ol> <p> <\/p><p>(1) establish rectification intervals for each inoperative instrument, item of equipment or function listed in the MEL. The rectification interval in the MEL should not be less restrictive than the corresponding rectification interval in the MMEL. The definitions and categories of rectification intervals are provided in CS-MMEL as well as in CS-GEN-MMEL; and<\/p> <p><\/p> <p> <\/p><p>(2) establish an effective rectification programme.<\/p> <p><\/p> <\/ol> <p>(e) The operator should establish the operational and maintenance procedures referenced in the MEL, taking into account the operational and maintenance procedures referenced in the MMEL. These procedures should be part of the operator’s manuals or the MEL.<\/p> <p>(f) The operator should amend the operational and maintenance procedures referenced in the MEL after any applicable change to the operational and maintenance procedures referenced in the MMEL.<\/p> <p>(g) Unless otherwise specified in the MEL, the operator should complete:<\/p> <ol> <p> <\/p><p>(1) the operational procedures referenced in the MEL when planning for and/or operating with the listed item inoperative; and<\/p> <p><\/p> <p> <\/p><p>(2) the maintenance procedures referenced in the MEL prior to operating with the listed item inoperative.<\/p> <p><\/p> <\/ol> <p>&nbsp;<\/p>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/3%20AMC/AMC1%20NCO%20GEN%20155%20Minimum%20equipment.htm"},{"id":"x-AMC2-NCO-GEN-155","kind":"AMC","label":"AMC2 NCO.GEN.155","title":"AMC2 NCO.GEN.155 Minimum equipment list","h":"<h3><a><\/a>AMC2 NCO.GEN.155 Minimum equipment list&nbsp;&nbsp;&nbsp;&nbsp;<\/h3> <p>CAA ORS9 Decision No. 1<\/p> <p>FORMAT OF THE MEL<\/p> <p>The MEL format, the presentation of MEL items and dispatch conditions should:<\/p> <p>(a) reflect those of the MMEL;<\/p> <p>(b) follow the ATA 100/2200 Specification numbering system for MEL items; and<\/p> <p>(c) when different from (a) and (b), be clear and unambiguous.<\/p> <p>&nbsp;<\/p>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/3%20AMC/AMC2%20NCO%20GEN%20155%20Minimum%20equipment.htm"},{"id":"x-AMC3-NCO-GEN-155","kind":"AMC","label":"AMC3 NCO.GEN.155","title":"AMC3 NCO.GEN.155 Minimum equipment list","h":"<h3><a><\/a>AMC3 NCO.GEN.155 Minimum equipment list&nbsp;&nbsp;&nbsp;&nbsp;<\/h3> <p>CAA ORS9 Decision No. 1<\/p> <p>EXTENT OF THE MEL<\/p> <p>The operator should include guidance in the MEL on how to deal with any failures that occur between the commencement of the flight and the start of the take-off. If a failure occurs between the commencement of the flight and the start of the take-off, any decision to continue the flight should be subject to pilot judgement and good airmanship. The pilot-in-command may refer to the MEL before any decision to continue the flight is taken.<\/p> <p>&nbsp;<\/p>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/3%20AMC/AMC3%20NCO%20GEN%20155%20Minimum%20equipment.htm"},{"id":"x-AMC4-NCO-GEN-155","kind":"AMC","label":"AMC4 NCO.GEN.155","title":"AMC4 NCO.GEN.155 Minimum equipment list","h":"<h3><a><\/a>AMC4 NCO.GEN.155 Minimum equipment list&nbsp;&nbsp;&nbsp;&nbsp;<\/h3> <p>CAA ORS9 Decision No. 1<\/p> <p>OPERATIONAL AND MAINTENANCE PROCEDURES<\/p> <p>(a) The operational and maintenance procedures referenced in the MEL should be based on the operational and maintenance procedures referenced in the MMEL. Modified procedures may, however, be developed by the operator when they provide the same level of safety as required by the MMEL. Modified maintenance procedures should be developed in accordance with the applicable airworthiness requirements.<\/p> <p>(b) Providing appropriate operational and maintenance procedures referenced in the MEL, regardless of who developed them, is the responsibility of the operator.<\/p> <p>(c) Any item in the MEL requiring an operational or maintenance procedure to ensure an acceptable level of safety should be so identified in the ‘remarks’ or ‘exceptions’ column/part/section of the MEL. This will normally be ‘(O)’ for an operational procedure, or ‘(M)’ for a maintenance procedure. ‘(O)(M)’ means both operational and maintenance procedures are required.<\/p> <p>(d) The satisfactory accomplishment of all procedures, regardless of who performs them, is the responsibility of the operator.<\/p> <p>&nbsp;<\/p>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/3%20AMC/AMC4%20NCO%20GEN%20155%20Minimum%20equipment.htm"},{"id":"x-AMC5-NCO-GEN-155","kind":"AMC","label":"AMC5 NCO.GEN.155","title":"AMC5 NCO.GEN.155 Minimum equipment list","h":"<h3><a><\/a>AMC5 NCO.GEN.155 Minimum equipment list&nbsp;&nbsp;&nbsp;&nbsp;<\/h3> <p>CAA ORS9 Decision No. 1<\/p> <p>OPERATIONAL AND MAINTENANCE PROCEDURES — APPLICABLE CHANGES<\/p> <p>(a) Changes to the operational and maintenance procedures referenced in the MMEL are considered applicable and require the amendment of the maintenance and operating procedures referenced in the MEL when:<\/p> <ol> <p> <\/p><p>(1) the modified procedure is applicable to the operator’s MEL; and<\/p> <p><\/p> <p> <\/p><p>(2) the purpose of this change is to improve compliance with the intent of the associated MMEL dispatch condition.<\/p> <p><\/p> <\/ol> <p>(b) An acceptable timescale for the amendments of maintenance and operating procedures, as defined in (a), should be 90 days from the date when the amended procedures referenced in the MMEL are made available. Reduced timescales for the implementation of safety-related amendments may be required if the CAA consider it necessary.<\/p> <p>&nbsp;<\/p>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/3%20AMC/AMC5%20NCO%20GEN%20155%20Minimum%20equipment.htm"},{"id":"x-GM1-NCO-GEN-155","kind":"GM","label":"GM1 NCO.GEN.155","title":"GM1 NCO.GEN.155 Minimum equipment list","h":"<h4><a><\/a>GM1 NCO.GEN.155 Minimum equipment list&nbsp;&nbsp;&nbsp;&nbsp;<\/h4> <p>CAA ORS9 Decision No. 1<\/p> <p>GENERAL<\/p> <p>(a) The Minimum Equipment List (MEL) is a document that lists the equipment that may be temporarily inoperative, subject to certain conditions, at the commencement of flight. This document is prepared by the operator for their own particular aircraft, taking account of their aircraft configuration and all those individual variables that cannot be addressed at MMEL level, such as operating environment, route structure, geographic location, aerodromes where spare parts and maintenance capabilities are available, etc.<\/p> <p>(b) The MMEL, as defined in the mandatory part of the operational suitability data established in accordance with Regulation (EU) No 748/2012, is developed in compliance with CS-MMEL or CS-GEN-MMEL. These Certification Specifications contain, among other, guidance intended to standardise the level of relief granted in MMELs, in particular for items that are subject to operational requirements. If an MMEL established as part of the operational suitability data is not available and items subject to operational requirements are listed in the available MMEL without specific relief or dispatch conditions but only with a reference to the operational requirements, the operator may refer to CS-MMEL or CS-GEN-MMEL guidance material, as applicable, to develop the relevant MEL content for such items.<\/p> <p>&nbsp;<\/p>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/4%20GM/GM1%20NCO%20GEN%20155%20Minimum%20equipment.htm"},{"id":"x-GM2-NCO-GEN-155","kind":"GM","label":"GM2 NCO.GEN.155","title":"GM2 NCO.GEN.155 Minimum equipment list","h":"<h4><a><\/a>GM2 NCO.GEN.155 Minimum equipment list&nbsp;&nbsp;&nbsp;&nbsp;<\/h4> <p>CAA ORS9 Decision No. 1<\/p> <p>SCOPE OF THE MEL<\/p> <p>(a) Examples of special approvals in accordance with Part-SPA may be:<\/p> <ol> <p> <\/p><p>(1) RVSM<\/p> <p><\/p> <p> <\/p><p>(2) LVO<\/p> <p><\/p> <\/ol> <p>(b) When an aircraft has installed equipment which is not required for the operations conducted, the operator may wish to delay rectification of such items for an indefinite period. Such cases are considered to be out of the scope of the MEL, therefore modification of the aircraft is appropriate and deactivation, inhibition or removal of the item should be accomplished by an appropriate approved modification procedure.<\/p> <p>&nbsp;<\/p>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/4%20GM/GM2%20NCO%20GEN%20155%20Minimum%20equipment.htm"},{"id":"x-GM3-NCO-GEN-155","kind":"GM","label":"GM3 NCO.GEN.155","title":"GM3 NCO.GEN.155 Minimum equipment list","h":"<h4><a><\/a>GM3 NCO.GEN.155 Minimum equipment list&nbsp;&nbsp;&nbsp;&nbsp;<\/h4> <p>CAA ORS9 Decision No. 1<\/p> <p>PURPOSE OF THE MEL<\/p> <p>The MEL is an alleviating document having the purpose to identify the minimum equipment and conditions to operate safely an aircraft having inoperative equipment. Its purpose is not, however, to encourage the operation of aircraft with inoperative equipment. It is undesirable for aircraft to be dispatched with inoperative equipment and such operations are permitted only as a result of careful analysis of each item to ensure that the acceptable level of safety, as intended in the applicable airworthiness and operational requirements, is maintained. The continued operation of an aircraft in this condition should be minimised.<\/p> <p>&nbsp;<\/p>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/4%20GM/GM3%20NCO%20GEN%20155%20Minimum%20equipment.htm"},{"id":"x-GM4-NCO-GEN-155","kind":"GM","label":"GM4 NCO.GEN.155","title":"GM4 NCO.GEN.155 Minimum equipment list","h":"<h4><a><\/a>GM4 NCO.GEN.155 Minimum equipment list&nbsp;&nbsp;&nbsp;&nbsp;<\/h4> <p>CAA ORS9 Decision No. 1<\/p> <p>OPERATIONAL AND MAINTENANCE PROCEDURES<\/p> <p>(a) Operational and maintenance procedures are an integral part of the compensating conditions needed to maintain an acceptable level of safety, enabling the CAA to approve the MEL.<\/p> <p>(b) Normally, operational procedures are accomplished by the flight crew; however, other personnel may be qualified and authorised to perform certain functions.<\/p> <p>(c) Normally, maintenance procedures are accomplished by the maintenance personnel; however, other personnel may be qualified and authorised to perform certain functions in accordance with the applicable airworthiness requirements.<\/p> <p>(d) Operational and maintenance procedures, regardless of the document where they are contained, should be readily available for use when needed for the application of the MEL.<\/p> <p>(e) Unless specifically permitted by a maintenance procedure, an inoperative item may not be removed from the aircraft.<\/p> <p>&nbsp;<\/p>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/4%20GM/GM4%20NCO%20GEN%20155%20Minimum%20equipment.htm"}]},{"id":"r-NCO-OP-100","ref":"NCO.OP.100","title":"Use of aerodromes and operating sites","h":"<h1>NCO.OP.100 Use of aerodromes and operating sites <\/h1> <div> <p>The pilot-in-command shall only use aerodromes and operating sites that are adequate for the type of aircraft and operation concerned.<\/p> <p>&nbsp;<\/p> <\/div>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/2%20Regs/18760_NCOOP100_Use_of_aerodromes_and_operating_sites.htm","sub":[]},{"id":"r-NCO-OP-101","ref":"NCO.OP.101","title":"Altimeter check and settings","h":"<h1>NCO.OP.101 Altimeter check and settings<\/h1> <p>SI 2024 No. 1290<\/p> <p>The pilot‑in‑command must:<\/p> <ol> <li value=\"1\">check the proper operation of the altimeter before each departure;<\/li> <li value=\"2\">use appropriate altimeter settings for all phases of flight, taking into account any procedure prescribed by the State of the aerodrome or the State of the airspace, if applicable.<\/li> <\/ol> <p>&nbsp;<\/p>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/2%20Regs/18761_NCOOP101_Altimeter%20check%20and%20settings.htm","sub":[{"id":"x-AMC1-NCO-OP-101-a","kind":"AMC","label":"AMC1 NCO.OP.101(a)","title":"AMC1 NCO.OP.101(a) Altimeter check and settings","h":"<h3>AMC1 NCO.OP.101(a) Altimeter check and settings<\/h3> <p>CAA ORS9 Decision No. 47<\/p> <p>PRE-FLIGHT ALTIMETER CHECK<\/p> <ol> <li value=\"1\"> <p>A serviceable altimeter indicates the elevation of the point selected, plus the height of the altimeter above this point, within a tolerance of ±&nbsp;60&nbsp;ft.<\/p> <\/li> <li value=\"2\"> <p>If the altimeter does not indicate the reference elevation or height exactly but is within the specified tolerances, no adjustment of this indication should be made at any stage of a flight. Also, any error which is within tolerance on the ground should be ignored by the pilot during flight.<\/p> <\/li> <li value=\"3\"> <p>If no altimeter setting is available at the aerodrome or operating site of departure, the altimeter should be set using the elevation of the aerodrome or operating site, and the altimeter setting should be verified on first contact with an ATS unit.<\/p> <\/li> <\/ol> <p>&nbsp;<\/p>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/3%20AMC/AMC1%20NCO%20OP%20101%20a%20Altimeter.htm"}]},{"id":"r-NCO-OP-110","ref":"NCO.OP.110","title":"Aerodrome operating minima — aeroplanes and helicopters","h":"<h1>NCO.OP.110 Aerodrome operating minima — aeroplanes and helicopters <\/h1> <p>SI 2024 No. 1290<\/p> <ol> <li value=\"1\">For IFR flights, the pilot‑in‑command must establish aerodrome operating minima for each planned departure aerodrome, destination aerodrome or alternate aerodrome in order to ensure separation of the aircraft from terrain and obstacles and to mitigate the risk of loss of visual references during the visual flight segment of instrument approach operations.<\/li> <li value=\"2\"> <p>When selecting the aerodrome operating minima, the pilot‑in‑command shall take the following into account:<\/p> <ol> <li value=\"1\">the type, performance and handling characteristics of the aircraft;<\/li> <li value=\"2\">his/her competence and experience;<\/li> <li value=\"3\">the dimensions and characteristics of the runways and final approach and take‑off areas (FATOs) that may be selected for use;<\/li> <li value=\"4\">the adequacy and performance of the available visual and non‑visual ground aids;<\/li> <li value=\"5\">the equipment available on the aircraft for the purpose of navigation and/or control of the flight path, during the take‑off, the approach, the flare, the landing, the rollout and the missed approach;<\/li> <li value=\"6\">any conditions or limitations stated in the aircraft flight manual;<\/li> <li value=\"7\">the obstacles in the climb‑out areas and clearance margins;<\/li> <li value=\"8\">the OCA or OCH in the IAP if established;<\/li> <li value=\"9\">the IAP, if established;<\/li> <li value=\"10\">the aerodrome characteristics and the type of air navigation service available;<\/li> <li value=\"11\">any minima promulgated by the State of the aerodrome, where available; and<\/li> <li value=\"12\">the conditions prescribed in any specific approvals for LVOs or operations with operational credits.<\/li> <\/ol> <\/li> <li value=\"3\"> <p>The minima for a specific type of approach and landing procedure shall only be used if:<\/p> <ol> <li value=\"1\">the ground equipment required for the intended procedure is operative;<\/li> <li value=\"2\">the aircraft systems required for the type of approach are operative;<\/li> <li value=\"3\">the required aircraft performance criteria are met; and<\/li> <li value=\"4\">the pilot is qualified appropriately.<\/li> <\/ol> <\/li> <\/ol> <p>&nbsp;<\/p>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/2%20Regs/18820_NCOOP110_Aerodrome_operating_minima_aeroplanes_and_helicopters.htm","sub":[{"id":"x-AMC1-NCO-OP-110","kind":"AMC","label":"AMC1 NCO.OP.110","title":"AMC1 NCO.OP.110 Aerodrome operating minima — aeroplanes and helicopters","h":"<h3>AMC1 NCO.OP.110 Aerodrome operating minima — aeroplanes and helicopters<\/h3> <p>CAA ORS9 Decision No. 47<\/p> <p>TAKE-OFF OPERATIONS<\/p> <ol> <li value=\"1\"> <p>General<\/p> <p>Take‑off minima should be expressed as visibility (VIS) or runway visual range (RVR) limits, taking into account all relevant factors for each runway&nbsp;/ final approach and take‑off area (FATO)&nbsp;/ operating site planned to be used and aircraft characteristics and equipment. Where there is a specific need to see and avoid obstacles on departure and/or for a forced landing, additional conditions, e.g.&nbsp;ceiling, it should be specified.<\/p> <\/li> <li value=\"2\"> <p> Visual reference<\/p> <ol> <li value=\"1\"> <p>The take‑off minima should be selected to ensure sufficient guidance to control the aircraft in the event of both a rejected take‑off in adverse circumstances and an engine failure after rotation.<\/p> <\/li> <li value=\"2\"> <p>For night operations, sufficient lighting should be in operation to illuminate the runway&nbsp;/ FATO and any relevant obstacles.<\/p> <\/li> <li value=\"3\"> <p>For point‑in‑space (PinS) departures to an initial departure fix (IDF), the take‑off minima should be selected to ensure sufficient guidance to see and avoid obstacles and return to the heliport if the flight cannot be continued visually to the IDF. The minimum VIS should be 800&nbsp;m and the minimum ceiling should be 250&nbsp;ft.<\/p> <\/li> <li value=\"4\"> <p>For helicopters outside of a runway environment, the minimum VIS should be 800&nbsp;m, and for offshore helideck operations, the minimum VIS should be 500&nbsp;m.<\/p> <\/li> <\/ol> <\/li> <\/ol> <p>&nbsp;<\/p>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/3%20AMC/AMC1%20NCO%20OP%20110%20Aerodrome.htm"},{"id":"x-AMC2-NCO-OP-110","kind":"AMC","label":"AMC2 NCO.OP.110","title":"AMC2 NCO.OP.110 Aerodrome operating minima — aeroplanes and helicopters","h":"<h3>AMC2 NCO.OP.110 Aerodrome operating minima — aeroplanes and helicopters<\/h3> <p>CAA ORS9 Decision No. 47<\/p> <p>RVR OR VIS FOR INSTRUMENT APPROACH OPERATIONS — DETERMINATION OF DH/MDH FOR INSTRUMENT APPROACH OPERATIONS — AEROPLANES<\/p> <ol> <li value=\"1\"> <p>The RVR (or for non‑instrument runways, VIS) for straight‑in instrument approach operations should not be less than the greatest of the following:<\/p> <ol> <li value=\"1\"> <p>the minimum RVR (or for non‑instrument runways, VIS) for the type of runway used according to Table&nbsp;1; <\/p> <\/li> <li value=\"2\"> <p>the minimum RVR determined according to the MDH or DH and class of lighting facility according to Table&nbsp;2; <\/p> <\/li> <li value=\"3\"> <p>the minimum RVR according to the visual and non‑visual aids and on‑board equipment used according to Table&nbsp;3.<\/p> <\/li> <\/ol> <\/li> <li value=\"2\"> <p>For Category&nbsp;A and&nbsp;B aeroplanes, if the RVR determined in accordance with (a) is greater than 1&nbsp;500&nbsp;m, then 1&nbsp;500&nbsp;m should be used.<\/p> <\/li> <li value=\"3\"> <p>The visual aids, if available, may comprise standard runway day markings, runway edge lights, threshold lights, runway end lights and approach lights as defined in Table&nbsp;6.<\/p> <\/li> <li value=\"4\"> <p>For night operations or for any operation where credit for visual aids is required, the lights should be on and serviceable except as provided for in GM5&nbsp;NCO.OP.110.<\/p> <\/li> <\/ol> <p>Table 1<\/p> <p>Type of runway versus minimum RVR or VIS — aeroplanes<\/p> <table> <colgroup><col> <col> <\/colgroup><thead> <tr> <th> <p>Type of runway<\/p> <\/th> <th> <p>Minimum RVR or VIS (m)<\/p> <\/th> <\/tr> <\/thead> <tbody> <tr> <td> <p>Precision approach (PA) runway, category&nbsp;I<\/p> <\/td> <td> <p>550<\/p> <\/td> <\/tr> <tr> <td> <p>Non‑precision approach (NPA) runway<\/p> <\/td> <td> <p>750<\/p> <\/td> <\/tr> <tr> <td> <p>Non‑instrument runway<\/p> <\/td> <td> <p>Visibility according to Table&nbsp;1 in NCO.OP.112 (Circling minima)<\/p> <\/td> <\/tr> <\/tbody> <\/table> <p>Table 2<\/p> <p>RVR versus DH/MDH<\/p> <table> <colgroup><col> <col> <col> <col> <col> <col> <col> <\/colgroup><thead> <tr> <th colspan=\"3\" rowspan=\"2\"> <p>DH or MDH<\/p> <\/th> <th colspan=\"4\">Class of lighting facility<\/th> <\/tr> <tr> <th> <p>FALS<\/p> <\/th> <th> <p>IALS<\/p> <\/th> <th> <p>BALS<\/p> <\/th> <th> <p>NALS<\/p> <\/th> <\/tr> <\/thead> <tbody ry&nbsp;A and B aeroplanes or &lt;5°for Category&nbsp;C and D aeroplanes<\/p> <\/td> <td> <p>750<\/p> <\/td> <\/tr> <tr> <td> <p>Final approach track offset ≥ 15° for category&nbsp;A or B aeroplanes<\/p> <\/td> <td> <p>1&nbsp;000<\/p> <\/td> <\/tr> <tr> <td> <p>Final approach track offset ≥ 5° for category&nbsp;C or D aeroplanes<\/p> <\/td> <td> <p>1&nbsp;200<\/p> <\/td> <\/tr> <\/tbody> <\/table> <p>DETERMINATION OF RVR FOR INSTRUMENT APPROACH OPERATIONS — HELICOPTERS<\/p> <ol> <li value=\"5\"> <p>For IFR operations, the RVR should not be less than the greatest of the following:<\/p> <ol> <li value=\"1\"> <p>the minimum RVR for the type of runway/FATO used according to Table&nbsp;4; or <\/p> <\/li> <li value=\"2\"> <p>the minimum RVR determined according to the MDH or DH and class of lighting facility according to Table&nbsp;5;<\/p> <\/li> <li value=\"3\"> <p>for PinS operations with instructions to ‘proceed visually’, the distance between the MAPt of the PinS and the FATO/approach light system.<\/p> <\/li> <\/ol> <\/li> <li value=\"6\"> <p>For PinS operations with instructions to ‘proceed VFR’, the VIS should be compatible with visual flight rules.<\/p> <\/li> <li value=\"7\"> <p>The visual aids, if available, may comprise standard runway day markings, runway edge lights, threshold lights, runway end lights and approach lights as defined in Table&nbsp;6.<\/p> <\/li> <li value=\"8\"> <p>For night operations or for any operation where credit for visual aids is required, the lights should be on and serviceable. <\/p> <\/li> <\/ol> <p>Table 4<\/p> <p>Type of runway/FATO versus minimum RVR — helicopters<\/p> <table> <colgroup><col> <col> <\/colgroup><thead> <tr> <th> <p>Type of runway/FATO<\/p> <\/th> <th> <p>Minimum RVR or VIS (m)<\/p> <\/th> <\/tr> <\/thead> <tbody> <tr> <td>PA runway, category&nbsp;I<\/td> <td>RVR 550<\/td> <\/tr> <tr> <td>NPA runway<\/td> <td>RVR 550<\/td> <\/tr> <tr> <td> <p>Non‑instrument runway<\/p> <\/td> <td>RVR 550<\/td> <\/tr> <tr> <td> <p>Instrument FATO<\/p> <\/td> <td> <p>RVR&nbsp;550<\/p> <\/td> <\/tr> <tr> <td> <p>FATO<\/p> <\/td> <td> <p>RVR or VIS&nbsp;800<\/p> <\/td> <\/tr> <\/tbody> <\/table> <p>Table 5<\/p> <p>DH/MDH versus minimum RVR — helicopters<\/p> <table> <colgroup><col> <col> <col> <col> <col> <\/colgroup><thead> <tr> <th rowspan=\"2\"> <p>DH/MDH (ft)<\/p> <\/th> <th colspan=\"4\">Facilities versus RVR (m)*<\/th> <\/tr> <tr> <th> <p>FALS<\/p> <\/th> <th> <p>IALS<\/p> <\/th> <th> <p>BALS<\/p> <\/th> <th> <p>NALS<\/p> <\/th> <\/tr> <\/thead> <tbody> <tr> <td> <p>200<\/p> <\/td> <td> <p>550<\/p> <\/td> <td> <p>600<\/p> <\/td> <td> <p>700<\/p> <\/td> <td> <p>1&nbsp;000<\/p> <\/td> <\/tr> <tr> <td> <p>201–249<\/p> <\/td> <td> <p>550<\/p> <\/td> <td> <p>650<\/p> <\/td> <td> <p>750<\/p> <\/td> <td> <p>1&nbsp;000<\/p> <\/td> <\/tr> <tr> <td> <p>250–299<\/p> <\/td> <td> <p>600*<\/p> <\/td> <td> <p>700*<\/p> <\/td> <td> <p>800<\/p> <\/td> <td> <p>1&nbsp;000<\/p> <\/td> <\/tr> <tr> <td> <p>300 and above<\/p> <\/td> <td> <p>750*<\/p> <\/td> <td> <p>800<\/p> <\/td> <td> <p>900<\/p> <\/td> <td> <p>1&nbsp;000<\/p> <\/td> <\/tr> <\/tbody> <\/table> <p>*Minima on 2D approach operations should be no lower than 800&nbsp;m.<\/p> <p>APPROACH LIGHTING SYSTEMS — AEROPLANES AND HELICOPTERS<\/p> <p>Table 6<\/p> <p>Approach lighting systems<\/p> <table> <colgroup><col> <col> <\/colgroup><thead> <tr> <th> <p>Class of lighting facility <\/p> <\/th> <th> <p>Length, configuration and intensity of approach lights <\/p> <\/th> <\/tr> <\/thead> <tbody> <tr> <td> <p>FALS<\/p> <\/td> <td> <p>CAT I lighting system (HIALS ≥720&nbsp;m) distance coded centre line, barrette centre line<\/p> <\/td> <\/tr> <tr> <td> <p>IALS<\/p> <\/td> <td> <p>Simple approach lighting system (HIALS 420–719&nbsp;m) single source, barrette<\/p> <\/td> <\/tr> <tr> <td> <p>BALS<\/p> <\/td> <td> <p>Any other approach lighting system (HIALS, MALS or ALS&nbsp;210‑419&nbsp;m)<\/p> <\/td> <\/tr> <tr> <td> <p>NALS<\/p> <\/td> <td> <p>Any other approach lighting system (HIALS, MALS or ALS &lt;210&nbsp;m) or no approach lights<\/p> <\/td> <\/tr> <\/tbody> <\/table> <p>&nbsp;<\/p>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/3%20AMC/AMC2%20NCO%20OP%20110%20Aerodrome.htm"},{"id":"x-AMC3-NCO-OP-110","kind":"AMC","label":"AMC3 NCO.OP.110","title":"AMC3 NCO.OP.110 Aerodrome operating minima — aeroplanes and helicopters","h":"<h3>AMC3 NCO.OP.110 Aerodrome operating minima — aeroplanes and helicopters<\/h3> <p>CAA ORS9 Decision No. 47<\/p> <p>VISUAL APPROACH<\/p> <p>For a visual approach operation, the RVR should not be less than 800&nbsp;m.<\/p> <p>&nbsp;<\/p>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/3%20AMC/AMC3%20NCO%20OP%20110%20Aerodrome.htm"},{"id":"x-GM1-NCO-OP-110","kind":"GM","label":"GM1 NCO.OP.110","title":"GM1 NCO.OP.110 Aerodrome operating minima – aeroplanes and helicopters","h":"<h4>GM1 NCO.OP.110 Aerodrome operating minima – aeroplanes and helicopters<\/h4> <p>CAA ORS9 Decision No. 47<\/p> <p>AIRCRAFT CATEGORIES<\/p> <ol> <li value=\"1\"> <p>Aircraft categories should be based on the indicated airspeed at threshold (V<sub>AT<\/sub>), which is equal to the stalling speed (V<sub>SO<\/sub>) multiplied by 1.3 or where published 1‑g (gravity) stall speed (V<sub>S1g<\/sub>) multiplied by 1.23 in the landing configuration at the maximum certified landing mass. If both V<sub>SO<\/sub> and V<sub>S1g<\/sub> are available, the higher resulting V<sub>AT<\/sub> should be used.<\/p> <\/li> <li value=\"2\"> <p>The aircraft categories specified in Table 7 should be used. <\/p> <p>Table 7: Aircraft categories corresponding to V<sub>AT<\/sub> values<\/p> <table> <colgroup><col> <col> <\/colgroup><thead> <tr> <th>Aircraft category<\/th> <th>V<sub>AT<\/sub><\/th> <\/tr> <\/thead> <tbody> <tr> <td>A<\/td> <td>Less than 91&nbsp;kt<\/td> <\/tr> <tr> <td>B<\/td> <td>from 91 to 120&nbsp;kt<\/td> <\/tr> <tr> <td>C<\/td> <td>from 121 to 140&nbsp;kt<\/td> <\/tr> <tr> <td>D<\/td> <td>from 141 to 165&nbsp;kt<\/td> <\/tr> <tr> <td>E<\/td> <td>from 166 to 210&nbsp;kt<\/td> <\/tr> <\/tbody> <\/table> <\/li> <li value=\"3\"> <p>Helicopters are also eligible for Category&nbsp;H where applicable.<\/p> <\/li> <\/ol> <p>&nbsp;<\/p>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/4%20GM/GM1%20NCO%20OP%20110%20Aerodrome%20operating.htm"},{"id":"x-GM2-NCO-OP-110","kind":"GM","label":"GM2 NCO.OP.110","title":"GM2 NCO.OP.110 Aerodrome operating minima – aeroplanes and helicopters","h":"<h4>GM2 NCO.OP.110 Aerodrome operating minima – aeroplanes and helicopters<\/h4> <p>CAA ORS9 Decision No. 47<\/p> <p>FLIGHTS WITH VFR AND IFR SEGMENTS<\/p> <p>Where a flight contains VFR and IFR segments, aerodrome operating minima need be established only as far as relevant to the IFR segments. Attention is drawn to NCO.OP.160 points (a) and (c), according to which, the pilot‑in‑command shall be satisfied that the VFR segments will be conducted in conditions at or above the applicable VFR operating minima. For example, for a VFR departure changing to IFR at a transition point en‑route and an IFR arrival at destination, the pilot‑in‑command should be satisfied that VMC will exist up to the transition point, and aerodrome operating minima should be established for the destination and any alternate destinations required.<\/p> <p>&nbsp;<\/p>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/4%20GM/GM2%20NCO%20OP%20110%20Aerodrome%20operating.htm"},{"id":"x-GM3-NCO-OP-110","kind":"GM","label":"GM3 NCO.OP.110","title":"GM3 NCO.OP.110 Aerodrome operating minima – aeroplanes and helicopters","h":"<h4>GM3 NCO.OP.110 Aerodrome operating minima – aeroplanes and helicopters<\/h4> <p>CAA ORS9 Decision No. 47<\/p> <p>MEANS TO DETERMINE THE REQUIRED RVR BASED ON DH AND LIGHTING FACILITIES<\/p> <ol> <li value=\"1\"> <p>The values in Table&nbsp;2 are derived from the formula below:<\/p> <p>RVR (m) = [(DH/MDH (ft) x 0.3048)/tanα] — length of approach lights (m),<\/p> <p>where α is the calculation angle, being a default value of 3.00° increasing in steps of 0.10° for each 10&nbsp;ft of DH or MDH up to 260&nbsp;ft, then increasing in steps of 0.10° for each 20&nbsp;ft of DH or MDH up to 3.77° and then remaining constant. A lower RVR limit of 550&nbsp;m and an upper RVR limit of 2&nbsp;400&nbsp;m has been applied to the table.<\/p> <\/li> <li value=\"2\"> <p>The lighting system classes in Table&nbsp;2 have the meaning specified in Table&nbsp;6.<\/p> <\/li> <\/ol> <p>&nbsp;<\/p>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/4%20GM/GM3%20NCO%20OP%20110%20Aerodrome%20operating.htm"},{"id":"x-GM4-NCO-OP-110","kind":"GM","label":"GM4 NCO.OP.110","title":"GM4 NCO.OP.110 Aerodrome operating minima – aeroplanes and helicopters","h":"<h4>GM4 NCO.OP.110 Aerodrome operating minima – aeroplanes and helicopters<\/h4> <p>CAA ORS9 Decision No. 47<\/p> <p>USE OF THIRD-PARTY INFORMATION<\/p> <p>If a pilot‑in‑command uses information provided by a third party for aerodrome operating minima, the pilot‑in‑command verifies that the method for calculating minima is in accordance with this Regulation.<\/p> <p>&nbsp;<\/p>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/4%20GM/GM4%20NCO%20OP%20110%20Aerodrome%20operating.htm"},{"id":"x-GM5-NCO-OP-110","kind":"GM","label":"GM5 NCO.OP.110","title":"GM5 NCO.OP.110 Aerodrome operating minima – aeroplanes and helicopters","h":"<h4>GM5 NCO.OP.110 Aerodrome operating minima – aeroplanes and helicopters<\/h4> <p>CAA ORS9 Decision No. 47<\/p> <p>EFFECT OF TEMPORARILY FAILED OR DOWNGRADED GROUND EQUIPMENT ON LANDING MINIMA<\/p> <ol> <li value=\"1\"> <p>Lighting in Table&nbsp;5 should be considered only if the relevant lighting is operating. For example, if components of a FALS have failed leaving only the last 250&nbsp;m operating normally, the lighting facilities should be treated as BALS.<\/p> <\/li> <li value=\"2\"> <p>Failures of standby equipment, standby power systems, middle markers and RVR assessment systems have no effect on minima.<\/p> <\/li> <\/ol> <p>&nbsp;<\/p>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/4%20GM/GM5%20NCO%20OP%20110%20Aerodrome%20operating.htm"},{"id":"x-GM1-NCO-OP-110-b-5","kind":"GM","label":"GM1 NCO.OP.110(b)(5)","title":"GM1 NCO.OP.110(b)(5) Aerodrome operating minima — aeroplanes and helicopters","h":"<h4>GM1 NCO.OP.110(b)(5) Aerodrome operating minima — aeroplanes and helicopters<\/h4> <p>CAA ORS9 Decision No. 47<\/p> <p>VISUAL AND NON‑VISUAL AIDS AND INFRASTRUCTURE<\/p> <p>‘Visual and non‑visual aids and infrastructure’ refers to all equipment and facilities required for the procedure to be used for the intended instrument approach operation. This includes, but is not limited to, lights, markings, ground- or space‑based radio aids, etc. <\/p> <p>&nbsp;<\/p>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/4%20GM/GM1%20NCO%20OP%20110%20b%205%20Aerodrome.htm"}]},{"id":"r-NCO-OP-111","ref":"NCO.OP.111","title":"Aerodrome operating minima — 2D and 3D approach operations","h":"<h1>NCO.OP.111 Aerodrome operating minima — 2D and 3D approach operations <\/h1> <p>SI 2024 No. 1290<\/p> <ol> <li value=\"1\"> <p>The DH to be used for a 3D approach operation or 2D approach operation flown with the CDFA technique must not be lower than the highest of:<\/p> <ol> <li value=\"1\">the OCH for the category of aircraft;<\/li> <li value=\"2\">the published approach procedure DH or MDH, where applicable;<\/li> <li value=\"3\">the system minimum specified in Table 1; or<\/li> <li value=\"4\">the minimum DH specified in the aircraft flight manual or equivalent.<\/li> <\/ol> <\/li> <li value=\"2\"> <p>The MDH for a 2D approach operation flown without the CDFA technique must not be lower than the highest of:<\/p> <ol> <li value=\"1\">the OCH for the category of aircraft;<\/li> <li value=\"2\">the published approach procedure MDH, where applicable;<\/li> <li value=\"3\">the system minimum specified in Table 1; or<\/li> <li value=\"4\">the minimum MDH specified in the aircraft flight manual, if stated.<\/li> <\/ol> <\/li> <\/ol> <p>Table 1<\/p> <p>System Minima<\/p> <table> <colgroup><col> <col> <\/colgroup><thead> <tr> <th>Facility<\/th> <th>Lowest DH/MDH (ft)<\/th> <\/tr> <\/thead> <tbody> <tr> <td>ILS/MLS/GLS<\/td> <td>200<\/td> <\/tr> <tr> <td>GNSS/SBAS (LPV)<\/td> <td>200<\/td> <\/tr> <tr> <td>Precision approach radar (PAR)<\/td> <td>200<\/td> <\/tr> <tr> <td>GNSS/SBAS (LP) <\/td> <td>250<\/td> <\/tr> <tr> <td>GNSS (LNAV)<\/td> <td>250<\/td> <\/tr> <tr> <td>GNSS/Baro-VNAV (LNAV/VNAV)<\/td> <td>250<\/td> <\/tr> <tr> <td>Helicopter point‑in‑space approach <\/td> <td>250<\/td> <\/tr> <tr> <td>LOC with or without DME <\/td> <td>250<\/td> <\/tr> <tr> <td>SRA (terminating at ½&nbsp;NM<\/td> <td>250<\/td> <\/tr> <tr> <td>SRA (terminating at 1&nbsp;NM)<\/td> <td>300<\/td> <\/tr> <tr> <td>SRA (terminating at 2&nbsp;NM or more)<\/td> <td>350<\/td> <\/tr> <tr> <td>VOR<\/td> <td>300<\/td> <\/tr> <tr> <td>VOR/DME<\/td> <td>250<\/td> <\/tr> <tr> <td>NDB<\/td> <td>350<\/td> <\/tr> <tr> <td>NDB/DME<\/td> <td>300<\/td> <\/tr> <tr> <td>VDF<\/td> <td>350<\/td> <\/tr> <\/tbody> <\/table> <p>&nbsp;<\/p>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/2%20Regs/18850_NCOOP111_Aerodrome_operating_minima_NPA_APV_CAT_I_operations.htm","sub":[{"id":"x-AMC1-NCO-OP-111","kind":"AMC","label":"AMC1 NCO.OP.111","title":"AMC1 NCO.OP.111 Aerodrome operating minima — 2D and 3D approach operations","h":"<h3>AMC1 NCO.OP.111 Aerodrome operating minima — 2D and 3D approach operations<\/h3> <p>CAA ORS9 Decision No. 47<\/p> <p>DETERMINATION OF DH/MDH FOR INSTRUMENT APPROACH OPERATIONS AND RUNWAY<\/p> <p>When determining the DH/MDH in accordance with the obstacle clearance hight (OCH) for the category of aircraft and the published approach procedure DH or minimum descent height (MDH), the pilot should determine whether the obstacle limitation surface is appropriate for the type of instrument approach flown and runway as this matter may have an impact on the calculation of the OCH and DH/MDH. When this information is not available (e.g.&nbsp;not mentioned in the AIP, etc.), then the pilot should take into account Table&nbsp;8 or&nbsp;9 below, as applicable, when determining the DH/MDH:<\/p> <p>Table 8<\/p> <p>Runway type minima — aeroplanes<\/p> <table> <colgroup><col> <col> <\/colgroup><thead> <tr> <th>Runway type<\/th> <th>Lowest DH/MDH (ft)<\/th> <\/tr> <\/thead> <tbody> <tr> <td>PA runway, category&nbsp;I<\/td> <td>200<\/td> <\/tr> <tr> <td>NPA runway<\/td> <td>250<\/td> <\/tr> <tr> <td>Non‑instrument runway<\/td> <td>Circling minima as shown in Table&nbsp;1 in NCC.OP.112<\/td> <\/tr> <\/tbody> <\/table> <p>&nbsp;<\/p> <p>Table 9<\/p> <p>Type of runway/FATO minima — helicopters<\/p> <table> <colgroup><col> <col> <\/colgroup><thead> <tr> <th>Runway type<\/th> <th>Lowest DH/MDH (ft)<\/th> <\/tr> <\/thead> <tbody> <tr> <td>PA runway, category&nbsp;I<\/td> <td>200<\/td> <\/tr> <tr> <td>NPA runway<\/td> <td>200<\/td> <\/tr> <tr> <td>Non‑instrument runway<\/td> <td>200<\/td> <\/tr> <tr> <td>Instrument FATO<\/td> <td>200<\/td> <\/tr> <tr> <td>FATO<\/td> <td>250<\/td> <\/tr> <\/tbody> <\/table> <p>Table&nbsp;8 does not apply to helicopter PinS approaches with instructions to ‘proceed VFR’.<\/p> <p>&nbsp;<\/p>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/3%20AMC/AMC1%20NCO%20OP%20111%20Aerodrome.htm"},{"id":"x-GM1-NCO-OP-111","kind":"GM","label":"GM1 NCO.OP.111","title":"GM1 NCO.OP.111 Aerodrome operating minima — 2D and 3D approach operations","h":"<h4>GM1 NCO.OP.111 Aerodrome operating minima — 2D and 3D approach operations<\/h4> <p>CAA ORS9 Decision No. 47<\/p> <p>APPROACH OPERATIONS — VERTICAL PATH CONTROL FOR NPA<\/p> <ol> <li value=\"1\"> <p>During a 3D instrument approach operation (using both lateral and vertical navigation guidance), the displayed vertical path should be followed continuously. The approach may be continued to DA/H, at which point a missed approach must be initiated if visual reference is not acquired.<\/p> <\/li> <li value=\"2\"> <p>During a 2D instrument approach operation (using lateral navigation guidance only) flown using the continuous descent final approach (CDFA) technique, the vertical path should be approximated continuously by:<\/p> <ol> <li value=\"1\"> <p>choosing an appropriate vertical speed; <\/p> <\/li> <li value=\"2\"> <p>cross-checking level against position along the approach; and <\/p> <\/li> <li value=\"3\"> <p>adapting the vertical speed as required. <\/p> <\/li> <\/ol> <p>The approach may be continued to DA/H or the missed approach point (MAPt) (whichever is reached first), at which point a missed approach must be initiated if visual reference is not acquired. There is no MDH for an NPA flown using the CDFA technique. An aircraft may descend briefly below the DH on an NPA flown using the CDFA technique, in the same way as it may on a PA or APV.<\/p> <\/li> <li value=\"3\"> <p>During a 2D instrument approach operation (using lateral navigation guidance only) flown using the step‑down (non‑CDFA) technique, the vertical path consists of a sequence of one or more descents to the next published level (i.e.&nbsp;the MDA/H or height at the next stepdown fix). The aircraft may fly level at the MDA/H until reaching the MAPt, where a missed approach must be initiated if visual reference is not acquired.<\/p> <\/li> <li value=\"4\"> <p>The CDFA technique has substantially improved safety performance in commercial air transport operations with complex motor‑powered aircraft. In lighter, more manoeuvrable aircraft, operated by a single pilot, which may be accustomed to shorter and steeper visual approaches, there may sometimes be advantages to a step‑down technique. Due consideration should be given to the choice of vertical path control at the planning stage of flight.<\/p> <\/li> <\/ol> <p>&nbsp;<\/p>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/4%20GM/GM1%20NCO%20OP%20111%20Aerodrome%20operating.htm"},{"id":"x-GM2-NCO-OP-111","kind":"GM","label":"GM2 NCO.OP.111","title":"GM2 NCO.OP.111 Aerodrome operating minima — 2D and 3D approach operations","h":"<h4>GM2 NCO.OP.111 Aerodrome operating minima — 2D and 3D approach operations<\/h4> <p>CAA ORS9 Decision No. 47<\/p> <p>DH/MDH — CALCULATION OF DA/MDA<\/p> <p>NCO.OP.111 refers to DH and MDH because the rule compares heights with other heights (system minima, minimum DH in the AFM, etc.). Usually, the DH or MDH will be converted to DA or MDA for operational use by adding the threshold elevation.<\/p> <p>&nbsp;<\/p>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/4%20GM/GM2%20NCO%20OP%20111%20Aerodrome%20operating.htm"},{"id":"x-GM3-NCO-OP-111","kind":"GM","label":"GM3 NCO.OP.111","title":"GM3 NCO.OP.111 Aerodrome operating minima — 2D and 3D approach operations","h":"<h4>GM3 NCO.OP.111 Aerodrome operating minima — 2D and 3D approach operations<\/h4> <p>CAA ORS9 Decision No. 47<\/p> <p>DH/MDH — PinS APPROACHES WITH VIRTUAL DESTINATION<\/p> <p>For PinS approaches with instructions to ‘proceed VFR’ that are not associated with a runway&nbsp;/ FATO&nbsp;/ operating site, DH/MDH can be established with reference to the ground below the MAPt.<\/p> <p>&nbsp;<\/p>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/4%20GM/GM3%20NCO%20OP%20111%20Aerodrome%20operating.htm"}]},{"id":"r-NCO-OP-112","ref":"NCO.OP.112","title":"Aerodrome operating minima — circling operations with aeroplanes","h":"<h1>NCO.OP.112 Aerodrome operating minima — circling operations with aeroplanes <\/h1> <p>SI 2024 No. 1290<\/p> <ol> <li value=\"1\"> <p>The MDH for a circling operation with aeroplanes shall not be lower than the highest of:<\/p> <ol> <li value=\"1\">the published circling OCH for the aeroplane category;<\/li> <li value=\"2\">the minimum circling height derived from Table 1; or<\/li> <li value=\"3\">the DH/MDH of the preceding instrument approach procedure.<\/li> <\/ol> <\/li> <li value=\"2\"> <p>The minimum visibility for a circling operation with aeroplanes shall be the highest of:<\/p> <ol> <li value=\"1\">the circling visibility for the aeroplane category, if published;<\/li> <li value=\"2\">the minimum visibility derived from Table 1; or<\/li> <\/ol> <\/li> <\/ol> <p>Table 1&nbsp;MDH and minimum visibility for circling vs. aeroplane category<\/p> <table> <colgroup><col> <col> <col> <col> <col> <\/colgroup><thead> <tr> <th>Height and visibility<\/th> <th>Category A<\/th> <th>Category B<\/th> <th>Category C<\/th> <th>Category D<\/th> <\/tr> <\/thead> <tbody> <tr> <td>MDH (ft)<\/td> <td>400<\/td> <td>500<\/td> <td>600<\/td> <td>700<\/td> <\/tr> <tr> <td>Minimum meteorological visibility (m)<\/td> <td>1500<\/td> <td>1600<\/td> <td>2400<\/td> <td>3600<\/td> <\/tr> <\/tbody> <\/table> <p>&nbsp;<\/p>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/2%20Regs/18880_NCOOP112_Aerodrome_operating_minima_circling_operations_with_aeroplane.htm","sub":[{"id":"x-GM1-NCO-OP-112","kind":"GM","label":"GM1 NCO.OP.112","title":"GM1 NCO.OP.112 Aerodrome operating minima – circling operations with aeroplanes","h":"<h4>GM1 NCO.OP.112 Aerodrome operating minima – circling operations with aeroplanes<\/h4> <p>CAA ORS9 Decision No. 47<\/p> <p>SUPPLEMENTAL INFORMATION<\/p> <ol> <li value=\"1\"> <p>The purpose of this guidance material is to provide pilots with supplemental information regarding the application of aerodrome operating minima in relation to circling approaches.<\/p> <\/li> <li value=\"2\"> <p>Conduct of flight — general:<\/p> <ol> <li value=\"1\"> <p>the MDH and obstacle clearance height (OCH) included in the procedure are referenced to aerodrome elevation;<\/p> <\/li> <li value=\"2\"> <p>the MDA is referenced to mean sea level; and<\/p> <\/li> <li value=\"3\"> <p>for these procedures, the applicable visibility is the flight visibility.<\/p> <\/li> <\/ol> <\/li> <li value=\"3\"> <p>Instrument approach followed by visual manoeuvring (circling) without prescribed tracks:<\/p> <ol> <li value=\"1\"> <p>When the aeroplane is on the initial instrument approach, before visual reference is established, but not below MDA/H — the aeroplane should follow the corresponding instrument approach procedure (IAP) until the appropriate instrument MAPt is reached.<\/p> <\/li> <li value=\"2\"> <p>At the beginning of the level flight phase at or above the MDA/H, the instrument approach track should be maintained until the pilot:<\/p> <ol> <li value=\"1\"> <p>estimates that, in all probability, visual contact with the runway of intended landing or the runway environment will be maintained during the entire circling procedure;<\/p> <\/li> <li value=\"2\"> <p>estimates that the aeroplane is within the circling area before commencing circling; and<\/p> <\/li> <li value=\"3\"> <p>is able to determine the aeroplane’s position in relation to the runway of intended landing with the aid of the appropriate visual references.<\/p> <\/li> <\/ol> <\/li> <li value=\"3\"> <p>When reaching the published instrument MAPt and the conditions stipulated in (c)(2) are unable to be established by the pilot, a missed approach should be carried out in accordance with that IAP.<\/p> <\/li> <li value=\"4\"> <p>After the aeroplane has left the track of the initial instrument approach, the flight phase outbound from the runway should be limited to an appropriate distance, which is required to align the aeroplane onto the final approach. Such manoeuvres should be conducted to enable the aeroplane:<\/p> <ol> <li value=\"1\"> <p>to attain a controlled and stable descent path to the intended landing runway; and<\/p> <\/li> <li value=\"2\"> <p>to remain within the circling area and in such a way that visual contact with the runway of intended landing or runway environment is maintained at all times.<\/p> <\/li> <\/ol> <\/li> <li value=\"5\"> <p>Flight manoeuvres should be carried out at an altitude/height that is not less than the circling MDA/H.<\/p> <\/li> <li value=\"6\"> <p>Descent below MDA/H should not be initiated until the threshold of the runway to be used has been appropriately identified. The aeroplane should be in a position to continue with a normal rate of descent and land within the touchdown zone.<\/p> <\/li> <\/ol> <\/li> <li value=\"4\"> <p>Instrument approach followed by a visual manoeuvring (circling) with prescribed track:<\/p> <ol> <li value=\"1\"> <p>The aeroplane should remain on the initial instrument approach procedure until one of the following is reached:<\/p> <ol> <li value=\"1\"> <p>the prescribed divergence point to commence circling on the prescribed track; or<\/p> <\/li> <li value=\"2\"> <p>the MAPt.<\/p> <\/li> <\/ol> <\/li> <li value=\"2\"> <p>The aeroplane should be established on the instrument approach track determined by the radio navigation aids, RNAV, RNP, or ILS, MLS or GLS in level flight at or above the MDA/H at or by the circling manoeuvre divergence point.<\/p> <\/li> <li value=\"3\"> <p>If the divergence point is reached before the required visual reference is acquired, a missed approach should be initiated not later than the MAPt and completed in accordance with the initial instrument approach procedure.<\/p> <\/li> <li value=\"4\"> <p>When commencing the prescribed circling manoeuvre at the published divergence point, the subsequent manoeuvres should be conducted to comply with the published routing and published heights/altitudes.<\/p> <\/li> <li value=\"5\"> <p>Unless otherwise specified, once the aeroplane is established on the prescribed track(s), the published visual reference does not need to be maintained unless:<\/p> <ol> <li value=\"1\"> <p>required by the State of the aerodrome; or<\/p> <\/li> <li value=\"2\"> <p>the circling MAPt (if published) is reached.<\/p> <\/li> <\/ol> <\/li> <li value=\"6\"> <p>If the prescribed circling manoeuvre has a published MAPt and the required visual reference has not been obtained by that point, a missed approach should be executed in accordance with (e)(2) and (e)(3).<\/p> <\/li> <li value=\"7\"> <p>Subsequent further descent below MDA/H should only commence when the required visual reference has been obtained.<\/p> <\/li> <li value=\"8\"> <p>Unless otherwise specified in the procedure, final descent should not be commenced from MDA/H until the threshold of the intended landing runway has been identified and the aeroplane is in a position to continue with a normal rate of descent to land within the touchdown zone.<\/p> <\/li> <\/ol> <\/li> <li value=\"5\"> <p>Missed approach:<\/p> <ol> <li value=\"1\"> <p>Missed approach during the instrument procedure prior to circling:<\/p> <ol> <li value=\"1\"> <p>if the missed approach is required to be flown when the aeroplane is positioned on the instrument approach track defined by radio navigation aids, RNAV, RNP or ILS, MLS or GLS and before commencing the circling manoeuvre, the published missed approach for the instrument approach should be followed; or<\/p> <\/li> <li value=\"2\"> <p>if the instrument approach procedure is carried out with the aid of an ILS, MLS or a stabilised approach (SAp), the MAPt associated with an ILS or MLS procedure without glide path (GP‑out procedure) or the SAp, where applicable, should be used.<\/p> <\/li> <\/ol> <\/li> <li value=\"2\"> <p>If a prescribed missed approach is published for the circling manoeuvre, this overrides the manoeuvres prescribed below.<\/p> <\/li> <li value=\"3\"> <p>If visual reference is lost while circling to land after the aeroplane has departed from the initial instrument approach track, the missed approach specified for that particular instrument approach should be followed. It is expected that the pilot will make an initial climbing turn toward the intended landing runway to a position overhead of the aerodrome where the pilot will establish the aeroplane in a climb on the instrument missed approach segment.<\/p> <\/li> <li value=\"4\"> <p>The aeroplane should not leave the visual manoeuvring (circling) area, which is obstacle protected, unless:<\/p> <ol> <li value=\"1\"> <p>established on the appropriate missed approach procedure; or<\/p> <\/li> <li value=\"2\"> <p>at minimum sector altitude (MSA).<\/p> <\/li> <\/ol> <\/li> <li value=\"5\"> <p>All turns should be made in the same direction and the aeroplane should remain within the circling protected area while climbing either:<\/p> <ol> <li value=\"1\"> <p>to the altitude assigned to any published circling missed approach manoeuvre if applicable;<\/p> <\/li> <li value=\"2\"> <p>to the altitude assigned to the missed approach of the initial instrument approach;<\/p> <\/li> <li value=\"3\"> <p>to the MSA;<\/p> <\/li> <li value=\"4\"> <p>to the minimum holding altitude (MHA) applicable for transition to a holding facility or fix, or continue to climb to an MSA; or<\/p> <\/li> <li value=\"5\"> <p>as directed by ATS.<\/p> <\/li> <\/ol> <p>When the missed approach procedure is commenced on the ‘downwind’ leg of the circling manoeuvre, an ‘S’ turn may be undertaken to align the aeroplane on the initial instrument approach missed approach path, provided the aeroplane remains within the protected circling area.<\/p> <p>The pilot-in-command should be responsible for ensuring adequate terrain clearance during the above‑stipulated manoeuvres, particularly during the execution of a missed approach initiated by ATS.<\/p> <\/li> <li value=\"6\"> <p>Because the circling manoeuvre may be accomplished in more than one direction, different patterns will be required to establish the aeroplane on the prescribed missed approach course, depending on its position at the time visual reference is lost. In particular, all turns are to be in the prescribed direction if this is restricted, e.g. to the west/east (left or right hand) to remain within the protected circling area.<\/p> <\/li> <li value=\"7\"> <p>If a missed approach procedure is published for a particular runway onto which the aeroplane is conducting a circling approach and the aeroplane has commenced a manoeuvre to align with the runway, the missed approach for this direction may be accomplished. The ATS unit should be informed of the intention to fly the published missed approach procedure for that particular runway.<\/p> <\/li> <li value=\"8\"> <p>The pilot-in-command should advise ATS when any missed approach procedure has been commenced, the height/altitude the aeroplane is climbing to and the position the aeroplane is proceeding towards and/or heading the aeroplane is established on.<\/p> <\/li> <\/ol> <\/li> <\/ol> <p>&nbsp;<\/p>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/4%20GM/GM1%20NCO%20OP%20112%20Aerodrome%20operating%20minima%20%E2%80%93%20circling%20operations%20with%20aeroplanes.htm"},{"id":"x-GM2-NCO-OP-112","kind":"GM","label":"GM2 NCO.OP.112","title":"GM2 NCO.OP.112 Aerodrome operating minima — circling operations with aeroplanes","h":"<h4>GM2 NCO.OP.112 Aerodrome operating minima — circling operations with aeroplanes<\/h4> <p>CAA ORS9 Decision No. 47<\/p> <p>DH/MDH — CALCULATION OF MDH/MDA<\/p> <p>NCO.OP.112 refers to MDH because the rule compares heights with other heights (minimum circling height, OCH, etc.). Usually, the MDH will be converted to MDA for operational use by adding the aerodrome elevation.<\/p> <p>&nbsp;<\/p>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/4%20GM/GM2%20NCO%20OP%20112%20Aerodrome%20operating.htm"}]},{"id":"r-NCO-OP-113","ref":"NCO.OP.113","title":"Aerodrome operating minima — onshore circling operations with helicopters","h":"<h1>NCO.OP.113 Aerodrome operating minima — onshore circling operations with helicopters <\/h1> <div> <p>The MDH for an onshore circling operation with helicopters shall not be lower than 250 ft and the meteorological visibility not less than 800 m.<\/p> <p>&nbsp;<\/p> <\/div>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/2%20Regs/18910_NCOOP113_Aerodrome_operating_minima_onshore_circling_operations_with_h.htm","sub":[]},{"id":"r-NCO-OP-115","ref":"NCO.OP.115","title":"Departure and approach procedures — aeroplanes and helicopters","h":"<h1>NCO.OP.115 Departure and approach procedures — aeroplanes and helicopters <\/h1> <div> <p>(a)&nbsp;The pilot-in-command shall use the departure and approach procedures established by the State of the aerodrome, if such procedures have been published for the runway or FATO to be used.<\/p> <p>(b)&nbsp;The pilot-in-command may deviate from a published departure route, arrival route or approach procedure:<\/p> <p>(1)&nbsp;&nbsp;provided obstacle clearance criteria can be observed, full account is taken of the operating conditions and any ATC clearance is adhered to; or<\/p> <p>(2)&nbsp;&nbsp;when being radar-vectored by an ATC unit.<\/p> <p>&nbsp;<\/p> <\/div>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/2%20Regs/18940_NCOOP115_Departure_and_approach_procedures_aeroplanes_and_helicopters.htm","sub":[{"id":"x-AMC1-NCO-OP-115","kind":"AMC","label":"AMC1 NCO.OP.115","title":"AMC1 NCO.OP.115 Departure and approach procedures — aeroplanes and helicopters","h":"<h3>AMC1 NCO.OP.115 Departure and approach procedures — aeroplanes and helicopters<\/h3> <p>CAA ORS9 Decision No. 47<\/p> <p>ARRIVALS AND DEPARTURES UNDER IFR WHERE NO INSTRUMENT FLIGHT PROCEDURES ARE PUBLISHED<\/p> <ol> <li value=\"1\"> <p>When arriving or departing under IFR to/from an aerodrome or operating site with no published instrument flight procedure, the pilot‑in‑command should ensure that sufficient obstacle clearance is available for safe operation. This may be achieved, for example, by climbing or descending visually when below a minimum altitude at which obstacle clearance is known to exist. <\/p> <\/li> <li value=\"2\"> <p>When operating IFR in uncontrolled airspace, separation from other aircraft remains the responsibility of the pilot‑in‑command. The pilot‑in‑command should also comply with any flight planning and communication requirements designated by the CAA under SERA.4001(b)(3) and SERA.5025(b). Any ATC clearance required to enter controlled airspace must be obtained prior to entry.&nbsp; <\/p> <\/li> <\/ol> <p>&nbsp;<\/p>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/3%20AMC/AMC1%20NCO%20OP%20115%20Departure.htm"}]},{"id":"r-NCO-OP-116","ref":"NCO.OP.116","title":"Performance-based navigation — aeroplanes and helicopters","h":"<h1>NCO.OP.116 Performance-based navigation — aeroplanes and helicopters <\/h1> <div> <p>The pilot-in-command shall ensure that, when PBN is required for the route or procedure to be flown:<\/p> <p>(a)&nbsp;the relevant PBN navigation specification is stated in the AFM or other document that has been approved by the certifying authority as part of an airworthiness assessment or is based on such approval; and<\/p> <p>(b)&nbsp;the aircraft is operated in conformance with the relevant navigation specification and limitations in the AFM or other document mentioned above.<\/p> <p>&nbsp;<\/p> <\/div>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/2%20Regs/18970_NCOOP116_Performance-based_navigation_aeroplanes_and_helicopters.htm","sub":[{"id":"x-AMC1-NCO-OP-116","kind":"AMC","label":"AMC1 NCO.OP.116","title":"AMC1 NCO.OP.116 Performance-based navigation – aeroplanes and helicopters","h":"<h3><a><\/a>AMC1 NCO.OP.116 Performance-based navigation – aeroplanes and helicopters&nbsp;&nbsp;&nbsp;&nbsp;<\/h3> <p>CAA ORS9 Decision No. 1<\/p> <p>PBN OPERATIONS<\/p> <p>For operations where a navigation specification for performance-based navigation (PBN) has been prescribed and no specific approval is required in accordance with SPA.PBN.100, the pilot-in- command should:<\/p> <p>(a) use operating procedures specifying:<\/p> <ol> <p> <\/p><p>(1) normal, abnormal and contingency procedures;<\/p> <p><\/p> <p> <\/p><p>(2) electronic navigation database management; and<\/p> <p><\/p> <p> <\/p><p>(3) relevant entries in the minimum equipment list (MEL), where applicable;<\/p> <p><\/p> <\/ol> <p>(b) ensure that he/she is appropriately trained for the intended operation.<\/p> <p>&nbsp;<\/p>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/3%20AMC/AMC1%20NCO%20OP%20116%20Performance.htm"},{"id":"x-AMC2-NCO-OP-116","kind":"AMC","label":"AMC2 NCO.OP.116","title":"AMC2 NCO.OP.116 Performance-based navigation – aeroplanes and helicopters","h":"<h3><a><\/a>AMC2 NCO.OP.116 Performance-based navigation – aeroplanes and helicopters&nbsp;&nbsp;&nbsp;&nbsp;<\/h3> <p>CAA ORS9 Decision No. 1<\/p> <p>MONITORING AND VERIFICATION<\/p> <p>(a) Preflight and general considerations<\/p> <ol> <p> <\/p><p>(1) At navigation system initialisation, the pilot-in-command should confirm that the navigation database is current and verify that the aircraft position, if required, has been entered correctly.<\/p> <p><\/p> <p> <\/p><p>(2) The active flight plan, if applicable, should be checked by comparing the charts or other applicable documents with navigation equipment and displays. This includes confirmation of the waypoint sequence, reasonableness of track angles and distances, any altitude or speed constraints, and, where possible, which waypoints are fly-by and which are fly-over. Where relevant, the RF leg arc radii should be confirmed.<\/p> <p><\/p> <p> <\/p><p>(3) The pilot-in-command should check that the navigation aids critical to the operation of the intended PBN procedure are available.<\/p> <p><\/p> <p> <\/p><p>(4) The pilot-in-command should confirm the navigation aids that should be excluded from the operation, if any.<\/p> <p><\/p> <p> <\/p><p>(5) An arrival, approach or departure procedure should not be used if the validity of the procedure in the navigation database has expired.<\/p> <p><\/p> <\/ol> <p>(b) Departure<\/p> <ol> <p> <\/p><p>(1) Prior to commencing a take-off on a PBN procedure, the pilot-in-command should verify that the area navigation system is available and operating correctly and the correct aerodrome and runway data has been loaded. A positive check should be made that the indicated aircraft position is consistent with the actual aircraft position at the start of the take-off roll (aeroplanes) or lift-off (helicopters).<\/p> <p><\/p> <p> <\/p><p>(2) Where GNSS is used, the signal should be acquired before the take-off roll (aeroplanes) or lift-off (helicopters) commences.<\/p> <p><\/p> <p> <\/p><p>(3) Unless automatic updating of the actual departure point is provided, the pilot-in- command should ensure initialisation on the runway or FATO either by means of a manual runway threshold or intersection update, as applicable. This is to preclude any inappropriate or inadvertent position shift after take-off.<\/p> <p><\/p> <\/ol> <p>(c) Arrival and approach<\/p> <ol> <p> <\/p><p>(1) The pilot-in-command should verify that the navigation system is operating correctly and the correct arrival procedure and runway (including any applicable transition) are entered and properly depicted.<\/p> <p><\/p> <p> <\/p><p>(2) Any published altitude and speed constraints should be observed.<\/p> <p><\/p> <p> <\/p><p>(3) The pilot-in-command should check approach procedures (including alternate aerodromes if needed) as extracted by the system (e.g. CDU flight plan page) or presented graphically on the moving map, in order to confirm the correct loading and the reasonableness of the procedure content.<\/p> <p><\/p> <p> <\/p><p>(4) Prior to commencing the approach operation (before the IAF), the pilot-in-command should verify the correctness of the loaded procedure by comparison with the appropriate approach charts. This check should include:<\/p> <ol> <p> <\/p><p>(i) the waypoint sequence;<\/p> <p><\/p> <p> <\/p><p>(ii) reasonableness of the tracks and distances of the approach legs and the accuracy of the inbound course; and<\/p> <p><\/p> <p> <\/p><p>(iii) the vertical path angle, if applicable.<\/p> <p><\/p> <\/ol> <p><\/p> <\/ol> <p>(d) Altimetry settings for RNP APCH operations using Baro VNAV<\/p> <ol> <p> <\/p><p>(1) Barometric settings<\/p> <ol> <p> <\/p><p>(i) The pilot-in-command should set and confirm the correct altimeter setting and check that the two altimeters provide altitude values that do not differ more than 100 ft at the most at or before the FAF.<\/p> <p><\/p> <p> <\/p><p>(ii) The pilot-in-command should fly the procedure with:<\/p> <ol> <p> <\/p><p>(A) a current local altimeter setting source available — a remote or regional altimeter setting source should not be used; and<\/p> <p><\/p> <p> <\/p><p>(B) the QNH/QFE, as appropriate, set on the aircraft’s altimeters.<\/p> <p><\/p> <\/ol> <p><\/p> <\/ol> <p><\/p> <p> <\/p><p>(2) Temperature compensation<\/p> <ol> <p> <\/p><p>(i) For RNP APCH operations to LNAV/VNAV minima using Baro VNAV:<\/p> <ol> <p> <\/p><p>(A) the pilot-in-command should not commence the approach when the aerodrome temperature is outside the promulgated aerodrome temperature limits for the procedure, unless the area navigation system is equipped with approved temperature compensation for the final approach;<\/p> <p><\/p> <p> <\/p><p>(B) when the temperature is within promulgated limits, the pilot-in-command should not make compensation to the altitude at the FAF; and<\/p> <p><\/p> <p> <\/p><p>(C) since only the final approach segment is protected by the promulgated aerodrome temperature limits, the pilot-in-command should consider the effect of temperature on terrain and obstacle clearance in other phases of flight.<\/p> <p><\/p> <\/ol> <p><\/p> <p> <\/p><p>(ii) For RNP APCH operations to LNAV minima using Baro VNAV:<\/p> <ol> <p> <\/p><p>(A) the pilot-in-command should consider the effect of temperature on terrain and obstacle clearance in all phases of flight, in particular on any step-down fix;<\/p> <p><\/p> <p> <\/p><p>(B) if the temperature is outside promulgated limits for RNP APCH to LNAV/VNAV minima, the pilot-in-command should not use a Baro VNAV function for vertical guidance, unless the area navigation system is equipped with approved temperature compensation for the final approach.<\/p> <p><\/p> <\/ol> <p><\/p> <\/ol> <p><\/p> <\/ol> <p>(e) Sensor and lateral navigation accuracy selection<\/p> <ol> <p> <\/p><p>(1) For multi-sensor systems, the pilot-in-command should verify, during the approach, that the GNSS sensor is used for position computation.<\/p> <p><\/p> <p> <\/p><p>(2) For aircraft with RNP input selection capability, the pilot-in-command should confirm that the indicated RNP value is appropriate for the PBN operation.<\/p> <p>&nbsp;<\/p> <p><\/p> <\/ol>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/3%20AMC/AMC2%20NCO%20OP%20116%20Performance.htm"},{"id":"x-AMC3-NCO-OP-116","kind":"AMC","label":"AMC3 NCO.OP.116","title":"AMC3 NCO.OP.116 Performance-based navigation – aeroplanes and helicopters","h":"<h3><a><\/a>AMC3 NCO.OP.116 Performance-based navigation – aeroplanes and helicopters&nbsp;&nbsp;&nbsp;&nbsp;<\/h3> <p>CAA ORS9 Decision No. 1<\/p> <p>MANAGAMENT OF THE NAVIGATION DATABASE<\/p> <p>(a) For RNAV 1, RNAV 2, RNP 1, RNP 2, and RNP APCH, the pilot-in-command should neither insert nor modify waypoints by manual entry into a procedure (departure, arrival or approach) that has been retrieved from the database. User-defined data may be entered and used for waypoint altitude/speed constraints on a procedure where said constraints are not included in the navigation database coding.<\/p> <p>(b) For RNP 4 operations, the pilot-in-command should not modify waypoints that have been retrieved from the database. User-defined data (e.g. for flex-track routes) may be entered and used.<\/p> <p>(c) The lateral and vertical definition of the flight path between the FAF and the missed approach point (MAPt) retrieved from the database should not be revised by the pilot-in-command.<\/p> <p>&nbsp;<\/p>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/3%20AMC/AMC3%20NCO%20OP%20116%20Performance.htm"},{"id":"x-AMC4-NCO-OP-116","kind":"AMC","label":"AMC4 NCO.OP.116","title":"AMC4 NCO.OP.116 Performance-based navigation – aeroplanes and helicopters","h":"<h3><a><\/a>AMC4 NCO.OP.116 Performance-based navigation – aeroplanes and helicopters&nbsp;&nbsp;&nbsp;&nbsp;<\/h3> <p>CAA ORS9 Decision No. 1<\/p> <p>DISPLAYS AND AUTOMATION<\/p> <p>(a) For RNAV 1, RNP 1, and RNP APCH operations, the pilot-in-command should use a lateral deviation indicator, and where available, flight director and/or autopilot in lateral navigation mode.<\/p> <p>(b) The appropriate displays should be selected so that the following information can be monitored:<\/p> <ol> <p> <\/p><p>(1) the computed desired path;<\/p> <p><\/p> <p> <\/p><p>(2) aircraft position relative to the lateral path (cross-track deviation) for FTE monitoring; and<\/p> <p><\/p> <p> <\/p><p>(3) aircraft position relative to the vertical path (for a 3D operation).<\/p> <p><\/p> <\/ol> <p>(c) The pilot-in-command of an aircraft with a lateral deviation indicator (e.g. CDI) should ensure that lateral deviation indicator scaling (full-scale deflection) is suitable for the navigation accuracy associated with the various segments of the procedure.<\/p> <p>(d) The pilot-in-command should maintain procedure centrelines unless authorised to deviate by ATC or demanded by emergency conditions.<\/p> <p>(e) Cross-track error/deviation (the difference between the area-navigation-system-computed path and the aircraft-computed position) should normally be limited to ± ½ time the RNAV/RNP value associated with the procedure. Brief deviations from this standard (e.g. overshoots or undershoots during and immediately after turns) up to a maximum of 1 time the RNAV/RNP value should be allowable.<\/p> <p>(f) For a 3D approach operation, the pilot-in-command should use a vertical deviation indicator and, where required by AFM/POH limitations, a flight director or autopilot in vertical navigation mode.<\/p> <p>(g) Deviations below the vertical path should not exceed 75 ft at any time, or half-scale deflection where angular deviation is indicated, and not more than 75 ft above the vertical profile, or half-scale deflection where angular deviation is indicated, at or below 1 000 ft above aerodrome level. The pilot-in-command should execute a missed approach if the vertical deviation exceeds this criterion, unless the pilot-in-command has in sight the visual references required to continue the approach.<\/p> <p>&nbsp;<\/p>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/3%20AMC/AMC4%20NCO%20OP%20116%20Performance.htm"},{"id":"x-AMC5-NCO-OP-116","kind":"AMC","label":"AMC5 NCO.OP.116","title":"AMC5 NCO.OP.116 Performance-based navigation – aeroplanes and helicopters","h":"<h3><a><\/a>AMC5 NCO.OP.116 Performance-based navigation – aeroplanes and helicopters&nbsp;&nbsp;&nbsp;&nbsp;<\/h3> <p>CAA ORS9 Decision No. 1<\/p> <p>VECTORING AND POSITIONING<\/p> <p>(a) ATC tactical interventions in the terminal area may include radar headings, ‘direct to’ clearances which bypass the initial legs of an approach procedure, interceptions of an initial or intermediate segments of an approach procedure or the insertion of additional waypoints loaded from the database.<\/p> <p>(b) In complying with ATC instructions, the pilot-in-command should be aware of the imp
