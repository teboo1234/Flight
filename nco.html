","title":"AMC1 NCO.IDE.H.165 Marking of break-in points","h":"<h3><a><\/a>AMC1 NCO.IDE.H.165 Marking of break-in points&nbsp;&nbsp;&nbsp;&nbsp;<\/h3> <p>CAA ORS9 Decision No. 1<\/p> <p>MARKINGS — COLOUR AND CORNERS<\/p> <p>(a) The colour of the markings should be red or yellow and, if necessary, should be outlined in white to contrast with the background.<\/p> <p>(b) If the corner markings are more than 2 m apart, intermediate lines 9 cm x 3 cm should be inserted so that there is no more than 2 m between adjacent markings.<\/p> <p>&nbsp;<\/p>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/3%20AMC/AMC1%20NCO%20IDE%20H%20165%20Marking.htm"}]},{"id":"r-NCO-IDE-H-170","ref":"NCO.IDE.H.170","title":"Emergency locator transmitter (ELT)","h":"<h1>NCO.IDE.H.170 Emergency locator transmitter (ELT) <\/h1> <div> <p>(a)&nbsp;Helicopters certified for a maximum passenger seating configuration above six shall be equipped with:<\/p> <p>(1)&nbsp;&nbsp;an automatic ELT; and<\/p> <p>(2)&nbsp;&nbsp;one survival ELT (ELT(S)) in a life-raft or life-jacket when the helicopter is operated at a distance from land corresponding to more than 3 minutes flying time at normal cruising speed.<\/p> <p>(b)&nbsp;Helicopters certified for a maximum passenger seating configuration of six or less shall be equipped with an ELT(S) or a personal locator beacon (PLB), carried by a crew member or a passenger.<\/p> <p>(c)&nbsp;ELTs of any type and PLBs shall be capable of transmitting simultaneously on 121,5 MHz and 406 MHz.<\/p> <p>&nbsp;<\/p> <\/div>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/2%20Regs/20990_NCOIDEH170_Emergency_locator_transmitter_ELT.htm","sub":[{"id":"x-AMC1-NCO-IDE-H-170","kind":"AMC","label":"AMC1 NCO.IDE.H.170","title":"AMC1 NCO.IDE.H.170 Emergency locator transmitter (ELT)","h":"<h3><a><\/a>AMC1 NCO.IDE.H.170 Emergency locator transmitter (ELT)&nbsp;&nbsp;&nbsp;&nbsp;<\/h3> <p>CAA ORS9 Decision No. 1<\/p> <p>BATTERIES<\/p> <p>(a) All batteries used in ELTs or PLBs should be replaced (or recharged, if the battery is rechargeable) when the equipment has been in use for more than 1 cumulative hour or in the following cases:<\/p> <ol> <p> <\/p><p>(1) Batteries specifically designed for use in ELTs and having an airworthiness release certificate (CAA Form 1 or equivalent) should be replaced (or recharged, if the battery is rechargeable) before the end of their useful life in accordance with the maintenance instructions applicable to the ELT.<\/p> <p><\/p> <p> <\/p><p>(2) Standard batteries manufactured in accordance with an industry standard and not having an airworthiness release certificate (CAA Form 1 or equivalent), when used in ELTs should be replaced (or recharged, if the battery is rechargeable) when 50 % of their useful life (or for rechargeable, 50 % of their useful life of charge), as established by the battery manufacturer, has expired.<\/p> <p><\/p> <p> <\/p><p>(3) All batteries used in PLBs should be replaced (or recharged, if the battery is rechargeable) when 50 % of their useful life (or for rechargeable, 50 % of their useful life of charge), as established by the battery manufacturer, has expired.<\/p> <p><\/p> <p> <\/p><p>(4) The battery useful life (or useful life of charge) criteria in (1), (2) and (3) do not apply to batteries (such as water-activated batteries) that are essentially unaffected during probable storage intervals.<\/p> <p><\/p> <\/ol> <p>(b) The new expiry date for a replaced (or recharged) battery should be legibly marked on the outside of the equipment.<\/p> <p>&nbsp;<\/p>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/3%20AMC/AMC1%20NCO%20IDE%20H%20170%20Emergency.htm"},{"id":"x-AMC2-NCO-IDE-H-170","kind":"AMC","label":"AMC2 NCO.IDE.H.170","title":"AMC2 NCO.IDE.H.170 Emergency locator transmitter (ELT)","h":"<h3><a><\/a>AMC2 NCO.IDE.H.170 Emergency locator transmitter (ELT)&nbsp;&nbsp;&nbsp;&nbsp;<\/h3> <p>CAA&nbsp;ORS9 Decision No. 45<\/p> <p>TYPES OF ELT AND GENERAL TECHNICAL SPECIFICATIONS<\/p> <ol> <li value=\"1\"> <p>The ELT required by this provision should be one of the following:<\/p> <ol> <li value=\"1\"> <p>Automatic fixed (ELT(AF)). An automatically activated ELT that is permanently attached to an aircraft and is designed to aid SAR teams in locating the crash site.<\/p> <\/li> <li value=\"2\"> <p>Automatic portable (ELT(AP)). An automatically activated ELT that is rigidly attached to an aircraft before a crash, but is readily removable from the aircraft after a crash. It functions as an ELT during the crash sequence. If the ELT does not employ an integral antenna, the aircraft-mounted antenna may be disconnected and an auxiliary antenna (stored on the ELT case) attached to the ELT. The ELT can be tethered to a survivor or a life-raft. This type of ELT is intended to aid SAR teams in locating the crash site or survivor(s).<\/p> <\/li> <li value=\"3\"> <p>Automatic deployable (ELT(AD)). An ELT that is rigidly attached to the aircraft before the crash and that is automatically deployed and activated by an impact, and, in some cases, also by water sensors. This type of ELT should float in water and is intended to aid SAR teams in locating the crash site. The ELT(AD) may be either a stand‑alone beacon or an inseparable part of a deployable recorder.<\/p> <\/li> <li value=\"4\"> <p>Survival ELT (ELT(S)). An ELT that is removable from an aircraft, stowed so as to facilitate its ready use in an emergency, and manually activated by a survivor. An ELT(S) may be activated manually or automatically (e.g. by water activation). It should be designed either to be tethered to a life‑raft or a survivor. A water‑activated ELT(S) is not an ELT(AP).<\/p> <\/li> <\/ol> <\/li> <li value=\"2\"> <p>To minimise the possibility of damage in the event of crash impact, the automatic ELT should be rigidly fixed to the aircraft structure, as far aft as is practicable, with its antenna and connections arranged so as to maximise the probability of the signal being transmitted after a crash.<\/p> <\/li> <li value=\"3\"> <p>Any ELT carried should operate in accordance with the relevant provisions of ICAO Annex&nbsp;10, Volume&nbsp;III, and should be registered with the national agency responsible for initiating search and rescue or other nominated agency.<\/p> <\/li> <\/ol> <p>&nbsp;<\/p>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/3%20AMC/AMC2%20NCO%20IDE%20H%20170%20Emergency.htm"},{"id":"x-AMC3-NCO-IDE-H-170","kind":"AMC","label":"AMC3 NCO.IDE.H.170","title":"AMC3 NCO.IDE.H.170 Emergency locator transmitter (ELT)","h":"<h3><a><\/a>AMC3 NCO.IDE.H.170 Emergency locator transmitter (ELT)&nbsp;&nbsp;&nbsp;&nbsp;<\/h3> <p>CAA ORS9 Decision No. 1<\/p> <p>PLB TECHNICAL SPECIFICATIONS<\/p> <p>(a) A personal locator beacon (PLB) should have a built-in GNSS receiver with a cosmicheskaya sistyema poiska avariynich sudov — search and rescue satellite-aided tracking (COSPAS- SARSAT) type approval number. However, devices with a COSPAS-SARSAT number belonging to series 700 are excluded as this series of numbers identifies the special-use beacons not meeting all the technical requirements and all the tests specified by COSPAS-SARSAT.<\/p> <p>(b) Any PLB carried should be registered with the national agency responsible for initiating search and rescue or other nominated agency.<\/p> <p>&nbsp;<\/p>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/3%20AMC/AMC3%20NCO%20IDE%20H%20170%20Emergency.htm"},{"id":"x-AMC4-NCO-IDE-H-170","kind":"AMC","label":"AMC4 NCO.IDE.H.170","title":"AMC4 NCO.IDE.H.170 Emergency locator transmitter (ELT)","h":"<h3><a><\/a>AMC4 NCO.IDE.H.170 Emergency locator transmitter (ELT)&nbsp;&nbsp;&nbsp;&nbsp;<\/h3> <p>CAA ORS9 Decision No. 1<\/p> <p>BRIEFING ON PLB USE<\/p> <p>When a PLB is carried by a passenger, he/she should be briefed on its characteristics and use by the pilot-in-command before the flight.<\/p> <p>&nbsp;<\/p>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/3%20AMC/AMC4%20NCO%20IDE%20H%20170%20Emergency.htm"},{"id":"x-GM1-NCO-IDE-H-170","kind":"GM","label":"GM1 NCO.IDE.H.170","title":"GM1 NCO.IDE.H.170 Emergency locator transmitter (ELT)","h":"<h4><a><\/a>GM1 NCO.IDE.H.170 Emergency locator transmitter (ELT)&nbsp;&nbsp;&nbsp;&nbsp;<\/h4> <p>CAA&nbsp;ORS9 Decision No. 45<\/p> <p>TERMINOLOGY<\/p> <p>GM1 CAT.IDE.H.280 contains explanations of terms used in point NCO.IDE.H.170 and in the related AMC.<\/p> <p>&nbsp;<\/p>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/4%20GM/GM1%20NCO%20IDE%20H%20170%20Emergency.htm"}]},{"id":"r-NCO-IDE-H-175","ref":"NCO.IDE.H.175","title":"Flight over water","h":"<h1>NCO.IDE.H.175 Flight over water <\/h1> <div> <p>(a)&nbsp;Helicopters shall be equipped with a life-jacket for each person on board or equivalent individual flotation device for each person on board younger than 24 months, which shall be worn or stowed in a position that is readily accessible from the seat or berth of the person for whose use it is provided, when:<\/p> <p>(1)&nbsp;&nbsp;flying over water beyond autorotational distance from land where in case of the critical engine failure, the helicopter is not able to sustain level flight; or<\/p> <p>(2)&nbsp;&nbsp;flying over water at a distance of land corresponding to more than 10 minutes flying at normal cruising speed, where in case of the critical engine failure, the helicopter is able to sustain level flight; or<\/p> <p>(3)&nbsp;&nbsp;taking off or landing at an aerodrome/operating site where the take-off or approach path is over water.<\/p> <p>(b)&nbsp;Each life-jacket or equivalent individual flotation device shall be equipped with a means of electric illumination for the purpose of facilitating the location of persons.<\/p> <p>(c)&nbsp;The pilot-in-command of a helicopter operated on a flight over water at a distance from land corresponding to more than 30 minutes flying time at normal cruising speed or 50 NM, whichever is less, shall determine the risks to survival of the occupants of the helicopter in the event of a ditching, based on which he/she shall determine the carriage of:<\/p> <p>(1)&nbsp;&nbsp;equipment for making the distress signals;<\/p> <p>(2)&nbsp;&nbsp;life-rafts in sufficient numbers to carry all persons on board, stowed so as to facilitate their ready use in emergency; and<\/p> <p>(3)&nbsp;&nbsp;life-saving equipment, to provide the means of sustaining life, as appropriate to the flight to be undertaken.<\/p> <p>(d)&nbsp;The pilot-in-command shall determine the risks to survival of the occupants of the helicopter in the event of a ditching, when deciding if the life-jackets required in (a) shall be worn by all occupants.<\/p> <p>&nbsp;<\/p> <\/div>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/2%20Regs/21020_NCOIDEH175_Flight_over_water.htm","sub":[{"id":"x-AMC1-NCO-IDE-H-175","kind":"AMC","label":"AMC1 NCO.IDE.H.175","title":"AMC1 NCO.IDE.H.175 Flight over water","h":"<h3><a><\/a>AMC1 NCO.IDE.H.175 Flight over water&nbsp;&nbsp;&nbsp;&nbsp;<\/h3> <p>CAA ORS9 Decision No. 1<\/p> <p>ACCESSIBILITY OF LIFE-JACKETS<\/p> <p>The life-jacket, if not worn, should be accessible from the seat or berth of the person for whose use it is provided, with a safety belt or a restraint system fastened.<\/p> <p>RISK ASSESSMENT<\/p> <p>(a) When conducting the risk assessment, the pilot-in-command should base his/her decision, as far as is practicable, on the Implementing Rules and AMCs applicable to the operation of the helicopter.<\/p> <p>(b) The pilot-in-command should, for determining the risk, take the following operating environment and conditions into account:<\/p> <ol> <p> <\/p><p>(1) sea state;<\/p> <p><\/p> <p> <\/p><p>(2) sea and air temperatures;<\/p> <p><\/p> <p> <\/p><p>(3) the distance from land suitable for making an emergency landing; and<\/p> <p><\/p> <p> <\/p><p>(4) the availability of search and rescue facilities.<\/p> <p>&nbsp;<\/p> <p><\/p> <\/ol>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/3%20AMC/AMC1%20NCO%20IDE%20H%20175%20Flight.htm"},{"id":"x-GM1-NCO-IDE-H-175","kind":"GM","label":"GM1 NCO.IDE.H.175","title":"GM1 NCO.IDE.H.175 Flight over water","h":"<h4><a><\/a>GM1 NCO.IDE.H.175 Flight over water&nbsp;&nbsp;&nbsp;&nbsp;<\/h4> <p>CAA ORS9 Decision No. 1<\/p> <p>SEAT CUSHIONS<\/p> <p>Seat cushions are not considered to be flotation devices.<\/p> <p>&nbsp;<\/p>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/4%20GM/GM1%20NCO%20IDE%20H%20175%20Flight%20over.htm"}]},{"id":"r-NCO-IDE-H-180","ref":"NCO.IDE.H.180","title":"Survival equipment","h":"<h1>NCO.IDE.H.180 Survival equipment <\/h1> <div> <p>Helicopters, operated over areas in which search and rescue would be especially difficult, shall be equipped with such signalling devices and life-saving equipment, including means of sustaining life, as may be appropriate to the area overflown.<\/p> <p>&nbsp;<\/p> <\/div>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/2%20Regs/21050_NCOIDEH180_Survival_equipment.htm","sub":[{"id":"x-AMC1-NCO-IDE-H-180","kind":"AMC","label":"AMC1 NCO.IDE.H.180","title":"AMC1 NCO.IDE.H.180 Survival equipment","h":"<h3><a><\/a>AMC1 NCO.IDE.H.180 Survival equipment&nbsp;&nbsp;&nbsp;&nbsp;<\/h3> <p>CAA ORS9 Decision No. 1<\/p> <p>GENERAL<\/p> <p>Helicopters operated across areas in which search and rescue would be especially difficult should be equipped with the following:<\/p> <p>(a) signalling equipment to make the distress signals;<\/p> <p>(b) at least one ELT(S) or a PLB, carried by the pilot-in-command or a passenger; and<\/p> <p>(c) additional survival equipment for the route to be flown taking account of the number of persons on board.<\/p> <p>&nbsp;<\/p>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/3%20AMC/AMC1%20NCO%20IDE%20H%20180%20Survival.htm"},{"id":"x-AMC2-NCO-IDE-H-180","kind":"AMC","label":"AMC2 NCO.IDE.H.180","title":"AMC2 NCO.IDE.H.180 Survival equipment","h":"<h3><a><\/a>AMC2 NCO.IDE.H.180 Survival equipment&nbsp;&nbsp;&nbsp;&nbsp;<\/h3> <p>CAA ORS9 Decision No. 1<\/p> <p>ADDITIONAL SURVIVAL EQUIPMENT<\/p> <p>(a) The following additional survival equipment should be carried when required:<\/p> <ol> <p> <\/p><p>(1) 500 ml of water for each four, or fraction of four, persons on board;<\/p> <p><\/p> <p> <\/p><p>(2) one knife;<\/p> <p><\/p> <p> <\/p><p>(3) first-aid equipment; and<\/p> <p><\/p> <p> <\/p><p>(4) one set of air/ground codes.<\/p> <p><\/p> <\/ol> <p>(b) If any item of equipment contained in the above list is already carried on board the helicopter in accordance with another requirement, there is no need for this to be duplicated.<\/p> <p>&nbsp;<\/p>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/3%20AMC/AMC2%20NCO%20IDE%20H%20180%20Survival.htm"},{"id":"x-GM1-NCO-IDE-H-180","kind":"GM","label":"GM1 NCO.IDE.H.180","title":"GM1 NCO.IDE.H.180 Survival equipment","h":"<h4><a><\/a>GM1 NCO.IDE.H.180 Survival equipment&nbsp;&nbsp;&nbsp;&nbsp;<\/h4> <p>CAA ORS9 Decision No. 1<\/p> <p>SIGNALLING EQUIPMENT<\/p> <p>The signalling equipment for making distress signals is described in ICAO Annex 2, Rules of the Air.<\/p> <p>&nbsp;<\/p>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/4%20GM/GM1%20NCO%20IDE%20H%20180%20Survival.htm"},{"id":"x-GM2-NCO-IDE-H-180","kind":"GM","label":"GM2 NCO.IDE.H.180","title":"GM2 NCO.IDE.H.180 Survival equipment","h":"<h4><a><\/a>GM2 NCO.IDE.H.180 Survival equipment&nbsp;&nbsp;&nbsp;&nbsp;<\/h4> <p>CAA ORS9 Decision No. 1<\/p> <p>AREAS IN WHICH SEARCH AND RESCUE WOULD BE ESPECIALLY DIFFICULT<\/p> <p>The expression ‘areas in which search and rescue would be especially difficult’ should be interpreted, in this context, as meaning:<\/p> <p>(a) areas so designated by the authority responsible for managing search and rescue; or<\/p> <p>(b) areas that are largely uninhabited and where:<\/p> <ol> <p> <\/p><p>(1) the authority referred to in (a) has not published any information to confirm whether search and rescue would be or would not be especially difficult; and<\/p> <p><\/p> <p> <\/p><p>(2) the authority referred to in (a) does not, as a matter of policy, designate areas as being especially difficult for search and rescue.<\/p> <p>&nbsp;<\/p> <p><\/p> <\/ol>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/4%20GM/GM2%20NCO%20IDE%20H%20180%20Survival.htm"}]},{"id":"r-NCO-IDE-H-185","ref":"NCO.IDE.H.185","title":"All helicopters on flights over water — ditching","h":"<h1>NCO.IDE.H.185 All helicopters on flights over water — ditching <\/h1> <div> <p>Helicopters flying over water in a hostile environment beyond a distance of 50 NM from land shall be either of the following:<\/p> <p>(a)&nbsp;designed for landing on water in accordance with the relevant certification specifications;<\/p> <p>(b)&nbsp;certified for ditching in accordance with the relevant certification specifications;<\/p> <p>(c)&nbsp;fitted with emergency flotation equipment.<\/p> <p>&nbsp;<\/p> <\/div>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/2%20Regs/21080_NCOIDEH185_All_helicopters_on_flights_over_water_ditching.htm","sub":[{"id":"x-AMC1-NCO-IDE-H-185","kind":"AMC","label":"AMC1 NCO.IDE.H.185","title":"AMC1 NCO.IDE.H.185 All helicopters on flights over water – ditching","h":"<h3><a><\/a>AMC1 NCO.IDE.H.185 All helicopters on flights over water – ditching<\/h3> <p>CAA ORS9 Decision No. 1<\/p> <p>The considerations of AMC1 SPA.HOFO.165(d) should apply in respect of emergency flotation equipment.<\/p> <p>&nbsp;<\/p>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/3%20AMC/AMC1%20NCO%20IDE%20H%20185%20All%20helicopters.htm"}]},{"id":"r-NCO-IDE-H-190","ref":"NCO.IDE.H.190","title":"Radio communication equipment","h":"<h1>NCO.IDE.H.190 Radio communication equipment <\/h1> <div> <p>(a)&nbsp;Where required by the airspace being flown helicopters shall be equipped with radio communication equipment capable of conducting two-way communication with those aeronautical stations and on those frequencies to meet airspace requirements.<\/p> <p>(b)&nbsp;Radio communication equipment, if required by (a), shall provide for communication on the aeronautical emergency frequency 121,5 MHz.<\/p> <p>(c)&nbsp;When more than one communications equipment unit is required, each shall be independent of the other or others to the extent that a failure in any one will not result in failure of any other.<\/p> <p>(d)&nbsp;When a radio communication system is required, and in addition to the flight crew interphone system required in NCO.IDE.H.135, helicopters shall be equipped with a transmit button on the flight controls for each required pilot and/or crew member at his/her working station.<\/p> <p>&nbsp;<\/p> <\/div>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/2%20Regs/21110_NCOIDEH190_Radio_communication_equipment.htm","sub":[]},{"id":"r-NCO-IDE-H-195","ref":"NCO.IDE.H.195","title":"Navigation equipment","h":"<h1>NCO.IDE.H.195 Navigation equipment <\/h1> <div> <p>(a)&nbsp;Helicopters operated over routes that cannot be navigated by reference to visual landmarks shall be equipped with navigation equipment that will enable them to proceed in accordance with:<\/p> <p>(1)&nbsp;&nbsp;the ATS flight plan, if applicable; and<\/p> <p>(2)&nbsp;&nbsp;the applicable airspace requirements.<\/p> <p>(b)&nbsp;Helicopters shall have sufficient navigation equipment to ensure that, in the event of the failure of one item of equipment at any stage of the flight, the remaining equipment shall allow safe navigation in accordance with (a), or an appropriate contingency action, to be completed safely.<\/p> <p>(c)&nbsp;Helicopters operated on flights in which it is intended to land in IMC shall be equipped with navigation equipment capable of providing guidance to a point from which a visual landing can be performed. This equipment shall be capable of providing such guidance for each aerodrome at which is intended to land in IMC and for any designated alternate aerodromes.<\/p> <p>(d)&nbsp;For PBN operations the aircraft shall meet the airworthiness certification requirements for the appropriate navigation specification.<\/p> <p>(e)&nbsp;Helicopters shall be equipped with surveillance equipment in accordance with the applicable airspace requirements.<\/p> <p>&nbsp;<\/p> <\/div>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/2%20Regs/21140_NCOIDEH195_Navigation_equipment.htm","sub":[{"id":"x-AMC1-NCO-IDE-H-195","kind":"AMC","label":"AMC1 NCO.IDE.H.195","title":"AMC1 NCO.IDE.H.195 Navigation equipment","h":"<h3><a><\/a>AMC1 NCO.IDE.H.195 Navigation equipment&nbsp;&nbsp;&nbsp;&nbsp;<\/h3> <p>CAA ORS9 Decision No. 1<\/p> <p>NAVIGATION WITH VISUAL REFERENCE TO LANDMARKS<\/p> <p>Where helicopters, with the surface in sight, can proceed according to the ATS flight plan by navigation with visual reference to landmarks, no additional equipment is needed to comply NCO.IDE.H.195(a)(1).<\/p> <p>&nbsp;<\/p>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/3%20AMC/AMC1%20NCO%20IDE%20H%20195%20Navigation.htm"},{"id":"x-AMC1-NCO-IDE-H-195-a","kind":"AMC","label":"AMC1 NCO.IDE.H.195(a)","title":"AMC1 NCO.IDE.H.195(a) Navigation equipment","h":"<h3>AMC1 NCO.IDE.H.195(a) Navigation equipment<\/h3> <p>CAA ORS9 Decision No. 47<\/p> <p>NAVIGATION EQUIPMENT — RNAV SUBSTITUTION<\/p> <p>An RNAV system may be used to substitute for conventional navigation aids and radio equipment, without monitoring of the raw data from conventional navigation aids, under the conditions defined in AMC1&nbsp;NCO.IDE.A.195(a).<\/p> <p>&nbsp;<\/p>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/3%20AMC/AMC1%20NCO%20IDE%20H%20195%20a%20Navigation.htm"},{"id":"x-AMC1-NCO-IDE-H-195-b","kind":"AMC","label":"AMC1 NCO.IDE.H.195(b)","title":"AMC1 NCO.IDE.H.195(b) Navigation equipment","h":"<h3>AMC1 NCO.IDE.H.195(b) Navigation equipment<\/h3> <p>CAA ORS9 Decision No. 47<\/p> <p>APPROPRIATE CONTINGENCY ACTION<\/p> <ol> <li value=\"1\"> <p>An appropriate contingency action is an alternative offered in NCO.IDE.H.195(b) to completion of the planned flight to a safe landing, either at the planned destination or a destination alternate, using normal procedures and using navigation equipment meeting the requirements of NCO.IDE.H.100, installed for redundancy or as a backup. <\/p> <\/li> <li value=\"2\"> <p>The contingency action should be considered before flight and take into account the information identified by flight preparation according to NCO.OP.135. It may depend on the flight and availability of navigation solutions (satellites, ground navaids, etc.) and weather conditions (IMC, VMC) along the flight.<\/p> <\/li> <li value=\"3\"> <p>The contingency action addresses partial loss of navigation capability. An appropriate contingency action to meet the requirements of NCO.IDE.H.195(b) does not rely on the performance of any function of the item of equipment whose potential failure is being considered. For example, in considering the failure of a VOR/LOC/DME receiver, none of the functions of that receiver should be relied upon in the contingency action.<\/p> <\/li> <li value=\"4\"> <p>Examples of contingency actions include:<\/p> <p>— seeking navigational assistance from ATS, using communication, navigation and surveillance systems that remain operational, to enable a safe instrument approach or a safe descent to VMC;&nbsp;and<\/p> <p>— unusually long periods of dead reckoning.<\/p> <\/li> <li value=\"5\"> <p>A contingency action is required such that the failure of one item of navigation equipment has a reasonable likelihood of a safe outcome to the flight, consistent with other risks to which the operation is exposed.<\/p> <\/li> <\/ol> <p>&nbsp;<\/p>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/3%20AMC/AMC1%20NCO%20IDE%20H%20195%20b%20Navigation.htm"},{"id":"x-GM1-NCO-IDE-H-195","kind":"GM","label":"GM1 NCO.IDE.H.195","title":"GM1 NCO.IDE.H.195 Navigation equipment","h":"<h4><a><\/a>GM1 NCO.IDE.H.195 Navigation equipment&nbsp;&nbsp;&nbsp;&nbsp;<\/h4> <p>CAA ORS9 Decision No. 1<\/p> <p>APPLICABLE AIRSPACE REQUIREMENTS<\/p> <p>For helicopters being operated under European air traffic control, the applicable airspace requirements include the Single European Sky legislation.<\/p> <p>&nbsp;<\/p>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/4%20GM/GM1%20NCO%20IDE%20H%20195%20Navigation.htm"},{"id":"x-GM2-NCO-IDE-H-195","kind":"GM","label":"GM2 NCO.IDE.H.195","title":"GM2 NCO.IDE.H.195 Navigation equipment","h":"<h4><a><\/a>GM2 NCO.IDE.H.195 Navigation equipment&nbsp;&nbsp;&nbsp;&nbsp;<\/h4> <p>CAA ORS9 Decision No. 1<\/p> <p>AIRCRAFT ELIGIBILITY FOR PBN SPECIFICATION NOT REQUIRING SPECIFIC APPROVAL<\/p> <p>(a) The performance of the aircraft is usually stated in the AFM/POH.<\/p> <p>(b) Where such a reference cannot be found in the AFM/POH, other information provided by the aircraft manufacturer as TC holder, the STC holder or the design organisation having a privilege to approve minor changes may be considered.<\/p> <p>(c) The following documents are considered acceptable sources of information:<\/p> <ol> <p> <\/p><p>(1) AFM/POH, supplements thereto, and documents directly referenced in the AFM/POH;<\/p> <p><\/p> <p> <\/p><p>(2) FCOM or similar document;<\/p> <p><\/p> <p> <\/p><p>(3) Service Bulletin or Service Letter issued by the TC holder or STC holder;<\/p> <p><\/p> <p> <\/p><p>(4) approved design data or data issued in support of a design change approval;<\/p> <p><\/p> <p> <\/p><p>(5) any other formal document issued by the TC or STC holders stating compliance with PBN specifications, AMC, Advisory Circulars (AC) or similar documents issued by the State of Design; and<\/p> <p><\/p> <p> <\/p><p>(6) written evidence obtained from the State of Design.<\/p> <p><\/p> <\/ol> <p>(d) Equipment qualification data, in itself, is not sufficient to assess the PBN capabilities of the aircraft, since the latter depend on installation and integration.<\/p> <p>(e) As some PBN equipment and installations may have been certified prior to the publication of the PBN Manual and the adoption of its terminology for the navigation specifications, it is not always possible to find a clear statement of aircraft PBN capability in the AFM/POH. However, aircraft eligibility for certain PBN specifications can rely on the aircraft performance certified for PBN procedures and routes prior to the publication of the PBN Manual.<\/p> <p>(f) Below, various references are listed which may be found in the AFM/POH or other acceptable documents (see listing above) in order to consider the aircraft’s eligibility for a specific PBN specification if the specific term is not used.<\/p> <p>(g) RNAV 5<\/p> <ol> <p> <\/p><p>(1) If a statement of compliance with any of the following specifications or standards is found in the acceptable documentation as listed above, the aircraft is eligible for RNAV 5 operations.<\/p> <ol> <p> <\/p><p>(i) B-RNAV;<\/p> <p><\/p> <p> <\/p><p>(ii) RNAV 1;<\/p> <p><\/p> <p> <\/p><p>(iii) RNP APCH;<\/p> <p><\/p> <p> <\/p><p>(iv) RNP 4;<\/p> <p><\/p> <p> <\/p><p>(v) A-RNP;<\/p> <p><\/p> <p> <\/p><p>(vi) AMC 20-4;<\/p> <p><\/p> <p> <\/p><p>(vii) JAA TEMPORARY GUIDANCE MATERIAL, LEAFLET NO. 2 (TGL 2)<\/p> <p><\/p> <p> <\/p><p>(viii) JAA AMJ 20X2;<\/p> <p><\/p> <p> <\/p><p>(ix) FAA AC 20-130A for en route operations;<\/p> <p><\/p> <p> <\/p><p>(x) FAA AC 20-138 for en route operations; and<\/p> <p><\/p> <p> <\/p><p>(xi) FAA AC 90-96.<\/p> <p><\/p> <\/ol> <p><\/p> <\/ol> <p>(h) RNAV 1/RNAV 2<\/p> <ol> <p> <\/p><p>(1) If a statement of compliance with any of the following specifications or standards is found in the acceptable documentation as listed above, the aircraft is eligible for RNAV 1/RNAV 2 operations.<\/p> <ol> <p> <\/p><p>(i) RNAV 1;<\/p> <p><\/p> <p> <\/p><p>(ii) PRNAV;<\/p> <p><\/p> <p> <\/p><p>(iii) US RNAV type A;<\/p> <p><\/p> <p> <\/p><p>(iv) FAA AC 20-138 for the appropriate navigation specification;<\/p> <p><\/p> <p> <\/p><p>(v) FAA AC 90-100A;<\/p> <p><\/p> <p> <\/p><p>(vi) JAA TEMPORARY GUIDANCE MATERIAL, LEAFLET NO. 10 Rev1 (TGL 10); and<\/p> <p><\/p> <p> <\/p><p>(vii) FAA AC 90-100.<\/p> <p><\/p> <\/ol> <p><\/p> <p> <\/p><p>(2) However, if position determination is exclusively computed based on VOR-DME, the aircraft is not eligible for RNAV 1/RNAV 2 operations.<\/p> <p><\/p> <\/ol> <p>(i) RNP 1/RNP 2 continental<\/p> <ol> <p> <\/p><p>(1) If a statement of compliance with any of the following specifications or standards is found in the acceptable documentation as listed above, the aircraft is eligible for RNP 1/RNP 2 continental operations.<\/p> <ol> <p> <\/p><p>(i) A-RNP;<\/p> <p><\/p> <p> <\/p><p>(ii) FAA AC 20-138 for the appropriate navigation specification; and<\/p> <p><\/p> <p> <\/p><p>(iii) FAA AC 90-105.<\/p> <p><\/p> <\/ol> <p><\/p> <p> <\/p><p>(2) Alternatively, if a statement of compliance with any of the following specifications or standards is found in the acceptable documentation as listed above and position determination is primarily based on GNSS, the aircraft is eligible for RNP 1/RNP 2 continental operations. However, in these cases, loss of GNSS implies loss of RNP 1/RNP 2 capability.<\/p> <ol> <p> <\/p><p>(i) JAA TEMPORARY GUIDANCE MATERIAL, LEAFLET NO. 10 (TGL 10) (any revision); and<\/p> <p><\/p> <p> <\/p><p>(ii) FAA AC 90-100.<\/p> <p><\/p> <\/ol> <p><\/p> <\/ol> <p>(j) RNP APCH — LNAV minima<\/p> <ol> <p> <\/p><p>(1) If a statement of compliance with any of the following specifications or standards is found in the acceptable documentation as listed above, the aircraft is eligible for RNP APCH — LNAV operations.<\/p> <ol> <p> <\/p><p>(i) A-RNP;<\/p> <p><\/p> <p> <\/p><p>(ii) AMC 20-27;<\/p> <p><\/p> <p> <\/p><p>(iii) AMC 20-28;<\/p> <p><\/p> <p> <\/p><p>(iv) FAA AC 20-138 for the appropriate navigation specification; and<\/p> <p><\/p> <p> <\/p><p>(v) FAA AC 90-105 for the appropriate navigation specification.<\/p> <p><\/p> <\/ol> <p><\/p> <p> <\/p><p>(2) Alternatively, if a statement of compliance with RNP 0.3 GNSS approaches in accordance with any of the following specifications or standards is found in the acceptable documentation as listed above, the aircraft is eligible for RNP APCH — LNAV operations. Any limitation such as ‘within the US National Airspace’ may be ignored since RNP APCH procedures are assumed to meet the same ICAO criteria around the world.<\/p> <ol> <p> <\/p><p>(i) JAA TEMPORARY GUIDANCE MATERIAL, LEAFLET NO. 3 (TGL 3);<\/p> <p><\/p> <p> <\/p><p>(ii) AMC 20-4;<\/p> <p><\/p> <p> <\/p><p>(iii) FAA AC 20-130A; and<\/p> <p><\/p> <p> <\/p><p>(iv) FAA AC 20-138.<\/p> <p><\/p> <\/ol> <p><\/p> <\/ol> <p>(k) RNP APCH — LNAV/VNAV minima<\/p> <ol> <p> <\/p><p>(1) If a statement of compliance with any of the following specifications or standards is found in the acceptable documentation as listed above, the aircraft is eligible for RNP APCH — LNAV/VNAV operations.<\/p> <ol> <p> <\/p><p>(i) A-RNP;<\/p> <p><\/p> <p> <\/p><p>(ii) AMC 20-27 with Baro VNAV;<\/p> <p><\/p> <p> <\/p><p>(iii) AMC 20-28;<\/p> <p><\/p> <p> <\/p><p>(iv) FAA AC 20-138; and<\/p> <p><\/p> <p> <\/p><p>(v) FAA AC 90-105 for the appropriate navigation specification.<\/p> <p><\/p> <\/ol> <p><\/p> <p> <\/p><p>(2) Alternatively, if a statement of compliance with FAA AC 20-129 is found in the acceptable documentation as listed above, and the aircraft complies with the requirements and limitations of EASA SIB 2014-04, the aircraft is eligible for RNP APCH — LNAV/VNAV operations. Any limitation such as ‘within the US National Airspace’ may be ignored since RNP APCH procedures are assumed to meet the same ICAO criteria around the world.<\/p> <p><\/p> <\/ol> <p>(l) RNP APCH — LPV minima<\/p> <ol> <p> <\/p><p>(1) If a statement of compliance with any of the following specifications or standards is found in the acceptable documentation as listed above, the aircraft is eligible for RNP APCH — LPV operations.<\/p> <p>(i)&nbsp;&nbsp;&nbsp;&nbsp;AMC 20-28;<\/p> <p><\/p> <\/ol> <ol> <p> <\/p><p>(ii) FAA AC 20-138 for the appropriate navigation specification; and<\/p> <p><\/p> <p> <\/p><p>(iii) FAA AC 90-107.<\/p> <p>(2) For aircraft that have a TAWS Class A installed and do not provide Mode-5 protection on an LPV approach, the DH is limited to 250 ft.<\/p> <p><\/p> <\/ol> <p>(m) RNAV 10<\/p> <ol> <p> <\/p><p>(1) If a statement of compliance with any of the following specifications or standards is found in the acceptable documentation as listed above, the aircraft is eligible for RNAV 10 operations.<\/p> <ol> <p> <\/p><p>(i) RNP 10;<\/p> <p><\/p> <p> <\/p><p>(ii) FAA AC 20-138 for the appropriate navigation specification;<\/p> <p><\/p> <p> <\/p><p>(iii) AMC 20-12;<\/p> <p><\/p> <p> <\/p><p>(iv) FAA Order 8400.12 (or later revision); and<\/p> <p><\/p> <p> <\/p><p>(v) FAA AC 90-105.<\/p> <p><\/p> <p> <\/p><p>(vi) <\/p> <p><\/p> <\/ol> <p><\/p> <\/ol> <p>(n) RNP 4<\/p> <ol> <p> <\/p><p>(1) If a statement of compliance with any of the following specifications or standards is found in the acceptable documentation as listed above, the aircraft is eligible for RNP 4 operations.<\/p> <ol> <p> <\/p><p>(i) FAA AC 20-138B or later, for the appropriate navigation specification;<\/p> <p><\/p> <p> <\/p><p>(ii) FAA Order 8400.33; and<\/p> <p><\/p> <p> <\/p><p>(iii) FAA AC 90-105 for the appropriate navigation specification.<\/p> <p><\/p> <\/ol> <p><\/p> <\/ol> <p>(o) RNP 2 oceanic<\/p> <ol> <p> <\/p><p>(1) If a statement of compliance with FAA AC 90-105 for the appropriate navigation specification is found in the acceptable documentation as listed above, the aircraft is eligible for RNP 2 oceanic operations.<\/p> <p><\/p> <p> <\/p><p>(2) If the aircraft has been assessed eligible for RNP 4, the aircraft is eligible for RNP 2 oceanic.<\/p> <p><\/p> <\/ol> <p>(p) Special features<\/p> <ol> <p> <\/p><p>(1) RF in terminal operations (used in RNP 1 and in the initial segment of the RNP APCH)<\/p> <ol> <p> <\/p><p>(i) If a statement of demonstrated capability to perform an RF leg, certified in accordance with any of the following specifications or standards, is found in the acceptable documentation as listed above, the aircraft is eligible for RF in terminal operations:<\/p> <ol> <p> <\/p><p>(A) AMC 20-26; and<\/p> <p><\/p> <p> <\/p><p>(B) FAA AC 20-138B or later.<\/p> <p><\/p> <\/ol> <p><\/p> <p> <\/p><p>(ii) If there is a reference to RF and a reference to compliance with AC 90-105, then the aircraft is eligible for such operations.<\/p> <p><\/p> <\/ol> <p><\/p> <\/ol> <p>(q) Other considerations<\/p> <ol> <p> <\/p><p>(1) In all cases, the limitations in the AFM/POH need to be checked, in particular the use of AP or FD which can be required to reduce the FTE primarily for RNP APCH, RNAV 1, and RNP 1.<\/p> <p><\/p> <p> <\/p><p>(2) Any limitation such as ‘within the US National Airspace’ may be ignored since RNP APCH procedures are assumed to meet the same ICAO criteria around the world.<\/p> <p>&nbsp;<\/p> <p><\/p> <\/ol>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/4%20GM/GM2%20NCO%20IDE%20H%20195%20Navigation.htm"},{"id":"x-GM3-NCO-IDE-H-195","kind":"GM","label":"GM3 NCO.IDE.H.195","title":"GM3 NCO.IDE.H.195 Navigation equipment","h":"<h4><a><\/a>GM3 NCO.IDE.H.195 Navigation equipment&nbsp;&nbsp;&nbsp;&nbsp;<\/h4> <p>CAA ORS9 Decision No. 1<\/p> <p>GENERAL<\/p> <p>(a) The PBN specifications for which the aircraft complies with the relevant airworthiness criteria are set out in the AFM/POH, together with any limitations to be observed.<\/p> <p>(b) Because functional and performance requirements are defined for each navigation specification, an aircraft approved for an RNP specification is not automatically approved for all RNAV specifications. Similarly, an aircraft approved for an RNP or RNAV specification having a stringent accuracy requirement (e.g. RNP 0.3 specification) is not automatically approved for a navigation specification having a less stringent accuracy requirement (e.g. RNP 4).<\/p> <p>RNP 4<\/p> <p>(c) For RNP 4, at least two LRNSs, capable of navigating to RNP 4, and listed in the AFM/POH, may be operational at the entry point of the RNP 4 airspace. If an item of equipment required for RNP 4 operations is unserviceable, then the pilot-in-command may consider an alternate route or diversion for repairs. For multi-sensor systems, the AFM/POH may permit entry if one GNSS sensor is lost after departure, provided one GNSS and one inertial sensor remain available.<\/p> <p>&nbsp;<\/p>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/4%20GM/GM3%20NCO%20IDE%20H%20195%20Navigation.htm"},{"id":"x-GM1-NCO-IDE-H-195-a","kind":"GM","label":"GM1 NCO.IDE.H.195(a)","title":"GM1 NCO.IDE.H.195(a) Navigation equipment","h":"<h4>GM1 NCO.IDE.H.195(a) Navigation equipment<\/h4> <p>CAA ORS9 Decision No. 47<\/p> <p>NAVIGATION EQUIPMENT — SCOPE OF RNAV SUBSTITUTION<\/p> <ol> <li value=\"1\"> <p>Applications of RNAV substitution include use to:<\/p> <ol> <li value=\"1\"> <p>determine aircraft position relative to or distance from a VOR, marker, DME fix or a named fix defined by a VOR radial or NDB bearing;<\/p> <\/li> <li value=\"2\"> <p>navigate to or from a VOR, or NDB, except as lateral guidance in the FAS of an IAP; <\/p> <\/li> <li value=\"3\"> <p>hold over a VOR, NDB, or DME fix;<\/p> <\/li> <li value=\"4\"> <p>fly an arc based upon DME; or<\/p> <\/li> <li value=\"5\"> <p>fly an overlay of a conventional departure, arrival, approach or route except as lateral guidance in the FAS of an IAP.<\/p> <\/li> <\/ol> <\/li> <li value=\"2\"> <p>RNAV substitution for ADF, marker and VOR may be used where airborne and/or ground‑based equipment is not available.<\/p> <\/li> <li value=\"3\"> <p>RNAV substitution for DME may be used where the ground‑based DME transponder is unserviceable or the airborne DME transceiver is found to be unserviceable in flight. Caution must be exercised by the pilot‑in‑command when calculating and using GNSS distances to the active waypoint as reference points are often different.<\/p> <\/li> <\/ol> <p>&nbsp;<\/p>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/4%20GM/GM1%20NCO%20IDE%20H%20195%20a%20Navigation.htm"},{"id":"x-GM2-NCO-IDE-H-195-a","kind":"GM","label":"GM2 NCO.IDE.H.195(a)","title":"GM2 NCO.IDE.H.195(a) Navigation equipment","h":"<h4>GM2 NCO.IDE.H.195(a) Navigation equipment<\/h4> <p>CAA ORS9 Decision No. 47<\/p> <p>NAVIGATION EQUIPMENT — SUITABILITY OF THE RNAV SYSTEM FOR RNAV SUBSTITUTION<\/p> <p>GNSS (E)TSOs are referenced in AMC1&nbsp;NCO.IDE.A.195(a) since most of the aircraft conducting NCO are equipped with an RNAV stand‑alone system which exclusively bases its positioning on GNSS.<\/p> <p>&nbsp;<\/p>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/4%20GM/GM2%20NCO%20IDE%20H%20195%20a%20Navigation.htm"},{"id":"x-GM3-NCO-IDE-H-195-a","kind":"GM","label":"GM3 NCO.IDE.H.195(a)","title":"GM3 NCO.IDE.H.195(a) Navigation equipment","h":"<h4>GM3 NCO.IDE.H.195(a) Navigation equipment<\/h4> <p>CAA ORS9 Decision No. 47<\/p> <p>NAVIGATION EQUIPMENT — RNAV SUBSTITUTION — OPERATING PROCEDURE<\/p> <p>Although RNAV substitution may not be used for lateral guidance in the FAS, this does not preclude the use of the RNAV system to fly the FAS, provided that raw data from the associated conventional navigation aids is monitored.<\/p> <p>&nbsp;<\/p>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/4%20GM/GM3%20NCO%20IDE%20H%20195%20a%20Navigation.htm"}]},{"id":"r-NCO-IDE-H-200","ref":"NCO.IDE.H.200","title":"Transponder","h":"<h1>NCO.IDE.H.200 Transponder <\/h1> <div> <p>Where required by the airspace being flown, helicopters shall be equipped with a secondary surveillance radar (SSR) transponder with all the required capabilities.<\/p> <p>&nbsp;<\/p> <\/div>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/2%20Regs/21170_NCOIDEH200_Transponder.htm","sub":[{"id":"x-AMC1-NCO-IDE-H-200","kind":"AMC","label":"AMC1 NCO.IDE.H.200","title":"AMC1 NCO.IDE.H.200 Transponder","h":"<h3><a><\/a>AMC1 NCO.IDE.H.200 Transponder&nbsp;&nbsp;&nbsp;&nbsp;<\/h3> <p>CAA ORS9 Decision No. 1<\/p> <p>GENERAL<\/p> <p>(a) The secondary surveillance radar (SSR) transponders of helicopters being operated under European air traffic control should comply with any applicable Single European Sky legislation.<\/p> <p>(b) If the Single European Sky legislation is not applicable, the SSR transponders should operate in accordance with the relevant provisions of Volume IV of ICAO Annex 10.<\/p> <p>&nbsp;<\/p>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/3%20AMC/AMC1%20NCO%20IDE%20H%20200%20Transponder.htm"}]},{"id":"r-NCO-IDE-H-205","ref":"NCO.IDE.H.205","title":"Management of aeronautical databases","h":"<h1>NCO.IDE.H.205 Management of aeronautical databases <\/h1> <div> <p>(a)&nbsp;Aeronautical databases used on certified aircraft system applications shall meet data quality requirements that are adequate for the intended use of the data.<\/p> <p>(b)&nbsp;The operator shall ensure the timely distribution and insertion of current and unaltered aeronautical databases to the aircraft that require them.<\/p> <p>(c)&nbsp;Notwithstanding any other occurrence reporting requirements as defined in Regulation (EU) No 376/2014, the operator shall report to the database provider instances of erroneous, inconsistent or missing data that might be reasonably expected to constitute a hazard to flight.<\/p> <p>In such cases, the pilot-in-command shall not use the affected data.<\/p> <p>&nbsp;<\/p> <\/div>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/2%20Regs/21200_NCOIDEH205_Management_of_aeronautical_databases.htm","sub":[{"id":"x-AMC1-NCO-IDE-H-205","kind":"AMC","label":"AMC1 NCO.IDE.H.205","title":"AMC1 NCO.IDE.H.205 Management of aeronautical databases","h":"<h3><a><\/a>AMC1 NCO.IDE.H.205 Management of aeronautical databases&nbsp;&nbsp;&nbsp;&nbsp;<\/h3> <p>CAA ORS9 Decision No. 1<\/p> <p>AERONAUTICAL DATABASES<\/p> <p>When the operator of an aircraft uses an aeronautical database that supports an airborne navigation application as a primary means of navigation used to meet the airspace usage requirements, the database provider should be a Type 2 DAT provider certified in accordance with Regulation (EU) 2017/373 or equivalent.<\/p> <p>&nbsp;<\/p>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/3%20AMC/AMC1%20NCO%20IDE%20H%20205%20Management.htm"},{"id":"x-GM1-NCO-IDE-H-205","kind":"GM","label":"GM1 NCO.IDE.H.205","title":"GM1 NCO.IDE.H.205 Management of aeronautical databases","h":"<h4><a><\/a>GM1 NCO.IDE.H.205 Management of aeronautical databases&nbsp;&nbsp;&nbsp;&nbsp;<\/h4> <p>CAA ORS9 Decision No. 1<\/p> <p>AERONAUTICAL DATABASE APPLICATIONS<\/p> <p>The certification of a Type 2 DAT provider in accordance with Regulation (EU) 2017/373 ensures data integrity and compatibility with the certified aircraft application/equipment.<\/p> <p>&nbsp;<\/p>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/4%20GM/GM1%20NCO%20IDE%20H%20205%20Management.htm"},{"id":"x-GM2-NCO-IDE-H-205","kind":"GM","label":"GM2 NCO.IDE.H.205","title":"GM2 NCO.IDE.H.205 Management of aeronautical databases","h":"<h4><a><\/a>GM2 NCO.IDE.H.205 Management of aeronautical databases&nbsp;&nbsp;&nbsp;&nbsp;<\/h4> <p>CAA ORS9 Decision No. 1<\/p> <p>TIMELY DISTRIBUTION<\/p> <p>The operator should distribute current and unaltered aeronautical databases to all aircraft requiring them in accordance with the validity period of the databases or in accordance with an established procedure if no validity period is defined.<\/p> <p>&nbsp;<\/p>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/4%20GM/GM2%20NCO%20IDE%20H%20205%20Management.htm"},{"id":"x-GM3-NCO-IDE-H-205","kind":"GM","label":"GM3 NCO.IDE.H.205","title":"GM3 NCO.IDE.H.205 Management of aeronautical databases","h":"<h4>GM3 NCO.IDE.H.205 Management of aeronautical databases<\/h4> <p>CAA&nbsp;ORS9 Decision No. 19<\/p> <p>STANDARDS FOR AERONAUTICAL DATABASES AND DAT PROVIDERS<\/p> <p>(a) A ‘Type 2 DAT provider’ is an organisation as defined in Article 2(5)(b) of Regulation (EU) 2017/373.<\/p> <p>(b) Equivalent to a certified ‘Type 2 DAT provider’ is:<\/p> <p>(i) defined in any Aviation Safety Agreement between the UK and a third country, including any Technical Implementation Procedures, or any Working Arrangements between the CAA and the aviation authority of a third country; or<\/p> <p>(ii) a Type 2 DAT provider certified by EASA in accordance with Commission Implementing Regulation (EU) 2017/373; or<\/p> <p>(iii) the holder of an FAA Type 2 Data Supplier Letter of Acceptance.<\/p> <p>&nbsp;<\/p>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/4%20GM/GM3%20NCO%20IDE%20H%20205%20Management.htm"}]},{"id":"r-NCO-SPEC-100","ref":"NCO.SPEC.100","title":"Scope","h":"<h1>NCO.SPEC.100 Scope <\/h1> <div> <p>This subpart establishes specific requirements to be followed by a pilot-in-command conducting non-commercial specialised operations with other-than complex motor-powered aircraft.<\/p> <p>&nbsp;<\/p> <\/div>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/2%20Regs/21310_NCOSPEC100_Scope.htm","sub":[{"id":"x-AMC1-NCO-SPEC-100","kind":"AMC","label":"AMC1 NCO.SPEC.100","title":"AMC1 NCO.SPEC.100 Scope","h":"<h3><a><\/a>AMC1 NCO.SPEC.100 Scope&nbsp;&nbsp;&nbsp;&nbsp;<\/h3> <p>CAA ORS9 Decision No. 1<\/p> <p>CRITERIA<\/p> <p>The pilot-in-command should consider the following criteria to determine whether an activity falls within the scope of specialised operations:<\/p> <p>(a) the aircraft is flown close to the surface to fulfil the mission;<\/p> <p>(b) abnormal manoeuvres are performed;<\/p> <p>(c) special equipment is necessary to fulfil the mission and which affects the manoeuvrability of the aircraft;<\/p> <p>(d) substances are released from the aircraft during the flight where these substances are either harmful or affect the manoeuvrability of the aircraft;<\/p> <p>(e) external loads or goods are lifted or towed;<\/p> <p>(f) persons enter or leave the aircraft during flight; or<\/p> <p>(g) the flight falls under the definition of 'maintenance check flight'.<\/p> <p>&nbsp;<\/p>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/3%20AMC/AMC1%20NCO%20SPEC%20100%20Scope.htm"},{"id":"x-GM1-NCO-SPEC-100","kind":"GM","label":"GM1 NCO.SPEC.100","title":"GM1 NCO.SPEC.100 Scope","h":"<h4><a><\/a>GM1 NCO.SPEC.100 Scope&nbsp;&nbsp;&nbsp;&nbsp;<\/h4> <p>CAA ORS9 Decision No. 1<\/p> <p>LIST OF SPECIALISED OPERATIONS<\/p> <p>(a) Specialised operations include the following activities:<\/p> <ol> <p> <\/p><p>(1) helicopter external loads operations;<\/p> <p><\/p> <p> <\/p><p>(2) helicopter survey operations;<\/p> <p><\/p> <p> <\/p><p>(3) human external cargo operations;<\/p> <p><\/p> <p> <\/p><p>(4) parachute operations and skydiving;<\/p> <p><\/p> <p> <\/p><p>(5) agricultural flights;<\/p> <p><\/p> <p> <\/p><p>(6) aerial photography flights;<\/p> <p><\/p> <p> <\/p><p>(7) glider towing;<\/p> <p><\/p> <p> <\/p><p>(8) aerial advertising flights;<\/p> <p><\/p> <p> <\/p><p>(9) calibration flights;<\/p> <p><\/p> <p> <\/p><p>(10) construction work flights, including stringing power line operations, clearing saw operations;<\/p> <p><\/p> <p> <\/p><p>(11) oil spill work;<\/p> <p><\/p> <p> <\/p><p>(12) avalanche mining operations;<\/p> <p><\/p> <p> <\/p><p>(13) survey operations, including aerial mapping operations, pollution control activity;<\/p> <p><\/p> <p> <\/p><p>(14) news media flights, television and movie flights;<\/p> <p><\/p> <p> <\/p><p>(15) special events flights, including such as flying display, competition flights;<\/p> <p><\/p> <p> <\/p><p>(16) aerobatic flights;<\/p> <p><\/p> <p> <\/p><p>(17) animal herding and rescue flights and veterinary dropping flights;<\/p> <p><\/p> <p> <\/p><p>(18) maritime funeral operations;<\/p> <p><\/p> <p> <\/p><p>(19) scientific research flights (other than those under Annex I to Regulation (EU) 2018/1139);<\/p> <p><\/p> <p> <\/p><p>(20) cloud seeding; and<\/p> <p><\/p> <p> <\/p><p>(21) maintenance check flights.<\/p> <p><\/p> <\/ol> <p>(b) For&nbsp;&nbsp; other&nbsp;&nbsp; operations,&nbsp;&nbsp; the&nbsp;&nbsp; pilot-in-command&nbsp;&nbsp; can&nbsp;&nbsp; apply&nbsp;&nbsp; the&nbsp;&nbsp; criteria&nbsp;&nbsp; specified&nbsp;&nbsp; in AMC1 NCO.SPEC.100 to determine whether an activity falls within the scope of specialised operations.<\/p> <p>&nbsp;<\/p>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/4%20GM/GM1%20NCO%20SPEC%20100%20Scope.htm"}]},{"id":"r-NCO-SPEC-105","ref":"NCO.SPEC.105","title":"Checklist","h":"<h1>NCO.SPEC.105 Checklist <\/h1> <div> <p>(a)&nbsp;Before commencing a specialised operation, the pilot-in-command shall conduct a risk assessment, assessing the complexity of the activity to determine the hazards and associated risks inherent in the operation and establish mitigating measures.<\/p> <p>(b)&nbsp;A specialised operation shall be performed in accordance with a checklist. Based on the risk assessment, the pilot-in-command shall establish such checklist appropriate to the specialised activity and aircraft used, taking account of any section of this subpart.<\/p> <p>(c)&nbsp;The checklist that is relevant to the duties of the pilot-in-command, crew members and task specialists shall be readily accessible on each flight.<\/p> <p>(d)&nbsp;The checklist shall be regularly reviewed and updated, as appropriate.<\/p> <p>&nbsp;<\/p> <\/div>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/2%20Regs/21340_NCOSPEC105_Checklist.htm","sub":[{"id":"x-GM1-NCO-SPEC-105","kind":"GM","label":"GM1 NCO.SPEC.105","title":"GM1 NCO.SPEC.105 Checklist","h":"<h4><a><\/a>GM1 NCO.SPEC.105 Checklist&nbsp;&nbsp;&nbsp;&nbsp;<\/h4> <p>CAA ORS9 Decision No. 1<\/p> <p>DEVELOPMENT OF CHECKLISTS<\/p> <p>For developing the checklist, the pilot-in-command should duly take into account at least the following items:<\/p> <p>(a) nature and complexity of the activity:<\/p> <ol> <p> <\/p><p>(1) the nature of the flight and the risk exposure, e.g. low height;<\/p> <p><\/p> <p> <\/p><p>(2) the complexity of the activity taking into account the necessary pilot skills and level of experience, ground support, safety and individual protective equipment;<\/p> <p><\/p> <p> <\/p><p>(3) the operational environment and geographical area, e.g., congested hostile environment, mountainous areas, sea areas, or desert areas;<\/p> <p><\/p> <p> <\/p><p>(4) the result of the risk assessment and evaluation;<\/p> <p><\/p> <\/ol> <p>(b) aircraft and equipment:<\/p> <ol> <p> <\/p><p>(1) the category of aircraft to be used for the activity should be indicated, e.g. helicopter/aeroplane, single/multi-engined;<\/p> <p><\/p> <p> <\/p><p>(2) all equipment required for the activity should be listed;<\/p> <p><\/p> <\/ol> <p>(c) crew members:<\/p> <ol> <p> <\/p><p>(1) crew composition;<\/p> <p><\/p> <p> <\/p><p>(2) minimum crew experience and training provisions; and<\/p> <p><\/p> <p> <\/p><p>(3) recency provisions;<\/p> <p><\/p> <\/ol> <p>(d) task specialists:<\/p> <ol> <p> <\/p><p>(1) description of the task specialists’ function(s)<\/p> <p><\/p> <p> <\/p><p>(2) minimum crew experience and training provisions; and<\/p> <p><\/p> <p> <\/p><p>(3) recency provisions;<\/p> <p><\/p> <p> <\/p><p>(4) briefing;<\/p> <p><\/p> <\/ol> <p>(e) aircraft performance:<\/p> <p>this chapter should detail the specific performance requirements to be applied, in order to ensure an adequate power margin;<\/p> <p>(f) normal procedures and emergency procedures:<\/p> <ol> <p> <\/p><p>(1) operating procedures for the flight crew, including the coordination with task specialists;<\/p> <p><\/p> <p> <\/p><p>(2) ground procedures for the task specialists;<\/p> <p><\/p> <\/ol> <p>(g) ground equipment:<\/p> <p>this chapter should detail the nature, number and location of ground equipment required for the activity;<\/p> <p>(h) records:<\/p> <p>it should be determined which records specific to these flight(s) are to be kept, such as task details, aircraft registration, pilot-in-command, flight times, weather and any remarks, including a record of occurrences affecting flight safety or the safety of persons or property on the ground.<\/p> <p>&nbsp;<\/p>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/4%20GM/GM1%20NCO%20SPEC%20105%20Checklist.htm"},{"id":"x-GM2-NCO-SPEC-105","kind":"GM","label":"GM2 NCO.SPEC.105","title":"GM2 NCO.SPEC.105 Checklists","h":"<h4><a><\/a>GM2 NCO.SPEC.105 Checklists&nbsp;&nbsp;&nbsp;&nbsp;<\/h4> <p>CAA ORS9 Decision No. 1<\/p> <p>TEMPLATE FORMS<\/p> <p>The following templates are examples, which could be used for developing checklist.<\/p> <p>(a) Template Form A
