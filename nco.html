se of AP or FD which can be required to reduce the FTE primarily for RNP APCH, RNAV 1, and RNP 1.<\/p> <p><\/p> <p> <\/p><p>(5) Any limitation such as ‘within the US National Airspace’ may be ignored since RNP APCH procedures are assumed to meet the same ICAO criteria around the world.<\/p> <p>&nbsp;<\/p> <p><\/p> <\/ol>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/4%20GM/GM1%20NCO%20IDE%20A%20195%20Navigation.htm"},{"id":"x-GM2-NCO-IDE-A-195","kind":"GM","label":"GM2 NCO.IDE.A.195","title":"GM2 NCO.IDE.A.195 Navigation equipment","h":"<h4><a><\/a>GM2 NCO.IDE.A.195 Navigation equipment&nbsp;&nbsp;&nbsp;&nbsp;<\/h4> <p>CAA ORS9 Decision No. 1<\/p> <p>GENERAL<\/p> <p>(a) The PBN specifications for which the aircraft complies with the relevant airworthiness criteria are set out in the AFM/POH, together with any limitations to be observed.<\/p> <p>(b) Because functional and performance requirements are defined for each navigation specification, an aircraft approved for an RNP specification is not automatically approved for all RNAV specifications. Similarly, an aircraft approved for an RNP or RNAV specification having a stringent accuracy requirement (e.g. RNP 0.3 specification) is not automatically approved for a navigation specification having a less stringent accuracy requirement (e.g. RNP 4).<\/p> <p>RNP 4<\/p> <p>(c) For RNP 4, at least two LRNSs, capable of navigating to RNP 4, and listed in the AFM/POH, may be operational at the entry point of the RNP 4 airspace. If an item of equipment required for RNP 4 operations is unserviceable, then the pilot-in-command may consider an alternate route or diversion for repairs. For multi-sensor systems, the AFM/POH may permit entry if one GNSS sensor is lost after departure, provided one GNSS and one inertial sensor remain available.<\/p> <p>&nbsp;<\/p>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/4%20GM/GM2%20NCO%20IDE%20A%20195%20Navigation.htm"},{"id":"x-GM1-NCO-IDE-A-195-a","kind":"GM","label":"GM1 NCO.IDE.A.195(a)","title":"GM1 NCO.IDE.A.195(a) Navigation equipment","h":"<h4>GM1 NCO.IDE.A.195(a) Navigation equipment<\/h4> <p>CAA ORS9 Decision No. 47<\/p> <p>NAVIGATION EQUIPMENT — SCOPE OF RNAV SUBSTITUTION<\/p> <ol> <li value=\"1\"> <p>Applications of RNAV substitution include use to:<\/p> <ol> <li value=\"1\"> <p>determine aircraft position relative to or distance from a VOR, marker, DME fix or a named fix defined by a VOR radial or NDB bearing;<\/p> <\/li> <li value=\"2\"> <p>navigate to or from a VOR, or NDB, except as lateral guidance in the FAS of an IAP; <\/p> <\/li> <li value=\"3\"> <p>hold over a VOR, NDB, or DME fix;<\/p> <\/li> <li value=\"4\"> <p>fly an arc based upon DME; or<\/p> <\/li> <li value=\"5\"> <p>fly an overlay of a conventional departure, arrival, approach or route except as lateral guidance in the FAS of an IAP.<\/p> <\/li> <\/ol> <\/li> <li value=\"2\"> <p>RNAV substitution for ADF, marker and VOR may be used where airborne and/or ground‑based equipment is not available.<\/p> <\/li> <li value=\"3\"> <p>RNAV substitution for DME may be used where the ground‑based DME transponder is unserviceable or the airborne DME transceiver is found to be unserviceable in flight. Caution must be exercised by the pilot‑in‑command when calculating and using GNSS distances to the active waypoint as reference points are often different.<\/p> <\/li> <\/ol> <p>&nbsp;<\/p>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/4%20GM/GM1%20NCO%20IDE%20A%20195%20a%20Navigation.htm"},{"id":"x-GM2-NCO-IDE-A-195-a","kind":"GM","label":"GM2 NCO.IDE.A.195(a)","title":"GM2 NCO.IDE.A.195(a) Navigation equipment","h":"<h4>GM2 NCO.IDE.A.195(a) Navigation equipment<\/h4> <p>CAA ORS9 Decision No. 47<\/p> <p>NAVIGATION EQUIPMENT — SUITABILITY OF THE RNAV SYSTEM FOR RNAV SUBSTITUTION<\/p> <p>GNSS (E)TSOs are referenced in AMC1&nbsp;NCO.IDE.A.195(a) since most of the aircraft conducting NCO are equipped with an RNAV stand‑alone system which exclusively bases its positioning on GNSS.<\/p> <p>&nbsp;<\/p>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/4%20GM/GM2%20NCO%20IDE%20A%20195%20a%20Navigation.htm"},{"id":"x-GM3-NCO-IDE-A-195-a","kind":"GM","label":"GM3 NCO.IDE.A.195(a)","title":"GM3 NCO.IDE.A.195(a) Navigation equipment","h":"<h4>GM3 NCO.IDE.A.195(a) Navigation equipment<\/h4> <p>CAA ORS9 Decision No. 47<\/p> <p>NAVIGATION EQUIPMENT — RNAV SUBSTITUTION — OPERATING PROCEDURE<\/p> <p>Although RNAV substitution may not be used for lateral guidance in the FAS, this does not preclude the use of the RNAV system to fly the FAS, provided that raw data from the associated conventional navigation aids is monitored.<\/p> <p>&nbsp;<\/p>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/4%20GM/GM3%20NCO%20IDE%20A%20195%20a%20Navigation.htm"}]},{"id":"r-NCO-IDE-A-200","ref":"NCO.IDE.A.200","title":"Transponder","h":"<h1>NCO.IDE.A.200 Transponder <\/h1> <div> <p>Where required by the airspace being flown, aeroplanes shall be equipped with a secondary surveillance radar (SSR) transponder with all the required capabilities.<\/p> <p>&nbsp;<\/p> <\/div>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/2%20Regs/20560_NCOIDEA200_Transponder.htm","sub":[{"id":"x-AMC1-NCO-IDE-A-200","kind":"AMC","label":"AMC1 NCO.IDE.A.200","title":"AMC1 NCO.IDE.A.200 Transponder","h":"<h3><a><\/a>AMC1 NCO.IDE.A.200 Transponder&nbsp;&nbsp;&nbsp;&nbsp;<\/h3> <p>CAA ORS9 Decision No. 1<\/p> <p>GENERAL<\/p> <p>(a) The secondary surveillance radar (SSR) transponders of aeroplanes being operated under European air traffic control should comply with any applicable Single European Sky legislation.<\/p> <p>(b) If the Single European Sky legislation is not applicable, the SSR transponders should operate in accordance with the relevant provisions of Volume IV of ICAO Annex 10.<\/p> <p>&nbsp;<\/p>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/3%20AMC/AMC1%20NCO%20IDE%20A%20200%20Transponder.htm"}]},{"id":"r-NCO-IDE-A-205","ref":"NCO.IDE.A.205","title":"Management of aeronautical databases","h":"<h1>NCO.IDE.A.205 Management of aeronautical databases <\/h1> <div> <p>(a)&nbsp;Aeronautical databases used on certified aircraft system applications shall meet data quality requirements that are adequate for the intended use of the data.<\/p> <p>(b)&nbsp;The pilot-in-command shall ensure the timely distribution and insertion of current and unaltered aeronautical databases to the aircraft that require them.<\/p> <p>(c)&nbsp;Notwithstanding any other occurrence reporting requirements as defined in Regulation (EU) No 376/2014, the pilot-in-command shall report to the database provider instances of erroneous, inconsistent or missing data that might be reasonably expected to constitute a hazard to a flight.<\/p> <p>In such cases, the pilot-in-command shall not use the affected data.<\/p> <p>&nbsp;<\/p> <\/div>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/2%20Regs/20590_NCOIDEA205_Management_of_aeronautical_databases.htm","sub":[{"id":"x-AMC1-NCO-IDE-A-205","kind":"AMC","label":"AMC1 NCO.IDE.A.205","title":"AMC1 NCO.IDE.A.205 Management of aeronautical databases","h":"<h3><a><\/a>AMC1 NCO.IDE.A.205 Management of aeronautical databases&nbsp;&nbsp;&nbsp;&nbsp;<\/h3> <p>CAA ORS9 Decision No. 1<\/p> <p>AERONAUTICAL DATABASES<\/p> <p>When the operator of an aircraft uses an aeronautical database that supports an airborne navigation application as a primary means of navigation used to meet the airspace usage requirements, the database provider should be a Type 2 DAT provider certified in accordance with Regulation (EU) 2017/373 or equivalent.<\/p> <p>&nbsp;<\/p>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/3%20AMC/AMC1%20NCO%20IDE%20A%20205%20Management.htm"},{"id":"x-GM1-NCO-IDE-A-205","kind":"GM","label":"GM1 NCO.IDE.A.205","title":"GM1 NCO.IDE.A.205 Management of aeronautical databases","h":"<h4><a><\/a>GM1 NCO.IDE.A.205 Management of aeronautical databases&nbsp;&nbsp;&nbsp;&nbsp;<\/h4> <p>CAA ORS9 Decision No. 1<\/p> <p>AERONAUTICAL DATABASE APPLICATIONS<\/p> <p>The certification of a Type 2 DAT provider in accordance with Regulation (EU) 2017/373 ensures data integrity and compatibility with the certified aircraft application/equipment.<\/p> <p>&nbsp;<\/p>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/4%20GM/GM1%20NCO%20IDE%20A%20205%20Management.htm"},{"id":"x-GM2-NCO-IDE-A-205","kind":"GM","label":"GM2 NCO.IDE.A.205","title":"GM2 NCO.IDE.A.205 Management of aeronautical databases","h":"<h4><a><\/a>GM2 NCO.IDE.A.205 Management of aeronautical databases&nbsp;&nbsp;&nbsp;&nbsp;<\/h4> <p>CAA ORS9 Decision No. 1<\/p> <p>TIMELY DISTRIBUTION<\/p> <p>The operator should distribute current and unaltered aeronautical databases to all aircraft requiring them in accordance with the validity period of the databases or in accordance with an established procedure if no validity period is defined.<\/p> <p>&nbsp;<\/p>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/4%20GM/GM2%20NCO%20IDE%20A%20205%20Management.htm"},{"id":"x-GM3-NCO-IDE-A-205","kind":"GM","label":"GM3 NCO.IDE.A.205","title":"GM3 NCO.IDE.A.205 Management of aeronautical databases","h":"<h4>GM3 NCO.IDE.A.205 Management of aeronautical databases&nbsp;&nbsp;&nbsp;&nbsp;<\/h4> <p>CAA&nbsp;ORS9 Decision No. 19<\/p> <p>STANDARDS FOR AERONAUTICAL DATABASES AND DAT PROVIDERS<\/p> <p>(a) A ‘Type 2 DAT provider’ is an organisation as defined in Article 2(5)(b) of Regulation (EU) 2017/373.<\/p> <p>(b) Equivalent to a certified ‘Type 2 DAT provider’ is:<\/p> <p>(i) defined in any Aviation Safety Agreement between the UK and a third country, including any Technical Implementation Procedures, or any Working Arrangements between the CAA and the aviation authority of a third country; or<\/p> <p>(ii) a Type 2 DAT provider certified by EASA in accordance with Commission Implementing Regulation (EU) 2017/373; or<\/p> <p>(iii) the holder of an FAA Type 2 Data Supplier Letter of Acceptance.<\/p> <p>&nbsp;<\/p>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/4%20GM/GM3%20NCO%20IDE%20A%20205%20Management.htm"}]},{"id":"r-NCO-IDE-H-100","ref":"NCO.IDE.H.100","title":"Instruments and equipment — general","h":"<h1>NCO.IDE.H.100 Instruments and equipment — general <\/h1> <div> <p>(a)&nbsp;Instruments and equipment required by this Subpart shall be approved in accordance with the applicable airworthiness requirements if they are:<\/p> <p>(1)&nbsp;&nbsp;used by the flight crew to control the flight path;<\/p> <p>(2)&nbsp;&nbsp;used to comply with NCO.IDE.H.190;<\/p> <p>(3)&nbsp;&nbsp;used to comply with NCO.IDE.H.195; or<\/p> <p>(4)&nbsp;&nbsp;installed in the helicopter.<\/p> <p>(b)&nbsp;The following items, when required under this Subpart, do not need an equipment approval:<\/p> <p>(1)&nbsp;&nbsp;independent portable lights;<\/p> <p>(2)&nbsp;&nbsp;an accurate time piece;<\/p> <p>(3)&nbsp;&nbsp;first-aid kit;<\/p> <p>(4)&nbsp;&nbsp;survival and signalling equipment;<\/p> <p>(5)&nbsp;&nbsp;sea anchor and equipment for mooring;<\/p> <p>(6)&nbsp;&nbsp;child restraint device;<\/p> <p>(7)&nbsp;&nbsp;a simple PCDS used by a task specialist as a restraint device.<\/p> <p>(c)&nbsp;Instruments and equipment or accessories not required under Annex VII (Part-NCO), as well as any other equipment that is not required under this Regulation, but carried on a flight, shall comply with the following requirements:<\/p> <p>(1)&nbsp;&nbsp;the information provided by those instruments, equipment or accessories shall not be used by the flight crew members to comply with Annex II to Regulation (EU) 2018/1139 or points NCO.IDE.H.190 and NCO.IDE.H.195 of Annex VII;<\/p> <p>(2)&nbsp;&nbsp;the instruments and equipment or accessories shall not affect the airworthiness of the helicopter, even in the case of failures or malfunction.<\/p> <p>(d)&nbsp;Instruments and equipment shall be readily operable or accessible from the station where the flight crew member that needs to use it is seated.<\/p> <p>(e)&nbsp;All required emergency equipment shall be easily accessible for immediate use.<\/p> <p>&nbsp;<\/p> <\/div>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/2%20Regs/20630_NCOIDEH100_Instruments_and_equipment_general.htm","sub":[{"id":"x-GM1-NCO-IDE-H-100-a","kind":"GM","label":"GM1 NCO.IDE.H.100(a)","title":"GM1 NCO.IDE.H.100(a) Instruments and equipment – general","h":"<h4><a><\/a>GM1 NCO.IDE.H.100(a) Instruments and equipment – general&nbsp;&nbsp;&nbsp;&nbsp;<\/h4> <p>CAA ORS9 Decision No. 1<\/p> <p>APPLICABLE AIRWORTHINESS REQUIREMENTS<\/p> <p>The applicable airworthiness requirements for approval of instruments and equipment required by this Part are the following:<\/p> <p>(a) Regulation (EU) No 748/2012 for helicopters registered in the EU; and<\/p> <p>(b) Airworthiness requirements of the State of registry for helicopters registered outside the EU.<\/p> <p>&nbsp;<\/p>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/4%20GM/GM1%20NCO%20IDE%20H%20100%20a%20Instruments.htm"},{"id":"x-GM1-NCO-IDE-H-100-b","kind":"GM","label":"GM1 NCO.IDE.H.100(b)","title":"GM1 NCO.IDE.H.100(b) Instruments and equipment – general","h":"<h4><a><\/a>GM1 NCO.IDE.H.100(b) Instruments and equipment – general&nbsp;&nbsp;&nbsp;&nbsp;<\/h4> <p>CAA ORS9 Decision No. 1<\/p> <p>REQUIRED INSTRUMENTS AND EQUIPMENT THAT DO NOT NEED TO BE APPROVED IN ACCORDANCE WITH THE APPLICABLE AIRWORTHINESS REQUIREMENTS<\/p> <p>The functionality of non-installed instruments and equipment required by this Subpart and that do not need an equipment approval, as listed in NCO.IDE.H.100(b), should be checked against recognised industry standards appropriate to the intended purpose. The operator is responsible for ensuring the maintenance of these instruments and equipment.<\/p> <p>&nbsp;<\/p>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/4%20GM/GM1%20NCO%20IDE%20H%20100%20b%20Instruments.htm"},{"id":"x-GM1-NCO-IDE-H-100-c","kind":"GM","label":"GM1 NCO.IDE.H.100(c)","title":"GM1 NCO.IDE.H.100(c) Instruments and equipment – general","h":"<h4><a><\/a>GM1 NCO.IDE.H.100(c) Instruments and equipment – general&nbsp;&nbsp;&nbsp;&nbsp;<\/h4> <p>CAA ORS9 Decision No. 1<\/p> <p>NOT REQUIRED INSTRUMENTS AND EQUIPMENT THAT DO NOT NEED TO BE APPROVED IN ACCORDANCE WITH THE APPLICABLE AIRWORTHINESS REQUIREMENTS, BUT ARE CARRIED ON A FLIGHT<\/p> <p>(a) The provision of this paragraph does not exempt any installed instrument or item of equipment from complying with the applicable airworthiness requirements. In this case, the installation should be approved as required in the applicable airworthiness requirements and should comply with the applicable Certification Specifications.<\/p> <p>(b) The failure of additional non-installed instruments or equipment not required by this Part or by the applicable airworthiness requirements or any applicable airspace requirements should not adversely affect the airworthiness and/or the safe operation of the helicopter. Examples may be the following:<\/p> <ol> <p> <\/p><p>(1) portable electronic flight bag (EFB);<\/p> <p><\/p> <p> <\/p><p>(2) portable electronic devices carried by crew members; and<\/p> <p><\/p> <p> <\/p><p>(3) non-installed passenger entertainment equipment.<\/p> <p>&nbsp;<\/p> <p><\/p> <\/ol>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/4%20GM/GM1%20NCO%20IDE%20H%20100%20c%20Instruments.htm"}]},{"id":"r-NCO-IDE-H-105","ref":"NCO.IDE.H.105","title":"Minimum equipment for flight","h":"<h1>NCO.IDE.H.105 Minimum equipment for flight <\/h1> <div> <p>A flight shall not be commenced when any of the helicopter’s instruments, items of equipment or functions required for the intended flight are inoperative or missing, unless:<\/p> <p>(a)&nbsp;the helicopter is operated in accordance with the MEL, if established; or<\/p> <p>(b)&nbsp;the helicopter is subject to a permit to fly issued in accordance with the applicable airworthiness requirements.<\/p> <p>&nbsp;<\/p> <\/div>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/2%20Regs/20660_NCOIDEH105_Minimum_equipment_for_flight.htm","sub":[{"id":"x-AMC1-NCO-IDE-H-105","kind":"AMC","label":"AMC1 NCO.IDE.H.105","title":"AMC1 NCO.IDE.H.105 Minimum equipment for flight","h":"<h3>AMC1 NCO.IDE.H.105 Minimum equipment for flight<\/h3> <p>CAA&nbsp;ORS9 Decision No. 15<\/p> <p>MANAGEMENT OF THE STATUS OF CERTAIN INSTRUMENTS, EQUIPMENT OR FUNCTIONS<\/p> <p>The operator should control and retain the status of the instruments, equipment or functions required for the intended operation, that are not controlled for the purpose of continuing airworthiness management.<\/p> <p>&nbsp;<\/p>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/3%20AMC/AMC1%20NCO%20IDE%20H%20105%20Minimum.htm"},{"id":"x-GM1-NCO-IDE-H-105","kind":"GM","label":"GM1 NCO.IDE.H.105","title":"GM1 NCO.IDE.H.105 Minimum equipment for flight","h":"<h4>GM1 NCO.IDE.H.105 Minimum equipment for flight<\/h4> <p>CAA&nbsp;ORS9 Decision No. 15<\/p> <p>MANAGEMENT OF THE STATUS OF CERTAIN INSTRUMENTS, EQUIPMENT OR FUNCTIONS<\/p> <p>(a)&nbsp;&nbsp;&nbsp;&nbsp;The operator should define responsibilities and procedures to retain and control the status of instruments, equipment or functions required for the intended operation, that are not controlled for the purpose of continuing airworthiness management.<\/p> <p>(b)&nbsp;&nbsp;&nbsp;&nbsp;Examples of such instruments, equipment or functions may be, but are not limited to, equipment related to navigation approvals as FM immunity or certain software versions.<\/p> <p>&nbsp;<\/p>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/4%20GM/GM1%20NCO%20IDE%20H%20105%20Minimum.htm"}]},{"id":"r-NCO-IDE-H-115","ref":"NCO.IDE.H.115","title":"Operating lights","h":"<h1>NCO.IDE.H.115 Operating lights <\/h1> <div> <p>Helicopters operated at night shall be equipped with:<\/p> <p>(a)&nbsp;an anti-collision light system;<\/p> <p>(b)&nbsp;navigation/position lights;<\/p> <p>(c)&nbsp;a landing light;<\/p> <p>(d)&nbsp;lighting supplied from the helicopter’s electrical system to provide adequate illumination for all instruments and equipment essential to the safe operation of the helicopter;<\/p> <p>(e)&nbsp;lighting supplied from the helicopter’s electrical system to provide illumination in all passenger compartments;<\/p> <p>(f)&nbsp;an independent portable light for each crew member station; and<\/p> <p>(g)&nbsp;lights to conform with the International Regulations for Preventing Collisions at Sea if the helicopter is amphibious.<\/p> <p>&nbsp;<\/p> <\/div>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/2%20Regs/20690_NCOIDEH115_Operating_lights.htm","sub":[{"id":"x-AMC1-NCO-IDE-H-115","kind":"AMC","label":"AMC1 NCO.IDE.H.115","title":"AMC1 NCO.IDE.H.115 Operating lights","h":"<h3><a><\/a>AMC1 NCO.IDE.H.115 Operating lights&nbsp;&nbsp;&nbsp;&nbsp;<\/h3> <p>CAA ORS9 Decision No. 1<\/p> <p>LANDING LIGHT<\/p> <p>The landing light should be trainable, at least in the vertical plane, or optionally be an additional fixed light or lights positioned to give a wide spread of illumination.<\/p> <p>&nbsp;<\/p>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/3%20AMC/AMC1%20NCO%20IDE%20H%20115%20Operating.htm"}]},{"id":"r-NCO-IDE-H-120","ref":"NCO.IDE.H.120","title":"Operations under VFR — flight and navigational instruments and associated equipment","h":"<h1>NCO.IDE.H.120 Operations under VFR — flight and navigational instruments and associated equipment <\/h1> <div> <p>(a)&nbsp;Helicopters operated under VFR by day shall be equipped with a means of measuring and displaying the following:<\/p> <p>(1)&nbsp;&nbsp;magnetic heading;<\/p> <p>(2)&nbsp;&nbsp;time in hours, minutes and seconds;<\/p> <p>(3)&nbsp;&nbsp;barometric altitude;<\/p> <p>(4)&nbsp;&nbsp;indicated airspeed; and<\/p> <p>(5)&nbsp;&nbsp;slip.<\/p> <p>(b)&nbsp;Helicopters operated under VMC at night, or when the visibility is less than 1500m, or in conditions where the helicopter cannot be maintained in a desired flight path without reference to one or more additional instruments, shall be, in addition to (a), equipped with:<\/p> <p>(1)&nbsp;&nbsp;a means of measuring and displaying the following:<\/p> <p>(i)&nbsp;&nbsp;attitude;<\/p> <p>(ii)&nbsp;&nbsp;vertical speed; and<\/p> <p>(iii)&nbsp;&nbsp;stabilised heading; and<\/p> <p>(2)&nbsp;&nbsp;a means of indicating when the supply of power to the gyroscopic instruments is not adequate.<\/p> <p>(c)&nbsp;Helicopters operated when the visibility is less than 1500m, or in conditions where the helicopter cannot be maintained in a desired flight path without reference to one or more additional instruments, shall be, in addition to (a) and (b), equipped with a means of preventing malfunction of the airspeed indicating system required in (a)(4) due to condensation or icing.<\/p> <p>&nbsp;<\/p> <\/div>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/2%20Regs/20720_NCOIDEH120_Operations_under_VFR_flight_and_navigational_instruments_an.htm","sub":[{"id":"x-AMC1-NCO-IDE-H-120-a-1-u0026NCO-IDE-H-125-a-1","kind":"AMC","label":"AMC1 NCO.IDE.H.120(a)(1)\\u0026NCO.IDE.H.125(a)(1)","title":"AMC1 NCO.IDE.H.120(a)(1)\\u0026NCO.IDE.H.125(a)(1) Operations under VFR \\u0026 operations under IFR – flight and navigational instruments and associated equipment","h":"<h3><a><\/a>AMC1 NCO.IDE.H.120(a)(1)&amp;NCO.IDE.H.125(a)(1) Operations under&nbsp;VFR &amp; operations under IFR – flight and navigational instruments and associated equipment&nbsp;&nbsp;&nbsp;&nbsp;<\/h3> <p>CAA ORS9 Decision No. 1<\/p> <p>MEANS OF MEASURING AND DISPLAYING MAGNETIC HEADING<\/p> <p>The means of measuring and displaying magnetic direction should be a magnetic compass or equivalent.<\/p> <p>&nbsp;<\/p>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/3%20AMC/AMC1%20NCO%20IDE%20H%20120%20a%201%20NCO.htm"},{"id":"x-AMC1-NCO-IDE-H-120-a-2-u0026NCO-IDE-H-125-a-2","kind":"AMC","label":"AMC1 NCO.IDE.H.120(a)(2)\\u0026NCO.IDE.H.125(a)(2)","title":"AMC1 NCO.IDE.H.120(a)(2)\\u0026NCO.IDE.H.125(a)(2) Operations under VFR \\u0026 operations under IFR – flight and navigational instruments and associated equipment","h":"<h3><a><\/a>AMC1 NCO.IDE.H.120(a)(2)&amp;NCO.IDE.H.125(a)(2) Operations under&nbsp;VFR &amp; operations under IFR – flight and navigational instruments and associated equipment&nbsp;&nbsp;&nbsp;&nbsp;<\/h3> <p>CAA ORS9 Decision No. 1<\/p> <p>MEANS OF MEASURING AND DISPLAYING THE TIME<\/p> <p>A means of measuring and displaying the time in hours, minutes and seconds may be a wrist watch capable of the same functions.<\/p> <p>&nbsp;<\/p>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/3%20AMC/AMC1%20NCO%20IDE%20H%20120%20a%202%20NCO.htm"},{"id":"x-AMC1-NCO-IDE-H-120-a-3-u0026NCO-IDE-H-125-a-3","kind":"AMC","label":"AMC1 NCO.IDE.H.120(a)(3)\\u0026NCO.IDE.H.125(a)(3)","title":"AMC1 NCO.IDE.H.120(a)(3)\\u0026NCO.IDE.H.125(a)(3) Operations under VFR \\u0026 operations under IFR – flight and navigational instruments  and associated equipment","h":"<h3><a><\/a>AMC1 NCO.IDE.H.120(a)(3)&amp;NCO.IDE.H.125(a)(3) Operations under&nbsp;VFR &amp; operations under IFR – flight and navigational instruments and associated equipment&nbsp;&nbsp;&nbsp;&nbsp;<\/h3> <p>CAA ORS9 Decision No. 1<\/p> <p>CALIBRATION OF THE MEANS OF MEASURING AND DISPLAYING PRESSURE ALTITUDE<\/p> <p>The instrument measuring and displaying pressure altitude should be of a sensitive type calibrated in feet (ft), with a sub-scale setting, calibrated in hectopascals/millibars, adjustable for any barometric pressure likely to be set during flight.<\/p> <p>&nbsp;<\/p>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/3%20AMC/AMC1%20NCO%20IDE%20H%20120%20a%203%20NCO.htm"},{"id":"x-AMC1-NCO-IDE-H-120-a-4-u0026NCO-IDE-H-125-a-4","kind":"AMC","label":"AMC1 NCO.IDE.H.120(a)(4)\\u0026NCO.IDE.H.125(a)(4)","title":"AMC1 NCO.IDE.H.120(a)(4)\\u0026NCO.IDE.H.125(a)(4) Operations under VFR \\u0026 operations under IFR – flight and navigational instruments and associated equipment","h":"<h3><a><\/a>AMC1 NCO.IDE.H.120(a)(4)&amp;NCO.IDE.H.125(a)(4) Operations under&nbsp;VFR &amp; operations under IFR – flight and navigational instruments and associated equipment&nbsp;&nbsp;&nbsp;&nbsp;<\/h3> <p>CAA ORS9 Decision No. 1<\/p> <p>CALIBRATION OF THE INSTRUMENT INDICATING AIRSPEED<\/p> <p>(a) The instrument indicating airspeed should be calibrated in knots (kt).<\/p> <p>(b) In the case of helicopters with an MCTOM below 2 000 kg, calibration in kilometres per hour (kph) or in miles per hour (mph) is acceptable when such units are used in the AFM.<\/p> <p>&nbsp;<\/p>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/3%20AMC/AMC1%20NCO%20IDE%20H%20120%20a%204%20NCO.htm"},{"id":"x-AMC1-NCO-IDE-H-120-a-5","kind":"AMC","label":"AMC1 NCO.IDE.H.120(a)(5)","title":"AMC1 NCO.IDE.H.120(a)(5) Operations under VFR – flight and navigational instruments and associated equipment","h":"<h3><a><\/a>AMC1 NCO.IDE.H.120(a)(5) Operations under VFR – flight and navigational instruments and associated equipment&nbsp;&nbsp;&nbsp;&nbsp;<\/h3> <p>CAA ORS9 Decision No. 1<\/p> <p>SLIP<\/p> <p>The means of measuring and displaying slip may be a slip string for operations under VFR.<\/p> <p>&nbsp;<\/p>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/3%20AMC/AMC1%20NCO%20IDE%20H%20120%20a%205%20Operations.htm"},{"id":"x-AMC1-NCO-IDE-H-120-b-1-iii-u0026NCO-IDE-H-125-a-8","kind":"AMC","label":"AMC1 NCO.IDE.H.120(b)(1)(iii)\\u0026NCO.IDE.H.125(a)(8)","title":"AMC1 NCO.IDE.H.120(b)(1)(iii)\\u0026NCO.IDE.H.125(a)(8) Operations under VFR \\u0026 operations under IFR – flight and navigational instruments and associated equipment","h":"<h3><a><\/a>AMC1 NCO.IDE.H.120(b)(1)(iii)&amp;NCO.IDE.H.125(a)(8) Operations under VFR &amp; operations under IFR – flight and navigational instruments and associated equipment&nbsp;&nbsp;&nbsp;&nbsp;<\/h3> <p>CAA ORS9 Decision No. 1<\/p> <p>STABILISED HEADING<\/p> <p>Stabilised direction should be achieved for VFR flights by a gyroscopic direction indicator, whereas for IFR flights, this should be achieved through a magnetic gyroscopic direction indicator.<\/p> <p>&nbsp;<\/p>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/3%20AMC/AMC1%20NCO%20IDE%20H%20120%20b%201%20iii.htm"},{"id":"x-AMC1-NCO-IDE-H-120-c-u0026NCO-IDE-H-125-c","kind":"AMC","label":"AMC1 NCO.IDE.H.120(c)\\u0026NCO.IDE.H.125(c)","title":"AMC1 NCO.IDE.H.120(c)\\u0026NCO.IDE.H.125(c) Operations under VFR \\u0026 Operations under IFR – flight and navigational instruments and associated equipment","h":"<h3><a><\/a>AMC1 NCO.IDE.H.120(c)&amp;NCO.IDE.H.125(c) Operations under VFR &amp; Operations under IFR – flight and navigational instruments and associated equipment&nbsp;&nbsp;&nbsp;&nbsp;<\/h3> <p>CAA ORS9 Decision No. 1<\/p> <p>MEANS OF PREVENTING MALFUNCTION DUE TO CONDENSATION OR ICING<\/p> <p>The means of preventing malfunction due to either condensation or icing of the airspeed indicating system should be a heated pitot tube or equivalent.<\/p> <p>&nbsp;<\/p>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/3%20AMC/AMC1%20NCO%20IDE%20H%20120%20c%20NCO%20IDE.htm"},{"id":"x-AMC1-NCO-IDE-H-120-u0026NCO-IDE-H-125","kind":"AMC","label":"AMC1 NCO.IDE.H.120\\u0026NCO.IDE.H.125","title":"AMC1 NCO.IDE.H.120\\u0026NCO.IDE.H.125 Operations under VFR \\u0026 operations under IFR – flight and navigational instruments and associated equipment","h":"<h3><a><\/a>AMC1 NCO.IDE.H.120&amp;NCO.IDE.H.125 Operations under VFR &amp; operations under IFR – flight and navigational instruments and associated equipment&nbsp;&nbsp;&nbsp;&nbsp;<\/h3> <p>CAA ORS9 Decision No. 1<\/p> <p>INTEGRATED INSTRUMENTS<\/p> <p>(a) Individual equipment requirements may be met by combinations of instruments, by integrated flight systems or by a combination of parameters on electronic displays. The information so available to each required pilot should not be less than that required in the applicable operational requirements, and the equivalent safety of the installation should be approved during type certification of the helicopter for the intended type of operation.<\/p> <p>(b) The means of measuring and indicating turn and slip, helicopter attitude and stabilised helicopter heading may be met by combinations of instruments or by integrated flight director systems, provided that the safeguards against total failure, inherent in the three separate instruments, are retained.<\/p> <p>&nbsp;<\/p>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/3%20AMC/AMC1%20NCO%20IDE%20H%20120%20NCO%20IDE.htm"}]},{"id":"r-NCO-IDE-H-125","ref":"NCO.IDE.H.125","title":"Operations under IFR — flight and navigational instruments and associated equipment","h":"<h1>NCO.IDE.H.125 Operations under IFR — flight and navigational instruments and associated equipment <\/h1> <div> <p>Helicopters operated under IFR shall be equipped with:<\/p> <p>(a)&nbsp;a means of measuring and displaying the following:<\/p> <p>(1)&nbsp;&nbsp;magnetic heading;<\/p> <p>(2)&nbsp;&nbsp;time in hours, minutes and seconds;<\/p> <p>(3)&nbsp;&nbsp;barometric altitude;<\/p> <p>(4)&nbsp;&nbsp;indicated airspeed;<\/p> <p>(5)&nbsp;&nbsp;vertical speed;<\/p> <p>(6)&nbsp;&nbsp;slip;<\/p> <p>(7)&nbsp;&nbsp;attitude;<\/p> <p>(8)&nbsp;&nbsp;stabilised heading; and<\/p> <p>(9)&nbsp;&nbsp;outside air temperature;<\/p> <p>(b)&nbsp;a means of indicating when the supply of power to the gyroscopic instruments is not adequate;<\/p> <p>(c)&nbsp;a means of preventing malfunction of the airspeed indicating system required by (a)(4) due to condensation or icing; and<\/p> <p>(d)&nbsp;an additional means of measuring and displaying attitude as a standby instrument.<\/p> <p>&nbsp;<\/p> <\/div>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/2%20Regs/20750_NCOIDEH125_Operations_under_IFR_flight_and_navigational_instruments_an.htm","sub":[{"id":"x-AMC1-NCO-IDE-H-125-a-9","kind":"AMC","label":"AMC1 NCO.IDE.H.125(a)(9)","title":"AMC1 NCO.IDE.H.125(a)(9) Operations under IFR – flight and navigational instruments and associated equipment","h":"<h3><a><\/a>AMC1 NCO.IDE.H.125(a)(9) Operations under IFR – flight and navigational instruments and associated equipment&nbsp;&nbsp;&nbsp;&nbsp;<\/h3> <p>CAA ORS9 Decision No. 1<\/p> <p>MEANS OF DISPLAYING OUTSIDE AIR TEMPERATURE<\/p> <ol> <li value=\"1\"> <p>The means of displaying outside air temperature should be calibrated in degrees Celsius.<\/p> <\/li> <li value=\"2\"> <p>In the case of helicopters with a maximum certified take-off mass (MCTOM) below 2&nbsp;000&nbsp;kg, calibration in degrees Fahrenheit is acceptable, when such unit is used in the AFM.<\/p> <\/li> <li value=\"3\"> <p>The means of displaying outside air temperature may be an air temperature indicator that provides indications that are convertible to outside air temperature.<\/p> <\/li> <\/ol> <p>&nbsp;<\/p>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/3%20AMC/AMC1%20NCO%20IDE%20H%20125%20a%209%20Operations.htm"},{"id":"x-GM1-NCO-IDE-H-125-a-3","kind":"GM","label":"GM1 NCO.IDE.H.125(a)(3)","title":"GM1 NCO.IDE.H.125(a)(3) Operations under IFR – flight and navigational instruments and associated equipment","h":"<h4><a><\/a>GM1 NCO.IDE.H.125(a)(3) Operations under IFR – flight and navigational instruments and associated equipment&nbsp;&nbsp;&nbsp;&nbsp;<\/h4> <p>CAA ORS9 Decision No. 1<\/p> <p>ALTIMETERS<\/p> <p>Altimeters with counter drum-pointer or equivalent presentation are considered to be less susceptible to misinterpretation for helicopters operating above 10 000 ft.<\/p> <p>&nbsp;<\/p>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/4%20GM/GM1%20NCO%20IDE%20H%20125%20a%203%20Operations.htm"}]},{"id":"r-NCO-IDE-H-126","ref":"NCO.IDE.H.126","title":"Additional equipment for single pilot operations under IFR","h":"<h1>NCO.IDE.H.126 Additional equipment for single pilot operations under IFR <\/h1> <div> <p>Helicopters operated under IFR with a single pilot shall be equipped with an autopilot with at least altitude hold and heading mode.<\/p> <p>&nbsp;<\/p> <\/div>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/2%20Regs/20780_NCOIDEH126_Additional_equipment_for_single_pilot_operations_under_IFR.htm","sub":[]},{"id":"r-NCO-IDE-H-135","ref":"NCO.IDE.H.135","title":"Flight crew interphone system","h":"<h1>NCO.IDE.H.135 Flight crew interphone system <\/h1> <div> <p>Helicopters operated by more than one flight crew member shall be equipped with a flight crew interphone system, including headsets and microphones for use by all flight crew members.<\/p> <p>&nbsp;<\/p> <\/div>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/2%20Regs/20810_NCOIDEH135_Flight_crew_interphone_system.htm","sub":[{"id":"x-AMC1-NCO-IDE-H-135","kind":"AMC","label":"AMC1 NCO.IDE.H.135","title":"AMC1 NCO.IDE.H.135 Flight crew interphone system","h":"<h3><a><\/a>AMC1 NCO.IDE.H.135 Flight crew interphone system&nbsp;&nbsp;&nbsp;&nbsp;<\/h3> <p>CAA ORS9 Decision No. 1<\/p> <p>GENERAL<\/p> <p>(a) The flight crew interphone system should not be of a handheld type.<\/p> <p>(b) A headset consists of a communication device which includes two earphones to receive and a microphone to transmit audio signals to the helicopter’s communication system. To comply with the minimum performance requirements, the earphones and microphone should match the communication system’s characteristics and the flight crew compartment environment. The headset should be adequately adjustable in order to fit the pilot’s head. Headset boom microphones should be of the noise cancelling type.<\/p> <p>(c) If the intention is to utilise noise cancelling earphones, the pilot-in-command should ensure that the earphones do not attenuate any aural warnings or sounds necessary for alerting the flight crew on matters related to the safe operation of the helicopter.<\/p> <p>&nbsp;<\/p>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/3%20AMC/AMC1%20NCO%20IDE%20H%20135%20Flight.htm"},{"id":"x-GM1-NCO-IDE-H-135","kind":"GM","label":"GM1 NCO.IDE.H.135","title":"GM1 NCO.IDE.H.135 Flight crew interphone system","h":"<h4><a><\/a>GM1 NCO.IDE.H.135 Flight crew interphone system&nbsp;&nbsp;&nbsp;&nbsp;<\/h4> <p>CAA ORS9 Decision No. 1<\/p> <p>HEADSET<\/p> <p>The term ‘headset’ includes any aviation helmet incorporating headphones and microphone worn by a flight crew member.<\/p> <p>&nbsp;<\/p>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/4%20GM/GM1%20NCO%20IDE%20H%20135%20Flight%20crew.htm"}]},{"id":"r-NCO-IDE-H-140","ref":"NCO.IDE.H.140","title":"Seats, seat safety belts, restraint systems and child restraint devices","h":"<h1>NCO.IDE.H.140 Seats, seat safety belts, restraint systems and child restraint devices <\/h1> <div> <p>(a)&nbsp;Helicopters shall be equipped with:<\/p> <p>(1)&nbsp;&nbsp;a seat or berth for each person on board who is aged 24 months or more, or a station for each crew member or task specialist on board;<\/p> <p>(2)&nbsp;&nbsp;a seat belt on each passenger seat and restraining belts for each berth, and restraint devices for each station;<\/p> <p>(3)&nbsp;&nbsp;for helicopters first issued with an individual CofA after 31 December 2012, a seat belt with an upper torso restraint system for each passenger who is aged 24 months or more;<\/p> <p>(4)&nbsp;&nbsp;a child restraint device for each person on board younger than 24 months; and<\/p> <p>(5)&nbsp;&nbsp;a seat belt with upper torso restraint system incorporating a device that will automatically restrain the occupant’s torso in the event of rapid deceleration on each flight crew seat.<\/p> <p>(b)&nbsp;A seat belt with upper torso restraint system shall have a single point release.<\/p> <p>&nbsp;<\/p> <\/div>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/2%20Regs/20840_NCOIDEH140_Seats_seat_safety_belts_restraint_systems_and_child_restraint.htm","sub":[{"id":"x-AMC1-NCO-IDE-H-140","kind":"AMC","label":"AMC1 NCO.IDE.H.140","title":"AMC1 NCO.IDE.H.140 Seats, seat safety belts, restraint systems and  child restraint devices","h":"<h3><a><\/a>AMC1 NCO.IDE.H.140 Seats, seat safety belts, restraint systems and child restraint devices&nbsp;&nbsp;&nbsp;&nbsp;<\/h3> <p>CAA ORS9 Decision No. 1<\/p> <p>CHILD RESTRAINT DEVICES (CRDs)<\/p> <p>(a) A CRD is considered to be acceptable if:<\/p> <ol> <p> <\/p><p>(1) it is a supplementary loop belt manufactured with the same techniques and the same materials of the approved safety belts; or<\/p> <p><\/p> <p> <\/p><p>(2) it complies with (b).<\/p> <p><\/p> <\/ol> <p>(b) Provided the CRD can be installed properly on the respective helicopter seat, the following CRDs are considered acceptable:<\/p> <ol> <p> <\/p><p>(1) CRDs approved for use in aircraft according to the European Technical Standard Order ETSO-C100c on Aviation Child Safety Device (ACSD);<\/p> <p><\/p> <p> <\/p><p>(2) CRDs approved through a Type Certificate or Supplemental Type Certificate;<\/p> <p><\/p> <p> <\/p><p>(3) Child seats approved for use in motor vehicles on the basis of the technical standard specified in (i). The child seat must be also approved for use in aircraft on the basis of the technical standard specified in either point (ii) or point (iii):<\/p> <ol> <p> <\/p><p>(i) UN Standard ECE R44-04 (or 03), or ECE R129 bearing the respective ‘ECE R’ label; and<\/p> <p><\/p> <p> <\/p><p>(ii) German ‘Qualification Procedure for Child Restraint Systems for Use in Aircraft’ (TÜV Doc.: TÜV/958-01/2001) bearing the label ‘For Use in Aircraft’; or<\/p> <p><\/p> <p> <\/p><p>(iii) Other technical standard acceptable to the CAA. The child seat should hold a qualification sign that it can be used in aircraft.<\/p> <p><\/p> <\/ol> <p><\/p> <p> <\/p><p>(4) Child seats approved for use in motor vehicles and aircraft according to Canadian CMVSS 213/213.1 bearing the respective label;<\/p> <p><\/p> <p> <\/p><p>(5) Child seats approved for use in motor vehicles and aircraft according to US FMVSS No 213 and bearing one or two labels displaying the following two sentences:<\/p> <ol> <p> <\/p><p>(i) ‘THIS CHILD RESTRAINT SYSTEM CONFORMS TO ALL APPLICABLE FEDERAL MOTOR VEHICLE SAFETY STANDARDS’; and<\/p> <p><\/p> <p> <\/p><p>(ii) in red letters ‘THIS RESTRAINT IS CERTIFIED FOR USE IN MOTOR VEHICLES AND AIRCRAFT’;<\/p> <p><\/p> <\/ol> <p><\/p> <p> <\/p><p>(6) Child seats approved for use in motor vehicles and aircraft according to Australia/New Zealand’s technical standard AS/NZS 1754:2013 bearing the green part on the label displaying ‘For Use in Aircraft’; and<\/p> <p><\/p> <p> <\/p><p>(7) CRDs manufactured and tested according to other technical standards equivalent to those listed above. The devices should be marked with an associated qualification sign, which shows the name of the qualification organisation and a specific identification number, related to the associated qualification project. The qualifying organisation should be a competent and independent organisation that is acceptable to the CAA.<\/p> <p><\/p> <\/ol> <p>(c) Location<\/p> <ol> <p> <\/p><p>(1) Forward-facing child seats may be installed on both forward- and rearward-facing passenger seats, but only when fitted in the same direction as the passenger seat on which they are positioned. Rearward-facing child seats should only be installed on forward-facing passenger seats. A child seat may not be installed within the radius of action of an airbag unless it is obvious that the airbag is de-activated or it can be demonstrated that there is no negative impact from the airbag.<\/p> <p><\/p> <p> <\/p><p>(2) An infant/child in a CRD should be located in the vicinity of a floor level exit.<\/p> <p><\/p> <p> <\/p><p>(3) An infant/child in a CRD should not hinder evacuation for any passenger.<\/p> <p><\/p> <\/ol> <p>(d) Installation<\/p> <ol> <p> <\/p><p>(1) CRDs tested and approved for use in aircraft should only be installed on a suitable passenger seat by the method shown in the manufacturer’s instructions provided with each CRD and with the type of connecting device they are approved for the installation in aircraft. CRDs designed to be installed only by means of rigid bar lower anchorages (ISOFIX or equivalent) should only be used on passenger seats equipped with such connecting devices and should not be secured by passenger seat lap belt.<\/p> <p><\/p> <p> <\/p><p>(2) All safety and installation instructions should be followed carefully by the responsible person accompanying the infant/child. Operators should prohibit the use of a CRD not installed on the passenger seat according to the manufacturer’s instructions or not approved for use in aircraft.<\/p> <p><\/p> <p> <\/p><p>(3) If a forward-facing child seat with a rigid backrest is to be fastened by a seat lap belt, the restraint device should be fastened when the backrest of the passenger seat on which it rests is in a reclined position. Thereafter, the backrest is to be positioned upright. This procedure ensures better tightening of the child seat on the aircraft seat if the aircraft seat is reclinable.<\/p> <p><\/p> <p> <\/p><p>(4) The buckle of the adult safety belt should be easily accessible for both opening and closing, and should be in line with the seat belt halves (not canted) after tightening.<\/p> <p><\/p> <p> <\/p><p>(5) Forward-facing restraint devices with an integral harness must not be installed such that the adult safety belt is secured over the infant.<\/p> <p><\/p> <\/ol> <p>(e) Operation<\/p> <ol> <p> <\/p><p>(1) Each CRD should remain secured to a passenger seat during all phases of flight, unless it is properly stowed when not in use.<\/p> <p><\/p> <p> <\/p><p>(2) Where a child seat is adjustable in recline, it should be in an upright position for all occasions when passenger restraint devices are required.<\/p> <p>&nbsp;<\/p> <p><\/p> <\/ol>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/3%20AMC/AMC1%20NCO%20IDE%20H%20140%20Seats%20seat.htm"},{"id":"x-AMC2-NCO-IDE-H-140","kind":"AMC","label":"AMC2 NCO.IDE.H.140","title":"AMC2 NCO.IDE.H.140 Seats, seat safety belts, restraint systems and child restraint devices","h":"<h3><a><\/a>AMC2 NCO.IDE.H.140 Seats, seat safety belts, restraint systems and child restraint devices&nbsp;&nbsp;&nbsp;&nbsp;<\/h3> <p>CAA ORS9 Decision No. 1<\/p> <p>UPPER TORSO RESTRAINT SYSTEM<\/p> <p>The following systems are deemed to be compliant with the requirement for an upper torso restraint system:<\/p> <p>(a) a seat belt with a diagonal shoulder strap;<\/p> <p>(b) a restraint system having a seat belt and two shoulder straps that may be used independently;<\/p> <p>(c) a restraint system having a seat belt, two shoulder straps and additional straps that may be used independently.<\/p> <p>SEAT BELT<\/p> <p>A seat belt with diagonal shoulder strap (three anchorage points) is deemed to be compliant with the requirement for a seat belt (two anchorage points).<\/p> <p>&nbsp;<\/p>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/3%20AMC/AMC2%20NCO%20IDE%20H%20140%20Seats%20seat.htm"}]},{"id":"r-NCO-IDE-H-145","ref":"NCO.IDE.H.145","title":"First-aid kit","h":"<h1>NCO.IDE.H.145 First-aid kit <\/h1> <div> <p>(a)&nbsp;Helicopters shall be equipped with a first-aid kit.<\/p> <p>(b)&nbsp;The first-aid kit shall be:<\/p> <p>(1)&nbsp;&nbsp;readily accessible for use; and<\/p> <p>(2)&nbsp;&nbsp;kept up-to-date.<\/p> <p>&nbsp;<\/p> <\/div>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/2%20Regs/20870_NCOIDEH145_First-aid_kit.htm","sub":[{"id":"x-AMC1-NCO-IDE-H-145","kind":"AMC","label":"AMC1 NCO.IDE.H.145","title":"AMC1 NCO.IDE.H.145 First-aid kit","h":"<h3><a><\/a>AMC1 NCO.IDE.H.145 First-aid kit&nbsp;&nbsp;&nbsp;&nbsp;<\/h3> <p>CAA ORS9 Decision No. 1<\/p> <p>CONTENT OF FIRST-AID KITS<\/p> <p>(a) First-aid kits should be equipped with appropriate and sufficient medications and instrumentation. However, these kits should be amended by the operator according to the characteristics of the operation (scope of operation, flight duration, number and demographics of passengers, etc.).<\/p> <p>(b) The following should be included in the FAKs:<\/p> <ol> <p> <\/p><p>(1) bandages (assorted sizes),<\/p> <p><\/p> <p> <\/p><p>(2) burns dressings (large and small),<\/p> <p><\/p> <p> <\/p><p>(3) wound dressings (large and small),<\/p> <p><\/p> <p> <\/p><p>(4) adhesive dressings (assorted sizes),<\/p> <p><\/p> <p> <\/p><p>(5) antiseptic wound cleaner,<\/p> <p><\/p> <p> <\/p><p>(6) safety scissors,<\/p> <p><\/p> <p> <\/p><p>(7) disposable gloves.<\/p> <p>&nbsp;<\/p> <p><\/p> <\/ol>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/3%20AMC/AMC1%20NCO%20IDE%20H%20145%20First%20aid.htm"},{"id":"x-AMC2-NCO-IDE-H-145","kind":"AMC","label":"AMC2 NCO.IDE.H.145","title":"AMC2 NCO.IDE.H.145 First-aid kit","h":"<h3><a><\/a>AMC2 NCO.IDE.H.145 First-aid kit&nbsp;&nbsp;&nbsp;&nbsp;<\/h3> <p>CAA ORS9 Decision No. 1<\/p> <p>MAINTENANCE OF FIRST-AID KIT<\/p> <p>To be kept up-to-date, the first-aid kit should be:<\/p> <p>(a) inspected periodically to confirm, to the extent possible, that contents are maintained in the condition necessary for their intended use;<\/p> <p>(b) replenished at regular intervals, in accordance with instructions contained on their labels, or as circumstances warrant; and<\/p> <p>(c) replenished after use in-flight at the first opportunity where replacement items are available.<\/p> <p>&nbsp;<\/p>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/3%20AMC/AMC2%20NCO%20IDE%20H%20145%20First%20aid.htm"}]},{"id":"r-NCO-IDE-H-155","ref":"NCO.IDE.H.155","title":"Supplemental oxygen — non-pressurised helicopters","h":"<h1>NCO.IDE.H.155 Supplemental oxygen — non-pressurised helicopters <\/h1> <div> <p>Non-pressurised helicopters operated when an oxygen supply is required in accordance with NCO.OP.190 shall be equipped with oxygen storage and dispensing apparatus capable of storing and dispensing the required oxygen supplies.<\/p> <p>&nbsp;<\/p> <\/div>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/2%20Regs/20900_NCOIDEH155_Supplemental_oxygen_non-pressurised_helicopters.htm","sub":[{"id":"x-AMC1-NCO-IDE-H-155","kind":"AMC","label":"AMC1 NCO.IDE.H.155","title":"AMC1 NCO.IDE.H.155 Supplemental oxygen – non-pressurised helicopters","h":"<h3><a><\/a>AMC1 NCO.IDE.H.155 Supplemental oxygen – non-pressurised helicopters&nbsp;&nbsp;&nbsp;&nbsp;<\/h3> <p>CAA ORS9 Decision No. 1<\/p> <p>DETERMINATION OF OXYGEN<\/p> <p>The amount of oxygen should be determined on the basis of cabin pressure altitude and flight duration, consistent with the operating procedures, including emergency procedures, established for each operation and the routes to be flown as specified in the AFM.<\/p> <p>&nbsp;<\/p>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/3%20AMC/AMC1%20NCO%20IDE%20H%20155%20Supplemental.htm"},{"id":"x-AMC2-NCO-IDE-H-155","kind":"AMC","label":"AMC2 NCO.IDE.H.155","title":"AMC2 NCO.IDE.H.155 Supplemental oxygen supply – non- pressurised helicopters","h":"<h3><a><\/a>AMC2 NCO.IDE.H.155 Supplemental oxygen supply – non- pressurised helicopters&nbsp;&nbsp;&nbsp;&nbsp;<\/h3> <p>CAA ORS9 Decision No. 1<\/p> <p>OXYGEN SUPPLY<\/p> <p>The need for oxygen supply, when required by NCO.OP.190, may be met either by means of installed equipment or portable equipment.<\/p> <p>&nbsp;<\/p>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/3%20AMC/AMC2%20NCO%20IDE%20H%20155%20Supplemental.htm"}]},{"id":"r-NCO-IDE-H-160","ref":"NCO.IDE.H.160","title":"Hand fire extinguishers","h":"<h1>NCO.IDE.H.160 Hand fire extinguishers <\/h1> <div> <p>(a)&nbsp;Helicopters, except ELA2 helicopters, shall be equipped with at least one hand fire extinguisher:<\/p> <p>(1)&nbsp;&nbsp;in the flight crew compartment; and<\/p> <p>(2)&nbsp;&nbsp;in each passenger compartment that is separate from the flight crew compartment, except if the compartment is readily accessible to the flight crew.<\/p> <p>(b)&nbsp;The type and quantity of extinguishing agent for the required fire extinguishers shall be suitable for the type of fire likely to occur in the compartment where the extinguisher is intended to be used and to minimise the hazard of toxic gas concentration in compartments occupied by persons.<\/p> <p>&nbsp;<\/p> <\/div>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/2%20Regs/20930_NCOIDEH160_Hand_fire_extinguishers.htm","sub":[]},{"id":"r-NCO-IDE-H-165","ref":"NCO.IDE.H.165","title":"Marking of break-in points","h":"<h1>NCO.IDE.H.165 Marking of break-in points <\/h1> <div> <p>If areas of the helicopter’s fuselage suitable for break-in by rescue crews in an emergency are marked, such areas shall be marked as shown in Figure 1.<\/p> <p>Figure 1&nbsp;Marking of break-in points<\/p> <p> <img src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAhAAAADtCAYAAADuk0xnAAAAAXNSR0IArs4c6QAAAARnQU1BAACxjwv8YQUAAAAJcEhZcwAADsMAAA7DAcdvqGQAAEoOSURBVHhe7Z13YBRHtu7ffy/cd3cdwGCc1tebHda767z7du/a6wxO6117HXDABptoY5ucRM5BOQACFEACESSCCAIkEAqAQERJJIEiyjnL36tTMy0GSSCNmJFGo++HjzXTXV1d3X3q1DfV1dX/48cff8xVVk6j0Wg0Go3WTssVAVEOQgghhJB2ItqBAoIQQgghVuFUAkIdh7JGNDaazPT9R/NaQshNMdeXH831x6hDhBDSGio+OIeA0IFPiYeaqgoU5OYgOzcftfUMgIS0D1VPzOKhorQA2Vm5KCmrQEMD6xAhpHWcRECYfjlV5F9Bwr4dWL1qDcI2bsKemGRUKxHRHElrjRHi7GhfV+IhJyUJG9YGIzhoLcK278Opi9mosaxDzepG22bejhDidKg67gQCQgJVYz2OR2/F4rkzMdc3CBvXrsGS6fOQlFWJRosgJkGtrqYalZWVqK6pQ2NDAxrq6lBTU4PqqgpUVNagvr4OVRUVqKpWn+UXmHlbQpwVfeuvrgybPadhyuylCFq7Dq6ungiO2IsrRZW63uh6JulU/aisKEdlda3uoWhsqEd9XS1qqqtRray2tg51tdWqLlWiTnoBzfsghDgXDiMgbuWeq2zT2FCN9f5e+GH6XOy6UoGc1CSs/P5D+O7KRL1SEJJGgl9JfhZOHk3Avj1RiDt8HFcys5B7/gz27tqLhMSD2LVzD44mJSMhOgpR0Ym4mFWIWksFYiWm/ZqMEHug/f8W6o/wY6MS0lUZmDX8HfhsiUZmQSF2BfjC1ScAMam5SoQrH1b511SV4VJKMqL37cGefTFIycjD1aw0HEmIQ3R0NKJjonHgUBwOH4nH/r37kHQy/ZZuJRp1p6PbE0Lsh6qXXS8gJPBJj0BJSYn69V9vXtp+JLg0NtZgZ9hqTJs7G2sPn8bh6AgsHDYAC31OoM58H7exoQb7w9dhycJFmOkyHfMWuSEsfBuig73x7/6fwX2FN74b8i8MnzgX3otmYcSQsQjcEoer5daXSZB9yvFUVFSgvLxcHychtkb8TOpPWVkZ6urq9Hdr+fHHBjTW5MBr0hB4BW3B0eQTWLdoJsbN8kLY0Uw0qDwbaiuRmXoUHrOnY/6ixZg64Xv4bD6I2MgVmDD2O4yZOBVTJ47D8JHfYer8xZgzdQImTPFBTkmN8v2OlOlH3TModUf+duS4CCH2Q9XJrhUQEhRqa2tx/vx57N27VwcLa5E8pHHOS03Eet+FGDPJBVMmj8GgAX/DIu9kUzeqBMCqbIwZPRmLAyORmpGJuIMx2LgxFNtXeeHD16biXHYxQr0/xz+mLcOZC2fhM3wE3BZtwOnLVWp7tR/z/tqL7FOO59ixYzh69GiHxBEhN8Pw/ZSUFCQmJqK4uFgvsxbZRt8G3BkCl2kumDdnBoa+/08M/G4+Qo9maQFRXZiF+FBffPzvacgoq0VGUiQ2bTqAg5uWYvLMqQjZGY3o9aGY/t0sLAtPwKn49Rg26HMkXCnStwKtQZdHWUZGBg4fPowrV640LSOEOAaqPna9gKiqqsL+/fsxdep
