 functionality of non-installed instruments and equipment required by this Subpart and that do not need an equipment approval, as listed in NCO.IDE.A.100(b), should be checked against recognised industry standards appropriate to the intended purpose. The operator is responsible for ensuring the maintenance of these instruments and equipment.<\/p> <p>&nbsp;<\/p>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/4%20GM/GM1%20NCO%20IDE%20A%20100%20b%20Instruments.htm"},{"id":"x-GM1-NCO-IDE-A-100-c","kind":"GM","label":"GM1 NCO.IDE.A.100(c)","title":"GM1 NCO.IDE.A.100(c) Instruments and equipment – general","h":"<h4><a><\/a>GM1 NCO.IDE.A.100(c) Instruments and equipment – general&nbsp;&nbsp;&nbsp;&nbsp;<\/h4> <p>CAA ORS9 Decision No. 1<\/p> <p>NOT REQUIRED INSTRUMENTS AND EQUIPMENT THAT DO NOT NEED TO BE APPROVED IN ACCORDANCE WITH THE APPLICABLE AIRWORTHINESS REQUIREMENTS, BUT ARE CARRIED ON A FLIGHT<\/p> <p>(a) The provision of this paragraph does not exempt any installed instrument or item of equipment from complying with the applicable airworthiness requirements. In this case, the installation should be approved as required in the applicable airworthiness requirements and should comply with the applicable Certification Specifications.<\/p> <p>(b) The failure of additional non-installed instruments or equipment not required by this Part or by the applicable airworthiness requirements or any applicable airspace requirements should not adversely affect the airworthiness and/or the safe operation of the aeroplane. Examples may be the following:<\/p> <ol> <p> <\/p><p>(1) portable electronic flight bag (EFB);<\/p> <p><\/p> <p> <\/p><p>(2) portable electronic devices carried by crew members; and<\/p> <p><\/p> <p> <\/p><p>(3) non-installed passenger entertainment equipment.<\/p> <p>&nbsp;<\/p> <p><\/p> <\/ol>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/4%20GM/GM1%20NCO%20IDE%20A%20100%20c%20Instruments.htm"}]},{"id":"r-NCO-IDE-A-105","ref":"NCO.IDE.A.105","title":"Minimum equipment for flight","h":"<h1>NCO.IDE.A.105 Minimum equipment for flight <\/h1> <div> <p>A flight shall not be commenced when any of the aeroplane instruments, items of equipment or functions required for the intended flight are inoperative or missing, unless:<\/p> <p>(a)&nbsp;the aeroplane is operated in accordance with the MEL, if established; or<\/p> <p>(b)&nbsp;the aeroplane is subject to a permit to fly issued in accordance with the applicable airworthiness requirements.<\/p> <p>&nbsp;<\/p> <\/div>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/2%20Regs/20020_NCOIDEA105_Minimum_equipment_for_flight.htm","sub":[{"id":"x-AMC1-NCO-IDE-A-105","kind":"AMC","label":"AMC1 NCO.IDE.A.105","title":"AMC1 NCO.IDE.A.105 Minimum equipment for flight","h":"<h3>AMC1 NCO.IDE.A.105 Minimum equipment for flight<\/h3> <p>CAA&nbsp;ORS9 Decision No. 15<\/p> <p>MANAGEMENT OF THE STATUS OF CERTAIN INSTRUMENTS, EQUIPMENT OR FUNCTIONS<\/p> <p>The operator should control and retain the status of the instruments, equipment or functions required for the intended operation, that are not controlled for the purpose of continuing airworthiness management.<\/p> <p>&nbsp;<\/p>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/3%20AMC/AMC1%20NCO%20IDE%20A%20105%20Minimum.htm"},{"id":"x-GM1-NCO-IDE-A-105","kind":"GM","label":"GM1 NCO.IDE.A.105","title":"GM1 NCO.IDE.A.105 Minimum equipment for flight","h":"<h4>GM1 NCO.IDE.A.105 Minimum equipment for flight<\/h4> <p>CAA&nbsp;ORS9 Decision No. 15<\/p> <p>MANAGEMENT OF THE STATUS OF CERTAIN INSTRUMENTS, EQUIPMENT OR FUNCTIONS<\/p> <p>(a)&nbsp;&nbsp;&nbsp;&nbsp;The operator should define responsibilities and procedures to retain and control the status of instruments, equipment or functions required for the intended operation, that are not controlled for the purpose of continuing airworthiness management.<\/p> <p>(b)&nbsp;&nbsp;&nbsp;&nbsp;Examples of such instruments, equipment or functions may be, but are not limited to, equipment related to navigation approvals as FM immunity or certain software versions.<\/p> <p>&nbsp;<\/p>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/4%20GM/GM1%20NCO%20IDE%20A%20105%20Minimum.htm"}]},{"id":"r-NCO-IDE-A-110","ref":"NCO.IDE.A.110","title":"Spare electrical fuses","h":"<h1>NCO.IDE.A.110 Spare electrical fuses <\/h1> <div> <p>Aeroplanes shall be equipped with spare electrical fuses, of the ratings required for complete circuit protection, for replacement of those fuses that are allowed to be replaced in flight.<\/p> <p>&nbsp;<\/p> <\/div>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/2%20Regs/20050_NCOIDEA110_Spare_electrical_fuses.htm","sub":[{"id":"x-GM1-NCO-IDE-A-110","kind":"GM","label":"GM1 NCO.IDE.A.110","title":"GM1 NCO.IDE.A.110 Spare electrical fuses","h":"<h4><a><\/a>GM1 NCO.IDE.A.110 Spare electrical fuses&nbsp;&nbsp;&nbsp;&nbsp;<\/h4> <p>CAA ORS9 Decision No. 1<\/p> <p>FUSES<\/p> <p>A spare electrical fuse means a replaceable fuse in the flight crew compartment, not an automatic circuit breaker or circuit breakers in the electric compartments.<\/p> <p>&nbsp;<\/p>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/4%20GM/GM1%20NCO%20IDE%20A%20110%20Spare%20electrical.htm"}]},{"id":"r-NCO-IDE-A-115","ref":"NCO.IDE.A.115","title":"Operating lights","h":"<h1>NCO.IDE.A.115 Operating lights <\/h1> <div> <p>Aeroplanes operated at night shall be equipped with:<\/p> <p>(a)&nbsp;an anti-collision light system;<\/p> <p>(b)&nbsp;navigation/position lights;<\/p> <p>(c)&nbsp;a landing light;<\/p> <p>(d)&nbsp;lighting supplied from the aeroplane’s electrical system to provide adequate illumination for all instruments and equipment essential to the safe operation of the aeroplane;<\/p> <p>(e)&nbsp;lighting supplied from the aeroplane’s electrical system to provide illumination in all passenger compartments;<\/p> <p>(f)&nbsp;an independent portable light for each crew member station; and<\/p> <p>(g)&nbsp;lights to conform with the International Regulations for Preventing Collisions at Sea if the aeroplane is operated as a seaplane.<\/p> <p>&nbsp;<\/p> <\/div>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/2%20Regs/20080_NCOIDEA115_Operating_lights.htm","sub":[]},{"id":"r-NCO-IDE-A-120","ref":"NCO.IDE.A.120","title":"Operations under VFR — flight and navigational instruments and associated equipment","h":"<h1>NCO.IDE.A.120 Operations under VFR — flight and navigational instruments and associated equipment <\/h1> <div> <p>(a)&nbsp;Aeroplanes operated under VFR by day shall be equipped with a means of measuring and displaying the following:<\/p> <p>(1)&nbsp;&nbsp;magnetic heading;<\/p> <p>(2)&nbsp;&nbsp;time, in hours, minutes and seconds;<\/p> <p>(3)&nbsp;&nbsp;barometric altitude;<\/p> <p>(4)&nbsp;&nbsp;indicated airspeed; and<\/p> <p>(5)&nbsp;&nbsp;Mach number, whenever speed limitations are expressed in terms of Mach number.<\/p> <p>(b)&nbsp;Aeroplanes operated under visual meteorological conditions (VMC) at night, or in conditions where the aeroplane cannot be maintained in a desired flight path without reference to one or more additional instruments, shall be, in addition to (a), equipped with:<\/p> <p>(1)&nbsp;&nbsp;a means of measuring and displaying the following:<\/p> <p>(i)&nbsp;&nbsp;turn and slip;<\/p> <p>(ii)&nbsp;&nbsp;attitude;<\/p> <p>(iii)&nbsp;&nbsp;vertical speed; and<\/p> <p>(iv)&nbsp;&nbsp;stabilised heading;<\/p> <p>&nbsp;and<\/p> <p>(2)&nbsp;&nbsp;a means of indicating when the supply of power to the gyroscopic instruments is not adequate.<\/p> <p>(c)&nbsp;Aeroplanes operated in conditions where they cannot be maintained in a desired flight path without reference to one or more additional instruments, shall be, in addition to (a) and (b), equipped with a means of preventing malfunction of the airspeed indicating system required in (a)(4) due to condensation or icing.<\/p> <p>&nbsp;<\/p> <\/div>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/2%20Regs/20110_NCOIDEA120_Operations_under_VFR_flight_and_navigational_instruments_an.htm","sub":[{"id":"x-AMC2-NCO-IDE-A-120","kind":"AMC","label":"AMC2 NCO.IDE.A.120","title":"AMC2 NCO.IDE.A.120 Operations under VFR – flight and navigational instruments and associated equipment","h":"<h3><a><\/a>AMC2 NCO.IDE.A.120 Operations under VFR – flight and navigational instruments and associated equipment&nbsp;&nbsp;&nbsp;&nbsp;<\/h3> <p>CAA ORS9 Decision No. 1<\/p> <p>LOCAL FLIGHTS<\/p> <p>For flights that do not exceed 60 minutes duration, that take off and land at the same aerodrome, and that remain within 50 NM of that aerodrome, an equivalent means of complying with NCO.IDE.A.120(b)(1)(i), (b)(1)(ii) may be:<\/p> <p>(a) a turn and slip indicator;<\/p> <p>(b) a turn co-ordinator; or<\/p> <p>(c) both an attitude indicator and a slip indicator.<\/p> <p>&nbsp;<\/p>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/3%20AMC/AMC2%20NCO%20IDE%20A%20120%20Operations.htm"},{"id":"x-AMC1-NCO-IDE-A-120-a-1-u0026NCO-IDE-A-125-a-1","kind":"AMC","label":"AMC1 NCO.IDE.A.120(a)(1)\\u0026NCO.IDE.A.125(a)(1)","title":"AMC1 NCO.IDE.A.120(a)(1)\\u0026NCO.IDE.A.125(a)(1) Operations under VFR \\u0026 operations under IFR – flight and navigational instruments and associated equipment","h":"<h3><a><\/a>AMC1 NCO.IDE.A.120(a)(1)&amp;NCO.IDE.A.125(a)(1) Operations under&nbsp;VFR &amp; operations under IFR – flight and navigational instruments and associated equipment&nbsp;&nbsp;&nbsp;&nbsp;<\/h3> <p>CAA ORS9 Decision No. 1<\/p> <p>MEANS OF MEASURING AND DISPLAYING MAGNETIC HEADING<\/p> <p>The means of measuring and displaying magnetic direction should be a magnetic compass or equivalent.<\/p> <p>&nbsp;<\/p>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/3%20AMC/AMC1%20NCO%20IDE%20A%20120%20a%201%20NCO.htm"},{"id":"x-AMC1-NCO-IDE-A-120-a-2-u0026NCO-IDE-A-125-a-2","kind":"AMC","label":"AMC1 NCO.IDE.A.120(a)(2)\\u0026NCO.IDE.A.125(a)(2)","title":"AMC1 NCO.IDE.A.120(a)(2)\\u0026NCO.IDE.A.125(a)(2) Operations under VFR \\u0026 operations under IFR – flight and navigational instruments and associated equipment","h":"<h3><a><\/a>AMC1 NCO.IDE.A.120(a)(2)&amp;NCO.IDE.A.125(a)(2) Operations under&nbsp;VFR &amp; operations under IFR – flight and navigational instruments and associated equipment&nbsp;&nbsp;&nbsp;&nbsp;<\/h3> <p>CAA ORS9 Decision No. 1<\/p> <p>MEANS OF MEASURING AND DISPLAYING THE TIME<\/p> <p>A means of measuring and displaying the time in hours, minutes and seconds may be a wrist watch capable of the same functions.<\/p> <p>&nbsp;<\/p>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/3%20AMC/AMC1%20NCO%20IDE%20A%20120%20a%202%20NCO.htm"},{"id":"x-AMC1-NCO-IDE-A-120-a-3-u0026NCO-IDE-A-125-a-3","kind":"AMC","label":"AMC1 NCO.IDE.A.120(a)(3)\\u0026NCO.IDE.A.125(a)(3)","title":"AMC1 NCO.IDE.A.120(a)(3)\\u0026NCO.IDE.A.125(a)(3) Operations under VFR operations \\u0026 operations under IFR – flight and navigational  instruments and associated equipment","h":"<h3><a><\/a>AMC1 NCO.IDE.A.120(a)(3)&amp;NCO.IDE.A.125(a)(3) Operations under&nbsp;VFR operations &amp; operations under IFR – flight and navigational instruments and associated equipment&nbsp;&nbsp;&nbsp;&nbsp;<\/h3> <p>CAA ORS9 Decision No. 1<\/p> <p>CALIBRATION OF THE MEANS OF MEASURING AND DISPLAYING PRESSURE ALTITUDE<\/p> <p>The instrument measuring and displaying barometric altitude should be of a sensitive type calibrated in feet (ft), with a sub-scale setting, calibrated in hectopascals/millibars, adjustable for any barometric pressure likely to be set during flight.<\/p> <p>&nbsp;<\/p>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/3%20AMC/AMC1%20NCO%20IDE%20A%20120%20a%203%20NCO.htm"},{"id":"x-AMC1-NCO-IDE-A-120-a-4-u0026NCO-IDE-A-125-a-4","kind":"AMC","label":"AMC1 NCO.IDE.A.120(a)(4)\\u0026NCO.IDE.A.125(a)(4)","title":"AMC1 NCO.IDE.A.120(a)(4)\\u0026NCO.IDE.A.125(a)(4) Operations under VFR \\u0026 operations under IFR – flight and navigational instruments  and associated equipment","h":"<h3><a><\/a>AMC1 NCO.IDE.A.120(a)(4)&amp;NCO.IDE.A.125(a)(4) Operations under VFR &amp; operations under IFR – flight and navigational instruments and associated equipment&nbsp;&nbsp;&nbsp;&nbsp;<\/h3> <p>CAA ORS9 Decision No. 1<\/p> <p>CALIBRATION OF THE INSTRUMENT INDICATING AIRSPEED<\/p> <p>(a) The instrument indicating airspeed should be calibrated in knots (kt).<\/p> <p>(b) In the case of aeroplanes with a maximum certified take-off mass (MCTOM) below 2 000 kg, calibration in kilometres per hour (kph) or in miles per hour (mph) is acceptable when such units are used in the AFM.<\/p> <p>&nbsp;<\/p>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/3%20AMC/AMC1%20NCO%20IDE%20A%20120%20a%204%20NCO.htm"},{"id":"x-AMC1-NCO-IDE-A-120-c-u0026NCO-IDE-A-125-c","kind":"AMC","label":"AMC1 NCO.IDE.A.120(c)\\u0026NCO.IDE.A.125(c)","title":"AMC1 NCO.IDE.A.120(c)\\u0026NCO.IDE.A.125(c) Operations under IFR — flight and navigational instruments and associated equipment","h":"<h3><a><\/a>AMC1 NCO.IDE.A.120(c)&amp;NCO.IDE.A.125(c) Operations under IFR — flight and navigational instruments and associated equipment&nbsp;&nbsp;&nbsp;&nbsp;<\/h3> <p>CAA ORS9 Decision No. 1<\/p> <p>MEANS OF PREVENTING MALFUNCTION DUE TO CONDENSATION OR ICING<\/p> <p>The means of preventing malfunction due to either condensation or icing of the airspeed indicating system should be a heated pitot tube or equivalent.<\/p> <p>&nbsp;<\/p>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/3%20AMC/AMC1%20NCO%20IDE%20A%20120%20c%20NCO%20IDE.htm"},{"id":"x-AMC1-NCO-IDE-A-120-u0026NCO-IDE-A-125","kind":"AMC","label":"AMC1 NCO.IDE.A.120\\u0026NCO.IDE.A.125","title":"AMC1 NCO.IDE.A.120\\u0026NCO.IDE.A.125 Operations under VFR \\u0026 operations under IFR – flight and navigational instruments and associated equipment","h":"<h3><a><\/a>AMC1 NCO.IDE.A.120&amp;NCO.IDE.A.125 Operations under VFR &amp; operations under IFR – flight and navigational instruments and associated equipment&nbsp;&nbsp;&nbsp;&nbsp;<\/h3> <p>CAA ORS9 Decision No. 1<\/p> <p>INTEGRATED INSTRUMENTS<\/p> <p>(a) Individual equipment requirements may be met by combinations of instruments, by integrated flight systems or by a combination of parameters on electronic displays. The information so available to each required pilot should not be less than that required in the applicable operational requirements, and the equivalent safety of the installation should be approved during type certification of the aeroplane for the intended type of operation.<\/p> <p>(b) The means of measuring and indicating turn and slip, aeroplane attitude and stabilised aeroplane heading may be met by combinations of instruments or by integrated flight director systems, provided that the safeguards against total failure, inherent in the three separate instruments, are retained.<\/p> <p>&nbsp;<\/p>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/3%20AMC/AMC1%20NCO%20IDE%20A%20120%20NCO%20IDE.htm"},{"id":"x-GM1-NCO-IDE-A-120","kind":"GM","label":"GM1 NCO.IDE.A.120","title":"GM1 NCO.IDE.A.120 Operations under VFR – flight and navigational  instruments and associated equipment","h":"<h4><a><\/a>GM1 NCO.IDE.A.120 Operations under VFR – flight and navigational instruments and associated equipment&nbsp;&nbsp;&nbsp;&nbsp;<\/h4> <p>CAA ORS9 Decision No. 1<\/p> <p>SLIP INDICATION<\/p> <p>Aeroplanes should be equipped with a means of measuring and displaying slip.<\/p> <p>&nbsp;<\/p>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/4%20GM/GM1%20NCO%20IDE%20A%20120%20Operations.htm"}]},{"id":"r-NCO-IDE-A-125","ref":"NCO.IDE.A.125","title":"Operations under IFR — flight and navigational instruments and associated equipment","h":"<h1>NCO.IDE.A.125 Operations under IFR — flight and navigational instruments and associated equipment <\/h1> <div> <p>Aeroplanes operated under IFR shall be equipped with:<\/p> <p>(a)&nbsp;a means of measuring and displaying the following:<\/p> <p>(1)&nbsp;&nbsp;magnetic heading;<\/p> <p>(2)&nbsp;&nbsp;time in hours, minutes and seconds;<\/p> <p>(3)&nbsp;&nbsp;barometric altitude;<\/p> <p>(4)&nbsp;&nbsp;indicated airspeed;<\/p> <p>(5)&nbsp;&nbsp;vertical speed;<\/p> <p>(6)&nbsp;&nbsp;turn and slip;<\/p> <p>(7)&nbsp;&nbsp;attitude;<\/p> <p>(8)&nbsp;&nbsp;stabilised heading;<\/p> <p>(9)&nbsp;&nbsp;outside air temperature; and<\/p> <p>(10)&nbsp;&nbsp;Mach number, whenever speed limitations are expressed in terms of Mach number;<\/p> <p>(b)&nbsp;a means of indicating when the supply of power to the gyroscopic instruments is not adequate; and<\/p> <p>(c)&nbsp;a means of preventing malfunction of the airspeed indicating system required in (a)(4) due to condensation or icing.<\/p> <p>&nbsp;<\/p> <\/div>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/2%20Regs/20140_NCOIDEA125_Operations_under_IFR_flight_and_navigational_instruments_an.htm","sub":[{"id":"x-AMC1-NCO-IDE-A-125-a-9","kind":"AMC","label":"AMC1 NCO.IDE.A.125(a)(9)","title":"AMC1 NCO.IDE.A.125(a)(9) Operations under IFR – flight and navigational instruments and associated equipment","h":"<h3><a><\/a>AMC1 NCO.IDE.A.125(a)(9) Operations under IFR – flight and navigational instruments and associated equipment<\/h3> <p>CAA ORS9 Decision No. 1<\/p> <p>MEANS OF DISPLAYING OUTSIDE AIR TEMPERATURE<\/p> <ol> <li value=\"1\"> <p>The means of displaying outside air temperature should be calibrated in degrees Celsius.<\/p> <\/li> <li value=\"2\"> <p>In the case of aeroplanes with a maximum certified take-off mass (MCTOM) below 2&nbsp;000&nbsp;kg, calibration in degrees Fahrenheit is acceptable, when such unit is used in the AFM.<\/p> <\/li> <li value=\"3\"> <p>The means of displaying outside air temperature may be an air temperature indicator that provides indications that are convertible to outside air temperature.<\/p> <\/li> <\/ol> <p>&nbsp;<\/p>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/3%20AMC/AMC1%20NCO%20IDE%20A%20125%20a%209%20Operations.htm"},{"id":"x-GM1-NCO-IDE-A-125","kind":"GM","label":"GM1 NCO.IDE.A.125","title":"GM1 NCO.IDE.A.125 Operations under IFR – flight and navigational instruments and associated equipment","h":"<h4><a><\/a>GM1 NCO.IDE.A.125 Operations under IFR – flight and navigational instruments and associated equipment&nbsp;&nbsp;&nbsp;&nbsp;<\/h4> <p>CAA ORS9 Decision No. 1<\/p> <p>ALTERNATE SOURCE OF STATIC PRESSURE<\/p> <p>Aeroplanes should be equipped with an alternate source of static pressure.<\/p> <p>&nbsp;<\/p>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/4%20GM/GM1%20NCO%20IDE%20A%20125%20Operations.htm"},{"id":"x-GM1-NCO-IDE-A-125-a-3","kind":"GM","label":"GM1 NCO.IDE.A.125(a)(3)","title":"GM1 NCO.IDE.A.125(a)(3) Operations under IFR – flight and navigational instruments and associated equipment","h":"<h4><a><\/a>GM1 NCO.IDE.A.125(a)(3) Operations under IFR – flight and navigational instruments and associated equipment&nbsp;&nbsp;&nbsp;&nbsp;<\/h4> <p>CAA ORS9 Decision No. 1<\/p> <p>ALTIMETERS<\/p> <p>Altimeters with counter drum-pointer or equivalent presentation are considered to be less susceptible to misinterpretation for aeroplanes operating above 10 000 ft.<\/p> <p>&nbsp;<\/p>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/4%20GM/GM1%20NCO%20IDE%20A%20125%20a%203%20Operations.htm"}]},{"id":"r-NCO-IDE-A-130","ref":"NCO.IDE.A.130","title":"Terrain awareness warning system (TAWS)","h":"<h1>NCO.IDE.A.130 Terrain awareness warning system (TAWS) <\/h1> <div> <p>Turbine-powered aeroplanes certified for a maximum passenger seating configuration of more than nine shall be equipped with a TAWS that meets the requirements for:<\/p> <p>(a)&nbsp;class A equipment, as specified in an acceptable standard, in the case of aeroplanes for which the individual certificate of airworthiness (CofA) was first issued after 1 January 2011; or<\/p> <p>(b)&nbsp;class B equipment, as specified in an acceptable standard, in the case of aeroplanes for which the individual CofA was first issued on or before 1 January 2011.<\/p> <p>&nbsp;<\/p> <\/div>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/2%20Regs/20170_NCOIDEA130_Terrain_awareness_warning_system_TAWS.htm","sub":[{"id":"x-AMC1-NCO-IDE-A-130","kind":"AMC","label":"AMC1 NCO.IDE.A.130","title":"AMC1 NCO.IDE.A.130 Terrain awareness warning system (TAWS)","h":"<h3><a><\/a>AMC1 NCO.IDE.A.130 Terrain awareness warning system (TAWS)&nbsp;&nbsp;&nbsp;&nbsp;<\/h3> <p>CAA ORS9 Decision No. 1<\/p> <p>EXCESSIVE DOWNWARDS GLIDESLOPE DEVIATION WARNING FOR CLASS A TAWS<\/p> <p>The requirement for a Class A TAWS to provide a warning to the flight crew for excessive downwards glideslope deviation should apply to all final approach glideslopes with angular vertical navigation (VNAV) guidance, whether provided by the instrument landing system (ILS), microwave landing system (MLS), satellite-based augmentation system approach procedure with vertical guidance (SBAS APV (localiser performance with vertical guidance approach LPV)), ground-based augmentation system (GBAS (GPS landing system, GLS)) or any other systems providing similar guidance. The same requirement should not apply to systems providing vertical guidance based on barometric VNAV.<\/p> <p>&nbsp;<\/p>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/3%20AMC/AMC1%20NCO%20IDE%20A%20130%20Terrain.htm"},{"id":"x-GM1-NCO-IDE-A-130","kind":"GM","label":"GM1 NCO.IDE.A.130","title":"GM1 NCO.IDE.A.130 Terrain awareness warning system (TAWS)","h":"<h4><a><\/a>GM1 NCO.IDE.A.130 Terrain awareness warning system (TAWS)&nbsp;&nbsp;&nbsp;&nbsp;<\/h4> <p>CAA ORS9 Decision No. 1<\/p> <p>ACCEPTABLE STANDARD FOR TAWS<\/p> <p>An acceptable standard for Class A and Class B TAWS may be the applicable Technical Standards Order (TSO) issued by the CAA or equivalent.<\/p> <p>&nbsp;<\/p>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/4%20GM/GM1%20NCO%20IDE%20A%20130%20Terrain.htm"}]},{"id":"r-NCO-IDE-A-135","ref":"NCO.IDE.A.135","title":"Flight crew interphone system","h":"<h1>NCO.IDE.A.135 Flight crew interphone system <\/h1> <div> <p>Aeroplanes operated by more than one flight crew member shall be equipped with a flight crew interphone system, including headsets and microphones for use by all flight crew members.<\/p> <p>&nbsp;<\/p> <\/div>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/2%20Regs/20200_NCOIDEA135_Flight_crew_interphone_system.htm","sub":[{"id":"x-AMC1-NCO-IDE-A-135","kind":"AMC","label":"AMC1 NCO.IDE.A.135","title":"AMC1 NCO.IDE.A.135 Flight crew interphone system","h":"<h3><a><\/a>AMC1 NCO.IDE.A.135 Flight crew interphone system&nbsp;&nbsp;&nbsp;&nbsp;<\/h3> <p>CAA ORS9 Decision No. 1<\/p> <p>GENERAL<\/p> <p>(a) The flight crew interphone system should not be of a handheld type.<\/p> <p>(b) A headset consists of a communication device that includes two earphones to receive and a microphone to transmit audio signals to the aeroplane’s communication system. To comply with the minimum performance requirements, the earphones and microphone should match the communication system’s characteristics and the flight crew compartment environment. The headset should be adequately adjustable in order to fit the pilot’s head. Headset boom microphones should be of the noise cancelling type.<\/p> <p>(c) If the intention is to utilise noise cancelling earphones, the pilot-in-command should ensure that the earphones do not attenuate any aural warnings or sounds necessary for alerting the flight crew on matters related to the safe operation of the aeroplane.<\/p> <p>&nbsp;<\/p>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/3%20AMC/AMC1%20NCO%20IDE%20A%20135%20Flight.htm"},{"id":"x-GM1-NCO-IDE-A-135","kind":"GM","label":"GM1 NCO.IDE.A.135","title":"GM1 NCO.IDE.A.135 Flight crew interphone system","h":"<h4><a><\/a>GM1 NCO.IDE.A.135 Flight crew interphone system&nbsp;&nbsp;&nbsp;&nbsp;<\/h4> <p>CAA ORS9 Decision No. 1<\/p> <p>HEADSET<\/p> <p>The term ‘headset’ includes any aviation helmet incorporating headphones and microphone worn by a flight crew member.<\/p> <p>&nbsp;<\/p>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/4%20GM/GM1%20NCO%20IDE%20A%20135%20Flight%20crew.htm"}]},{"id":"r-NCO-IDE-A-140","ref":"NCO.IDE.A.140","title":"Seats, seat safety belts, restraint systems and child restraint devices","h":"<h1>NCO.IDE.A.140 Seats, seat safety belts, restraint systems and child restraint devices <\/h1> <div> <p>(a)&nbsp;Aeroplanes shall be equipped with:<\/p> <p>(1)&nbsp;&nbsp;a seat or berth for each person on board who is aged 24 months or more;<\/p> <p>(2)&nbsp;&nbsp;a seat belt on each seat and restraining belts for each berth;<\/p> <p>(3)&nbsp;&nbsp;a child restraint device (CRD) for each person on board younger than 24 months; and<\/p> <p>(4)&nbsp;&nbsp;a seat belt with upper torso restraint system on each flight crew seat, having a single point release for aeroplanes having a CofA first issued on or after 25 August 2016.<\/p> <p>&nbsp;<\/p> <\/div>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/2%20Regs/20230_NCOIDEA140_Seats_seat_safety_belts_restraint_systems_and_child_restraint.htm","sub":[{"id":"x-AMC1-NCO-IDE-A-140","kind":"AMC","label":"AMC1 NCO.IDE.A.140","title":"AMC1 NCO.IDE.A.140 Seats, seat safety belts, restraint systems and  child restraint devices","h":"<h3><a><\/a>AMC1 NCO.IDE.A.140 Seats, seat safety belts, restraint systems and child restraint devices&nbsp;&nbsp;&nbsp;&nbsp;<\/h3> <p>CAA ORS9 Decision No. 1<\/p> <p>CHILD RESTRAINT DEVICES (CRDs)<\/p> <p>(a) A CRD is considered to be acceptable if:<\/p> <ol> <p> <\/p><p>(1) it is a supplementary loop belt manufactured with the same techniques and the same materials as the approved safety belts; or<\/p> <p><\/p> <p> <\/p><p>(2) it complies with (b).<\/p> <p><\/p> <\/ol> <p>(b) Provided the CRD can be installed properly on the respective aircraft seat, the following CRDs are considered acceptable:<\/p> <ol> <p> <\/p><p>(1) CRDs approved for use in aircraft according to the European Technical Standard Order ETSO-C100c on Aviation Child Safety Device (ACSD);<\/p> <p><\/p> <p> <\/p><p>(2) CRDs approved through a Type Certificate or Supplemental Type Certificate;<\/p> <p><\/p> <p> <\/p><p>(3) Child seats approved for use in motor vehicles on the basis of the technical standard specified in (i). The child seat must be also approved for use in aircraft on the basis of the technical standard specified in either point (ii) or point (iii):<\/p> <ol> <p> <\/p><p>(i) UN Standard ECE R44-04 (or 03), or ECE R129 bearing the respective ‘ECE R’ label; and<\/p> <p><\/p> <p> <\/p><p>(ii) German ‘Qualification Procedure for Child Restraint Systems for Use in Aircraft’ (TÜV/958-01/2001) bearing the label ‘For Use in Aircraft’; or<\/p> <p><\/p> <p> <\/p><p>(iii) Other technical standard acceptable to the CAA. The child seat should hold a qualification sign that it can be used in aircraft.<\/p> <p><\/p> <\/ol> <p><\/p> <p> <\/p><p>(4) Child seats approved for use in motor vehicles and aircraft according to Canadian CMVSS 213/213.1 bearing the respective label;<\/p> <p><\/p> <p> <\/p><p>(5) Child seats approved for use in motor vehicles and aircraft according to US FMVSS No 213 and bearing one or two labels displaying the following two sentences:<\/p> <ol> <p> <\/p><p>(i) ‘THIS CHILD RESTRAINT SYSTEM CONFORMS TO ALL APPLICABLE FEDERAL MOTOR VEHICLE SAFETY STANDARDS’; and<\/p> <p><\/p> <p> <\/p><p>(ii) in red letters ‘THIS RESTRAINT IS CERTIFIED FOR USE IN MOTOR VEHICLES AND AIRCRAFT’;<\/p> <p><\/p> <\/ol> <p><\/p> <p> <\/p><p>(6) Child seats approved for use in motor vehicles and aircraft according to Australia/New Zealand’s technical standard AS/NZS 1754:2013 bearing the green part on the label displaying ‘For Use in Aircraft’; and<\/p> <p><\/p> <p> <\/p><p>(7) CRDs manufactured and tested according to other technical standards equivalent to those listed above. The devices should be marked with an associated qualification sign, which shows the name of the qualification organisation and a specific identification number, related to the associated qualification project. The qualifying organisation should be a competent and independent organisation that is acceptable to the CAA.<\/p> <p><\/p> <\/ol> <p>(c) Location<\/p> <ol> <p> <\/p><p>(1) Forward-facing child seats may be installed on both forward-and rearward-facing passenger seats, but only when fitted in the same direction as the passenger seat on which they are positioned. Rearward-facing child seats should only be installed on forward-facing passenger seats. A child seat may not be installed within the radius of action of an airbag unless it is obvious that the airbag is de-activated or it can be demonstrated that there is no negative impact from the airbag.<\/p> <p><\/p> <p> <\/p><p>(2) An infant/child in a CRD should be located in the vicinity of a floor level exit.<\/p> <p><\/p> <p> <\/p><p>(3) An infant/child in a CRD should not hinder evacuation for any passenger.<\/p> <p><\/p> <\/ol> <p>(d) Installation<\/p> <ol> <p> <\/p><p>(1) CRDs tested and approved for use in aircraft should only be installed on a suitable passenger seat by the method shown in the manufacturer’s instructions provided with each CRD and with the type of connecting device they are approved for the installation in aircraft. CRDs designed to be installed only by means of rigid bar lower anchorages (ISOFIX or equivalent) should only be used on passenger seats equipped with such connecting devices and should not be secured by passenger seat lap belt.<\/p> <p><\/p> <p> <\/p><p>(2) All safety and installation instructions should be followed carefully by the responsible adult accompanying the infant/child. Operators should prohibit the use of a CRD not installed on the passenger seat according to the manufacturer’s instructions or not approved for use in aircraft.<\/p> <p><\/p> <p> <\/p><p>(3) If a forward-facing child seat with a rigid backrest is to be fastened by a seat lap belt, the restraint device should be fastened when the backrest of the passenger seat on which it rests is in a reclined position. Thereafter, the backrest is to be positioned upright. This procedure ensures better tightening of the child seat on the aircraft seat if the aircraft seat is reclinable.<\/p> <p><\/p> <p> <\/p><p>(4) The buckle of the adult safety belt should be easily accessible for both opening and closing, and should be in line with the seat belt halves (not canted) after tightening.<\/p> <p><\/p> <p> <\/p><p>(5) Forward-facing restraint devices with an integral harness must not be installed such that the adult safety belt is secured over the infant.<\/p> <p><\/p> <\/ol> <p>(e) Operation<\/p> <ol> <p> <\/p><p>(1) Each CRD should remain secured to a passenger seat during all phases of flight unless it is properly stowed when not in use.<\/p> <p><\/p> <p> <\/p><p>(2) Where a child seat is adjustable in recline, it should be in an upright position for all occasions when passenger restraint devices are required.<\/p> <p>&nbsp;<\/p> <p><\/p> <\/ol>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/3%20AMC/AMC1%20NCO%20IDE%20A%20140%20Seats%20seat.htm"},{"id":"x-AMC2-NCO-IDE-A-140","kind":"AMC","label":"AMC2 NCO.IDE.A.140","title":"AMC2 NCO.IDE.A.140 Seats, seat safety belts, restraint systems and  child restraint devices","h":"<h3><a><\/a>AMC2 NCO.IDE.A.140 Seats, seat safety belts, restraint systems and child restraint devices&nbsp;&nbsp;&nbsp;&nbsp;<\/h3> <p>CAA ORS9 Decision No. 1<\/p> <p>UPPER TORSO RESTRAINT SYSTEM<\/p> <p>(a) The following systems are deemed to be compliant with the requirement for an upper torso restraint system:<\/p> <ol> <p> <\/p><p>(1) A seat belt with a diagonal shoulder strap;<\/p> <p><\/p> <p> <\/p><p>(2) A restraint system having a seat belt and two shoulder straps that may be used independently;<\/p> <p><\/p> <p> <\/p><p>(3) A restraint system having a seat belt, two shoulder straps and additional straps that may be used independently.<\/p> <p><\/p> <\/ol> <p>(b) The use of the upper torso restraint independently from the use of the seat belt is intended as an option for the comfort of the occupant of the seat in those phases of flight where only the seat belt is required to be fastened. A restraint system including a seat belt and an upper torso restraint that both remain permanently fastened is also acceptable.<\/p> <p>SEAT BELT<\/p> <p>A seat belt with a diagonal shoulder strap (three anchorage points) is deemed to be compliant with the requirement for a seat belt (two anchorage points).<\/p> <p>&nbsp;<\/p>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/3%20AMC/AMC2%20NCO%20IDE%20A%20140%20Seats%20seat.htm"}]},{"id":"r-NCO-IDE-A-145","ref":"NCO.IDE.A.145","title":"First-aid kit","h":"<h1>NCO.IDE.A.145 First-aid kit <\/h1> <div> <p>(a)&nbsp;Aeroplanes shall be equipped with a first-aid kit.<\/p> <p>(b)&nbsp;The first-aid kit shall be:<\/p> <p>(1)&nbsp;&nbsp;readily accessible for use; and<\/p> <p>(2)&nbsp;&nbsp;kept up-to-date.<\/p> <p>&nbsp;<\/p> <\/div>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/2%20Regs/20260_NCOIDEA145_First-aid_kit.htm","sub":[{"id":"x-AMC1-NCO-IDE-A-145","kind":"AMC","label":"AMC1 NCO.IDE.A.145","title":"AMC1 NCO.IDE.A.145 First-aid kit","h":"<h3><a><\/a>AMC1 NCO.IDE.A.145 First-aid kit&nbsp;&nbsp;&nbsp;&nbsp;<\/h3> <p>CAA ORS9 Decision No. 1<\/p> <p>CONTENT OF FIRST-AID KITS<\/p> <p>(a) First-aid kits should be equipped with appropriate and sufficient medications and instrumentation. However, these kits should be amended by the operator according to the characteristics of the operation (scope of operation, flight duration, number and demographics of passengers, etc.).<\/p> <p>(b) The following should be included in the FAKs:<\/p> <ol> <p> <\/p><p>(1) bandages (assorted sizes),<\/p> <p><\/p> <p> <\/p><p>(2) burns dressings (large and small),<\/p> <p><\/p> <p> <\/p><p>(3) wound dressings (large and small),<\/p> <p><\/p> <p> <\/p><p>(4) adhesive dressings (assorted sizes),<\/p> <p><\/p> <p> <\/p><p>(5) antiseptic wound cleaner,<\/p> <p><\/p> <p> <\/p><p>(6) safety scissors,<\/p> <p><\/p> <p> <\/p><p>(7) disposable gloves.<\/p> <p>&nbsp;<\/p> <p><\/p> <\/ol>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/3%20AMC/AMC1%20NCO%20IDE%20A%20145%20First%20aid.htm"},{"id":"x-AMC2-NCO-IDE-A-145","kind":"AMC","label":"AMC2 NCO.IDE.A.145","title":"AMC2 NCO.IDE.A.145 First-aid kit","h":"<h3><a><\/a>AMC2 NCO.IDE.A.145 First-aid kit&nbsp;&nbsp;&nbsp;&nbsp;<\/h3> <p>CAA ORS9 Decision No. 1<\/p> <p>MAINTENANCE OF FIRST-AID KIT<\/p> <p>To be kept up-to-date, the first-aid kit should be:<\/p> <p>(a) inspected periodically to confirm, to the extent possible, that contents are maintained in the condition necessary for their intended use;<\/p> <p>(b) replenished at regular intervals, in accordance with instructions contained on their labels, or as circumstances warrant; and<\/p> <p>(c) replenished after use in-flight at the first opportunity where replacement items are available.<\/p> <p>&nbsp;<\/p>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/3%20AMC/AMC2%20NCO%20IDE%20A%20145%20First%20aid.htm"}]},{"id":"r-NCO-IDE-A-150","ref":"NCO.IDE.A.150","title":"Supplemental oxygen — pressurised aeroplanes","h":"<h1>NCO.IDE.A.150 Supplemental oxygen — pressurised aeroplanes <\/h1> <div> <p>(a)&nbsp;Pressurised aeroplanes operated at flight altitudes for which the oxygen supply is required in accordance with (b) shall be equipped with oxygen storage and dispensing apparatus capable of storing and dispensing the required oxygen supplies.<\/p> <p>(b)&nbsp;Pressurised aeroplanes operated above flight altitudes at which the pressure altitude in the passenger compartments is above 10000 ft shall carry enough breathing oxygen to supply:<\/p> <p>(1)&nbsp;&nbsp;all crew members and:<\/p> <p>(i)&nbsp;&nbsp;100 % of the passengers for any period when the cabin pressure altitude exceeds 15000 ft, but in no case less than 10 minutes’ supply;<\/p> <p>(ii)&nbsp;&nbsp;at least 30 % of the passengers, for any period when, in the event of loss of pressurisation and taking into account the circumstances of the flight, the pressure altitude in the passenger compartment will be between 14000 ft and 15000 ft; and<\/p> <p>(iii)&nbsp;&nbsp;at least 10 % of the passengers for any period in excess of 30 minutes when the pressure altitude in the passenger compartment will be between 10000 ft and 14000 ft;<\/p> <p>&nbsp;and<\/p> <p>(2)&nbsp;&nbsp;all the occupants of the passenger compartment for no less than 10 minutes, in the case of aeroplanes operated at pressure altitudes above 25000 ft, or operated below that altitude but under conditions that will not allow them to descend safely to a pressure altitude of 13000 ft within 4 minutes.<\/p> <p>(c)&nbsp;Pressurised aeroplanes operated at flight altitudes above 25000 ft shall, in addition, be equipped with a device to provide a warning indication to the flight crew of any loss of pressurisation.<\/p> <p>&nbsp;<\/p> <\/div>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/2%20Regs/20290_NCOIDEA150_Supplemental_oxygen_pressurised_aeroplanes.htm","sub":[{"id":"x-AMC1-NCO-IDE-A-150","kind":"AMC","label":"AMC1 NCO.IDE.A.150","title":"AMC1 NCO.IDE.A.150 Supplemental oxygen – pressurised aeroplanes","h":"<h3><a><\/a>AMC1 NCO.IDE.A.150 Supplemental oxygen – pressurised aeroplanes&nbsp;&nbsp;&nbsp;&nbsp;<\/h3> <p>CAA ORS9 Decision No. 1<\/p> <p>DETERMINATION OF OXYGEN<\/p> <p>(a) In the determination of the amount of oxygen for the routes to be flown, it is assumed that the aeroplane will descend in accordance with the emergency procedures specified in the AFM, without exceeding its operating limitations, to a flight altitude that will allow the flight to be completed safely (i.e. flight altitudes ensuring adequate terrain clearance, navigational accuracy, hazardous weather avoidance, etc.).<\/p> <p>(b) The amount of oxygen should be determined on the basis of cabin pressure altitude, flight duration, and on the assumption that a cabin pressurisation failure will occur at the pressure altitude or point of flight that is most critical from the standpoint of oxygen need.<\/p> <p>(c) Following a cabin pressurisation failure, the cabin pressure altitude should be considered to be the same as the aeroplane pressure altitude, unless it can be demonstrated to the CAA that no probable failure of the cabin or pressurisation system will result in a cabin pressure altitude equal to the aeroplane pressure altitude. Under these circumstances, the demonstrated maximum cabin pressure altitude may be used as a basis for determination of oxygen supply.<\/p> <p>&nbsp;<\/p>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/3%20AMC/AMC1%20NCO%20IDE%20A%20150%20Supplemental.htm"}]},{"id":"r-NCO-IDE-A-155","ref":"NCO.IDE.A.155","title":"Supplemental oxygen — non-pressurised aeroplanes","h":"<h1>NCO.IDE.A.155 Supplemental oxygen — non-pressurised aeroplanes <\/h1> <div> <p>Non-pressurised aeroplanes operated when an oxygen supply is required in accordance with NCO.OP.190 shall be equipped with oxygen storage and dispensing apparatus capable of storing and dispensing the required oxygen supplies.<\/p> <p>&nbsp;<\/p> <\/div>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/2%20Regs/20320_NCOIDEA155_Supplemental_oxygen_non-pressurised_aeroplanes.htm","sub":[{"id":"x-AMC1-NCO-IDE-A-155","kind":"AMC","label":"AMC1 NCO.IDE.A.155","title":"AMC1 NCO.IDE.A.155 Supplemental oxygen – non-pressurised aeroplanes","h":"<h3><a><\/a>AMC1 NCO.IDE.A.155 Supplemental oxygen – non-pressurised aeroplanes&nbsp;&nbsp;&nbsp;&nbsp;<\/h3> <p>CAA ORS9 Decision No. 1<\/p> <p>DETERMINATION OF OXYGEN<\/p> <p>(a) In the determination of the amount of oxygen for the routes to be flown, it is assumed that the aeroplane will operate at a flight altitude that will allow the flight to be completed safely (i.e. flight altitudes ensuring adequate terrain clearance, navigational accuracy, hazardous weather avoidance, etc.).<\/p> <p>(b) The amount of oxygen should be determined on the basis of cabin pressure altitude and flight duration.<\/p> <p>&nbsp;<\/p>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/3%20AMC/AMC1%20NCO%20IDE%20A%20155%20Supplemental.htm"},{"id":"x-AMC2-NCO-IDE-A-155","kind":"AMC","label":"AMC2 NCO.IDE.A.155","title":"AMC2 NCO.IDE.A.155 Supplemental oxygen supply – non- pressurised aeroplanes","h":"<h3><a><\/a>AMC2 NCO.IDE.A.155 Supplemental oxygen supply – non- pressurised aeroplanes&nbsp;&nbsp;&nbsp;&nbsp;<\/h3> <p>CAA ORS9 Decision No. 1<\/p> <p>OXYGEN SUPPLY<\/p> <p>The need for oxygen supply, when required by NCO.OP.190, may be met either by means of installed equipment or portable equipment.<\/p> <p>&nbsp;<\/p>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/3%20AMC/AMC2%20NCO%20IDE%20A%20155%20Supplemental.htm"}]},{"id":"r-NCO-IDE-A-160","ref":"NCO.IDE.A.160","title":"Hand fire extinguishers","h":"<h1>NCO.IDE.A.160 Hand fire extinguishers <\/h1> <div> <p>(a)&nbsp;Aeroplanes, except ELA1 aeroplanes, shall be equipped with at least one hand fire extinguisher:<\/p> <p>(1)&nbsp;&nbsp;in the flight crew compartment; and<\/p> <p>(2)&nbsp;&nbsp;in each passenger compartment that is separate from the flight crew compartment, except if the compartment is readily accessible to the flight crew.<\/p> <p>(b)&nbsp;The type and quantity of extinguishing agent for the required fire extinguishers shall be suitable for the type of fire likely to occur in the compartment where the extinguisher is intended to be used and to minimise the hazard of toxic gas concentration in compartments occupied by persons.<\/p> <p>&nbsp;<\/p> <\/div>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/2%20Regs/20350_NCOIDEA160_Hand_fire_extinguishers.htm","sub":[]},{"id":"r-NCO-IDE-A-165","ref":"NCO.IDE.A.165","title":"Marking of break-in points","h":"<h1>NCO.IDE.A.165 Marking of break-in points <\/h1> <div> <p>If areas of the aeroplane’s fuselage suitable for break-in by rescue crews in an emergency are marked, such areas shall be marked as shown in Figure 1.<\/p> <p>Figure 1&nbsp;Marking of break-in points<\/p> <p> <img src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAigAAAD3CAYAAAA3+q9WAAAAAXNSR0IArs4c6QAAAARnQU1BAACxjwv8YQUAAAAJcEhZcwAADsMAAA7DAcdvqGQAAE7fSURBVHhe7b13YBXH2cZ7/7vfTey4xb2XuMVO4jh2HCex49hJ7DhxtwO2wcbGBTC9iF5EE00NSRShggRIQiBRJJpAohcJUEGo0SSQhApCvUt+7rxzzoqDEEb9nCOeH369q93Z2dk98848OzM7+//8+OOPZ5RdpNFoNBqNRrMROyMC5SIIIYQQQmyHYgoUQgghhNgaPU+gqOsxWWMjGpUZfxNCOhH6GSGka+lpAsVUSDY21KOy5CLyCy6gsqoGDeYClBDSGShfEj9rVH5WXozCwiL6GSGks+lJAsVUaNbXVKIwKw1 2008; or<\/p> <p>(3)&nbsp;&nbsp;a survival ELT (ELT(S)) or a personal locator beacon (PLB), carried by a crew member or a passenger, when certified for a maximum passenger seating configuration of six or less.<\/p> <p>(b)&nbsp;ELTs of any type and PLBs shall be capable of transmitting simultaneously on 121,5 MHz and 406 MHz.<\/p> <p>&nbsp;<\/p> <\/div>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/2%20Regs/20410_NCOIDEA170_Emergency_locator_transmitter_ELT.htm","sub":[{"id":"x-AMC1-NCO-IDE-A-170","kind":"AMC","label":"AMC1 NCO.IDE.A.170","title":"AMC1 NCO.IDE.A.170 Emergency locator transmitter (ELT)","h":"<h3><a><\/a>AMC1 NCO.IDE.A.170 Emergency locator transmitter (ELT)&nbsp;&nbsp;&nbsp;&nbsp;<\/h3> <p>CAA ORS9 Decision No. 1<\/p> <p>BATTERIES<\/p> <p>(a) All batteries used in ELTs or PLBs should be replaced (or recharged, if the battery is rechargeable) when the equipment has been in use for more than 1 cumulative hour or in the following cases:<\/p> <ol> <p> <\/p><p>(1) Batteries specifically designed for use in ELTs and having an airworthiness release certificate (CAA Form 1 or equivalent) should be replaced (or recharged, if the battery is rechargeable) before the end of their useful life in accordance with the maintenance instructions applicable to the ELT.<\/p> <p><\/p> <p> <\/p><p>(2) Standard batteries manufactured in accordance with an industry standard and not having an airworthiness release certificate (CAA Form 1 or equivalent), when used in ELTs should be replaced (or recharged, if the battery is rechargeable) when 50 % of their useful life (or for rechargeable, 50 % of their useful life of charge), as established by the battery manufacturer, has expired.<\/p> <p><\/p> <p> <\/p><p>(3) All batteries used in PLBs should be replaced (or recharged, if the battery is rechargeable) when 50 % of their useful life (or for rechargeable, 50 % of their useful life of charge), as established by the battery manufacturer, has expired.<\/p> <p><\/p> <p> <\/p><p>(4) The battery useful life (or useful life of charge) criteria in (1),(2) and (3) do not apply to batteries (such as water-activated batteries) that are essentially unaffected during probable storage intervals.<\/p> <p><\/p> <\/ol> <p>(b) The new expiry date for a replaced (or recharged) battery should be legibly marked on the outside of the equipment.<\/p> <p>&nbsp;<\/p>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/3%20AMC/AMC1%20NCO%20IDE%20A%20170%20Emergency.htm"},{"id":"x-AMC2-NCO-IDE-A-170","kind":"AMC","label":"AMC2 NCO.IDE.A.170","title":"AMC2 NCO.IDE.A.170 Emergency locator transmitter (ELT)","h":"<h3><a><\/a>AMC2 NCO.IDE.A.170 Emergency locator transmitter (ELT)&nbsp;&nbsp;&nbsp;&nbsp;<\/h3> <p>CAA&nbsp;ORS9 Decision No. 45<\/p> <p>TYPES OF ELTs AND GENERAL TECHNICAL SPECIFICATIONS<\/p> <ol> <li value=\"1\"> <p>The ELT required by this provision should be one of the following:<\/p> <ol> <li value=\"1\"> <p>Automatic fixed (ELT(AF)). An automatically activated ELT that is permanently attached to an aircraft and is designed to aid search and rescue (SAR) teams in locating the crash site.<\/p> <\/li> <li value=\"2\"> <p>Automatic portable (ELT(AP)). An automatically activated ELT that is rigidly attached to an aircraft before a crash, but is readily removable from the aircraft after a crash. It functions as an ELT during the crash sequence. If the ELT does not employ an integral antenna, the aircraft-mounted antenna may be disconnected and an auxiliary antenna (stored on the ELT case) attached to the ELT. The ELT can be tethered to a survivor or a life-raft. This type of ELT is intended to aid SAR teams in locating the crash site or survivor(s).<\/p> <\/li> <li value=\"3\"> <p>Automatic deployable (ELT(AD)). An ELT that is rigidly attached to the aircraft before the crash and that is automatically ejected, deployed and activated by an impact, and, in some cases, also by water sensors. This type of ELT should float in water and is intended to aid SAR teams in locating the crash site. The ELT(AD) may be either a stand‑alone beacon or an inseparable part of a deployable recorder.<\/p> <\/li> <li value=\"4\"> <p>Survival ELT (ELT(S)). An ELT that is removable from an aircraft, stowed so as to facilitate its ready use in an emergency and manually activated by a survivor. An ELT(S) may be activated manually or automatically (e.g. by water activation). It should be designed either to be tethered to a life-raft or a survivor. A water‑activated ELT(S) is not an ELT(AP).<\/p> <\/li> <\/ol> <\/li> <li value=\"2\"> <p>To minimise the possibility of damage in the event of crash impact, the automatic ELT should be rigidly fixed to the aircraft structure, as far aft as is practicable, with its antenna and connections arranged so as to maximise the probability of the signal being transmitted after a crash.<\/p> <\/li> <li value=\"3\"> <p>Any ELT carried should operate in accordance with the relevant provisions of ICAO Annex&nbsp;10, Volume&nbsp;III, and should be registered with the national agency responsible for initiating search and rescue or other nominated agency.<\/p> <\/li> <\/ol> <p>&nbsp;<\/p>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/3%20AMC/AMC2%20NCO%20IDE%20A%20170%20Emergency.htm"},{"id":"x-AMC3-NCO-IDE-A-170","kind":"AMC","label":"AMC3 NCO.IDE.A.170","title":"AMC3 NCO.IDE.A.170 Emergency locator transmitter (ELT)","h":"<h3><a><\/a>AMC3 NCO.IDE.A.170 Emergency locator transmitter (ELT)&nbsp;&nbsp;&nbsp;&nbsp;<\/h3> <p>CAA ORS9 Decision No. 1<\/p> <p>PLB TECHNICAL SPECIFICATIONS<\/p> <p>(a) A personal locator beacon (PLB) should have a built-in GNSS receiver with a cosmicheskaya sistyema poiska avariynich sudov — search and rescue satellite-aided tracking (COSPAS- SARSAT) type approval number. However, devices with a COSPAS-SARSAT number belonging to series 700 are excluded as this series of numbers identifies the special-use beacons not meeting all the technical requirements and all the tests specified by COSPAS-SARSAT.<\/p> <p>(b) Any PLB carried should be registered with the national agency responsible for initiating search and rescue or other nominated agency.<\/p> <p>&nbsp;<\/p>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/3%20AMC/AMC3%20NCO%20IDE%20A%20170%20Emergency.htm"},{"id":"x-AMC4-NCO-IDE-A-170","kind":"AMC","label":"AMC4 NCO.IDE.A.170","title":"AMC4 NCO.IDE.A.170 Emergency locator transmitter (ELT)","h":"<h3><a><\/a>AMC4 NCO.IDE.A.170 Emergency locator transmitter (ELT)&nbsp;&nbsp;&nbsp;&nbsp;<\/h3> <p>CAA ORS9 Decision No. 1<\/p> <p>BRIEFING ON PLB USE<\/p> <p>When a PLB is carried by a passenger, he/she should be briefed on its characteristics and use by the pilot-in-command before the flight.<\/p> <p>&nbsp;<\/p>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/3%20AMC/AMC4%20NCO%20IDE%20A%20170%20Emergency.htm"},{"id":"x-GM1-NCO-IDE-A-170","kind":"GM","label":"GM1 NCO.IDE.A.170","title":"GM1 NCO.IDE.A.170 Emergency locator transmitter (ELT)","h":"<h4><a><\/a>GM1 NCO.IDE.A.170 Emergency locator transmitter (ELT)&nbsp;&nbsp;&nbsp;&nbsp;<\/h4> <p>CAA&nbsp;ORS9 Decision No. 45<\/p> <p>TERMINOLOGY<\/p> <p>GM1 CAT.IDE.A.280 contains explanations of terms used in point NCO.IDE.A.170 and in the related AMC.<\/p> <p>&nbsp;<\/p>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/4%20GM/GM1%20NCO%20IDE%20A%20170%20Emergency.htm"}]},{"id":"r-NCO-IDE-A-175","ref":"NCO.IDE.A.175","title":"Flight over water","h":"<h1>NCO.IDE.A.175 Flight over water <\/h1> <div> <p>(a)&nbsp;The following aeroplanes shall be equipped with a life-jacket for each person on board, or equivalent individual floatation device for each person on board younger than 24 months, that shall be worn or stowed in a position that is readily accessible from the seat or berth of the person for whose use it is provided:<\/p> <p>(1)&nbsp;&nbsp;single-engined landplanes when:<\/p> <p>(i)&nbsp;&nbsp;flying over water beyond gliding distance from land; or<\/p> <p>(ii)&nbsp;&nbsp;taking off or landing at an aerodrome or operating site where, in the opinion of the pilot-in-command, the take-off or approach path is so disposed over water that there would be a likelihood of a ditching;<\/p> <p>(2)&nbsp;&nbsp;seaplanes operated over water; and<\/p> <p>(3)&nbsp;&nbsp;aeroplanes operated at a distance away from land where an emergency landing is possible greater than that corresponding to 30 minutes at normal cruising speed or 50 NM, whichever is less.<\/p> <p>(b)&nbsp;Seaplanes operated over water shall be equipped with:<\/p> <p>(1)&nbsp;&nbsp;one anchor;<\/p> <p>(2)&nbsp;&nbsp;one sea anchor (drogue), when necessary to assist in manoeuvring; and<\/p> <p>(3)&nbsp;&nbsp;equipment for making the sound signals, as prescribed in the International Regulations for Preventing Collisions at Sea, where applicable.<\/p> <p>(c)&nbsp;The pilot-in-command of an aeroplane operated at a distance away from land where an emergency landing is possible greater than that corresponding to 30 minutes at normal cruising speed or 50 NM, whichever is the lesser, shall determine the risks to survival of the occupants of the aeroplane in the event of a ditching, based on which he/she shall determine the carriage of:<\/p> <p>(1)&nbsp;&nbsp;equipment for making the distress signals;<\/p> <p>(2)&nbsp;&nbsp;life-rafts in sufficient numbers to carry all persons on board, stowed so as to facilitate their ready use in emergency; and<\/p> <p>(3)&nbsp;&nbsp;life-saving equipment, to provide the means of sustaining life, as appropriate to the flight to be undertaken.<\/p> <p>&nbsp;<\/p> <\/div>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/2%20Regs/20440_NCOIDEA175_Flight_over_water.htm","sub":[{"id":"x-AMC1-NCO-IDE-A-175","kind":"AMC","label":"AMC1 NCO.IDE.A.175","title":"AMC1 NCO.IDE.A.175 Flight over water","h":"<h3><a><\/a>AMC1 NCO.IDE.A.175 Flight over water&nbsp;&nbsp;&nbsp;&nbsp;<\/h3> <p>CAA ORS9 Decision No. 1<\/p> <p>ACCESSIBILITY OF LIFE-JACKETS<\/p> <p>The life-jacket, if not worn, should be accessible from the seat or berth of the person for whose use it is provided, with a safety belt or a restraint system fastened.<\/p> <p>MEANS OF ILLUMINATION FOR LIFE-JACKETS<\/p> <p>Each life-jacket or equivalent individual flotation device should be equipped with a means of electric illumination for the purpose of facilitating the location of persons.<\/p> <p>RISK ASSESSMENT<\/p> <p>(a) When conducting the risk assessment, the pilot-in-command should base his/her decision, as far as is practicable, on the Implementing Rules and AMCs applicable to the operation of the aeroplane.<\/p> <p>(b) The pilot-in-command should, for determining the risk, take the following operating environment and conditions into account:<\/p> <ol> <p> <\/p><p>(1) sea state;<\/p> <p><\/p> <p> <\/p><p>(2) sea and air temperatures;<\/p> <p><\/p> <p> <\/p><p>(3) the distance from land suitable for making an emergency landing; and<\/p> <p><\/p> <p> <\/p><p>(4) the availability of search and rescue facilities.<\/p> <p>&nbsp;<\/p> <p><\/p> <\/ol>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/3%20AMC/AMC1%20NCO%20IDE%20A%20175%20Flight.htm"},{"id":"x-GM1-NCO-IDE-A-175","kind":"GM","label":"GM1 NCO.IDE.A.175","title":"GM1 NCO.IDE.A.175 Flight over water","h":"<h4><a><\/a>GM1 NCO.IDE.A.175 Flight over water&nbsp;&nbsp;&nbsp;&nbsp;<\/h4> <p>CAA ORS9 Decision No. 1<\/p> <p>SEAT CUSHIONS<\/p> <p>Seat cushions are not considered to be flotation devices.<\/p> <p>&nbsp;<\/p>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/4%20GM/GM1%20NCO%20IDE%20A%20175%20Flight%20over.htm"}]},{"id":"r-NCO-IDE-A-180","ref":"NCO.IDE.A.180","title":"Survival equipment","h":"<h1>NCO.IDE.A.180 Survival equipment <\/h1> <div> <p>Aeroplanes operated over areas in which search and rescue would be especially difficult shall be equipped with such signalling devices and life-saving equipment, including means of sustaining life, as may be appropriate to the area overflown.<\/p> <p>&nbsp;<\/p> <\/div>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/2%20Regs/20470_NCOIDEA180_Survival_equipment.htm","sub":[{"id":"x-AMC1-NCO-IDE-A-180","kind":"AMC","label":"AMC1 NCO.IDE.A.180","title":"AMC1 NCO.IDE.A.180 Survival equipment","h":"<h3><a><\/a>AMC1 NCO.IDE.A.180 Survival equipment&nbsp;&nbsp;&nbsp;&nbsp;<\/h3> <p>CAA ORS9 Decision No. 1<\/p> <p>GENERAL<\/p> <p>(a) Aeroplanes operated across land areas in which search and rescue would be especially difficult should be equipped with the following:<\/p> <ol> <p> <\/p><p>(1) signalling equipment to make the distress signals;<\/p> <p><\/p> <p> <\/p><p>(2) at least one ELT(S) or a PLB, carried by the pilot-in-command or a passenger; and<\/p> <p><\/p> <p> <\/p><p>(3) additional survival equipment for the route to be flown, taking account of the number of persons on board.<\/p> <p><\/p> <\/ol> <p>(b) The additional survival equipment specified in (a)(3) does not need to be carried when the aeroplane remains within a distance from an area where search and rescue is not especially difficult, that corresponds to:<\/p> <ol> <p> <\/p><p>(1) 120 minutes at one-engine-inoperative (OEI) cruising speed for aeroplanes capable of continuing the flight to an aerodrome with the critical engine(s) becoming inoperative at any point along the route or planned diversion routes; or<\/p> <p><\/p> <p> <\/p><p>(2) 30 minutes at cruising speed for all other aeroplanes.<\/p> <p>&nbsp;<\/p> <p><\/p> <\/ol>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/3%20AMC/AMC1%20NCO%20IDE%20A%20180%20Survival.htm"},{"id":"x-AMC2-NCO-IDE-A-180","kind":"AMC","label":"AMC2 NCO.IDE.A.180","title":"AMC2 NCO.IDE.A.180 Survival equipment","h":"<h3><a><\/a>AMC2 NCO.IDE.A.180 Survival equipment&nbsp;&nbsp;&nbsp;&nbsp;<\/h3> <p>CAA ORS9 Decision No. 1<\/p> <p>ADDITIONAL SURVIVAL EQUIPMENT<\/p> <p>(a) The following additional survival equipment should be carried when required:<\/p> <ol> <p> <\/p><p>(1) 500 ml of water for each four, or fraction of four, persons on board;<\/p> <p><\/p> <p> <\/p><p>(2) one knife;<\/p> <p><\/p> <p> <\/p><p>(3) first-aid equipment; and<\/p> <p><\/p> <p> <\/p><p>(4) one set of air/ground codes.<\/p> <p><\/p> <\/ol> <p>(b) If any item of equipment contained in the above list is already carried on board the aeroplane in accordance with another requirement, there is no need for this to be duplicated.<\/p> <p>&nbsp;<\/p>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/3%20AMC/AMC2%20NCO%20IDE%20A%20180%20Survival.htm"},{"id":"x-GM1-NCO-IDE-A-180","kind":"GM","label":"GM1 NCO.IDE.A.180","title":"GM1 NCO.IDE.A.180 Survival equipment","h":"<h4><a><\/a>GM1 NCO.IDE.A.180 Survival equipment&nbsp;&nbsp;&nbsp;&nbsp;<\/h4> <p>CAA ORS9 Decision No. 1<\/p> <p>SIGNALLING EQUIPMENT<\/p> <p>The signalling equipment for making distress signals is described in ICAO Annex 2, Rules of the Air.<\/p> <p>&nbsp;<\/p>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/4%20GM/GM1%20NCO%20IDE%20A%20180%20Survival.htm"},{"id":"x-GM2-NCO-IDE-A-180","kind":"GM","label":"GM2 NCO.IDE.A.180","title":"GM2 NCO.IDE.A.180 Survival equipment","h":"<h4><a><\/a>GM2 NCO.IDE.A.180 Survival equipment&nbsp;&nbsp;&nbsp;&nbsp;<\/h4> <p>CAA ORS9 Decision No. 1<\/p> <p>AREAS IN WHICH SEARCH AND RESCUE WOULD BE ESPECIALLY DIFFICULT<\/p> <p>The expression ‘areas in which search and rescue would be especially difficult’ should be interpreted, in this context, as meaning:<\/p> <p>(a) areas so designated by the authority responsible for managing search and rescue; or<\/p> <p>(b) areas that are largely uninhabited and where:<\/p> <ol> <p> <\/p><p>(1) the authority referred to in (a) has not published any information to confirm whether search and rescue would be or would not be especially difficult; and<\/p> <p><\/p> <p> <\/p><p>(2) the authority referred to in (a) does not, as a matter of policy, designate areas as being especially difficult for search and rescue.<\/p> <p>&nbsp;<\/p> <p><\/p> <\/ol>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/4%20GM/GM2%20NCO%20IDE%20A%20180%20Survival.htm"}]},{"id":"r-NCO-IDE-A-190","ref":"NCO.IDE.A.190","title":"Radio communication equipment","h":"<h1>NCO.IDE.A.190 Radio communication equipment <\/h1> <div> <p>(a)&nbsp;Where required by the airspace being flown aeroplanes shall be equipped with radio communication equipment capable of conducting two-way communication with those aeronautical stations and on those frequencies to meet airspace requirements.<\/p> <p>(b)&nbsp;Radio communication equipment, if required by (a), shall provide for communication on the aeronautical emergency frequency 121,5 MHz.<\/p> <p>(c)&nbsp;When more than one communication equipment unit is required, each shall be independent of the other or others to the extent that a failure in any one will not result in failure of any other.<\/p> <p>&nbsp;<\/p> <\/div>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/2%20Regs/20500_NCOIDEA190_Radio_communication_equipment.htm","sub":[{"id":"x-GM1-NCO-IDE-A-190","kind":"GM","label":"GM1 NCO.IDE.A.190","title":"GM1 NCO.IDE.A.190 Radio communication equipment","h":"<h4><a><\/a>GM1 NCO.IDE.A.190 Radio communication equipment&nbsp;&nbsp;&nbsp;&nbsp;<\/h4> <p>CAA ORS9 Decision No. 1<\/p> <p>APPLICABLE AIRSPACE REQUIREMENTS<\/p> <p>For aeroplanes being operated under European air traffic control, the applicable airspace requirements include the Single European Sky legislation.<\/p> <p>&nbsp;<\/p>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/4%20GM/GM1%20NCO%20IDE%20A%20190%20Radio%20communication.htm"}]},{"id":"r-NCO-IDE-A-195","ref":"NCO.IDE.A.195","title":"Navigation equipment","h":"<h1>NCO.IDE.A.195 Navigation equipment <\/h1> <div> <p>(a)&nbsp;Aeroplanes operated over routes that cannot be navigated by reference to visual landmarks shall be equipped with any navigation equipment necessary to enable them to proceed in accordance with:<\/p> <p>(1)&nbsp;&nbsp;the ATS flight plan; if applicable; and<\/p> <p>(2)&nbsp;&nbsp;the applicable airspace requirements.<\/p> <p>(b)&nbsp;Aeroplanes shall have sufficient navigation equipment to ensure that, in the event of the failure of one item of equipment at any stage of the flight, the remaining equipment shall allow safe navigation in accordance with (a), or an appropriate contingency action, to be completed safely.<\/p> <p>(c)&nbsp;Aeroplanes operated on flights in which it is intended to land in IMC shall be equipped with suitable equipment capable of providing guidance to a point from which a visual landing can be performed. This equipment shall be capable of providing such guidance for each aerodrome at t which it is intended to land in IMC and for any designated alternate aerodromes.<\/p> <p>(d)&nbsp;For PBN operations the aircraft shall meet the airworthiness certification requirements for the appropriate navigation specification.<\/p> <p>(e)&nbsp;Aeroplanes shall be equipped with surveillance equipment in accordance with the applicable airspace requirements.<\/p> <p>&nbsp;<\/p> <\/div>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/2%20Regs/20530_NCOIDEA195_Navigation_equipment.htm","sub":[{"id":"x-AMC1-NCO-IDE-A-195","kind":"AMC","label":"AMC1 NCO.IDE.A.195","title":"AMC1 NCO.IDE.A.195 Navigation equipment","h":"<h3><a><\/a>AMC1 NCO.IDE.A.195 Navigation equipment&nbsp;&nbsp;&nbsp;&nbsp;<\/h3> <p>CAA ORS9 Decision No. 1<\/p> <p>NAVIGATION WITH VISUAL REFERENCE TO LANDMARKS<\/p> <p>Where aeroplanes, with the surface in sight, can proceed according to the ATS flight plan by navigation with visual reference to landmarks, no additional equipment is needed to comply with NCO.IDE.A.195(a)(1).<\/p> <p>&nbsp;<\/p>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/3%20AMC/AMC1%20NCO%20IDE%20A%20195%20Navigation.htm"},{"id":"x-AMC1-NCO-IDE-A-195-a","kind":"AMC","label":"AMC1 NCO.IDE.A.195(a)","title":"AMC1 NCO.IDE.A.195(a) Navigation equipment","h":"<h3>AMC1 NCO.IDE.A.195(a) Navigation equipment<\/h3> <p>CAA ORS9 Decision No. 47<\/p> <p>NAVIGATION EQUIPMENT — RNAV SUBSTITUTION<\/p> <p>An RNAV system may be used to substitute for conventional navigation aids and radio equipment, without monitoring of the raw data from conventional navigation aids, under the following conditions:<\/p> <p>SCOPE OF RNAV SUBSTITUTION<\/p> <ol> <li value=\"1\"> <p>RNAV substitution may be used in all the phases of flight except:<\/p> <ol> <li value=\"1\"> <p>to provide lateral guidance in the FAS of an IAP; and<\/p> <\/li> <li value=\"2\"> <p>to substitute for DME, if a DME transceiver is either not installed on the aircraft or found to be unserviceable before flight.<\/p> <\/li> <\/ol> <\/li> <\/ol> <p>SUITABILITY OF THE RNAV SYSTEM FOR RNAV SUBSTITUTION<\/p> <ol> <li value=\"2\"> <p>The RNAV system should meet:<\/p> <ol> <li value=\"1\"> <p>at least the requirements of (E)TSO‑C129/‑C196/‑C145/‑C146 (or later equivalent standards); and<\/p> <\/li> <li value=\"2\"> <p>the requirements of NCO.OP.116(a) for RNAV&nbsp;1, RNP&nbsp;1 or RNP&nbsp;APCH as regards its installation in the aircraft.<\/p> <\/li> <\/ol> <\/li> <\/ol> <p>OPERATING PROCEDURE<\/p> <ol> <li value=\"3\"> <p>The pilot‑in‑command is responsible for:<\/p> <ol> <li value=\"1\"> <p>ensuring that any procedure and waypoints used are retrieved from a navigation database which meets the requirements of NCO.IDE.A.205;<\/p> <\/li> <li value=\"2\"> <p>verifying waypoint sequence, reasonableness of track angles, and distances of any overlay procedure used and in particular, where the use of RNAV substitution is used to replace offset DME with a zero‑range indication, associated with an IAP;<\/p> <\/li> <li value=\"3\"> <p>applying pre‑flight procedures associated with GNSS use (e.g.&nbsp;RAIM check if applicable); and<\/p> <\/li> <li value=\"4\"> <p>complying with any limitation on RNAV substitution in the AFM. <\/p> <\/li> <\/ol> <\/li> <\/ol> <p>PILOT COMPETENCE<\/p> <ol> <li value=\"4\"> <p>The pilot‑in‑command should be aware of the limitations of RNAV substitution.<\/p> <\/li> <\/ol> <p>AIRSPACE LIMITATIONS<\/p> <ol> <li value=\"5\"> <p>RNAV substitution should not be applied on any procedure where RNAV substitution has been indicated as ‘not authorised’ by an AIP entry or a notice to airmen (NOTAM).<\/p> <\/li> <\/ol> <p>CONTINGENCY PLANNING<\/p> <ol> <li value=\"6\"> <p>Nothing in this AMC relieves the pilot‑in‑command from compliance with NCO.IDE.A.195(b) which requires sufficient navigation equipment to ensure that, in the event of the failure of one item of equipment at any stage of the flight, the remaining equipment shall allow safe navigation according to the flight plan, or an appropriate contingency action, to be completed safely. <\/p> <\/li> <\/ol> <p>&nbsp;<\/p>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/3%20AMC/AMC1%20NCO%20IDE%20A%20195%20a%20Navigation.htm"},{"id":"x-AMC1-NCO-IDE-A-195-b","kind":"AMC","label":"AMC1 NCO.IDE.A.195(b)","title":"AMC1 NCO.IDE.A.195(b) Navigation equipment","h":"<h3>AMC1 NCO.IDE.A.195(b) Navigation equipment<\/h3> <p>CAA ORS9 Decision No. 47<\/p> <p>APPROPRIATE CONTINGENCY ACTION<\/p> <ol> <li value=\"1\"> <p>An appropriate contingency action is an alternative offered in NCO.IDE.A.195(b) to completion of the planned flight to a safe landing, either at the planned destination or a destination alternate, using normal procedures and using navigation equipment meeting the requirements of NCO.IDE.A.100, installed for redundancy or as a backup. <\/p> <\/li> <li value=\"2\"> <p>The contingency action should be considered before flight and take into account the information identified by flight preparation according to NCO.OP.135. It may depend on the flight and availability of navigation solutions (satellites, ground navaids, etc.) and weather conditions (IMC, VMC) along the flight.<\/p> <\/li> <li value=\"3\"> <p>The contingency action addresses partial loss of navigation capability. An appropriate contingency action to meet the requirements of NCO.IDE.A.195(b) does not rely on the performance of any function of the item of equipment whose potential failure is being considered. For example, in considering the failure of a VOR/LOC/DME receiver, none of the functions of that receiver should be relied upon in the contingency action.<\/p> <\/li> <li value=\"4\"> <p>Examples of contingency actions include:<\/p> <p>— seeking navigational assistance from ATS, using communication, navigation and surveillance systems that remain operational, to enable a safe instrument approach or a safe descent to VMC; and<\/p> <p>— unusually long periods of dead reckoning.<\/p> <\/li> <li value=\"5\"> <p>A contingency action is required such that the failure of one item of navigation equipment has a reasonable likelihood of a safe outcome to the flight, consistent with other risks to which the operation is exposed.<\/p> <\/li> <\/ol> <p>&nbsp;<\/p>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/3%20AMC/AMC1%20NCO%20IDE%20A%20195%20b%20Navigation.htm"},{"id":"x-GM1-NCO-IDE-A-195","kind":"GM","label":"GM1 NCO.IDE.A.195","title":"GM1 NCO.IDE.A.195 Navigation equipment","h":"<h4><a><\/a>GM1 NCO.IDE.A.195 Navigation equipment&nbsp;&nbsp;&nbsp;&nbsp;<\/h4> <p>CAA ORS9 Decision No. 1<\/p> <p>AIRCRAFT ELIGIBILITY FOR PBN SPECIFICATION NOT REQUIRING SPECIFIC APPROVAL<\/p> <p>(a) The performance of the aircraft is usually stated in the AFM/POH.<\/p> <p>(b) Where such a reference cannot be found in the AFM/POH, other information provided by the aircraft manufacturer as TC holder, the STC holder or the design organisation having a privilege to approve minor changes may be considered.<\/p> <p>(c) The following documents are considered acceptable sources of information:<\/p> <ol> <p> <\/p><p>(1) AFM/POH, supplements thereto, and documents directly referenced in the AFM/POH;<\/p> <p><\/p> <p> <\/p><p>(2) FCOM or similar document;<\/p> <p><\/p> <p> <\/p><p>(3) Service Bulletin or Service Letter issued by the TC holder or STC holder;<\/p> <p><\/p> <p> <\/p><p>(4) approved design data or data issued in support of a design change approval;<\/p> <p><\/p> <p> <\/p><p>(5) any other formal document issued by the TC or STC holders stating compliance with PBN specifications, AMC, Advisory Circulars (AC) or similar documents issued by the State of Design; and<\/p> <p><\/p> <p> <\/p><p>(6) written evidence obtained from the State of Design.<\/p> <p><\/p> <\/ol> <p>(d) Equipment qualification data, in itself, is not sufficient to assess the PBN capabilities of the aircraft, since the latter depend on installation and integration.<\/p> <p>(e) As some PBN equipment and installations may have been certified prior to the publication of the PBN Manual and the adoption of its terminology for the navigation specifications, it is not always possible to find a clear statement of aircraft PBN capability in the AFM/POH. However, aircraft eligibility for certain PBN specifications can rely on the aircraft performance certified for PBN procedures and routes prior to the publication of the PBN Manual.<\/p> <p>(f) Below, various references are listed which may be found in the AFM/POH or other acceptable documents (see listing above) in order to consider the aircraft’s eligibility for a specific PBN specification if the specific term is not used.<\/p> <p>(g) RNAV 5<\/p> <ol> <p> <\/p><p>(1) If a statement of compliance with any of the following specifications or standards is found in the acceptable documentation as listed above, the aircraft is eligible for RNAV 5 operations.<\/p> <ol> <p> <\/p><p>(i) B-RNAV;<\/p> <p><\/p> <p> <\/p><p>(ii) RNAV 1;<\/p> <p><\/p> <p> <\/p><p>(iii) RNP APCH;<\/p> <p><\/p> <p> <\/p><p>(iv) RNP 4;<\/p> <p><\/p> <p> <\/p><p>(v) A-RNP;<\/p> <p><\/p> <p> <\/p><p>(vi) AMC 20-4;<\/p> <p><\/p> <p> <\/p><p>(vii) JAA TEMPORARY GUIDANCE MATERIAL, LEAFLET NO. 2 (TGL 2);<\/p> <p><\/p> <p> <\/p><p>(viii) JAA AMJ 20X2;<\/p> <p><\/p> <p> <\/p><p>(ix) FAA AC 20-130A for en route operations;<\/p> <p><\/p> <p> <\/p><p>(x) FAA AC 20-138 for en route operations; and<\/p> <p><\/p> <p> <\/p><p>(xi) FAA AC 90-96.<\/p> <p><\/p> <\/ol> <p><\/p> <\/ol> <p>(h) RNAV 1/RNAV 2<\/p> <ol> <p> <\/p><p>(1) If a statement of compliance with any of the following specifications or standards is found in the acceptable documentation as listed above, the aircraft is eligible for RNAV 1/RNAV 2 operations.<\/p> <ol> <p> <\/p><p>(i) RNAV 1;<\/p> <p><\/p> <p> <\/p><p>(ii) PRNAV;<\/p> <p><\/p> <p> <\/p><p>(iii) US RNAV type A;<\/p> <p><\/p> <p> <\/p><p>(iv) FAA AC 20-138 for the appropriate navigation specification;<\/p> <p><\/p> <p> <\/p><p>(v) FAA AC 90-100A;<\/p> <p><\/p> <p> <\/p><p>(vi) JAA TEMPORARY GUIDANCE MATERIAL, LEAFLET NO. 10 Rev1 (TGL 10); and<\/p> <p><\/p> <p> <\/p><p>(vii) FAA AC 90-100.<\/p> <p><\/p> <\/ol> <p><\/p> <p> <\/p><p>(2) However, if position determination is exclusively computed based on VOR-DME, the aircraft is not eligible for RNAV 1/RNAV 2 operations.<\/p> <p><\/p> <\/ol> <p>(i) RNP 1/RNP 2 continental<\/p> <ol> <p> <\/p><p>(1) If a statement of compliance with any of the following specifications or standards is found in the acceptable documentation as listed above, the aircraft is eligible for RNP 1/RNP 2 continental operations.<\/p> <ol> <p> <\/p><p>(i) A-RNP;<\/p> <p><\/p> <p> <\/p><p>(ii) FAA AC 20-138 for the appropriate navigation specification; and<\/p> <p><\/p> <p> <\/p><p>(iii) FAA AC 90-105.<\/p> <p><\/p> <\/ol> <p><\/p> <p> <\/p><p>(2) Alternatively, if a statement of compliance with any of the following specifications or standards is found in the acceptable documentation as listed above and position determination is primarily based on GNSS, the aircraft is eligible for RNP 1/RNP 2 continental operations. However, in these cases, loss of GNSS implies loss of RNP 1/RNP 2 capability.<\/p> <ol> <p> <\/p><p>(i) JAA TEMPORARY GUIDANCE MATERIAL, LEAFLET NO. 10 (TGL 10) (any revision); and<\/p> <p><\/p> <p> <\/p><p>(ii) FAA AC 90-100.<\/p> <p><\/p> <\/ol> <p><\/p> <\/ol> <p>(j) RNP APCH — LNAV minima<\/p> <ol> <p> <\/p><p>(1) If a statement of compliance with any of the following specifications or standards is found in the acceptable documentation as listed above, the aircraft is eligible for RNP APCH — LNAV operations.<\/p> <ol> <p> <\/p><p>(i) A-RNP;<\/p> <p><\/p> <p> <\/p><p>(ii) AMC 20-27;<\/p> <p><\/p> <p> <\/p><p>(iii) AMC 20-28;<\/p> <p><\/p> <p> <\/p><p>(iv) FAA AC 20-138 for the appropriate navigation specification; and<\/p> <p><\/p> <p> <\/p><p>(v) FAA AC 90-105 for the appropriate navigation specification.<\/p> <p><\/p> <\/ol> <p><\/p> <p> <\/p><p>(2) Alternatively, if a statement of compliance with RNP 0.3 GNSS approaches in accordance with any of the following specifications or standards is found in the acceptable documentation as listed above, the aircraft is eligible for RNP APCH — LNAV operations. Any limitation such as ‘within the US National Airspace’ may be ignored since RNP APCH procedures are assumed to meet the same ICAO criteria around the world.<\/p> <ol> <p> <\/p><p>(i) JAA TEMPORARY GUIDANCE MATERIAL, LEAFLET NO. 3 (TGL 3);<\/p> <p><\/p> <p> <\/p><p>(ii) AMC 20-4;<\/p> <p><\/p> <p> <\/p><p>(iii) FAA AC 20-130A; and<\/p> <p><\/p> <p> <\/p><p>(iv) FAA AC 20-138.<\/p> <p><\/p> <\/ol> <p><\/p> <\/ol> <p>(k) RNP APCH — LNAV/VNAV minima<\/p> <ol> <p> <\/p><p>(1) If a statement of compliance with any of the following specifications or standards is found in the acceptable documentation as listed above, the aircraft is eligible for RNP APCH — LNAV/VNAV operations.<\/p> <ol> <p> <\/p><p>(i) A-RNP;<\/p> <p><\/p> <p> <\/p><p>(ii) AMC 20-27 with Baro VNAV;<\/p> <p><\/p> <p> <\/p><p>(iii) AMC 20-28;<\/p> <p><\/p> <p> <\/p><p>(iv) FAA AC 20-138; and<\/p> <p><\/p> <p> <\/p><p>(v) FAA AC 90-105 for the appropriate navigation specification.<\/p> <p><\/p> <\/ol> <p><\/p> <p> <\/p><p>(2) Alternatively, if a statement of compliance with FAA AC 20-129 is found in the acceptable documentation as listed above, and the aircraft complies with the requirements and limitations of EASA SIB 2014-04, the aircraft is eligible for RNP APCH — LNAV/VNAV operations. Any limitation such as ‘within the US National Airspace’ may be ignored since RNP APCH procedures are assumed to meet the same ICAO criteria around the world.<\/p> <p><\/p> <\/ol> <p>(l) RNP APCH — LPV minima<\/p> <ol> <p> <\/p><p>(1) If a statement of compliance with any of the following specifications or standards is found in the acceptable documentation as listed above, the aircraft is eligible for RNP APCH — LPV operations.<\/p> <ol> <p> <\/p><p>(i)&nbsp;&nbsp;&nbsp;&nbsp;AMC 20-28;<\/p> <p>(ii) FAA AC 20-138 for the appropriate navigation specification; and<\/p> <p>(iii) FAA AC 90-107.<\/p> <p><\/p> <\/ol> <p><\/p> <\/ol> <ol> <p> <\/p><p>(2) For aircraft that have a TAWS Class A installed and do not provide Mode-5 protection on an LPV approach, the DH is limited to 250 ft.<\/p> <p><\/p> <\/ol> <p>(m) RNAV 10<\/p> <ol> <p> <\/p><p>(1) If a statement of compliance with any of the following specifications or standards is found in the acceptable documentation as listed above, the aircraft is eligible for RNAV 10 operations.<\/p> <p><\/p> <\/ol> <ol> <p> <\/p><p>(i) RNP 10;<\/p> <p><\/p> <\/ol> <ol> <p> <\/p><p>(ii) FAA AC 20-138 for the appropriate navigation specification;<\/p> <p><\/p> <p> <\/p><p>(iii) AMC 20-12;<\/p> <p><\/p> <p> <\/p><p>(iv) FAA Order 8400.12 (or later revision); and<\/p> <p><\/p> <p> <\/p><p>(v) FAA AC 90-105.<\/p> <p><\/p> <\/ol> <p>(n) RNP 4<\/p> <ol> <p> <\/p><p>(1) If a statement of compliance with any of the following specifications or standards is found in the acceptable documentation as listed above, the aircraft is eligible for RNP 4 operations.<\/p> <ol> <p> <\/p><p>(i) FAA AC 20-138B or later, for the appropriate navigation specification;<\/p> <p><\/p> <p> <\/p><p>(ii) FAA Order 8400.33; and<\/p> <p><\/p> <p> <\/p><p>(iii) FAA AC 90-105 for the appropriate navigation specification.<\/p> <p><\/p> <\/ol> <p><\/p> <\/ol> <p>(o) RNP 2 oceanic<\/p> <ol> <p> <\/p><p>(1) If a statement of compliance with FAA AC 90-105 for the appropriate navigation specification is found in the acceptable documentation as listed above, the aircraft is eligible for RNP 2 oceanic operations.<\/p> <p><\/p> <p> <\/p><p>(2) If the aircraft has been assessed eligible for RNP 4, the aircraft is eligible for RNP 2 oceanic.<\/p> <p><\/p> <\/ol> <p>(p) Special features<\/p> <ol> <p> <\/p><p>(3) RF in terminal operations (used in RNP 1 and in the initial segment of the RNP APCH)<\/p> <ol> <p> <\/p><p>(i) If a statement of demonstrated capability to perform an RF leg, certified in accordance with any of the following specifications or standards, is found in the acceptable documentation as listed above, the aircraft is eligible for RF in terminal operations.<\/p> <ol> <p> <\/p><p>(A) AMC 20-26; and<\/p> <p><\/p> <p> <\/p><p>(B) FAA AC 20-138B or later.<\/p> <p><\/p> <\/ol> <p><\/p> <p> <\/p><p>(ii) If there is a reference to RF and a reference to compliance with AC 90-105, then the aircraft is eligible for such operations.<\/p> <p><\/p> <\/ol> <p><\/p> <\/ol> <p>(q) Other considerations<\/p> <ol> <p> <\/p><p>(4) In all cases, the limitations in the AFM/POH need to be checked, in particular the u
