<style>
:root{--bg:#f5f6f3;--pane:#fff;--side:#eef0ec;--ink:#14181c;--mut:#5f6872;--line:#dadfe2;--acc:#1f5fbf;--amc:#1d7a46;--gm:#8a5a00;--hl:#ffe58a;--amcbg:#edf7f0;--gmbg:#fbf4e6;--fs:16px}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:var(--fs)/1.5 "B612",system-ui,sans-serif;display:flex;flex-direction:column}
button,input{font:inherit;color:inherit}

.top h1{font-size:15px;margin:0;white-space:nowrap}
.top h1 small{display:block;font-size:11px;color:var(--mut);font-weight:400}
.search{flex:1;min-width:0;position:relative}
.search input{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.ib{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:7px 10px;cursor:pointer;white-space:nowrap}

.sub{border-bottom:1px solid var(--line)}

.sub>summary::-webkit-details-marker{display:none}
.sub>summary::before{content:"▸ ";color:var(--mut)}
.sub[open]>summary::before{content:"▾ "}
.sec{padding:6px 14px 2px 22px;font-size:12px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}

.crumb{font-size:12px;color:var(--mut);margin-bottom:6px}
.rule{background:var(--pane);border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin-bottom:14px}

.ref{font-family:"B612 Mono",monospace;color:var(--acc);font-weight:700}
.content h1,.content h2,.content h3,.content h4{font-size:1.05em;margin:.2em 0 .6em}
.content p{margin:.45em 0}
.content table{border-collapse:collapse;width:100%;margin:.7em 0;font-size:.88em;display:block;overflow-x:auto}
.content td,.content th{border:1px solid var(--line);padding:4px 7px;vertical-align:top}
.content img{max-width:100%;height:auto;background:#fff}
.content ol{padding-left:2.6em}
.content ol>li::marker{content:"(" counter(list-item, lower-alpha) ") "}
.content ol ol>li::marker{content:"(" counter(list-item) ") "}
.content ol ol ol>li::marker{content:"(" counter(list-item, lower-roman) ") "}
.content ol ol ol ol>li::marker{content:"(" counter(list-item, upper-alpha) ") "}
.content ol ol ol ol ol>li::marker{content:"(" counter(list-item, lower-alpha) ") "}

.content a.x{color:var(--acc);text-decoration:none;border-bottom:1px dotted var(--acc)}
mark{background:var(--hl);color:inherit;border-radius:2px}
.subhead{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);margin:18px 0 8px}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px}

.pn{display:flex;justify-content:space-between;gap:10px;margin-top:20px}
.pn a{flex:1;text-decoration:none;color:var(--ink);border:1px solid var(--line);background:var(--pane);border-radius:8px;padding:8px 12px;font-size:13px}
.pn a.n{text-align:right}
.pn a span{display:block;color:var(--acc);font-family:"B612 Mono",monospace}
.res{list-style:none;padding:0;margin:0}
.res li{background:var(--pane);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:8px;cursor:pointer}
.res .k{font-family:"B612 Mono",monospace;font-size:13px;font-weight:700}
.res .k.AMC{color:var(--amc)}.res .k.GM{color:var(--gm)}.res .k.R{color:var(--acc)}
.res .s{font-size:13px;color:var(--mut);margin-top:3px}
.home h2{font-size:18px;margin:0 0 6px}
.home .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;margin-top:14px}
.home .grid a{background:var(--pane);border:1px solid var(--line);border-radius:10px;padding:12px;text-decoration:none;color:var(--ink)}
.home .grid a b{display:block;color:var(--acc)}
.note{font-size:12.5px;color:var(--mut)}
#menuBtn{display:none}
.hideAG .blk,.hideAG .subhead{display:none}
@media (max-width:820px){
 #menuBtn{display:inline-block}

}

/21880_Human_external_cargo_operations_HEC.htm","name":"Human external cargo operations (HEC)"},{"title":"SECTION 4 - Parachute operations (PAR)","rules":["r-NCO-SPEC-PAR-100","r-NCO-SPEC-PAR-105","r-NCO-SPEC-PAR-110","r-NCO-SPEC-PAR-115","r-NCO-SPEC-PAR-120"],"h":"<h1>SECTION 4 - Parachute operations (PAR)<\/h1>","id":"s-SUBPART-E-SECTION-4","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/1%20Structure/21950_Parachute_operations_PAR.htm","name":"Parachute operations (PAR)"},{"title":"SECTION 5 - Aerobatic flights (ABF)","rules":["r-NCO-SPEC-ABF-100","r-NCO-SPEC-ABF-105","r-NCO-SPEC-ABF-110"],"h":"<h1>SECTION 5 - Aerobatic flights (ABF)<\/h1>","id":"s-SUBPART-E-SECTION-5","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/1%20Structure/22110_Aerobatic_flights_ABF.htm","name":"Aerobatic flights (ABF)"},{"title":"SECTION 6 - Maintenance check flights (MCFs)","rules":["r-NCO-SPEC-MCF-100","r-NCO-SPEC-MCF-105","r-NCO-SPEC-MCF-110","r-NCO-SPEC-MCF-120","r-NCO-SPEC-MCF-125","r-NCO-SPEC-MCF-130","r-NCO-SPEC-MCF-140"],"h":"<h1>SECTION 6 - Maintenance check flights (MCFs)<\/h1>","id":"s-SUBPART-E-SECTION-6","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/1%20Structure/22210_Maintenance_check_flights_MCFs.htm","name":"Maintenance check flights (MCFs)"}],"rules":[],"h":"<h1>SUBPART E: SPECIFIC REQUIREMENTS<\/h1>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/1%20Structure/21270_SPECIFIC_REQUIREMENTS.htm","id":"s-SUBPART-E","letter":"E","name":"Specific requirements"}],"rules":[{"id":"r-NCO-GEN-100","ref":"NCO.GEN.100","title":"Competent authority","h":"<h1>NCO.GEN.100 Competent authority <\/h1> <div> <p>Repealed<\/p> <p>&nbsp;<\/p> <\/div>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/2%20Regs/18240_NCOGEN100_Competent_authority.htm","sub":[]},{"id":"r-NCO-GEN-101","ref":"NCO.GEN.101","title":"Means of compliance","h":"<h1>NCO.GEN.101 Means of compliance <\/h1> <div> <p>Alternative means of compliance to those adopted by the CAA may be used by an operator to establish compliance with Regulation (EC) No 216/2008 and its Implementing Rules.<\/p> <p>&nbsp;<\/p> <\/div>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/2%20Regs/18270_NCOGEN101_Means_of_compliance.htm","sub":[]},{"id":"r-NCO-GEN-102","ref":"NCO.GEN.102","title":"Cost-shared flights","h":"<h1>NCO.GEN.102 Cost-shared flights<\/h1> <p>SI 2025 No. 878<\/p> <p>Cost-shared flights referred to in Article 6(4a)(a) must comply with the following:<\/p> <ol> <li value=\"1\"> <p>No more than six persons (including the pilot) are to be carried on the flight.<\/p> <\/li> <li value=\"2\"> <p>All costs other than direct costs must be paid by the pilot with no contribution from the passengers.<\/p> <\/li> <li value=\"3\"> <p>The contribution referred to in Article 6(4a)(a) is an amount not more than the total direct costs divided equally by the number of persons carried (including the pilot).<\/p> <\/li> <li value=\"4\"> <p>The flight must be operated by a private individual.<\/p> <\/li> <li value=\"5\"> <p>No person acting as a pilot is employed as a pilot or acting under a contract for the provision of services as a pilot for the flight.<\/p> <\/li> <li value=\"6\"> <p>Passengers undertaking the flight must be clearly advised that the flight does not meet the same safety standards as a Commercial Air Transport (CAT) flight.<\/p> <\/li> <li value=\"7\"> <p>For each passenger, a record must be made attesting to:<\/p> <ol> <li value=\"1\"> <p>their having been clearly advised that the flight does not meet the same safety standards as a CAT flight; and<\/p> <\/li> <li value=\"2\"> <p>their acceptance of this fact as indicated by their signed declaration to this effect.<\/p> <\/li> <\/ol> <\/li> <li value=\"8\"> <p>The records referred to in (g) above must be:<\/p> <ol> <li value=\"1\"> <p>completed prior to the flight;<\/p> <\/li> <li value=\"2\"> <p>retained by the operator of the flight for a period of 6 months from the date of the flight; and<\/p> <\/li> <li value=\"3\"> <p>produced by the operator of the flight when requested by a person who is an Authorised Person within the meaning given in Schedule 1 to the Air Navigation Order 2016.<\/p> <\/li> <\/ol> <\/li> <li value=\"9\"> <p>Where advertisement or promotion of the flight occurs, the advertisement or promotion:<\/p> <ol> <li value=\"1\"> <p>must be placed by the pilot intending to operate the flight; and<\/p> <\/li> <li value=\"2\"> <p>must include:<\/p> <ol> <li value=\"1\"> <p>a statement that the flight is a private arrangement not conducted in accordance with CAT safety standards;<\/p> <\/li> <li value=\"2\"> <p>the start and end locations of the flight;<\/p> <\/li> <li value=\"3\"> <p>the date when the pilot is available to conduct the flight;<\/p> <\/li> <li value=\"4\"> <p>the licence type held by the pilot;<\/p> <\/li> <li value=\"5\"> <p>the class of medical certificate or medical declaration held by the pilot;<\/p> <\/li> <li value=\"6\"> <p>the total number of hours flown by the pilot; and<\/p> <\/li> <li value=\"7\"> <p>the total number of hours flown by the pilot in the advertised aircraft type in the three months prior to the advertisement being placed.<\/p> <\/li> <\/ol> <\/li> <\/ol> <\/li> <\/ol> <p>&nbsp;<\/p>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/2%20Regs/18300_NCOGEN102_Cost-shared_flights.htm","sub":[{"id":"x-AMC1-NCO-GEN-102-g","kind":"AMC","label":"AMC1 NCO.GEN.102(g)","title":"AMC1 NCO.GEN.102(g) Cost-shared flights","h":"<h3>AMC1 NCO.GEN.102(g) Cost-shared flights<\/h3> <p>CAA ORS9 Decision No. 54<\/p> <p>&nbsp;<\/p> <ol> <li value=\"1\"> <p>The method of recording the safety standards being identified and accepted by the passenger(s) can be such as in the format provided by the CAA, or such method available to the pilot, but which should record as a minimum the following:<\/p> <ol> <li value=\"1\"> <p>Date of Flight;<\/p> <\/li> <li value=\"2\"> <p>Aircraft Type and Registration;<\/p> <\/li> <li value=\"3\"> <p>Departure and Arrival information;<\/p> <\/li> <li value=\"4\"> <p>Passenger information on the differences and associated risks between Commercial Air Transport (CAT) and flights under this regulation; and<\/p> <\/li> <li value=\"5\"> <p>Passenger Name(s), contact details and passenger signature or other means of indicating acceptance of cost sharing flight.<\/p> <\/li> <\/ol> <\/li> <li value=\"2\"> <p>Recording and acceptance of safety standards is not required for passengers who hold or have held a pilot’s licence proved to the satisfaction of the pilot in command of the cost sharing flight.<\/p> <\/li> <li value=\"3\"> <p>New records do not need to be made for passengers on repeat flights who have flown with the same pilot on a cost sharing flight within the last 6 calendar months, provided that the original record is retained, updated to include the repeat flight details and retained for a further 6 months from the date of any repeat flight.<\/p> <\/li> <li value=\"4\"> <p>Passengers who are required to sign the declaration and consent form and who are under the age of 18, or who otherwise cannot legally or physically do so, should have the risks accepted on their behalf by an individual who has legal authority to make decisions for that person, or by an individual to whom such authority has been delegated for the relevant period.<\/p> <\/li> <\/ol> <p>&nbsp;<\/p>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/3%20AMC/AMC1%20NCO%20GEN%20102%20g%20Cost-shared%20flights.htm"},{"id":"x-GM1-NCO-GEN-102-c","kind":"GM","label":"GM1 NCO.GEN.102(c)","title":"GM1 NCO.GEN.102(c) Cost-shared flights","h":"<h4>GM1 NCO.GEN.102(c) Cost-shared flights<\/h4> <p>CAA ORS9 Decision No. 54<\/p> <p>CONTRIBUTION<\/p> <p>(a) Pilots may pay more than the proportional costs.<\/p> <p>MARKET RATE<\/p> <p>(b) ‘Direct costs’ are defined in Article 2 of UK Regulation (EU) No. 965/2012 as including ‘aircraft rental fees at current market rate’. ‘Market rate’ in this context means the average rental price of the same type of aircraft in the same geographic area on the particular date of the flight.<\/p> <p>JOINT OWNERS<\/p> <p>(c) In the case of a jointly owned aircraft, the CAA considers the hourly rate, normally payable by a joint owner, for use of their aircraft to be a 'direct cost'. It may be no more than the average market rental price.<\/p> <p>&nbsp;<\/p>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/4%20GM/GM1%20NCO%20GEN%20102%20c%20Cost-shared%20flights.htm"}]},{"id":"r-NCO-GEN-103","ref":"NCO.GEN.103","title":"Introductory flights","h":"<h1>NCO.GEN.103 Introductory flights <\/h1> <div> <p>Introductory flights referred to in Article 6(4a)(c) of this Regulation, when conducted in accordance with this Annex, shall:<\/p> <p>(a)&nbsp;start and end at the same aerodrome or operating site;<\/p> <p>(b)&nbsp;be operated under VFR by day;<\/p> <p>(c)&nbsp;be overseen by a nominated person responsible for their safety; and<\/p> <p>(d)&nbsp;comply with any other conditions stipulated by the CAA.<\/p> <p>&nbsp;<\/p> <\/div>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/2%20Regs/18330_NCOGEN103_Introductory_flights.htm","sub":[]},{"id":"r-NCO-GEN-104","ref":"NCO.GEN.104","title":"Use of aircraft included in an AOC by an NCO operator","h":"<h1>NCO.GEN.104 Use of aircraft included in an AOC by an NCO operator <\/h1> <div> <p>(a)&nbsp;An NCO operator may use other than complex motor-powered aircraft listed on an operator’s AOC to conduct non-commercial operations in accordance with this Annex.<\/p> <p>(b)&nbsp;The NCO operator using the aircraft in accordance with point (a) shall establish a procedure:<\/p> <p>(1)&nbsp;&nbsp;clearly describing how operational control of the aircraft is transferred between the AOC holder and the NCO operator, as referred to in point ORO.GEN.310 of Annex III;<\/p> <p>(2)&nbsp;&nbsp;describing the handover procedure of the aircraft upon its return to the AOC holder.<\/p> <p>That procedure shall be included in a contract between the AOC holder and the NCO operator.<\/p> <p>The NCO operator shall ensure that the procedure is communicated to the relevant personnel.<\/p> <p>(c)&nbsp;The continuing airworthiness of the aircraft used pursuant to point (a) shall be managed by organisation responsible for the continuing airworthiness for the aircraft included in the AOC, in accordance with Regulation (EU) No 1321/2014.<\/p> <p>(d)&nbsp;The NCO operator using the aircraft in accordance with point (a) shall ensure the following:<\/p> <p>(1)&nbsp;&nbsp;that every flight conducted under its operational control is recorded in the aircraft technical log system;<\/p> <p>(2)&nbsp;&nbsp;that no changes to the aircraft systems or configuration are made;<\/p> <p>(3)&nbsp;&nbsp;that any defect or technical malfunction occurring while the aircraft is under its operational control is reported to the organisation referred to in point (c) immediately after the flight;<\/p> <p>(4)&nbsp;&nbsp;that the AOC holder receives a copy of any occurrence report related to the flights performed with the aircraft, completed in accordance with Regulation (EU) No 376/2014 and Regulation (EU) 2015/1018.<\/p> <p>&nbsp;<\/p> <\/div>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/2%20Regs/18360_NCOGEN104_Use_of_aircraft_included_in_an_AOC_by_an_NCO_operator.htm","sub":[{"id":"x-AMC1-NCO-GEN-104","kind":"AMC","label":"AMC1 NCO.GEN.104","title":"AMC1 NCO.GEN.104 Use of aircraft included in an AOC by an NCO operator","h":"<h3><a><\/a>AMC1 NCO.GEN.104 Use of aircraft included in an AOC by an NCO operator&nbsp;&nbsp;&nbsp;&nbsp;<\/h3> <p>CAA ORS9 Decision No. 1<\/p> <p>RESPONSIBILITIES OF THE NCO OPERATOR<\/p> <p>The operator using the aircraft included in an AOC for operations performed in accordance with Part- NCO should describe the following elements in its procedure required in NCO.GEN.104:<\/p> <p>(a) the way in which the shifting of operational control is communicated, including how, when and to whom the information is communicated;<\/p> <p>(b) the means to ensure that the relevant personnel are instructed on the following:<\/p> <ol> <p> <\/p><p>(1) to contact the organisation responsible for the management of continuing airworthiness of the aircraft of the AOC holder (CAMO or CAO) for any defect or technical malfunction which occurs before or during the operation.<\/p> <p>The information about any defect or malfunction should be transmitted to the CAMO/CAO of the AOC holder before the aircraft is used for the next flight. The same information should be confirmed by the entries in the aircraft technical log system; and<\/p> <p><\/p> <p> <\/p><p>(2) to report any occurrence in accordance with the applicable rules and the internal procedures; and<\/p> <p><\/p> <\/ol> <p>(c) the way in which the operator deals with failures and defects identified before the flight.<\/p> <p>&nbsp;<\/p>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/3%20AMC/AMC1%20NCO%20GEN%20104%20Use%20of%20aircraft.htm"},{"id":"x-GM1-NCO-GEN-104","kind":"GM","label":"GM1 NCO.GEN.104","title":"GM1 NCO.GEN.104 Use of aircraft included in an AOC by an NCO operator","h":"<h4><a><\/a>GM1 NCO.GEN.104 Use of aircraft included in an AOC by an NCO operator&nbsp;&nbsp;&nbsp;&nbsp;<\/h4> <p>CAA ORS9 Decision No. 1<\/p> <p>SCOPE<\/p> <p>As per SPO.GEN.005(b), operators performing non-commercial specialised operations with other than complex motor-powered aircraft will comply with Annex VII (Part-NCO). Thus, such operators are also covered by NCO.GEN.104.<\/p> <p>&nbsp;<\/p>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/4%20GM/GM1%20NCO%20GEN%20104%20Use%20of%20aircraft.htm"},{"id":"x-GM1-NCO-GEN-104-c","kind":"GM","label":"GM1 NCO.GEN.104(c)","title":"GM1 NCO.GEN.104(c) Use of aircraft included in an AOC by an NCO  operator","h":"<h4><a><\/a>GM1 NCO.GEN.104(c) Use of aircraft included in an AOC by an NCO operator&nbsp;&nbsp;&nbsp;&nbsp;<\/h4> <p>CAA ORS9 Decision No. 1<\/p> <p>CONTINUING AIRWORTHINESS MANAGEMENT<\/p> <p>In accordance with Annex I (Part-M) and Annex Vb (Part-ML) to Regulation (EU) No 1321/2014, the management of the continuing airworthiness of the aircraft by the CAMO/CAO of the AOC holder means that the NCO operator has established a written contract as per Appendix I to Part-M or Appendix I to Part-ML with this CAMO/CAO.<\/p> <p>&nbsp;<\/p>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/4%20GM/GM1%20NCO%20GEN%20104%20c%20Use%20of%20aircraft.htm"}]},{"id":"r-NCO-GEN-105","ref":"NCO.GEN.105","title":"Pilot-in-command responsibilities and authority","h":"<h1>NCO.GEN.105 Pilot-in-command responsibilities and authority <\/h1> <div> <p>(a)&nbsp;The pilot-in-command shall be responsible for:<\/p> <p>(1)&nbsp;&nbsp;the safety of the aircraft and of all crew members, passengers and cargo on board during aircraft operations as referred to in 1.c of Annex IV to Regulation (EC) No 216/2008;<\/p> <p>(2)&nbsp;&nbsp;the initiation, continuation, termination or diversion of a flight in the interest of safety;<\/p> <p>(3)&nbsp;&nbsp;ensuring that all operational procedures and checklists are complied with as referred to in 1.b of Annex IV to Regulation (EC) No 216/2008;<\/p> <p>(4)&nbsp;&nbsp;only commencing a flight if he/she is satisfied that all operational limitations referred to in 2.a.3 of Annex IV to Regulation (EC) No 216/2008 are complied with, as follows:<\/p> <p>(i)&nbsp;&nbsp;the aircraft is airworthy;<\/p> <p>(ii)&nbsp;&nbsp;the aircraft is duly registered;<\/p> <p>(iii)&nbsp;&nbsp;instruments and equipment required for the execution of that flight are installed in the aircraft and are operative, unless operation with inoperative equipment is permitted by the minimum equipment list (MEL) or equivalent document, if applicable, as provided for in points NCO.IDE.A.105 or NCO.IDE.H.105;<\/p> <p>(iv)&nbsp;&nbsp;the mass of the aircraft and the centre of gravity location are such that the flight can be conducted within limits prescribed in the airworthiness documentation;<\/p> <p>(v)&nbsp;&nbsp;all equipment, baggage and cargo are properly loaded and secured and an emergency evacuation remains possible;<\/p> <p>(vi)&nbsp;&nbsp;the aircraft operating limitations as specified in the aircraft flight manual (AFM) will not be exceeded at any time during the flight; and<\/p> <p>(vii)&nbsp;&nbsp;any navigational database required for PBN is suitable and current;<\/p> <p>(5)&nbsp;&nbsp;not commencing a flight if he/she is incapacitated from performing duties by any cause such as injury, sickness, fatigue or the effects of any psychoactive substance;<\/p> <p>(6)&nbsp;&nbsp;not continuing a flight beyond the nearest weather-permissible aerodrome or operating site when his/her capacity to perform duties is significantly reduced from causes such as fatigue, sickness or lack of oxygen;<\/p> <p>(7)&nbsp;&nbsp;deciding on acceptance of the aircraft with unserviceabilities in accordance with the configuration deviation list (CDL) or minimum equipment list (MEL), as applicable; and<\/p> <p>(8)&nbsp;&nbsp;recording utilisation data and all known or suspected defects in the aircraft at the termination of the flight, or series of flights, in the aircraft technical log or journey log for the aircraft.<\/p> <p>(b)&nbsp;The pilot-in-command shall ensure that during critical phases of flight or whenever deemed necessary in the interest of safety, all crew members are seated at their assigned stations and do not perform any activities other than those required for the safe operation of the aircraft.<\/p> <p>(c)&nbsp;The pilot-in-command shall have the authority to refuse carriage of or disembark any person, baggage or cargo that may represent a potential hazard to the safety of the aircraft or its occupants.<\/p> <p>(d)&nbsp;The pilot-in-command shall, as soon as possible, report to the appropriate air traffic services (ATS) unit any hazardous weather or flight conditions encountered that are likely to affect the safety of other aircraft.<\/p> <p>(e)&nbsp;The pilot-in-command shall, in an emergency situation that requires immediate decision and action, take any action he/she considers necessary under the circumstances in accordance with 7.d of Annex IV to Regulation (EC) No 216/2008. In such cases he/she may deviate from rules, operational procedures and methods in the interest of safety.<\/p> <p>(f)&nbsp;During flight, the pilot-in-command shall:<\/p> <p>(1)&nbsp;&nbsp;keep his/her safety belt fastened while at his/her station; and<\/p> <p>(2)&nbsp;&nbsp;remain at the controls of the aircraft at all times except if another pilot is taking the controls.<\/p> <p>(g)&nbsp;The pilot-in-command shall submit a report of an act of unlawful interference without delay to the CAA and shall inform the designated local authority.<\/p> <p>(h)&nbsp;The pilot-in-command shall notify the nearest appropriate authority by the quickest available means of any accident involving the aircraft that results in serious injury or death of any person or substantial damage to the aircraft or property.<\/p> <p>&nbsp;<\/p> <\/div>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/2%20Regs/18390_NCOGEN105_Pilot-in-command_responsibilities_and_authority.htm","sub":[{"id":"x-AMC1-NCO-GEN-105","kind":"AMC","label":"AMC1 NCO.GEN.105","title":"AMC1 NCO.GEN.105 Pilot-in-command responsibilities and authority","h":"<h3><a><\/a>AMC1 NCO.GEN.105 Pilot-in-command responsibilities and authority&nbsp;&nbsp;&nbsp;&nbsp;<\/h3> <p>CAA ORS9 Decision No. 1<\/p> <p>FLIGHT PREPARATION FOR PBN OPERATIONS<\/p> <p>(a) The pilot-in-command should ensure that RNAV 1, RNAV 2, RNP 1, RNP 2, and RNP APCH routes or procedures to be used for the intended flight, including for any alternate aerodromes, are selectable from the navigation database and are not prohibited by NOTAM.<\/p> <p>(b) The pilot-in-command should take account of any NOTAMs or pilot-in-command briefing material that could adversely affect the aircraft system operation along its flight plan including any alternate aerodromes.<\/p> <p>(c) When PBN relies on GNSS systems for which RAIM is required for integrity, its availability should be verified during the preflight planning. In the event of a predicted continuous loss of fault detection of more than five minutes, the flight planning should be revised to reflect the lack of full PBN capability for that period.<\/p> <p>(d) For RNP 4 operations with only GNSS sensors, a fault detection and exclusion (FDE) check should be performed. The maximum allowable time for which FDE capability is projected to be unavailable on any one event is 25 minutes. If predictions indicate that the maximum allowable FDE outage will be exceeded, the operation should be rescheduled to a time when FDE is available.<\/p> <p>(e) For RNAV 10 operations, the pilot-in-command should take account of the RNAV 10 time limit declared for the inertial system, if applicable, considering also the effect of weather conditions that could affect flight duration in RNAV 10 airspace. Where an extension to the time limit is permitted, the pilot-in-command will need to ensure that en route radio facilities are serviceable before departure, and to apply radio updates in accordance with any AFM/POH limitation.<\/p> <p>&nbsp;<\/p>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/3%20AMC/AMC1%20NCO%20GEN%20105%20Pilot%20in.htm"},{"id":"x-AMC2-NCO-GEN-105","kind":"AMC","label":"AMC2 NCO.GEN.105","title":"AMC2 NCO.GEN.105 Pilot-in-command responsibilities and authority","h":"<h3><a><\/a>AMC2 NCO.GEN.105 Pilot-in-command responsibilities and authority&nbsp;&nbsp;&nbsp;&nbsp;<\/h3> <p>CAA ORS9 Decision No. 1<\/p> <p>DATABASE SUITABILITY<\/p> <p>(a) The pilot-in-command should check that any navigational database required for PBN operations includes the routes and procedures required for the flight.<\/p> <p>DATABASE CURRENCY<\/p> <p>(b) The database validity (current AIRAC cycle) should be checked before the flight.<\/p> <p>(c) Navigation databases should be current for the duration of the flight. If the AIRAC cycle is due to change during flight, the pilot-in-command should follow procedures established by the pilot- in-command to ensure the accuracy of navigation data, including the suitability of navigation facilities used to define the routes and procedures for the flight.<\/p> <p>(d) An expired database may only be used if the following conditions are satisfied:<\/p> <ol> <p> <\/p><p>(1) the pilot-in-command has confirmed that the parts of the database which are intended to be used during the flight and any contingencies that are reasonable to expect are not changed in the current version;<\/p> <p><\/p> <p> <\/p><p>(2) any NOTAMs associated with the navigational data are taken into account;<\/p> <p><\/p> <p> <\/p><p>(3) maps and charts corresponding to those parts of the flight are current and have not been amended since the last cycle;<\/p> <p><\/p> <p> <\/p><p>(4) any MEL limitations, where available, are observed; and<\/p> <p><\/p> <p> <\/p><p>(5) the database has expired by no more than 28 days.<\/p> <p>&nbsp;<\/p> <p><\/p> <\/ol>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/3%20AMC/AMC2%20NCO%20GEN%20105%20Pilot%20in.htm"},{"id":"x-AMC1-NCO-GEN-105-a-3","kind":"AMC","label":"AMC1 NCO.GEN.105(a)(3)","title":"AMC1 NCO.GEN.105(a)(3) Pilot-in-command responsibilities and authority","h":"<h3>AMC1 NCO.GEN.105(a)(3) Pilot‑in‑command responsibilities and authority<\/h3> <p>CAA ORS9 Decision No. 47<\/p> <p>CHECKLISTS<\/p> <ol> <li value=\"1\"> <p>The pilot‑in‑command should have and use the latest checklists provided by the manufacturer or the operator, covering all phases of operation of the aircraft under normal and emergency conditions and situations.<\/p> <\/li> <li value=\"2\"> <p>If checks conducted prior to take‑off are suspended at any point, the pilot‑in‑command should restart them from a safe point prior to the interruption.<\/p> <\/li> <\/ol> <p>&nbsp;<\/p>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/3%20AMC/AMC1%20NCO%20GEN%20105%20a%203%20Pilot%20in.htm"},{"id":"x-AMC1-NCO-GEN-105-e","kind":"AMC","label":"AMC1 NCO.GEN.105(e)","title":"AMC1 NCO.GEN.105(e) Pilot-in-command responsibilities and authority","h":"<h3><a><\/a>AMC1 NCO.GEN.105(e) Pilot-in-command responsibilities and authority&nbsp;&nbsp;&nbsp;&nbsp;<\/h3> <p>CAA ORS9 Decision No. 1<\/p> <p>VIOLATION REPORTING<\/p> <p>If required by the State in which the incident occurs, the pilot-in-command should submit a report on any such violation to the appropriate authority of such State; in that event, the pilot-in-command should also submit a copy of it to the CAA. Such reports should be submitted as soon as possible and normally within 10 days.<\/p> <p>&nbsp;<\/p>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/3%20AMC/AMC1%20NCO%20GEN%20105%20e%20Pilot%20in.htm"},{"id":"x-GM1-NCO-GEN-105","kind":"GM","label":"GM1 NCO.GEN.105","title":"GM1 NCO.GEN.105 Pilot-in-command responsibilities and authority","h":"<h4><a><\/a>GM1 NCO.GEN.105 Pilot-in-command responsibilities and authority <\/h4> <p>CAA ORS9 Decision No. 1<\/p> <p>GENERAL<\/p> <p>In accordance with point 1.3 of Annex V to Regulation (EU) 2018/1139 (essential requirements for air operations), the pilot-in-command is responsible for the operation and safety of the aircraft and for the safety of all passengers and cargo on board. This includes the following:<\/p> <p>(a) the safety of all passengers and cargo on board, as soon as he/she arrives on board, until he/she leaves the aircraft at the end of the flight; and<\/p> <p>(b) the operation and safety of the aircraft:<\/p> <ol> <p> <\/p><p>(1) for aeroplanes, from the moment it is first ready to move for the purpose of flight until the moment it comes to rest at the end of the flight and the engine(s) used as primary propulsion unit(s) is/are shut down;<\/p> <p><\/p> <p> <\/p><p>(2) for helicopters, from the moment the engine(s) are started until the helicopter comes to rest at the end of the flight with the engine(s) shut down and the rotor blades stopped.<\/p> <p>&nbsp;<\/p> <p><\/p> <\/ol>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/4%20GM/GM1%20NCO%20GEN%20105%20Pilot%20in%20command.htm"},{"id":"x-GM1-NCO-GEN-105-a-3","kind":"GM","label":"GM1 NCO.GEN.105(a)(3)","title":"GM1 NCO.GEN.105(a)(3) Pilot-in-command responsibilities and authority","h":"<h4>GM1 NCO.GEN.105(a)(3) Pilot‑in‑command responsibilities and authority<\/h4> <p>CAA ORS9 Decision No. 47<\/p> <p>NORMAL CHECKLISTS<\/p> <ol> <li value=\"1\"> <p>A normal checklist is a written list to confirm that safety‑critical actions included in the associated normal procedure have been performed.<\/p> <\/li> <li value=\"2\"> <p>When normal checklists are not provided by the manufacturer, the operator may be required to develop normal checklists. The design and the usage of checklists need to observe human factors principles and take into account the latest relevant documentation and information from the manufacturer.<\/p> <\/li> <\/ol> <p>&nbsp;<\/p>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/4%20GM/GM1%20NCO%20GEN%20105%20a%203%20Pilot-in-command%20responsibilities%20and%20authority.htm"},{"id":"x-GM1-NCO-GEN-105-a-8","kind":"GM","label":"GM1 NCO.GEN.105(a)(8)","title":"GM1 NCO.GEN.105(a)(8) Pilot-in-command responsibilities and authority","h":"<h4><a><\/a>GM1 NCO.GEN.105(a)(8) Pilot-in-command responsibilities and authority&nbsp;&nbsp;&nbsp;&nbsp;<\/h4> <p>CAA ORS9 Decision No. 1<\/p> <p>RECORDING UTILISATION DATA<\/p> <p>Where an aircraft conducts a series of flights of short duration — such as a helicopter doing a series of lifts — and the aircraft is operated by the same pilot-in-command, the utilisation data for the series of flights may be recorded in the aircraft technical log or journey log as a single entry.<\/p> <p>&nbsp;<\/p>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/4%20GM/GM1%20NCO%20GEN%20105%20a%208%20Pilot.htm"},{"id":"x-GM1-NCO-GEN-105-d","kind":"GM","label":"GM1 NCO.GEN.105(d)","title":"GM1 NCO.GEN.105(d) Pilot-in-command responsibilities and authority","h":"<h4><a><\/a>GM1 NCO.GEN.105(d) Pilot-in-command responsibilities and authority&nbsp;&nbsp;&nbsp;&nbsp;<\/h4> <p>CAA ORS9 Decision No. 1<\/p> <p>REPORTING OF HAZARDOUS FLIGHT CONDITIONS<\/p> <p>(a) These reports should include any detail which may be pertinent to the safety of other aircraft.<\/p> <p>(b) Such reports should be made whenever any of the following conditions are encountered or observed:<\/p> <ol> <p> <\/p><p>(1) severe turbulence;<\/p> <p><\/p> <p> <\/p><p>(2) severe icing;<\/p> <p><\/p> <p> <\/p><p>(3) severe mountain wave;<\/p> <p><\/p> <p> <\/p><p>(4) thunderstorms, with or without hail, that are obscured, embedded, widespread or in squall lines;<\/p> <p><\/p> <p> <\/p><p>(5) heavy dust storm or heavy sandstorm;<\/p> <p><\/p> <p> <\/p><p>(6) volcanic ash cloud; and<\/p> <p><\/p> <p> <\/p><p>(7) unusual and/or increasing volcanic activity or a volcanic eruption.<\/p> <p><\/p> <\/ol> <p>(c) When other meteorological conditions not listed above, e.g. wind shear, are encountered that, in the opinion of the pilot-in-command, may affect the safety or the efficiency of other aircraft operations, the pilot-in-command should advise the appropriate air traffic services (ATS) unit as soon as practicable.<\/p> <p>&nbsp;<\/p>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/4%20GM/GM1%20NCO%20GEN%20105%20d%20Pilot%20in.htm"}]},{"id":"r-NCO-GEN-106","ref":"NCO.GEN.106","title":"Pilot-in-command responsibilities and authority — balloons","h":"<h1>NCO.GEN.106 Pilot-in-command responsibilities and authority — balloons <\/h1> <div> <p>Provision repealed before document was retained.<\/p> <p>&nbsp;<\/p> <\/div>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/2%20Regs/18420_NCOGEN106_Pilot-in-command_responsibilities_and_authority_balloons.htm","sub":[]},{"id":"r-NCO-GEN-110","ref":"NCO.GEN.110","title":"Compliance with laws, regulations and procedure","h":"<h1>NCO.GEN.110 Compliance with laws, regulations and procedure <\/h1> <div> <p>(a)&nbsp;The pilot-in-command shall comply with the laws, regulations and procedures of those States where operations are conducted.<\/p> <p>(b)&nbsp;The pilot-in-command shall be familiar with the laws, regulations and procedures, pertinent to the performance of his/her duties, prescribed for the areas to be traversed, the aerodromes or operating sites to be used and the related air navigation facilities as referred to in 1.a of Annex IV to Regulation (EC) No 216/2008.<\/p> <p>&nbsp;<\/p> <\/div>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/2%20Regs/18450_NCOGEN110_Compliance_with_laws_regulations_and_procedure.htm","sub":[]},{"id":"r-NCO-GEN-115","ref":"NCO.GEN.115","title":"Taxiing of aeroplanes","h":"<h1>NCO.GEN.115 Taxiing of aeroplanes <\/h1> <div> <p>An aeroplane shall only be taxied on the movement area of an aerodrome if the person at the controls:<\/p> <p>(a)&nbsp;is an appropriately qualified pilot; or<\/p> <p>(b)&nbsp;has been designated by the operator and:<\/p> <p>(1)&nbsp;&nbsp;is trained to taxi the aeroplane;<\/p> <p>(2)&nbsp;&nbsp;is trained to use the radio telephone, if radio communications are required;<\/p> <p>(3)&nbsp;&nbsp;has received instruction in respect of aerodrome layout, routes, signs, marking, lights, air traffic control (ATC) signals and instructions, phraseology and procedures; and<\/p> <p>(4)&nbsp;&nbsp;is able to conform to the operational standards required for safe aeroplane movement at the aerodrome.<\/p> <p>&nbsp;<\/p> <\/div>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/2%20Regs/18480_NCOGEN115_Taxiing_of_aeroplanes.htm","sub":[{"id":"x-GM1-NCO-GEN-115","kind":"GM","label":"GM1 NCO.GEN.115","title":"GM1 NCO.GEN.115 Taxiing of aeroplanes","h":"<h4><a><\/a>GM1 NCO.GEN.115 Taxiing of aeroplanes&nbsp;&nbsp;&nbsp;&nbsp;<\/h4> <p>CAA ORS9 Decision No. 1<\/p> <p>SAFETY-CRITICAL ACTIVITY<\/p> <p>(a) Taxiing should be treated as a safety-critical activity due to the risks related to the movement of the aeroplane and the potential for a catastrophic event on the ground.<\/p> <p>(b) Taxiing is a high-workload phase of flight that requires the full attention of the pilot-in- command.<\/p> <p>&nbsp;<\/p>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/4%20GM/GM1%20NCO%20GEN%20115%20Taxiing%20of.htm"},{"id":"x-GM1-NCO-GEN-115-b-4","kind":"GM","label":"GM1 NCO.GEN.115(b)(4)","title":"GM1 NCO.GEN.115(b)(4) Taxiing of aeroplanes","h":"<h4><a><\/a>GM1 NCO.GEN.115(b)(4) Taxiing of aeroplanes&nbsp;&nbsp;&nbsp;&nbsp;<\/h4> <p>CAA ORS9 Decision No. 1<\/p> <p>SKILLS AND KNOWLEDGE<\/p> <p>The person designated by the operator to taxi an aeroplane should possess the following skills and knowledge:<\/p> <p>(a) positioning of the aeroplane to ensure safety when starting engine;<\/p> <p>(b) getting ATIS reports and taxi clearance, where applicable;<\/p> <p>(c) interpretation of airfield markings/lights/signals/indicators;<\/p> <p>(d) interpretation of marshalling signals, where applicable;<\/p> <p>(e) identification of suitable parking area;<\/p> <p>(f) maintaining lookout and right-of-way rules and complying with ATC or marshalling instructions when applicable;<\/p> <p>(g) avoidance of adverse effect of propeller slipstream or jet wash on other aeroplanes, aerodrome facilities and personnel;<\/p> <p>(h) inspection of taxi path when surface conditions are obscured;<\/p> <p>(i) communication with others when controlling an aeroplane on the ground;<\/p> <p>(j) interpretation of operational instructions;<\/p> <p>(k) reporting of any problem that may occur while taxiing an aeroplane; and<\/p> <p>(l) adapting the taxi speed in accordance with prevailing aerodrome, traffic, surface and weather conditions.<\/p> <p>&nbsp;<\/p>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/4%20GM/GM1%20NCO%20GEN%20115%20b%204%20Taxiing.htm"}]},{"id":"r-NCO-GEN-120","ref":"NCO.GEN.120","title":"Rotor engagement — helicopters","h":"<h1>NCO.GEN.120 Rotor engagement — helicopters <\/h1> <div> <p>A helicopter rotor shall only be turned under power for the purpose of flight with a qualified pilot at the controls.<\/p> <p>&nbsp;<\/p> <\/div>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/2%20Regs/18510_NCOGEN120_Rotor_engagement_helicopters.htm","sub":[{"id":"x-GM1-NCO-GEN-120","kind":"GM","label":"GM1 NCO.GEN.120","title":"GM1 NCO.GEN.120 Rotor engagement","h":"<h4><a><\/a>GM1 NCO.GEN.120 Rotor engagement&nbsp;&nbsp;&nbsp;&nbsp;<\/h4> <p>CAA ORS9 Decision No. 1<\/p> <p>INTENT OF THE RULE<\/p> <p>(a) The following two situations where it is allowed to turn the rotor under power should be distinguished:<\/p> <ol> <p> <\/p><p>(1) for the purpose of flight, this is described in the implementing rule;<\/p> <p><\/p> <p> <\/p><p>(2) for maintenance purposes.<\/p> <p><\/p> <\/ol> <p>(b) Rotor engagement for the purpose of flight: it should be noted that the pilot should not leave the control when the rotors are turning. For example, the pilot is not allowed to get out of the aircraft in order to welcome passengers and adjust their seat belts with the rotors turning.<\/p> <p>(c) Rotor engagement for the purpose of maintenance: the implementing rule, however, should not prevent ground runs being conducted by qualified personnel other than pilots for maintenance purposes.<\/p> <p>The following conditions should be applied:<\/p> <ol> <p> <\/p><p>(1) The operator should ensure that the qualification of personnel, other than pilots, who are authorised to conduct maintenance runs is described in the appropriate manual.<\/p> <p><\/p> <p> <\/p><p>(2) Ground runs should not include taxiing the helicopter.<\/p> <p><\/p> <p> <\/p><p>(3) There should be no passengers on board.<\/p> <p><\/p> <p> <\/p><p>(4) Maintenance runs should not include collective increase or auto pilot engagement (risk of ground resonance).<\/p> <p>&nbsp;<\/p> <p><\/p> <\/ol>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/4%20GM/GM1%20NCO%20GEN%20120%20Rotor%20engagement.htm"}]},{"id":"r-NCO-GEN-125","ref":"NCO.GEN.125","title":"Portable electronic devices","h":"<h1>NCO.GEN.125 Portable electronic devices <\/h1> <div> <p>The pilot-in-command shall not permit any person to use a portable electronic device (PED) on board an aircraft, including an electronic flight bag (EFB), that could adversely affect the performance of the aircraft systems and equipment or the ability of the flight crew member to operate the aircraft.<\/p> <p>&nbsp;<\/p> <\/div>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/2%20Regs/18540_NCOGEN125_Portable_electronic_devices.htm","sub":[{"id":"x-AMC1-NCO-GEN-125","kind":"AMC","label":"AMC1 NCO.GEN.125","title":"AMC1 NCO.GEN.125 Portable electronic devices (PEDs)","h":"<h3><a><\/a>AMC1 NCO.GEN.125 Portable electronic devices (PEDs)&nbsp;&nbsp;&nbsp;&nbsp;<\/h3> <p>CAA ORS9 Decision No. 1<\/p> <p>ELECTRONIC FLIGHT BAGS (EFBS) — HARDWARE<\/p> <p>(a) EFB viewable stowage<\/p> <p>When a viewable stowage device is used, the pilot-in-command should ensure that, if the EFB moves or is separated from its stowage, or if the viewable stowage is unsecured from the aircraft (as a result of turbulence, manoeuvring, or other action), it will not jam flight controls, damage flight deck equipment, or injure any person on board.<\/p> <p>The viewable stowage device should not be positioned in such a way that it obstructs visual or physical access to aircraft controls and/or displays, flight crew ingress or egress, or external vision. The design of the viewable stowage device should allow the user easy access to any item of the EFB system, and notably to the EFB controls and a clear view of the EFB display while in use.<\/p> <p>(b) Cables<\/p> <p>If cables are used to connect an EFB to an aircraft system, power source, or any other equipment:<\/p> <ol> <p> <\/p><p>(1) the cables should not hang loosely in a way that compromises task performance and safety; flight crew should be able to easily secure the cables out of the way during operations (e.g. by using cable tether straps); and<\/p> <p><\/p> <p> <\/p><p>(2) the cables should be of sufficient length so that they do not to obstruct the use of any movable device on the flight deck.<\/p> <p>&nbsp;<\/p> <p><\/p> <\/ol>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/3%20AMC/AMC1%20NCO%20GEN%20125%20Portable.htm"},{"id":"x-AMC2-NCO-GEN-125","kind":"AMC","label":"AMC2 NCO.GEN.125","title":"AMC2 NCO.GEN.125 Portable electronic devices (PEDs)","h":"<h3><a><\/a>AMC2 NCO.GEN.125 Portable electronic devices (PEDs)&nbsp;&nbsp;&nbsp;&nbsp;<\/h3> <p>CAA ORS9 Decision No. 1<\/p> <p>ELECTRONIC FLIGHT BAGS (EFBs) — FUNCTIONS<\/p> <p>(a) Familiarisation<\/p> <p>The pilot-in-command should familiarise himself or herself with the use of the EFB hardware and its applications on the ground before using them in flight for the first time.<\/p> <p>A user guide should be available for the pilot-in-command.<\/p> <p>(b) Check before flight<\/p> <p>Before each flight, the pilot-in-command should perform the following checks to ensure the continued safe operation of the EFB during the flight:<\/p> <ol> <p> <\/p><p>(1) general check of the EFB operation by switching it ON and checking that the applications they intend to use in flight are adequately operative;<\/p> <p><\/p> <p> <\/p><p>(2) check of the remaining available battery power, if applicable, to ensure the availability of the EFB during the planned flight;<\/p> <p><\/p> <p> <\/p><p>(3) check of the version effectivity of the EFB databases, if applicable (e.g. for charts, performance calculation and weight and balance applications); and<\/p> <p><\/p> <p> <\/p><p>(4) check that an appropriate backup is available when a chart application or an application displaying aircraft checklists is used.<\/p> <p><\/p> <\/ol> <p>(c) Chart applications<\/p> <p>The navigation charts that are depicted should contain the necessary information in an appropriate format, to perform the operation safely. Consideration should be given to the size of the display to ensure legibility.<\/p> <p>(d) Performance calculation and weight and balance functions or applications<\/p> <p>Prior to the first use of a performance calculation or weight and balance function or application, and following any update of the database supporting the function or the application, a check should be performed on the ground to verify that the output of the application corresponds with the data derived from the AFM (or other appropriate sources);<\/p> <p>(e) Airport moving map display (AMMD) application<\/p> <p>An AMMD application should not be used as a primary means of navigation for taxiing, but as a confirmation of outside visual references.<\/p> <p>(f) Other functions<\/p> <p>If advanced functions on non-certified devices that display information related to the aircraft position in flight, navigation, surroundings in terms of e.g. terrain or traffic, or attitude are used, the pilot in command should be aware of the potential misleading or erroneous information displayed and should only use these functions as an advisory or supplementary means.<\/p> <p>&nbsp;<\/p>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/3%20AMC/AMC2%20NCO%20GEN%20125%20Portable.htm"},{"id":"x-GM1-NCO-GEN-125","kind":"GM","label":"GM1 NCO.GEN.125","title":"GM1 NCO.GEN.125 Portable electronic devices","h":"<h4><a><\/a>GM1 NCO.GEN.125 Portable electronic devices&nbsp;&nbsp;&nbsp;&nbsp;<\/h4> <p>CAA ORS9 Decision No. 1<\/p> <p>DEFINITIONS<\/p> <p>(a) Definition and categories of PEDs<\/p> <p>PEDs are any kind of electronic device, typically but not limited to consumer electronics, brought on board the aircraft by crew members, passengers, or as part of the cargo and that are not included in the approved aircraft configuration. All equipment that is able to consume electrical energy falls under this definition. The electrical energy can be provided from internal sources as batteries (chargeable or non-rechargeable) or the devices may also be connected to specific aircraft power sources.<\/p> <p>PEDs include the following two categories:<\/p> <ol> <p> <\/p><p>(1) Non-intentional transmitters can non-intentionally radiate RF transmissions, sometimes referred to as spurious emissions. This category includes, but is not limited to, calculators, cameras, radio receivers, audio and video players, electronic games and toys; when these devices are not equipped with a transmitting function.<\/p> <p><\/p> <p> <\/p><p>(2) Intentional transmitters radiate RF transmissions on specific frequencies as part of their intended function. In addition, they may radiate non-intentional transmissions like any PED. The term ‘transmitting PED’ (T-PED) is used to identify the transmitting capability of the PED. Intentional transmitters are transmitting devices such as RF-based remote control equipment, which may include some toys, two-way radios (sometimes referred to as private mobile radio), mobile phones of any type, satellite phones, computers with mobile phone data connection, wireless local area network (WLAN) or Bluetooth capability. After deactivation of the transmitting capability, e.g. by activating the so-called ‘flight mode’ or ‘flight safety mode’, the T-PED remains a PED having non-intentional emissions.<\/p> <p><\/p> <\/ol> <p>(b) Definition of the switched-off status<\/p> <p>Many PEDs are not completely disconnected from the internal power source when switched off. The switching function may leave some remaining functionality e.g. data storage, timer, clock, etc. These devices can be considered switched off when in the deactivated status. The same applies for devices having no transmitting capability and are operated by coin cells without further deactivation capability, e.g. wrist watches.<\/p> <p>&nbsp;<\/p>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/4%20GM/GM1%20NCO%20GEN%20125%20Portable%20electronic.htm"},{"id":"x-GM2-NCO-GEN-125","kind":"GM","label":"GM2 NCO.GEN.125","title":"GM2 NCO.GEN.125 Portable electronic devices","h":"<h4><a><\/a>GM2 NCO.GEN.125 Portable electronic devices&nbsp;&nbsp;&nbsp;&nbsp;<\/h4> <p>CAA ORS9 Decision No. 1<\/p> <p>GENERAL<\/p> <p>(a) PEDs can pose a risk of interference with electronically operated aircraft systems. Those systems could range from the electronic engine control, instruments, navigation or communication equipment, autopilots to any other type of avionic equipment on the aircraft. The interference can result in on-board systems malfunctioning or providing misleading information and communication disturbance. These can also lead to an increased workload for the flight crew.<\/p> <p>(b) Interference may be caused by transmitters being part of the PED’s functionality or by unintentional transmissions from the PED. Due to the likely proximity of the PED to any electronically operated aircraft system and the generally limited shielding found in small aircraft, the risk of interference is to be considered higher than that for larger aircraft with metal airframes.<\/p> <p>(c) During certification of the aircraft, when qualifying the aircraft functions consideration may only have been made of short-term exposure to a high radiating field, with an acceptable mitigating measure being a return to normal function after removal of the threat. This certification assumption may not be true when operating the transmitting PED on board the aircraft.<\/p> <p>(d) It has been found that compliance with the electromagnetic compatibility (EMC) Directive 2004/108/EC and related European standards, as indicated by the CE marking, is not sufficient to exclude the existence of interference. A well-known interference is the demodulation of the transmitted signal from GSM (global system for mobile communications) mobile phones leading to audio disturbances in other systems. Similar interferences are difficult to predict during the PED design and protecting the aircraft’s electronic systems against the full range of potential interferences is practically impossible. Therefore, not operating PEDs on-board aircraft is the safest option, especially as effects may not be identified immediately but under the most inconvenient circumstances.<\/p> <p>(e) Guidance to follow in case of fire caused by PEDs is provided by the International Civil Aviation Organisation, ‘Emergency response guidance for aircraft incidents involving dangerous goods’, ICAO Doc 9481-AN/928.<\/p> <p>&nbsp;<\/p>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/4%20GM/GM2%20NCO%20GEN%20125%20Portable%20electronic.htm"}]},{"id":"r-NCO-GEN-130","ref":"NCO.GEN.130","title":"Information on emergency and survival equipment carried","h":"<h1>NCO.GEN.130 Information on emergency and survival equipment carried <\/h1> <div> <p>Except for aircraft taking-off and landing at the same aerodrome/operating site, the operator shall, at all times, have available for immediate communication to rescue coordination centres (RCCs) lists containing information on the emergency and survival equipment carried on board.<\/p> <p>&nbsp;<\/p> <\/div>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/2%20Regs/18570_NCOGEN130_Information_on_emergency_and_survival_equipment_carried.htm","sub":[{"id":"x-AMC1-NCO-GEN-130","kind":"AMC","label":"AMC1 NCO.GEN.130","title":"AMC1 NCO.GEN.130 Information on emergency and survival equipment carried","h":"<h3><a><\/a>AMC1 NCO.GEN.130 Information on emergency and survival equipment carried&nbsp;&nbsp;&nbsp;&nbsp;<\/h3> <p>CAA ORS9 Decision No. 1<\/p> <p>CONTENT OF INFORMATION<\/p> <p>The information, compiled in a list, should include, as applicable:<\/p> <p>(a) the number, colour and type of life rafts and pyrotechnics,<\/p> <p>(b) details of emergency medical supplies and water supplies; and<\/p> <p>(c) the type and frequencies of the emergency portable radio equipment.<\/p> <p>&nbsp;<\/p>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/3%20AMC/AMC1%20NCO%20GEN%20130%20Information.htm"}]},{"id":"r-NCO-GEN-135","ref":"NCO.GEN.135","title":"Documents, manuals and information to be carried","h":"<h1>NCO.GEN.135 Documents, manuals and information to be carried <\/h1> <div> <p>(a)&nbsp;The following documents, manuals and information shall be carried on each flight as originals or copies unless otherwise specified:<\/p> <p>(1)&nbsp;&nbsp;the AFM, or equivalent document(s);<\/p> <p>(2)&nbsp;&nbsp;the original certificate of registration;<\/p> <p>(3)&nbsp;&nbsp;the original certificate of airworthiness (CofA);<\/p> <p>(4)&nbsp;&nbsp;the noise certificate, if applicable;<\/p> <p>(5)&nbsp;&nbsp;the list of specific approvals, if applicable;<\/p> <p>(6)&nbsp;&nbsp;the aircraft radio licence, if applicable;<\/p> <p>(7)&nbsp;&nbsp;the third party liability insurance certificate(s);<\/p> <p>(8)&nbsp;&nbsp;the journey log, or equivalent, for the aircraft;<\/p> <p>(9)&nbsp;&nbsp;details of the filed ATS flight plan, if applicable;<\/p> <p>(10)&nbsp;&nbsp;current and suitable aeronautical charts for the route area of the proposed flight and all routes along which it is reasonable to expect that the flight may be diverted;<\/p> <p>(11)&nbsp;&nbsp;procedures and visual signals information for use by intercepting and intercepted aircraft;<\/p> <p>(12)&nbsp;&nbsp;the MEL or CDL, if applicable; and<\/p> <p>(13)&nbsp;&nbsp;any other documentation that may be pertinent to the flight or is required by the States concerned with the flight.<\/p> <p>(b)&nbsp;Notwithstanding (a), on flights:<\/p> <p>(1)&nbsp;&nbsp;intending to take off and land at the same aerodrome/operating site; or<\/p> <p>(2)&nbsp;&nbsp; remaining within a distance or area determined by the CAA, &nbsp;the documents and information in (a)(2) to (a)(8) may be retained at the aerodrome or operating site.<\/p> <p>(c)&nbsp;The pilot-in-command shall make available within a reasonable time of being requested to do so by the CAA, the documentation required to be carried on board.<\/p> <p>&nbsp;<\/p> <\/div>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/2%20Regs/18600_NCOGEN135_Documents_manuals_and_information_to_be_carried.htm","sub":[{"id":"x-AMC1-NCO-GEN-135-a-10","kind":"AMC","label":"AMC1 NCO.GEN.135(a)(10)","title":"AMC1 NCO.GEN.135(a)(10) Documents, manuals and information to be carried","h":"<h3><a><\/a>AMC1 NCO.GEN.135(a)(10) Documents, manuals and information to be carried&nbsp;&nbsp;&nbsp;&nbsp;<\/h3> <p>CAA ORS9 Decision No. 1<\/p> <p>CURRENT AND SUITABLE AERONAUTICAL CHARTS<\/p> <p>(a) The aeronautical charts carried should contain data appropriate to the applicable air traffic regulations, rules of the air, flight altitudes, area/route and nature of the operation. Due consideration should be given to carriage of textual and graphic representations of:<\/p> <ol> <p> <\/p><p>(1) aeronautical data, including, as appropriate for the nature of the operation:<\/p> <ol> <p> <\/p><p>(i) airspace structure;<\/p> <p><\/p> <p> <\/p><p>(ii) significant points, navigation aids (navaids) and air traffic services (ATS) routes;<\/p> <p><\/p> <p> <\/p><p>(iii) navigation and communication frequencies;<\/p> <p><\/p> <p> <\/p><p>(iv) prohibited, restricted and danger areas; and<\/p> <p><\/p> <p> <\/p><p>(v) sites of other relevant activities that may hazard the flight; and<\/p> <p><\/p> <\/ol> <p><\/p> <p> <\/p><p>(2) topographical data, including terrain and obstacle data.<\/p> <p><\/p> <\/ol> <p>(b) A combination of different charts and textual data may be used to provide adequate and current data.<\/p> <p>(c) The aeronautical data should be appropriate for the current aeronautical information regulation and control (AIRAC) cycle.<\/p> <p>(d) The topographical data should be reasonably recent, having regard to the nature of the planned operation.<\/p> <p>&nbsp;<\/p>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/3%20AMC/AMC1%20NCO%20GEN%20135%20a%2010%20Documents.htm"},{"id":"x-AMC1-NCO-GEN-135-a-3","kind":"AMC","label":"AMC1 NCO.GEN.135(a)(3)","title":"AMC1 NCO.GEN.135(a)(3) Documents, manuals and information to be carried","h":"<h3><a><\/a>AMC1 NCO.GEN.135(a)(3) Documents, manuals and information to be carried&nbsp;&nbsp;&nbsp;&nbsp;<\/h3> <p>CAA ORS9 Decision No. 1<\/p> <p>CERTIFICATE OF AIRWORTHINESS<\/p> <p>The certificate of airworthiness should be a normal certificate of airworthiness, a restricted certificate of airworthiness or a permit to fly issued in accordance with the applicable airworthiness requirements.<\/p> <p>&nbsp;<\/p>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/3%20AMC/AMC1%20NCO%20GEN%20135%20a%203%20Documents.htm"},{"id":"x-GM1-NCO-GEN-135","kind":"GM","label":"GM1 NCO.GEN.135","title":"GM1 NCO.GEN.135 Documents, manuals and information to be carried","h":"<h4><a><\/a>GM1 NCO.GEN.135 Documents, manuals and information to be carried&nbsp;&nbsp;&nbsp;&nbsp;<\/h4> <p>CAA ORS9 Decision No. 1<\/p> <p>GENERAL<\/p> <p>(a) In case of loss or theft of documents specified in NCO.GEN.135, the operation may continue until the flight reaches the base or a place where a replacement document can be provided.<\/p> <p>(b) The documents, manuals and information may be available in a form other than on printed paper. An electronic storage medium is acceptable if accessibility, usability and reliability can be assured.<\/p> <p>&nbsp;<\/p>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/4%20GM/GM1%20NCO%20GEN%20135%20Documents.htm"},{"id":"x-GM1-NCO-GEN-135-a-1","kind":"GM","label":"GM1 NCO.GEN.135(a)(1)","title":"GM1 NCO.GEN.135(a)(1) Documents, manuals and information to be carried","h":"<h4><a><\/a>GM1 NCO.GEN.135(a)(1) Documents, manuals and information to be carried&nbsp;&nbsp;&nbsp;&nbsp;<\/h4> <p>CAA ORS9 Decision No. 1<\/p> <p>AFM OR EQUIVALENT DOCUMENT<\/p> <p>‘Aircraft flight manual (AFM), or equivalent document’ means the flight manual for the aircraft or other documents containing information required for the operation of the aircraft within the terms of its certificate of airworthiness.<\/p> <p>&nbsp;<\/p>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/4%20GM/GM1%20NCO%20GEN%20135%20a%201%20Documents.htm"},{"id":"x-GM1-NCO-GEN-135-a-11","kind":"GM","label":"GM1 NCO.GEN.135(a)(11)","title":"GM1 NCO.GEN.135(a)(11) Documents, manuals and information to be carried","h":"<h4><a><\/a>GM1 NCO.GEN.135(a)(11) Documents, manuals and information to be carried&nbsp;&nbsp;&nbsp;&nbsp;<\/h4> <p>CAA ORS9 Decision No. 1<\/p> <p>PROCEDURES AND VISUAL SIGNALS FOR USE BY INTERCEPTING AND INTERCEPTED AIRCRAFT<\/p> <p>The procedures and the visual signals information for use by intercepting and intercepted aircraft are those contained in the International Civil Aviation Organisation’s (ICAO) Annex 2.<\/p> <p>&nbsp;<\/p>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/4%20GM/GM1%20NCO%20GEN%20135%20a%2011%20Documents.htm"},{"id":"x-GM1-NCO-GEN-135-a-13","kind":"GM","label":"GM1 NCO.GEN.135(a)(13)","title":"GM1 NCO.GEN.135(a)(13) Documents, manuals and information to be carried","h":"<h4><a><\/a>GM1 NCO.GEN.135(a)(13) Documents, manuals and information to be carried&nbsp;&nbsp;&nbsp;&nbsp;<\/h4> <p>CAA ORS9 Decision No. 1<\/p> <p>DOCUMENTS THAT MAY BE PERTINENT TO THE FLIGHT<\/p> <p>Any other documents that may be pertinent to the flight or required by the States concerned with the flight may include, for example, forms to comply with reporting requirements.<\/p> <p>STATES CONCERNED WITH THE FLIGHT<\/p> <p>The States concerned are those of origin, transit, overflight and destination of the flight.<\/p> <p>&nbsp;<\/p>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/4%20GM/GM1%20NCO%20GEN%20135%20a%2013%20Documents.htm"},{"id":"x-GM1-NCO-GEN-135-a-8","kind":"GM","label":"GM1 NCO.GEN.135(a)(8)","title":"GM1 NCO.GEN.135(a)(8) Documents, manuals and information to be carried","h":"<h4><a><\/a>GM1 NCO.GEN.135(a)(8) Documents, manuals and information to be carried&nbsp;&nbsp;&nbsp;&nbsp;<\/h4> <p>CAA ORS9 Decision No. 1<\/p> <p>JOURNEY LOG OR EQUIVALENT<\/p> <p>’Journey log or equivalent’ means that the required information may be recorded in documentation other than a log book, such as the operational flight plan or the aircraft technical log.<\/p> <p>&nbsp;<\/p>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/4%20GM/GM1%20NCO%20GEN%20135%20a%208%20Documents.htm"}]},{"id":"r-NCO-GEN-140","ref":"NCO.GEN.140","title":"Transport of dangerous goods","h":"<h1>NCO.GEN.140 Transport of dangerous goods <\/h1> <div> <p>(a)&nbsp;The transport of dangerous goods by air shall be conducted in accordance with Annex 18 to the Chicago Convention as last amended and amplified by the Technical Instructions for the Safe Transport of Dangerous Goods by Air (ICAO Doc 9284-AN/905), including its supplements and any other addenda or corrigenda.<\/p> <p>(b)&nbsp;Dangerous goods shall only be transported by the operator approved in accordance with Annex V (Part-SPA), Subpart G, to Regulation (EU) No 965/2012 except when:<\/p> <p>(1)&nbsp;&nbsp;they are not subject to the Technical Instructions in accordance with Part 1 of those Instructions; or<\/p> <p>(2)&nbsp;&nbsp;they are carried by passengers or the pilot-in-command, or are in baggage, in accordance with Part 8 of the Technical Instructions;<\/p> <p>(3)&nbsp;&nbsp;they are carried by operators of ELA2 aircraft.<\/p> <p>(c)&nbsp;The pilot-in-command shall take all reasonable measures to prevent dangerous goods from being carried on board inadvertently.<\/p> <p>(d)&nbsp;The pilot-in-command shall, in accordance with the Technical Instructions, report without delay to the CAA and the appropriate authority of the State of occurrence in the event of any dangerous goods accidents or incidents.<\/p> <p>(e)&nbsp;The pilot-in-command shall ensure that passengers are provided with information about dangerous goods in accordance with the Technical Instructions.<\/p> <p>(f)&nbsp;Reasonable quantities of articles and substances that would otherwise be classified as dangerous goods and that are used to facilitate flight safety, where carriage aboard the aircraft is advisable to ensure their timely availability for operational purposes, shall be considered authorised under paragraph 1;2.2.1(a) of the Technical Instructions. This is regardless of whether or not such articles and substances are required to be carried or intended to be used in connection with a particular flight.<\/p> <p>The packing and loading on board of the above-mentioned articles and substances shall be performed, under the responsibility of the pilot in command, in such a way as to minimise the risks posed to crew members, passengers, cargo or the aircraft during aircraft operations.<\/p> <p>&nbsp;<\/p> <\/div>","url":"https://regulatorylibrary.caa.co.uk/965-2012/Content/Document%20Structure/07%20NCO/2%20Regs/18630_NCOGEN140_Transport_of_dangerous_goods.htm","sub":[{"id":"x-AMC1-NCO-GEN-140-d","kind":"AMC","label":"AMC1 NCO.GEN.140(d)","title":"AMC1 NCO.GEN.140(d) Transport of dangerous goods","h":"<h3><a><\/a>AMC1 NCO.GEN.140(d) Transport of dangerous goods&nbsp;&nbsp;&nbsp;&nbsp;<\/h3> <p>CAA ORS9 Decision No. 1<\/p> <p>DANGEROUS GOODS ACCIDENT AND INCIDENT REPORTING<\/p> <p>(a) Any type of dangerous goods incident or accident, or the finding of:<\/p> <ol> <p> <\/p><p>(1) undeclared or misdeclared dangerous goods in cargo;<\/p> <p><\/p> <p> <\/p><p>(2) forbidden dangerous goods in mail; or<\/p> <p><\/p> <p> <\/p><p>(3) forbidden dangerous goods in passenger or crew baggage, or on the person of a passenger or crew member should be reported. For this purpose, the Technical Instructions consider that reporting of undeclared and misdeclared dangerous goods found in cargo also applies to items of operators’ stores that are classified as dangerous goods.<\/p> <p><\/p> <\/ol> <p>(b) The first report should be dispatched within 72 hours of the event. It may be sent by any means, including e-mail, telephone or fax. This report should include the details that are known at that time, under the headings identified in 3. If necessary, a subsequent report should be made as soon as possible giving all the details that were not known at the time the first report was sent. If a report has been made verbally, written confirmation should be sent as soon as possible.<\/p> <p>(c) The first and any subsequent report should be as precise as possible and contain the following data, where relevant:<\/p> <ol> <p> <\/p><p>(1) date of the incident or accident or the finding of undeclared or misdeclared dangerous goods;<\/p> <p><\/p> <p> <\/p><p>(2) location and date of flight;<\/p> <p><\/p> <p> <\/p><p>(3) description of the goods;<\/p> <p><\/p> <p> <\/p><p>(4) proper shipping name (including the technical name, if appropriate) and United Nations (UN)/identification (ID) number, when known;<\/p> <p><\/p> <p> <\/p><p>(5) class or division and any subsidiary risk;<\/p> <p><\/p> <p> <\/p><p>(6) type of packaging, and the packaging specification marking on it;<\/p> <p><\/p> <p> <\/p><p>(7) quantity;<\/p> <p><\/p> <p> <\/p><p>(8) name and address of the passenger, etc.;<\/p> <p><\/p> <p> <\/p><p>(9) any other relevant details;<\/p> <p><\/p> <p> <\/p><p>(10) suspected cause of the incident or accident;<\/p> <p><\/p> <p> <\/p><p>(11) action taken;<\/p> <p><\/p> <p> <\/p><p>(12) any other reporting action taken; and<\/p> <p><\/p> <p> <\/p><p>(13) name, title, address and telephone number of the person making the report.<\/p> <p><\/p> <\/ol> <p>(d) Copies of relevant documents and any photographs taken should be attached to the report.<\/p> <p>(e) A dangerous goods accident or incident may also constitute an aircraft accident, serious incident or incident. The criteria for reporting both types of occurrence should be met.<\/p> <p>(f) The following dangerous goods reporting form should be used, but other forms, including electronic transfer of data, may be used provided that at least the minimum information of this AMC is supplied:<\/p> <p> <img src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAikAAAK2CAYAAACLowyIAAAAAXNSR0IArs4c6QAAAARnQU1BAACxjwv8YQUAAAAJcEhZcwAAFiUAABYlAUlSJPAAAP+lSURBVHhe7P0HXBTX/j/+f24Sk9x7k2jiTdFFRCkRxIJIAkhbBBUsSFREjYrBayyxYMvFGIoKIhgFjJhgNLFdbMSuPFTsBYw/KVLkjxT5iAG/KnwEwm529vH6n9ldYHfZAaRExPczj8nDnZ1y5sw57/Oe2V3mf0AIIYQQ0g5RkkIIIYSQd
