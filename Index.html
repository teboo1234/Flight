<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
<meta name="theme-color" content="#0f172a"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="default"/>
<meta name="apple-mobile-web-app-title" content="FlightDeck"/>
<link rel="apple-touch-icon" href="data:image/svg+xml;utf8,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20180%20180%22%3E%3Crect%20width%3D%22180%22%20height%3D%22180%22%20fill%3D%22%231e3a8a%22%20rx%3D%2240%22%2F%3E%3Ctext%20x%3D%2290%22%20y%3D%22118%22%20text-anchor%3D%22middle%22%20fill%3D%22%23fff%22%20font-size%3D%2276%22%20font-weight%3D%22800%22%20font-family%3D%22system-ui%2C-apple-system%22%3EFD%3C%2Ftext%3E%3C%2Fsvg%3E"/>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20180%20180%22%3E%3Crect%20width%3D%22180%22%20height%3D%22180%22%20fill%3D%22%231e3a8a%22%20rx%3D%2240%22%2F%3E%3Ctext%20x%3D%2290%22%20y%3D%22118%22%20text-anchor%3D%22middle%22%20fill%3D%22%23fff%22%20font-size%3D%2276%22%20font-weight%3D%22800%22%20font-family%3D%22system-ui%22%3EFD%3C%2Ftext%3E%3C%2Fsvg%3E"/>
<title>FlightDeck v148</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=JetBrains+Mono:wght@400;500&family=DM+Sans:wght@400;500;600&display=swap');
:root{
  --bg:#f5f7fa;--surface:#ffffff;--card:#eef2f6;--border:#cbd5e1;
  --text:#0f172a;--muted:#475569;--sky:#0369a1;--em:#047857;
  --amber:#b45309;--rose:#be123c;--violet:#6d28d9;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;font-size:16px;-webkit-text-size-adjust:100%;text-size-adjust:100%;touch-action:manipulation}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
button{cursor:pointer;font-family:inherit}
input,textarea,select{font-family:inherit}
#app{display:flex;flex-direction:column;height:100vh;overflow:hidden}
header{flex-shrink:0;background:rgba(245,247,250,.97);border-bottom:1px solid var(--border);backdrop-filter:blur(12px);z-index:50}
.hdr{max-width:1280px;margin:0 auto;padding:0 20px;display:flex;align-items:center;gap:8px;height:54px}
.logo{display:flex;align-items:center;gap:9px;margin-right:auto}
.logo-icon{width:28px;height:28px;background:linear-gradient(135deg,var(--sky),var(--violet));border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:14px}
.logo-name{font-family:'Syne',sans-serif;font-weight:700;font-size:16px;color:var(--text)}
.logo-sub{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--muted);border-left:1px solid var(--border);padding-left:10px}
nav{display:flex;gap:3px}
.tb{padding:5px 12px;border-radius:7px;border:1px solid transparent;background:transparent;color:var(--muted);font-size:12px;font-weight:500;transition:all .15s;white-space:nowrap}
.tb.on{border-color:var(--sky);background:rgba(14,165,233,.12);color:#0284c7}
.tb:hover:not(.on){background:var(--card);color:var(--text)}
.pwa-btn{padding:4px 10px;border-radius:7px;border:1px solid var(--em);background:rgba(16,185,129,.12);color:#059669;font-size:13px;display:none;cursor:pointer}
main{flex:1;overflow:hidden;max-width:1280px;width:100%;margin:0 auto;padding:16px 20px;display:flex;flex-direction:column}
.panel{display:none;flex:1;overflow:hidden;flex-direction:column}
.panel.on{display:flex}
.panes{display:flex;gap:14px;flex:1;overflow:hidden}
.sidebar{width:232px;flex-shrink:0;display:flex;flex-direction:column;gap:8px;overflow:hidden}
.slist{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:5px;padding-right:2px}
.detail{flex:1;min-width:0;overflow:hidden}
.dbox{background:rgba(255,255,255,.6);border:1px solid var(--border);border-radius:14px;padding:18px;height:100%;display:flex;flex-direction:column;overflow-y:auto}
.empty{height:100%;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:13px;flex-direction:column;gap:8px}
.empty-icon{font-size:36px;opacity:.3}
.card{background:rgba(255,255,255,.6);border:1px solid var(--border);border-radius:11px;padding:11px;cursor:pointer;transition:all .15s}
.card:hover{border-color:#475569}
.card.sel-sky{border-color:var(--sky)!important;background:rgba(14,165,233,.08)!important}
.card.sel-em{border-color:var(--em)!important;background:rgba(16,185,129,.08)!important}
.card.sel-am{border-color:var(--amber)!important;background:rgba(245,158,11,.08)!important}
.ctitle{font-weight:600;font-size:13px;color:var(--text);margin-bottom:5px;line-height:1.3}
.cmeta{display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.dh{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:14px;gap:10px}
.dtitle{font-family:'Syne',sans-serif;font-weight:700;font-size:19px;color:var(--text);line-height:1.2}
.dactions{display:flex;gap:5px;flex-shrink:0;flex-wrap:wrap}
.badge{font-family:'JetBrains Mono',monospace;font-size:12px;padding:2px 6px;border-radius:4px;border:1px solid;white-space:nowrap}
.b-sky{background:rgba(14,165,233,.12);color:#0369a1;border-color:rgba(14,165,233,.35)}
.b-em{background:rgba(16,185,129,.12);color:#047857;border-color:rgba(16,185,129,.35)}
.b-am{background:rgba(245,158,11,.12);color:#b45309;border-color:rgba(245,158,11,.35)}
.b-vi{background:rgba(139,92,246,.12);color:#6d28d9;border-color:rgba(139,92,246,.35)}
.b-ro{background:rgba(244,63,94,.12);color:#be123c;border-color:rgba(244,63,94,.35)}
.b-sl{background:rgba(100,116,139,.12);color:#475569;border-color:rgba(100,116,139,.35)}
.btn{padding:6px 13px;border-radius:8px;border:none;font-size:12px;font-weight:500;transition:all .15s}
.btn-p{background:var(--sky);color:#fff}.btn-p:hover{background:#0284c7}
.btn-g{background:transparent;border:1px solid var(--border);color:#475569}.btn-g:hover{background:var(--card);color:var(--text)}
.btn-d{background:rgba(244,63,94,.12);border:1px solid rgba(244,63,94,.35);color:#be123c}.btn-d:hover{background:rgba(244,63,94,.22)}
.btn-s{background:var(--em);color:#fff}.btn-s:hover{background:#059669;color:#000}
.btn-full{width:100%;text-align:center;padding:8px}
.field{margin-bottom:14px}
.field label{display:block;font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px}
.inp{width:100%;background:var(--card);border:1px solid var(--border);border-radius:8px;padding:8px 11px;color:var(--text);font-size:15px;transition:border-color .15s;outline:none}
.inp:focus{border-color:var(--sky)}
textarea.inp{resize:vertical;min-height:65px;line-height:1.5}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
.g4{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:14px}
.stat-row{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.stat{background:rgba(14,165,233,.07);border:1px solid rgba(14,165,233,.2);border-radius:9px;padding:9px 14px;text-align:center;min-width:88px}
.stat-v{font-family:'Syne',sans-serif;font-size:20px;font-weight:700;color:#0284c7}
.stat-l{font-size:12px;color:var(--muted);margin-top:1px}
.sec{margin-bottom:12px}
.sec-lbl{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;margin-bottom:5px}
.sec-box{background:rgba(255,255,255,.7);border:1px solid rgba(203,213,225,.7);border-radius:9px;padding:11px;font-size:13px;color:var(--text);line-height:1.7;white-space:pre-wrap}
.calc-card{background:rgba(14,165,233,.05);border:1px solid rgba(14,165,233,.2);border-radius:11px;padding:14px;margin-bottom:14px}
.fuel-card{background:rgba(245,158,11,.05);border:1px solid rgba(245,158,11,.2);border-radius:11px;padding:14px;margin-bottom:14px}
.calc-title{font-family:'JetBrains Mono',monospace;font-size:12px;text-transform:uppercase;letter-spacing:.1em;margin-bottom:10px}
.calc-val{font-family:'JetBrains Mono',monospace;font-size:18px;font-weight:600;color:#0284c7}
.calc-sub{font-size:12px;color:var(--muted);margin-top:2px}
.sdiv{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--sky);text-transform:uppercase;letter-spacing:.1em;padding:8px 0 4px;border-bottom:1px solid rgba(14,165,233,.2);margin-bottom:10px;margin-top:6px}

/* Colour-coded section cards used in the detail view and modal.
   Each section gets one accent colour applied to its left border,
   tinted background, and header label. */
.scard{border-radius:11px;padding:18px;margin-bottom:36px;border-left-width:5px;border-left-style:solid;border-top:1px solid;border-right:1px solid;border-bottom:1px solid;box-shadow:0 2px 6px rgba(15,23,42,.06)}
.scard:last-child{margin-bottom:0}
.scard-head{font-family:'JetBrains Mono',monospace;font-size:14px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;margin-bottom:16px;padding-bottom:10px;border-bottom:1px solid currentColor;display:flex;align-items:center;gap:8px}
.scard-head .ico{font-size:18px}
.scard .field{margin-bottom:14px}
/* sdiv = subsection heading inside a section card (e.g. "Surface Wind",
   "Runways", "Planning" within the Weather card). Give it real space
   above so the subsections feel distinct from one another. */
.scard .sdiv{margin-top:28px;margin-bottom:14px;padding-top:14px;border-top:1px dashed rgba(0,0,0,.1)}
.scard .sdiv:first-of-type,
.scard .scard-head + .sdiv,
.scard > .sdiv:first-child{margin-top:0;padding-top:0;border-top:none}
.scard > *:last-child{margin-bottom:0}
.scard .g2,.scard .g3,.scard .g4{margin-bottom:18px}
.scard .g2:last-child,.scard .g3:last-child,.scard .g4:last-child{margin-bottom:0}
.s-info   {background:rgba(30,58,138,.06);border-color:rgba(30,58,138,.18);border-left-color:#1e3a8a}
.s-info .scard-head{color:#1e3a8a}
.s-times  {background:rgba(14,116,144,.06);border-color:rgba(14,116,144,.18);border-left-color:#0e7490}
.s-times .scard-head{color:#0e7490}
.s-wx     {background:rgba(109,40,217,.06);border-color:rgba(109,40,217,.18);border-left-color:#6d28d9}
.s-wx .scard-head{color:#6d28d9}
.s-fuel   {background:rgba(180,83,9,.06);border-color:rgba(180,83,9,.18);border-left-color:#b45309;min-width:0;overflow-x:hidden}
.s-clr    {background:rgba(190,18,60,.05);border-color:rgba(190,18,60,.2);border-left-color:#be123c}
.s-clr .scard-head{color:#be123c}
.s-fuel .scard-head{color:#b45309}
.s-defects{background:rgba(190,18,60,.07);border-color:rgba(190,18,60,.22);border-left-color:#be123c}
.s-defects .scard-head{color:#be123c}
.s-notes  {background:rgba(71,85,105,.06);border-color:rgba(71,85,105,.18);border-left-color:#475569}
.s-notes .scard-head{color:#475569}
/* Calculated/derived value styling - mono and slightly larger */
.calc-num{font-family:'JetBrains Mono',monospace;font-weight:700}
/* Spectrum strip on flight list cards: small coloured bars showing what's filled in */
.spec{display:flex;height:4px;border-radius:2px;overflow:hidden;margin-bottom:8px;background:rgba(203,213,225,.4)}
/* ATIS structured field buttons */
.atis-fld{display:flex;flex-direction:column;align-items:flex-start;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px 16px;min-height:66px;cursor:pointer;font-family:inherit;transition:background .15s,border-color .15s;text-align:left}
.atis-fld:hover{background:var(--card);border-color:#1e3a8a}
.atis-fld:active{background:var(--border)}
.atis-fld .atis-lbl{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-family:'JetBrains Mono',monospace;margin-bottom:5px}
.atis-fld .atis-v{font-size:20px;font-weight:700;color:#1e3a8a;font-family:'JetBrains Mono',monospace}
/* TTCAFE input rows — always two lines: main row (letter | name | duration)
   plus a body row underneath (amount | unit | converted output). Every row
   uses the same grid template so columns align across all rows and devices. */
.ttcafe-row{display:grid;grid-template-columns:30px minmax(0,1fr) 96px;grid-template-areas:"letter name dur" ".      body body";gap:6px 6px;align-items:center;padding:8px 10px;background:rgba(255,255,255,.55);border:1px solid rgba(180,83,9,.22);border-radius:9px;transition:background .15s,border-color .15s;box-sizing:border-box;max-width:100%;overflow:hidden;min-width:0}
.ttcafe-row:hover{background:rgba(255,255,255,.85);border-color:rgba(180,83,9,.4)}
.ttcafe-row:focus-within{background:rgba(255,255,255,.9);border-color:#b45309;box-shadow:0 0 0 2px rgba(245,158,11,.15)}
.ttcafe-letter{grid-area:letter;width:28px;height:28px;display:flex;align-items:center;justify-content:center;background:#b45309;color:#fff;border-radius:7px;font-family:'JetBrains Mono',monospace;font-weight:800;font-size:13px}
.ttcafe-name{grid-area:name;font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--text);text-transform:uppercase;letter-spacing:.05em;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ttcafe-time{grid-area:dur;text-align:center;font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:600;color:#b45309;background:rgba(245,158,11,.08);border:1px solid rgba(245,158,11,.3);border-radius:6px;padding:6px 4px;outline:none;justify-self:end;box-sizing:border-box;width:96px;max-width:100%}
.ttcafe-body{grid-area:body;display:flex;align-items:center;gap:4px;min-width:0;overflow:hidden}
.ttcafe-body .fuel-inp,.ttcafe-body input[type="number"]{flex:0 0 62px;width:62px;text-align:right;min-width:0;padding:6px 4px;font-size:13px;box-sizing:border-box}
.ttcafe-body .fuel-unit,.ttcafe-body .ttcafe-unit-static{flex:0 0 50px;width:50px;text-align:center;padding:6px 2px;font-family:'JetBrains Mono',monospace;font-size:12px;box-sizing:border-box;min-width:0}
.ttcafe-body .ttcafe-unit-static{display:flex;align-items:center;justify-content:center;height:32px;box-sizing:border-box}
.ttcafe-body .ttcafe-out{flex:1 1 auto;font-family:'JetBrains Mono',monospace;font-size:11px;color:#0369a1;font-weight:600;padding:0 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
/* Duration spinner inside the dur cell fills the fixed column neatly */
.ttcafe-row .dur-spin{grid-area:dur;justify-self:end;width:96px;max-width:100%;box-sizing:border-box;overflow:hidden}
.ttcafe-row .dur-spin .dur-h{flex:0 0 38px !important;width:38px !important;min-width:0 !important;padding:6px 0 !important;font-size:12px !important}
.ttcafe-row .dur-spin .dur-m{flex:0 0 44px !important;width:44px !important;min-width:0 !important;padding:6px 0 !important;font-size:12px !important}
/* USG vs Litres colour differentiation */
.fuel-usg{color:#b45309;font-weight:700}
.fuel-usg-lbl{color:#b45309;font-size:11px;opacity:.75;font-weight:600}
.fuel-l{color:#0369a1;font-weight:700}
.fuel-l-lbl{color:#0369a1;font-size:11px;opacity:.75;font-weight:600}
.spec span{flex:1}
.spec .s1.on{background:#1e3a8a}
.spec .s2.on{background:#0e7490}
.spec .s3.on{background:#6d28d9}
.spec .s4.on{background:#b45309}
.spec .s5.on{background:#be123c}
.cli{display:flex;align-items:center;gap:9px;padding:9px 11px;border-radius:9px;border:1px solid;transition:all .15s}
.cli.done{background:rgba(16,185,129,.07);border-color:rgba(16,185,129,.3)}
.cli.undone{background:rgba(255,255,255,.6);border-color:var(--border)}
.cli-chk{width:17px;height:17px;border-radius:4px;border:2px solid;flex-shrink:0;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .15s}
.cli-chk.on{background:var(--em);border-color:var(--em)}
.cli-chk.off{border-color:var(--muted)}.cli-chk.off:hover{border-color:var(--em)}
.cli-num{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--muted);min-width:17px}
.cli-text{flex:1;font-size:13px}.cli-text.done{text-decoration:line-through;color:var(--muted)}
.cli-del{opacity:0;font-size:13px;color:var(--muted);transition:opacity .15s;padding:2px 5px;border-radius:4px;border:none;background:none;cursor:pointer}
.cli:hover .cli-del{opacity:1}.cli-del:hover{color:var(--rose)}
.prog{height:3px;background:var(--border);border-radius:2px;margin-top:7px;overflow:hidden}
.prog-fill{height:100%;background:var(--em);border-radius:2px;transition:width .3s}
.fbar{display:flex;gap:4px;flex-wrap:wrap}
.fchip{font-family:'JetBrains Mono',monospace;font-size:12px;padding:3px 7px;border-radius:4px;border:1px solid var(--border);background:var(--card);color:var(--muted);cursor:pointer;transition:all .15s}
.fchip.on{background:var(--sky);border-color:var(--sky);color:#fff}
.fchip:hover:not(.on){color:var(--text)}
.overlay{position:fixed;inset:0;background:rgba(15,23,42,.4);backdrop-filter:blur(8px);z-index:100;display:flex;align-items:center;justify-content:center;padding:14px}
.mbox{background:var(--surface);border:1px solid var(--border);border-radius:16px;width:100%;max-width:600px;max-height:92vh;display:flex;flex-direction:column;box-shadow:0 30px 60px rgba(0,0,0,.7)}
.mbox.wide{max-width:760px}
.mhead{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--border);flex-shrink:0}
.mtitle{font-family:'Syne',sans-serif;font-weight:700;color:var(--text);font-size:15px}
.mclose{background:none;border:none;color:var(--muted);font-size:20px;line-height:1;padding:2px 6px;cursor:pointer}.mclose:hover{color:var(--text)}
.mbody{padding:18px;overflow-y:auto;overflow-x:hidden;flex:1;min-width:0;box-sizing:border-box}
.mfoot{padding:10px 18px;border-top:1px solid var(--border);display:flex;gap:7px;flex-shrink:0}
.toast{position:fixed;bottom:20px;right:20px;background:var(--card);border:1px solid var(--em);border-radius:9px;padding:9px 14px;font-size:12px;color:#047857;z-index:300;transform:translateY(80px);opacity:0;transition:all .3s;pointer-events:none}
.toast.show{transform:translateY(0);opacity:1}
@media(max-width:640px){
  .panes{flex-direction:column}.sidebar{width:100%;max-height:200px}
  .logo-sub{display:none}.g2,.g3,.g4{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div id="app">
<header>
  <div class="hdr">
    <div class="logo">
      <div class="logo-icon">&#9992;</div>
      <span class="logo-name">FlightDeck</span>
      <span class="logo-sub">v148</span>
    </div>
    <nav id="nav">
      <button class="tb on" data-tab="flights">&#9992; Flight Log</button>
    </nav>
    <button class="btn btn-g" id="settings-btn" style="font-size:13px;padding:4px 10px;flex-shrink:0">&#9881; Settings</button>
    <button class="pwa-btn" id="install-btn">&#8595; Install</button>
  </div>
</header>
<main>
  <div class="panel on" id="tab-flights">
    <div id="fl-clock" style="display:flex;gap:16px;justify-content:center;align-items:center;padding:10px 14px;background:rgba(3,105,161,.05);border:1px solid rgba(3,105,161,.2);border-radius:9px;margin-bottom:14px;flex-wrap:wrap">
      <div style="text-align:center">
        <div style="font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;margin-bottom:2px">UTC</div>
        <div id="fl-clock-utc" style="font-family:'JetBrains Mono',monospace;font-size:22px;font-weight:700;color:#0369a1">--:--:--</div>
        <div id="fl-clock-utcdate" style="font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--muted)"></div>
      </div>
      <div style="width:1px;height:44px;background:var(--border)"></div>
      <div style="text-align:center">
        <div style="font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;margin-bottom:2px">Local <span id="fl-clock-tz" style="opacity:.7"></span></div>
        <div id="fl-clock-local" style="font-family:'JetBrains Mono',monospace;font-size:22px;font-weight:700;color:#047857">--:--:--</div>
        <div id="fl-clock-localdate" style="font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--muted)"></div>
      </div>
    </div>
    <div class="panes">
      <div class="sidebar">
        <div class="slist" id="fl-list"></div>
        <button class="btn btn-p btn-full" id="fl-new">+ Log Flight</button>
        <button class="btn btn-g btn-full" id="fl-export-all">&#8595; Export All (.csv)</button>
      </div>
      <div class="detail" id="fl-detail">
        <div class="empty"><div class="empty-icon">&#9992;</div><span>Select a flight or log a new one</span></div>
      </div>
    </div>
  </div>
  <div class="panel" id="tab-checklists" style="display:none">
    <div id="cl-filter"></div><div id="cl-list"></div><button id="cl-new"></button><div id="cl-detail"></div>
  </div>
  <div class="panel" id="tab-lessons" style="display:none">
    <div id="ls-filter"></div><div id="ls-list"></div><button id="ls-new"></button><div id="ls-detail"></div>
  </div>
  <div class="panel" id="tab-references" style="display:none">
    <input id="rf-search"/><div id="rf-filter"></div><div id="rf-list"></div><button id="rf-new"></button><div id="rf-detail"></div>
  </div>
</main>
</div>
<div id="modal-root"></div>
<div class="toast" id="toast"></div>

<script>
// ============================================================
// UTILITIES
// ============================================================
var uid = function(){ return Math.random().toString(36).slice(2,9); };
var qs  = function(s,c){ return (c||document).querySelector(s); };

function save(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
function load(k,d){ try{ var r=localStorage.getItem(k); return r?JSON.parse(r):d; }catch(e){ return d; } }

function toast(msg){
  var t=qs('#toast');
  t.textContent=msg;
  t.classList.add('show');
  setTimeout(function(){ t.classList.remove('show'); },2500);
}

function dlFile(name,text,mime){
  var a=document.createElement('a');
  a.href='data:'+(mime||'text/plain')+';charset=utf-8,'+encodeURIComponent(text);
  a.download=name;
  a.click();
}

function el(tag,cls,html){
  var e=document.createElement(tag);
  if(cls) e.className=cls;
  if(html) e.innerHTML=html;
  return e;
}

// ============================================================
// TIME HELPERS
// ============================================================
// "HH:MM" -> decimal hours, null if invalid
function parseUTC(s){
  if(!s) return null;
  var m=s.match(/^(\d{1,2}):(\d{2})$/);
  if(!m) return null;
  var h=parseInt(m[1]), mn=parseInt(m[2]);
  if(h>23||mn>59) return null;
  return h + mn/60;
}

// Build paired hour + minute dropdowns (minutes in 0.1 hr / 6 min steps)
// Stored value reads as "HH:MM" via getTimeSpinner
function timeSpinnerHtml(baseId, stored){
  var h='', m='';
  if(stored && /^\d{1,2}:\d{2}$/.test(stored)){
    var p=stored.split(':');
    h=('0'+parseInt(p[0])).slice(-2);
    m=p[1];
  }
  var hOpts='<option value="">HH</option>';
  for(var i=0;i<24;i++){
    var v=('0'+i).slice(-2);
    hOpts+='<option value="'+v+'"'+(h===v?' selected':'')+'>'+v+'</option>';
  }
  var mOpts='<option value="">MM</option>';
  ['00','06','12','18','24','30','36','42','48','54'].forEach(function(v){
    mOpts+='<option value="'+v+'"'+(m===v?' selected':'')+'>'+v+'</option>';
  });
  return '<div style="display:flex;gap:4px;align-items:center">'+
    '<select class="inp" id="'+baseId+'-h" style="flex:1;padding:7px 4px">'+hOpts+'</select>'+
    '<span style="color:var(--muted);font-weight:700">:</span>'+
    '<select class="inp" id="'+baseId+'-m" style="flex:1;padding:7px 4px">'+mOpts+'</select>'+
  '</div>';
}
function getTimeSpinner(baseId, ctx){
  var h=qs('#'+baseId+'-h', ctx);
  var m=qs('#'+baseId+'-m', ctx);
  if(!h||!m||!h.value||!m.value) return '';
  return h.value+':'+m.value;
}
function setTimeSpinnerNow(baseId, ctx){
  var d=new Date();
  var totalMin = d.getUTCHours()*60 + d.getUTCMinutes();
  var roundedMin = Math.round(totalMin/6)*6;
  if(roundedMin>=1440) roundedMin=0;
  var hh=('0'+Math.floor(roundedMin/60)).slice(-2);
  var mm=('0'+(roundedMin%60)).slice(-2);
  var h=qs('#'+baseId+'-h',ctx), m=qs('#'+baseId+'-m',ctx);
  if(h) h.value=hh;
  if(m) m.value=mm;
}

// ===== Duration spinner (for fuel-per-time on TTCAFE rows) =====
// Compact H:MM dropdown pair, hours 0-9, minutes in 5-min steps.
// ===== VHF frequency display + keypad =====
// Frequency shown as a button; tap opens a numeric keypad modal for fast entry.
// Format is XX.XXX (5 digits, decimal auto-inserted after 2 digits).
// Leading "1" is a static prefix shown outside the button.
function freqSpinnerHtml(baseId, savedVal){
  var display = '';
  if(savedVal && /^\d{3}\.\d{2,3}$/.test(savedVal)){
    var parts = savedVal.split('.');
    var whole = parts[0];
    var mhz = (whole.charAt(0)==='1' ? whole.substring(1) : whole.substring(whole.length-2));
    var fp = parts[1];
    while(fp.length<3) fp += '0';
    display = mhz + '.' + fp;
  }
  return '<div style="display:flex;gap:2px;align-items:center;flex:0 0 auto">'+
    '<button type="button" class="freq-btn" id="'+baseId+'-btn" data-val="'+(savedVal||'')+'" style="padding:4px 8px;flex:0 0 auto;font-family:JetBrains Mono,monospace;font-size:14px;font-weight:600;line-height:1.3;text-align:center;background:var(--surface);border:1px solid var(--border);border-radius:6px;cursor:pointer;color:#1e3a8a">'+(display?('1'+display):'1&mdash;&mdash;.&mdash;&mdash;&mdash;')+'</button>'+
  '</div>';
}
function getFreqSpinner(baseId, ctx){
  var btn = qs('#'+baseId+'-btn', ctx);
  if(!btn) return '';
  return btn.dataset.val || '';
}

// Combined wind entry: XXX/XX or XXX/XXGXX. Auto-inserts "/" after 3 digits
// and lets user tap G to add a gust component.
function openWindKeypad(currentValue, onDone){
  var ov = document.createElement('div');
  ov.style.cssText = 'position:fixed;inset:0;background:rgba(15,23,42,.6);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px';
  var box = document.createElement('div');
  box.style.cssText = 'background:var(--surface);border-radius:14px;padding:20px;max-width:360px;width:100%;box-shadow:0 10px 40px rgba(0,0,0,.4)';
  var dir='', spd='', gust='', hasGust=false;
  if(currentValue){
    var m = currentValue.match(/^(\d{1,3})\/(\d{1,2})(?:G(\d{1,2}))?$/);
    if(m){ dir=m[1]; spd=m[2]; if(m[3]){ hasGust=true; gust=m[3]; } }
  }
  function stage(){
    if(dir.length<3) return 'dir';
    if(spd.length<2) return 'spd';
    if(hasGust && gust.length<2) return 'gust';
    return 'done';
  }
  function fmtSlot(text, active, filled){
    var color = filled ? '#1e3a8a' : 'rgba(30,58,138,.25)';
    var border = active ? '#1e3a8a' : (filled?'transparent':'rgba(30,58,138,.15)');
    var bg = active ? 'rgba(30,58,138,.10)' : 'transparent';
    return '<span style="display:inline-block;min-width:20px;text-align:center;color:'+color+';background:'+bg+';border-bottom:3px solid '+border+';border-radius:4px 4px 0 0;padding:0 2px">'+(text||'\u00a0')+'</span>';
  }
  function fmt(){
    var st = stage();
    var html = '';
    // 3 dir slots
    for(var i=0;i<3;i++){
      var filled = i<dir.length;
      var active = st==='dir' && i===dir.length;
      html += fmtSlot(filled?dir.charAt(i):'', active, filled);
    }
    html += '<span style="color:var(--muted);padding:0 3px;font-weight:700">/</span>';
    for(var i=0;i<2;i++){
      var filled = i<spd.length;
      var active = st==='spd' && i===spd.length;
      html += fmtSlot(filled?spd.charAt(i):'', active, filled);
    }
    if(hasGust){
      html += '<span style="color:var(--muted);padding:0 3px;font-weight:700">G</span>';
      for(var i=0;i<2;i++){
        var filled = i<gust.length;
        var active = st==='gust' && i===gust.length;
        html += fmtSlot(filled?gust.charAt(i):'', active, filled);
      }
    }
    html += '<span style="font-size:16px;color:var(--muted);margin-left:8px">kt</span>';
    return html;
  }
  function assembled(){
    if(dir.length<3 || spd.length<1) return '';
    var s = spd.length===1 ? '0'+spd : spd;
    var out = dir+'/'+s;
    if(hasGust && gust.length>=1){
      var g = gust.length===1 ? '0'+gust : gust;
      out += 'G'+g;
    }
    return out;
  }
  var complete = (dir.length===3 && spd.length>=1 && (!hasGust || gust.length>=1));
  box.innerHTML =
    '<div style="font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;margin-bottom:10px;font-family:JetBrains Mono,monospace">Wind DDD/SS or DDD/SSGXX</div>'+
    '<div style="text-align:center;padding:18px 12px;background:rgba(30,58,138,.05);border-radius:9px;margin-bottom:14px;font-family:\'JetBrains Mono\',monospace;font-size:32px;font-weight:700"><span id="wk-display">'+fmt()+'</span></div>'+
    '<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px">'+
      '<button class="wk-k" data-k="1">1</button>'+
      '<button class="wk-k" data-k="2">2</button>'+
      '<button class="wk-k" data-k="3">3</button>'+
      '<button class="wk-k" data-k="4">4</button>'+
      '<button class="wk-k" data-k="5">5</button>'+
      '<button class="wk-k" data-k="6">6</button>'+
      '<button class="wk-k" data-k="7">7</button>'+
      '<button class="wk-k" data-k="8">8</button>'+
      '<button class="wk-k" data-k="9">9</button>'+
      '<span></span>'+
      '<button class="wk-k" data-k="0">0</button>'+
      '<button class="wk-k wk-k-gust" id="wk-gust" data-k="gust">G</button>'+
    '</div>'+
    '<button type="button" class="btn btn-p" id="wk-ok" style="width:100%;padding:18px;font-size:18px;font-weight:700" '+(complete?'':'disabled')+'>Enter</button>';
  ov.appendChild(box);
  document.body.appendChild(ov);
  var wkCss = document.createElement('style');
  wkCss.textContent = '.wk-k{padding:24px 0;font-size:28px;font-weight:700;background:var(--card);border:1px solid var(--border);border-radius:9px;cursor:pointer;font-family:"JetBrains Mono",monospace;color:var(--text);-webkit-tap-highlight-color:transparent}.wk-k:active{background:var(--border)}.wk-k-gust{background:rgba(180,83,9,.1);color:#b45309;border-color:rgba(180,83,9,.3)}.wk-k-gust:active{background:rgba(180,83,9,.25)}';
  box.appendChild(wkCss);
  function refresh(){
    var d = qs('#wk-display', box);
    if(d) d.innerHTML = fmt();
    var okBtn = qs('#wk-ok', box);
    var isComplete = (dir.length===3 && spd.length>=1 && (!hasGust || gust.length>=1));
    if(okBtn) okBtn.disabled = !isComplete;
    var gustBtn = qs('#wk-gust', box);
    if(gustBtn){
      var canAddGust = (dir.length===3 && spd.length>=1 && !hasGust);
      gustBtn.style.opacity = canAddGust ? '1' : '.4';
    }
  }
  box.querySelectorAll('.wk-k').forEach(function(k){
    k.addEventListener('click', function(){
      var v = k.getAttribute('data-k');
      if(v === 'gust'){
        if(dir.length===3 && spd.length>=1 && !hasGust){
          hasGust = true;
        }
      } else {
        // Digit
        var st = stage();
        if(st === 'dir'){
          if(dir.length>=3) dir = v; else dir += v;
        } else if(st === 'spd'){
          if(spd.length>=2) spd = v; else spd += v;
        } else if(st === 'gust'){
          if(gust.length>=2) gust = v; else gust += v;
        } else {
          // Complete - overwrite from start
          dir = v; spd=''; gust=''; hasGust=false;
        }
      }
      refresh();
    });
  });
  qs('#wk-ok', box).addEventListener('click', function(){
    var a = assembled();
    if(a){ onDone(a); document.body.removeChild(ov); }
  });
  ov.addEventListener('click', function(e){ if(e.target === ov) document.body.removeChild(ov); });
}

// Cloud layer picker.
// Height entered as 2 digits x.x = thousands of feet (e.g. "25" -> 2.5 -> 2500 ft).
// Stored as METAR-style hundreds-of-feet padded string, e.g. "SCT025".
function openCloudPicker(title, currentValue, onDone){
  var ov = document.createElement('div');
  ov.style.cssText = 'position:fixed;inset:0;background:rgba(15,23,42,.6);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px';
  var box = document.createElement('div');
  box.style.cssText = 'background:var(--surface);border-radius:14px;padding:20px;max-width:400px;width:100%;box-shadow:0 10px 40px rgba(0,0,0,.4)';
  var type='', digits='';
  if(currentValue){
    var m = currentValue.match(/^(FEW|SCT|BKN|OVC)(\d{1,3})$/);
    if(m){
      type = m[1];
      // Stored value is METAR hundreds-of-feet. Convert back to decimal
      // thousands: 025 -> 2.5 -> 25 (2 chars, no dot yet).
      var hundreds = parseInt(m[2]);
      var tenths = Math.round(hundreds / 10); // 25 hundreds -> 2.5k -> 25 tenths
      digits = String(tenths);
    }
  }
  var types = ['FEW','SCT','BKN','OVC'];
  function fmtDigits(){
    // Two-digit input: X.X (thousands)
    var slots = ['',''];
    for(var i=0;i<digits.length && i<2;i++) slots[i] = digits.charAt(i);
    var activePos = (digits.length<2) ? digits.length : -1;
    var html = '';
    for(var i=0;i<2;i++){
      var filled = !!slots[i];
      var isActive = i===activePos;
      var color = filled?'#1e3a8a':'rgba(30,58,138,.25)';
      var border = isActive?'#1e3a8a':(filled?'transparent':'rgba(30,58,138,.15)');
      var bg = isActive?'rgba(30,58,138,.10)':'transparent';
      html += '<span style="display:inline-block;min-width:22px;text-align:center;color:'+color+';background:'+bg+';border-bottom:3px solid '+border+';border-radius:4px 4px 0 0;padding:0 3px">'+(filled?digits.charAt(i):'\u00a0')+'</span>';
      if(i===0) html += '<span style="color:var(--muted);padding:0 2px;font-weight:700">.</span>';
    }
    // Convert to feet for live display
    var ft = '';
    if(digits.length===2){
      var thousands = parseFloat(digits.charAt(0)+'.'+digits.charAt(1));
      ft = ' \u00b7 '+Math.round(thousands*1000)+' ft';
    }
    return html + '<span style="font-size:14px;color:var(--muted);margin-left:8px">k ft'+ft+'</span>';
  }
  function complete(){ return type && digits.length===2; }
  box.innerHTML =
    '<div style="font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;margin-bottom:14px;font-family:JetBrains Mono,monospace">'+title+'</div>'+
    '<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px">'+
      types.map(function(t){
        return '<button type="button" class="cp-type" data-t="'+t+'" style="padding:22px 0;font-size:18px;font-family:JetBrains Mono,monospace;font-weight:700;background:'+(t===type?'#1e3a8a':'var(--card)')+';color:'+(t===type?'#fff':'var(--text)')+';border:1px solid var(--border);border-radius:8px;cursor:pointer">'+t+'</button>';
      }).join('')+
    '</div>'+
    '<div style="text-align:center;padding:18px 12px;background:rgba(30,58,138,.05);border-radius:9px;margin-bottom:14px;font-family:\'JetBrains Mono\',monospace;font-size:30px;font-weight:700"><span id="cp-display">'+fmtDigits()+'</span></div>'+
    '<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px">'+
      '<button class="cp-k" data-k="1">1</button>'+
      '<button class="cp-k" data-k="2">2</button>'+
      '<button class="cp-k" data-k="3">3</button>'+
      '<button class="cp-k" data-k="4">4</button>'+
      '<button class="cp-k" data-k="5">5</button>'+
      '<button class="cp-k" data-k="6">6</button>'+
      '<button class="cp-k" data-k="7">7</button>'+
      '<button class="cp-k" data-k="8">8</button>'+
      '<button class="cp-k" data-k="9">9</button>'+
      '<span></span>'+
      '<button class="cp-k" data-k="0">0</button>'+
      '<button class="cp-k cp-k-ok" id="cp-ok" data-k="ok">Enter</button>'+
    '</div>'+
    '<button type="button" class="btn btn-d" id="cp-remove" style="width:100%;padding:14px;font-size:14px">Remove Layer</button>';
  ov.appendChild(box);
  document.body.appendChild(ov);
  var cpCss = document.createElement('style');
  cpCss.textContent = '.cp-k{padding:24px 0;font-size:28px;font-weight:700;background:var(--card);border:1px solid var(--border);border-radius:9px;cursor:pointer;font-family:"JetBrains Mono",monospace;color:var(--text);-webkit-tap-highlight-color:transparent}.cp-k:active{background:var(--border)}.cp-k-ok{background:rgba(4,120,87,.1);color:#047857;border-color:rgba(4,120,87,.3);font-size:20px}.cp-k-ok:active{background:rgba(4,120,87,.2)}';
  box.appendChild(cpCss);
  function refresh(){
    var d = qs('#cp-display', box);
    if(d) d.innerHTML = fmtDigits();
    box.querySelectorAll('.cp-type').forEach(function(b){
      var t = b.getAttribute('data-t');
      b.style.background = t===type ? '#1e3a8a' : 'var(--card)';
      b.style.color = t===type ? '#fff' : 'var(--text)';
    });
  }
  box.querySelectorAll('.cp-type').forEach(function(b){
    b.addEventListener('click', function(){ type = b.getAttribute('data-t'); refresh(); });
  });
  box.querySelectorAll('.cp-k').forEach(function(k){
    k.addEventListener('click', function(){
      var v = k.getAttribute('data-k');
      if(v === 'ok'){
        if(complete()){
          var thousands = parseFloat(digits.charAt(0)+'.'+digits.charAt(1));
          var hundreds = Math.round(thousands*10);
          var padded = ('00'+hundreds).slice(-3);
          onDone(type+padded);
          document.body.removeChild(ov);
          return;
        }
      } else {
        if(digits.length>=2) digits = v; else digits += v;
      }
      refresh();
    });
  });
  qs('#cp-remove', box).addEventListener('click', function(){ onDone(''); document.body.removeChild(ov); });
  ov.addEventListener('click', function(e){ if(e.target === ov) document.body.removeChild(ov); });
}

// Combined temperature/dewpoint keypad. Stored as "15/10" or "M02/M05" (METAR style).
function openTempDewKeypad(currentValue, onDone){
  var ov = document.createElement('div');
  ov.style.cssText = 'position:fixed;inset:0;background:rgba(15,23,42,.6);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px';
  var box = document.createElement('div');
  box.style.cssText = 'background:var(--surface);border-radius:14px;padding:20px;max-width:360px;width:100%;box-shadow:0 10px 40px rgba(0,0,0,.4)';
  var tempNeg=false, tempDigits='', dewNeg=false, dewDigits='';
  if(currentValue){
    var m = currentValue.match(/^(M?)(\d{1,2})\/(M?)(\d{1,2})$/);
    if(m){
      tempNeg = m[1]==='M'; tempDigits=m[2];
      dewNeg = m[3]==='M'; dewDigits=m[4];
    }
  }
  function stage(){
    if(tempDigits.length<2) return 'temp';
    if(dewDigits.length<2) return 'dew';
    return 'done';
  }
  function fmtSlot(text, active, filled){
    var color = filled ? '#1e3a8a' : 'rgba(30,58,138,.25)';
    var border = active ? '#1e3a8a' : (filled?'transparent':'rgba(30,58,138,.15)');
    var bg = active ? 'rgba(30,58,138,.10)' : 'transparent';
    return '<span style="display:inline-block;min-width:22px;text-align:center;color:'+color+';background:'+bg+';border-bottom:3px solid '+border+';border-radius:4px 4px 0 0;padding:0 2px">'+(text||'\u00a0')+'</span>';
  }
  function fmtSign(neg, active){
    return '<span style="display:inline-block;min-width:14px;text-align:center;color:'+(neg?'#be123c':'rgba(30,58,138,.25)')+';font-size:20px;font-weight:700;padding:0 2px;'+(active?'text-shadow:0 0 4px rgba(190,18,60,.3)':'')+'">'+(neg?'-':'')+'</span>';
  }
  function fmt(){
    var st = stage();
    var html = '';
    html += fmtSign(tempNeg, st==='temp');
    for(var i=0;i<2;i++){
      var filled = i<tempDigits.length;
      var active = st==='temp' && i===tempDigits.length;
      html += fmtSlot(filled?tempDigits.charAt(i):'', active, filled);
    }
    html += '<span style="color:var(--muted);padding:0 6px;font-weight:700">/</span>';
    html += fmtSign(dewNeg, st==='dew');
    for(var i=0;i<2;i++){
      var filled = i<dewDigits.length;
      var active = st==='dew' && i===dewDigits.length;
      html += fmtSlot(filled?dewDigits.charAt(i):'', active, filled);
    }
    html += '<span style="font-size:16px;color:var(--muted);margin-left:8px">\u00b0C</span>';
    return html;
  }
  function assembled(){
    if(tempDigits.length<1 || dewDigits.length<1) return '';
    var t = tempDigits.length===1 ? '0'+tempDigits : tempDigits;
    var d = dewDigits.length===1 ? '0'+dewDigits : dewDigits;
    return (tempNeg?'M':'')+t+'/'+(dewNeg?'M':'')+d;
  }
  function complete(){ return tempDigits.length>=1 && dewDigits.length>=1; }
  box.innerHTML =
    '<div style="font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;margin-bottom:10px;font-family:JetBrains Mono,monospace">Temperature / Dewpoint</div>'+
    '<div style="text-align:center;padding:18px 12px;background:rgba(30,58,138,.05);border-radius:9px;margin-bottom:14px;font-family:\'JetBrains Mono\',monospace;font-size:32px;font-weight:700"><span id="td-display">'+fmt()+'</span></div>'+
    '<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px">'+
      '<button class="td-k" data-k="1">1</button>'+
      '<button class="td-k" data-k="2">2</button>'+
      '<button class="td-k" data-k="3">3</button>'+
      '<button class="td-k" data-k="4">4</button>'+
      '<button class="td-k" data-k="5">5</button>'+
      '<button class="td-k" data-k="6">6</button>'+
      '<button class="td-k" data-k="7">7</button>'+
      '<button class="td-k" data-k="8">8</button>'+
      '<button class="td-k" data-k="9">9</button>'+
      '<button class="td-k td-k-neg" data-k="neg">&plusmn;</button>'+
      '<button class="td-k" data-k="0">0</button>'+
      '<button class="td-k td-k-next" data-k="next">Next</button>'+
    '</div>'+
    '<button type="button" class="btn btn-p" id="td-ok" style="width:100%;padding:18px;font-size:18px;font-weight:700" '+(complete()?'':'disabled')+'>Enter</button>';
  ov.appendChild(box);
  document.body.appendChild(ov);
  var tdCss = document.createElement('style');
  tdCss.textContent = '.td-k{padding:24px 0;font-size:28px;font-weight:700;background:var(--card);border:1px solid var(--border);border-radius:9px;cursor:pointer;font-family:"JetBrains Mono",monospace;color:var(--text);-webkit-tap-highlight-color:transparent}.td-k:active{background:var(--border)}.td-k-neg{background:rgba(190,18,60,.08);color:#be123c;border-color:rgba(190,18,60,.25)}.td-k-neg:active{background:rgba(190,18,60,.18)}.td-k-next{background:rgba(3,105,161,.1);color:#0369a1;border-color:rgba(3,105,161,.3);font-size:16px}.td-k-next:active{background:rgba(3,105,161,.2)}';
  box.appendChild(tdCss);
  function refresh(){
    var d = qs('#td-display', box);
    if(d) d.innerHTML = fmt();
    var ok = qs('#td-ok', box);
    if(ok) ok.disabled = !complete();
  }
  box.querySelectorAll('.td-k').forEach(function(k){
    k.addEventListener('click', function(){
      var v = k.getAttribute('data-k');
      if(v === 'neg'){
        var st = stage();
        if(st === 'temp' || (st === 'dew' && dewDigits.length===0)) tempNeg = !tempNeg;
        else dewNeg = !dewNeg;
      } else if(v === 'next'){
        // Skip to next section: pad current with leading 0 if single digit
        var st = stage();
        if(st === 'temp' && tempDigits.length >= 1){
          if(tempDigits.length === 1) tempDigits = '0' + tempDigits;
        } else if(st === 'dew' && dewDigits.length >= 1){
          if(dewDigits.length === 1) dewDigits = '0' + dewDigits;
        }
      } else {
        var st = stage();
        if(st === 'temp'){
          if(tempDigits.length>=2) tempDigits = v; else tempDigits += v;
        } else if(st === 'dew'){
          if(dewDigits.length>=2) dewDigits = v; else dewDigits += v;
        } else {
          tempDigits = v; dewDigits=''; tempNeg=false; dewNeg=false;
        }
      }
      refresh();
    });
  });
  qs('#td-ok', box).addEventListener('click', function(){
    var a = assembled();
    if(a){ onDone(a); document.body.removeChild(ov); }
  });
  ov.addEventListener('click', function(e){ if(e.target === ov) document.body.removeChild(ov); });
}

// Runway picker: 01-36 + suffix (L/C/R or none)
function openRunwayPicker(currentValue, onDone){

    '<div style="text-align:center;padding:18px 12px;background:rgba(30,58,138,.05);border-radius:9px;margin-bottom:14px;font-family:\'JetBrains Mono\',monospace;font-size:36px;font-weight:700"><span id="rp-display">'+fmt()+'</span></div>'+
    '<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px">'+
      '<button class="rp-num" data-k="1">1</button>'+
      '<button class="rp-num" data-k="2">2</button>'+
      '<button class="rp-num" data-k="3">3</button>'+
      '<button class="rp-num" data-k="4">4</button>'+
      '<button class="rp-num" data-k="5">5</button>'+
      '<button class="rp-num" data-k="6">6</button>'+
      '<button class="rp-num" data-k="7">7</button>'+
      '<button class="rp-num" data-k="8">8</button>'+
      '<button class="rp-num" data-k="9">9</button>'+
      '<span></span>'+
      '<button class="rp-num" data-k="0">0</button>'+
      '<span></span>'+
    '</div>'+
    '<div style="font-size:12px;color:var(--muted);text-align:center;margin-bottom:8px;font-family:JetBrains Mono,monospace">Pick suffix to submit</div>'+
    '<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px">'+
      '<button type="button" class="rp-suffix" data-s="" style="padding:22px 0;font-size:18px;font-family:JetBrains Mono,monospace;font-weight:700;background:rgba(4,120,87,.1);color:#047857;border:1px solid rgba(4,120,87,.3);border-radius:8px;cursor:pointer">None</button>'+

      '<button type="button" class="rp-suffix" data-s="C" style="padding:22px 0;font-size:20px;font-family:JetBrains Mono,monospace;font-weight:700;background:rgba(3,105,161,.1);color:#0369a1;border:1px solid rgba(3,105,161,.3);border-radius:8px;cursor:pointer">C</button>'+
      '<button type="button" class="rp-suffix" data-s="R" style="padding:22px 0;font-size:20px;font-family:JetBrains Mono,monospace;font-weight:700;background:rgba(3,105,161,.1);color:#0369a1;border:1px solid rgba(3,105,161,.3);border-radius:8px;cursor:pointer">R</button>'+

// Generic numeric keypad for structured field entry (wind, temp, QNH etc).
// config = { title, digits (max), suffix, allowNeg, allowEmpty (OK with fewer digits), min, max, help }
function openNumericKeypad(config, currentValue, onDone){
  var cfg = Object.assign({
    title: 'Enter value',
    digits: 3,
    suffix: '',
    allowNeg: false,
    allowEmpty: false,
    min: null,
    max: null,
    help: ''
  }, config);
  var ov = document.createElement('div');
  ov.style.cssText = 'position:fixed;inset:0;background:rgba(15,23,42,.6);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px';
  var box = document.createElement('div');
  box.style.cssText = 'background:var(--surface);border-radius:14px;padding:20px;max-width:340px;width:100%;box-shadow:0 10px 40px rgba(0,0,0,.4)';
  var digits = '';
  var negative = false;
  if(currentValue !== null && currentValue !== undefined && currentValue !== ''){
    var s = String(currentValue);
    if(s.charAt(0)==='-'){ negative = true; s = s.substring(1); }
    // Strip non-digits
    digits = s.replace(/[^0-9]/g,'').substring(0, cfg.digits);
  }
  function assembled(){
    if(!digits) return '';
    return (negative ? '-' : '') + digits;
  }
  function fmtDisplay(){
    var slots = [];
    for(var i=0;i<cfg.digits;i++) slots.push(i<digits.length ? digits.charAt(i) : '');
    var activePos = (digits.length>=cfg.digits) ? -1 : digits.length;
    var html = '';
    if(cfg.allowNeg) html += '<span style="display:inline-block;min-width:16px;color:'+(negative?'#be123c':'rgba(30,58,138,.25)')+'">'+(negative?'-':'')+'</span>';
    for(var i=0;i<cfg.digits;i++){
      var ch = slots[i] || '\u00a0';
      var filled = !!slots[i];
      var isActive = i === activePos;
      var color = filled ? '#1e3a8a' : 'rgba(30,58,138,.25)';
      var borderColor = isActive ? '#1e3a8a' : (filled ? 'transparent' : 'rgba(30,58,138,.15)');
      var bg = isActive ? 'rgba(30,58,138,.10)' : 'transparent';
      html += '<span style="display:inline-block;min-width:20px;text-align:center;color:'+color+';background:'+bg+';border-bottom:3px solid '+borderColor+';border-radius:4px 4px 0 0;padding:0 2px">'+ch+'</span>';
    }
    if(cfg.suffix) html += '<span style="font-size:16px;color:var(--muted);margin-left:6px">'+cfg.suffix+'</span>';
    return html;
  }
  function validate(){
    var val = assembled();
    if(!val){ return cfg.allowEmpty ? '' : 'Enter a value'; }
    var num = parseInt(val);
    if(isNaN(num)) return 'Invalid';
    if(cfg.min !== null && num<cfg.min) return 'Min '+cfg.min;
    if(cfg.max !== null && num>cfg.max) return 'Max '+cfg.max;
    return '';
  }
  box.innerHTML =
    '<div style="font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;margin-bottom:10px;font-family:JetBrains Mono,monospace">'+cfg.title+'</div>'+
    '<div style="display:flex;align-items:baseline;justify-content:center;padding:18px 12px;background:rgba(30,58,138,.05);border-radius:9px;margin-bottom:8px;font-family:\'JetBrains Mono\',monospace;font-size:32px;font-weight:700">'+
      '<span id="fnk-display">'+fmtDisplay()+'</span>'+
    '</div>'+
    '<div id="fnk-status" style="font-size:12px;text-align:center;min-height:16px;margin-bottom:14px;font-family:JetBrains Mono,monospace;color:var(--muted)">'+(cfg.help||'&nbsp;')+'</div>'+
    '<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px">'+
      '<button class="nk-k" data-k="1">1</button>'+
      '<button class="nk-k" data-k="2">2</button>'+
      '<button class="nk-k" data-k="3">3</button>'+
      '<button class="nk-k" data-k="4">4</button>'+
      '<button class="nk-k" data-k="5">5</button>'+
      '<button class="nk-k" data-k="6">6</button>'+
      '<button class="nk-k" data-k="7">7</button>'+
      '<button class="nk-k" data-k="8">8</button>'+
      '<button class="nk-k" data-k="9">9</button>'+
      (cfg.allowNeg ? '<button class="nk-k nk-k-neg" data-k="neg">&plusmn;</button>' : '<span></span>')+
      '<button class="nk-k" data-k="0">0</button>'+
      '<span></span>'+
    '</div>'+
    '<button type="button" class="btn btn-p" id="fnk-ok" style="width:100%;padding:18px;font-size:18px;font-weight:700">Enter</button>';
  ov.appendChild(box);
  document.body.appendChild(ov);
  var nkCss = document.createElement('style');
  nkCss.textContent = '.nk-k{padding:24px 0;font-size:28px;font-weight:700;background:var(--card);border:1px solid var(--border);border-radius:9px;cursor:pointer;font-family:"JetBrains Mono",monospace;color:var(--text);-webkit-tap-highlight-color:transparent}.nk-k:active{background:var(--border)}.nk-k-neg{background:rgba(190,18,60,.08);color:#be123c;border-color:rgba(190,18,60,.25)}.nk-k-neg:active{background:rgba(190,18,60,.18)}';
  box.appendChild(nkCss);
  function refresh(){
    var d = qs('#fnk-display', box);
    if(d) d.innerHTML = fmtDisplay();
    var s = qs('#fnk-status', box);
    if(!s) return;
    var err = validate();
    if(err){ s.textContent = err; s.style.color='#b45309'; }
    else { s.textContent = cfg.help || '\u00a0'; s.style.color='var(--muted)'; }
  }
  box.querySelectorAll('.nk-k').forEach(function(k){
    k.addEventListener('click', function(){
      var v = k.getAttribute('data-k');
      if(v === 'neg'){ negative = !negative; }
      else {
        if(digits.length >= cfg.digits) digits = v;
        else digits += v;
      }
      refresh();
    });
  });
  qs('#fnk-ok', box).addEventListener('click', function(){
    if(!validate()){ onDone(assembled()); document.body.removeChild(ov); }
  });
  ov.addEventListener('click', function(e){ if(e.target === ov) document.body.removeChild(ov); });
}

// Open a modal keypad for entering a frequency. Calls onDone(newValue) when OK is tapped.
// Behavior: no backspace. Once 5 digits entered, tapping a new digit starts over.
function openFreqKeypad(currentVal, onDone){
  var ov = document.createElement('div');
  ov.style.cssText = 'position:fixed;inset:0;background:rgba(15,23,42,.6);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px';

  var box = document.createElement('div');
  box.style.cssText = 'background:var(--surface);border-radius:14px;padding:20px;max-width:360px;width:100%;box-shadow:0 10px 40px rgba(0,0,0,.4)';

  var digits = '';
  if(currentVal && /^\d{3}\.\d{2,3}$/.test(currentVal)){
    var parts = currentVal.split('.');
    var whole = parts[0];
    var mhzp = (whole.charAt(0)==='1' ? whole.substring(1) : whole.substring(whole.length-2));
    var fp = parts[1];
    while(fp.length<3) fp += '0';
    digits = mhzp + fp;
  }

  function assembled(d){
    if(d.length<5) return '';
    return '1' + d.substring(0,2) + '.' + d.substring(2);
  }

  // Render the 5 digit slots with an underline under the next-to-be-filled position.
  function displayHtml(d){
    var slots = [];
    for(var i=0;i<5;i++) slots.push(i<d.length ? d.charAt(i) : '');
    var activePos = (d.length>=5) ? -1 : d.length; // -1 when complete
    var html = '';
    for(var i=0;i<5;i++){
      var ch = slots[i] || '\u00a0'; // NBSP to keep width when empty
      var filled = !!slots[i];
      var isActive = i === activePos;
      var color = filled ? '#1e3a8a' : 'rgba(30,58,138,.25)';
      var borderColor = isActive ? '#1e3a8a' : (filled ? 'transparent' : 'rgba(30,58,138,.15)');
      var bg = isActive ? 'rgba(30,58,138,.10)' : 'transparent';
      html += '<span style="display:inline-block;min-width:20px;text-align:center;color:'+color+';background:'+bg+';border-bottom:3px solid '+borderColor+';border-radius:4px 4px 0 0;padding:0 2px">'+ch+'</span>';
      if(i === 1) html += '<span style="color:var(--muted);padding:0 2px">.</span>';
    }
    return html;
  }

  box.innerHTML =
    '<div style="font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;margin-bottom:8px;font-family:JetBrains Mono,monospace">Enter Frequency</div>'+
    '<div style="display:flex;align-items:baseline;justify-content:center;padding:14px 12px;background:rgba(30,58,138,.05);border-radius:9px;margin-bottom:8px;font-family:\'JetBrains Mono\',monospace;font-size:32px;font-weight:700">'+
      '<span style="color:var(--muted);margin-right:6px">1</span>'+
      '<span id="fc-display">'+displayHtml(digits)+'</span>'+
      '<span style="font-size:14px;font-weight:600;color:var(--muted);margin-left:8px">MHz</span>'+
    '</div>'+
    '<div id="fc-status" style="font-size:12px;text-align:center;min-height:16px;margin-bottom:14px;font-family:JetBrains Mono,monospace">&nbsp;</div>'+
    '<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px">'+
      '<button class="fc-key" data-k="1">1</button>'+
      '<button class="fc-key" data-k="2">2</button>'+
      '<button class="fc-key" data-k="3">3</button>'+
      '<button class="fc-key" data-k="4">4</button>'+
      '<button class="fc-key" data-k="5">5</button>'+
      '<button class="fc-key" data-k="6">6</button>'+
      '<button class="fc-key" data-k="7">7</button>'+
      '<button class="fc-key" data-k="8">8</button>'+
      '<button class="fc-key" data-k="9">9</button>'+
      '<button class="fc-key fc-key-clear" data-k="clear">C</button>'+
      '<button class="fc-key" data-k="0">0</button>'+
      '<button class="fc-key fc-key-ok" data-k="ok">OK</button>'+
    '</div>'+
    '<button type="button" class="btn btn-g" id="fc-cancel" style="width:100%;margin-top:12px;padding:10px">Cancel</button>';

  ov.appendChild(box);
  document.body.appendChild(ov);

  var css = document.createElement('style');
  css.textContent = '.fc-key{padding:18px 0;font-size:22px;font-weight:700;background:var(--card);border:1px solid var(--border);border-radius:9px;cursor:pointer;font-family:"JetBrains Mono",monospace;color:var(--text);transition:background .1s;-webkit-tap-highlight-color:transparent}.fc-key:hover,.fc-key:active{background:var(--border)}.fc-key-clear{background:rgba(180,83,9,.08);color:#b45309;border-color:rgba(180,83,9,.25)}.fc-key-clear:active{background:rgba(180,83,9,.2)}.fc-key-ok{background:rgba(4,120,87,.1);color:#047857;border-color:rgba(4,120,87,.3)}.fc-key-ok:active{background:rgba(4,120,87,.2)}';
  box.appendChild(css);

  function refresh(){
    var d = qs('#fc-display', box);
    if(d) d.innerHTML = displayHtml(digits);
    var s = qs('#fc-status', box);
    if(!s) return;
    if(digits.length<5){
      s.textContent = digits.length===0 ? 'Enter 5 digits' : (5-digits.length)+' more '+(digits.length===4?'digit':'digits');
      s.style.color = 'var(--muted)';
    } else {
      var freq = assembled(digits);
      if(isValidComChannel(freq)){
        var matches = lookupFrequency(freq);
        s.textContent = matches.length ? ('Valid \u00b7 '+matches.join(' / ')) : 'Valid';
        s.style.color = '#047857';
      } else {
        s.textContent = 'Outside 117.975\u2013137.000 MHz range';
        s.style.color = '#b45309';
      }
    }
  }

  box.querySelectorAll('.fc-key').forEach(function(k){
    k.addEventListener('click', function(){
      var v = k.getAttribute('data-k');
      if(v === 'clear'){
        digits = '';
      } else if(v === 'ok'){
        if(digits.length === 5){
          onDone(assembled(digits));
          document.body.removeChild(ov);
          return;
        }
      } else {
        // Digit: if already 5 digits entered, start fresh with this digit
        if(digits.length >= 5) digits = v;
        else digits += v;
      }
      refresh();
    });
  });
  qs('#fc-cancel', box).addEventListener('click', function(){
    document.body.removeChild(ov);
  });
  ov.addEventListener('click', function(e){
    if(e.target === ov) document.body.removeChild(ov);
  });
}

function getDuration(baseId, ctx){
  var h = qs('#'+baseId+'-h', ctx);
  var m = qs('#'+baseId+'-m', ctx);
  if(!h || !m) return null;
  if(h.value === '' && m.value === '') return null;
  var hv = parseInt(h.value)||0;
  var mv = parseInt(m.value)||0;
  return hv + mv/60;
}
function setDuration(baseId, ctx, hours){
  var h = qs('#'+baseId+'-h', ctx);
  var m = qs('#'+baseId+'-m', ctx);
  if(!h || !m) return;
  // Don't overwrite if the user is currently focused on either dropdown
  if(document.activeElement === h || document.activeElement === m) return;
  if(hours===null || hours===undefined || isNaN(hours) || hours<=0){
    h.value = ''; m.value = '';
    return;
  }
  var totalMin = Math.round(hours * 60 / 5) * 5;  // round to nearest 5 min
  var hh = Math.floor(totalMin / 60);
  var mm = totalMin % 60;
  if(hh > 9) hh = 9;
  h.value = String(hh);
  m.value = ('0'+mm).slice(-2);
}

// decimal difference, wraps midnight
function timeDiff(s,e){
  if(s===null||e===null) return null;
  var d=e-s;
  if(d<0) d+=24;
  // Round to nearest 0.1 hr (6 min)
  return Math.round(d*10)/10;
}

// decimal -> "H:MM"
function decToHM(d){
  if(d===null||d===undefined||isNaN(d)) return '--';
  var h=Math.floor(d), m=Math.round((d-h)*60);
  return h+':'+(m<10?'0':'')+m;
}

// decimal -> 2dp string
function escapeHtml(s){
  if(s===null||s===undefined) return '';
  return String(s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}

function dec2(v){
  if(v===null||v===undefined||isNaN(v)) return '--';
  return parseFloat(v).toFixed(2);
}

// tacho/hobbs end - start (raw, not rounded - logbook records use exact reading)
function instrDiff(s,e){
  var sv=parseFloat(s), ev=parseFloat(e);
  if(isNaN(sv)||isNaN(ev)) return null;
  var d=ev-sv;
  if(d<0) return null;
  return d;
}

// ============================================================
// WEATHER FETCH
// ============================================================
// Fetch raw text from a NOAA URL by trying a sequence of public CORS
// proxies. Returns the first successful non-empty response, or '' with
// the last error message. Free proxies come and go; this gives us
// resilience without requiring the user to register anywhere.
function fetchViaProxy(targetUrl, cb){
  var proxies = [
    function(u){ return 'https://api.codetabs.com/v1/proxy/?quest=' + encodeURIComponent(u); },
    function(u){ return 'https://corsproxy.io/?url=' + encodeURIComponent(u); },
    function(u){ return 'https://proxy.corsfix.com/?' + encodeURIComponent(u); },
    function(u){ return 'https://cors.x2u.in/' + encodeURIComponent(u); },
    function(u){ return 'https://api.allorigins.win/raw?url=' + encodeURIComponent(u); }
  ];
  var attempts = [];
  function tryNext(i){
    if(i >= proxies.length){
      cb('', 'all proxies failed: ' + attempts.join(' | '));
      return;
    }
    var url = proxies[i](targetUrl);
    var name = url.replace(/^https?:\/\//,'').split('/')[0];
    fetch(url)
      .then(function(r){
        if(!r.ok) throw new Error('HTTP '+r.status);
        return r.text();
      })
      .then(function(t){
        // Reject obvious error responses
        if(!t || t.length < 6 ||
           /^Host not in allowlist/i.test(t) ||
           /^error/i.test(t.trim()) ||
           /^<!DOCTYPE|^<html/i.test(t.trim())){
          attempts.push(name+': empty/blocked');
          tryNext(i+1);
          return;
        }
        cb(t, '');
      })
      .catch(function(e){
        attempts.push(name+': '+(e.message||e));
        tryNext(i+1);
      });
  }
  tryNext(0);
}

// Fetch METAR (last 6 hr) + TAF for an ICAO airport.
// If user has set an AVWX token, try that first (most reliable).
// Otherwise (or on failure) fall back through several public CORS proxies
// of NOAA aviationweather.gov.
// Calls cb(metar, taf, errMsg) - errMsg empty on success.
function fetchWx(icao, cb){
  if(!icao) { cb('','','no ICAO'); return; }
  icao = icao.toUpperCase();
  var key = localStorage.getItem('fd_avwx_key') || '';

  function clean(t){
    if(!t) return '';
    return t.split('\n').map(function(l){return l.trim();})
      .filter(function(l){
        if(l.length<6) return false;
        if(l.charAt(0)==='<') return false;
        if(/^Host not/i.test(l)) return false;
        if(/^error/i.test(l)) return false;
        if(l.indexOf('No data')>=0) return false;
        return true;
      }).join('\n');
  }

  // Inner helper - the NOAA proxy chain (used as primary or as AVWX fallback)
  function tryNoaa(){
    var noaaMetar = 'https://aviationweather.gov/api/data/metar?ids='+icao+'&format=raw&hours=6';
    var noaaTaf   = 'https://aviationweather.gov/api/data/taf?ids='+icao+'&format=raw';
    var metar='', taf='', done=0, errs=[];
    function fin(){
      if(++done===2){
        if(!metar && !taf){
          // Try nearest-station fallback
          findNearestStation(icao, function(near, nearErr, distNm){
            if(!near){
              cb('','','no data for '+icao+' and no nearest station: '+(nearErr||'unknown')+' -- check token / try later');
              return;
            }
            var m2='', t2='', d2=0;
            function fin2(){
              if(++d2===2){
                var prefix = '[Nearest: '+near+(distNm?' ('+distNm+' nm)':'')+'] ';
                cb(m2 ? prefix+m2 : '', t2 ? prefix+t2 : '',
                   (m2||t2) ? '' : 'no data for '+icao+' or nearest '+near);
              }
            }
            fetchViaProxy('https://aviationweather.gov/api/data/metar?ids='+near+'&format=raw&hours=6',
              function(t){ m2 = clean(t); fin2(); });
            fetchViaProxy('https://aviationweather.gov/api/data/taf?ids='+near+'&format=raw',
              function(t){ t2 = clean(t); fin2(); });
          });
          return;
        }
        cb(metar, taf, '');
      }
    }
    fetchViaProxy(noaaMetar, function(t, err){
      metar = clean(t); if(!metar) errs.push('METAR via proxy: '+err); fin();
    });
    fetchViaProxy(noaaTaf, function(t, err){
      taf = clean(t); if(!taf) errs.push('TAF via proxy: '+err); fin();
    });
  }

  // ---- AVWX path (if user has a token) ----
  if(key){
    var avwxQ = '?token='+encodeURIComponent(key.trim())+'&onfail=nearest';
    var metar='', taf='', done=0, errs=[], gotAuthError=false, needsNearest=false;
    function fin(){
      if(++done===2){
        // Auth error - fall through to NOAA proxy (last resort)
        if(gotAuthError && !metar && !taf){
          console.log('AVWX auth failed - falling back to NOAA proxy');
          tryNoaa();
          return;
        }
        if(metar || taf){ cb(metar, taf, ''); return; }
        // Both failed. Try coord-based lookup via AVWX station DB before giving up.
        if(needsNearest){
          tryAvwxByCoord();
          return;
        }
        // Report the specific error without slow NOAA fallback (skip when AVWX set)
        cb('', '', 'AVWX: '+(errs.join(' | ')||'no data available'));
      }
    }
    // Look up nearest reporting station: get coords for the ICAO, then
    // ask AVWX for the closest METAR/TAF to those coords.
    function tryAvwxByCoord(){
      function withCoords(lat, lon){
        var coord = lat.toFixed(4)+','+lon.toFixed(4);
        var m2='', t2='', d2=0;
        function fin2(){
          if(++d2===2){
            if(m2||t2) cb(m2, t2, '');
            else cb('', '', 'AVWX: no reporting station within range of '+icao);
          }
        }
        fetch('https://avwx.rest/api/metar/'+coord+avwxQ)
          .then(function(r){ return r.text(); })
          .then(function(t){
            var j=null; try { j = JSON.parse(t); } catch(e){}
            if(j && j.raw){
              m2 = j.raw;
              if(j.station && j.station !== icao) m2 = '[Nearest: '+j.station+'] '+m2;
            }
            fin2();
          }).catch(function(){ fin2(); });
        fetch('https://avwx.rest/api/taf/'+coord+avwxQ)
          .then(function(r){ return r.text(); })
          .then(function(t){
            var j=null; try { j = JSON.parse(t); } catch(e){}
            if(j && j.raw) t2 = j.raw;
            fin2();
          }).catch(function(){ fin2(); });
      }
      // Try AVWX station endpoint first
      fetch('https://avwx.rest/api/station/'+icao+'?token='+encodeURIComponent(key.trim()))
        .then(function(r){ return r.text(); })
        .then(function(txt){
          var d=null;
          try { d = JSON.parse(txt); } catch(e){}
          if(d && d.latitude && d.longitude){
            withCoords(d.latitude, d.longitude);
            return;
          }
          // AVWX doesn't know this ICAO - try airportdb.io as a coord source
          fetch('https://api.airportdb.io/api/v1/airport/'+icao+'?apiToken=public')
            .then(function(r){ return r.json(); })
            .then(function(d2){
              if(d2 && d2.latitude_deg && d2.longitude_deg){
                withCoords(parseFloat(d2.latitude_deg), parseFloat(d2.longitude_deg));
              } else {
                cb('', '', 'AVWX: station '+icao+' not in database; airportdb also empty');
              }
            }).catch(function(e){
              cb('', '', 'AVWX: no coords for '+icao+' ('+e+')');
            });
        }).catch(function(e){
          cb('', '', 'AVWX: station lookup failed: '+e);
        });
    }
    fetch('https://avwx.rest/api/metar/'+icao+avwxQ)
      .then(function(r){
        if(r.status===401||r.status===403) gotAuthError=true;
        return r.text();
      })
      .then(function(txt){
        var d=null;
        try { d = JSON.parse(txt); } catch(e){}
        if(d && d.raw){
          metar = d.raw;
          if(d.station && d.station !== icao) metar = '[Nearest: '+d.station+'] ' + metar;
        } else if(d && d.error){
          errs.push('METAR: '+d.error);
          needsNearest = true;
        } else if(!d) {
          errs.push('METAR: non-JSON response');
          needsNearest = true; // try coord-based lookup
        } else {
          // JSON but no raw and no error - likely no data
          needsNearest = true;
        }
        fin();
      }).catch(function(e){ errs.push('METAR: '+e); needsNearest = true; fin(); });
    fetch('https://avwx.rest/api/taf/'+icao+avwxQ)
      .then(function(r){
        if(r.status===401||r.status===403) gotAuthError=true;
        return r.text();
      })
      .then(function(txt){
        var d=null;
        try { d = JSON.parse(txt); } catch(e){}
        if(d && d.raw) taf = d.raw;
        else if(d && d.error) { errs.push('TAF: '+d.error); needsNearest = true; }
        else if(!d) { errs.push('TAF: non-JSON response'); needsNearest = true; }
        else needsNearest = true;
        fin();
      }).catch(function(e){ errs.push('TAF: '+e); needsNearest = true; fin(); });
    return;
  }

  // No AVWX key - go directly to NOAA proxy path
  tryNoaa();
}

// Find the closest reporting station to a given ICAO airport.
// Uses NOAA's stationinfo for a wide regional list of stations,
// then computes distances client-side. This avoids the bbox endpoint
// which seems to be rejected by some proxies.
function findNearestStation(icao, cb){
  geocodeIcao(icao, function(lat, lon, src){
    if(lat===null || lon===null){
      cb(null, 'could not locate '+icao+' (tried: '+src+')');
      return;
    }
    findNearestFromCoords(lat, lon, icao, cb);
  });
}

// Hand-curated list of major reporting stations by region. When NOAA's
// dynamic bbox query is unavailable through proxies, we test these known
// reporters against the failed ICAO's location and pick the closest one
// that has live METAR data.
var KNOWN_REPORTERS = [
  // UK & Ireland
  'EGLL','EGKK','EGSS','EGGW','EGLC','EGGD','EGTE','EGFF','EGNX','EGCC',
  'EGNT','EGNM','EGPH','EGPD','EGPF','EGPK','EGAA','EINN','EIDW','EICK',
  'EGLF','EGUL','EGUN','EGVN','EGYP','EGWU','EGVA','EGUW','EGOS','EGOV',
  'EGXC','EGXT','EGSC','EGTK','EGHI','EGJB','EGJJ','EGKB','EGMD','EGMC',
  // Continental Europe (commonly used alternates)
  'LFPG','LFPB','LFPO','EBBR','EHAM','EDDF','EDDM','EDDH','EKCH','ESSA',
  // US (in case someone enters US codes)
  'KJFK','KLAX','KORD','KATL','KDFW','KSEA','KBOS','KIAD','KIAH','KMIA'
];

function findNearestFromCoords(lat, lon, originalIcao, cb){
  if(isNaN(lat)||isNaN(lon)){ cb(null, 'bad coords'); return; }
  function gcNm(la1, lo1, la2, lo2){
    var R = 3440.065;
    var p1 = la1*Math.PI/180, p2 = la2*Math.PI/180;
    var dp = (la2-la1)*Math.PI/180;
    var dl = (lo2-lo1)*Math.PI/180;
    var a = Math.sin(dp/2)*Math.sin(dp/2) +
            Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)*Math.sin(dl/2);
    return 2*R*Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
  }
  var MAX_DIST_NM = 60;

  // Try the bbox endpoint first - works when proxies cooperate
  var deg = 0.75;
  var bbox = (lon-deg)+','+(lat-deg)+','+(lon+deg)+','+(lat+deg);
  fetchViaProxy('https://aviationweather.gov/api/data/metar?bbox='+encodeURIComponent(bbox)+'&format=json&hours=2',
    function(text){
      if(text){
        try {
          var arr = JSON.parse(text);
          if(Array.isArray(arr) && arr.length){
            var best=null, bestD=Infinity;
            arr.forEach(function(s){
              if(!s.icaoId || s.icaoId === originalIcao) return;
              var sLat = parseFloat(s.lat), sLon = parseFloat(s.lon);
              if(isNaN(sLat)||isNaN(sLon)) return;
              var d = gcNm(lat, lon, sLat, sLon);
              if(d > MAX_DIST_NM) return;
              if(d<bestD){ bestD=d; best=s.icaoId; }
            });
            if(best){ cb(best, '', Math.round(bestD)); return; }
          }
        } catch(e){}
      }
      // Fallback: try a known-list approach. Fetch METAR for all reporters
      // in one batch, get the lat/lon of each from the response, pick closest.
      var ids = KNOWN_REPORTERS.filter(function(s){return s !== originalIcao;}).join(',');
      fetchViaProxy('https://aviationweather.gov/api/data/metar?ids='+ids+'&format=json&hours=2',
        function(text2){
          if(!text2){ cb(null, 'no list data'); return; }
          try {
            var arr2 = JSON.parse(text2);
            if(!Array.isArray(arr2) || !arr2.length){ cb(null, 'empty list'); return; }
            var best2=null, bestD2=Infinity;
            arr2.forEach(function(s){
              if(!s.icaoId || s.icaoId === originalIcao) return;
              var sLat = parseFloat(s.lat), sLon = parseFloat(s.lon);
              if(isNaN(sLat)||isNaN(sLon)) return;
              var d = gcNm(lat, lon, sLat, sLon);
              if(d > MAX_DIST_NM) return;
              if(d<bestD2){ bestD2=d; best2=s.icaoId; }
            });
            if(best2) cb(best2, '', Math.round(bestD2));
            else cb(null, 'no station within '+MAX_DIST_NM+' nm of '+originalIcao);
          } catch(e){ cb(null, 'list parse error'); }
        });
    });
}

// Try several geocoding sources, calling cb(lat, lon, attemptedSources)
function geocodeIcao(icao, cb){
  var attempts = [];
  // 1. NOAA's stationinfo (only works for stations they track - airliner-grade)
  fetchViaProxy('https://aviationweather.gov/api/data/stationinfo?ids='+icao+'&format=json',
    function(text){
      if(text){
        try {
          var data = JSON.parse(text);
          if(Array.isArray(data) && data.length && data[0].lat && data[0].lon){
            cb(parseFloat(data[0].lat), parseFloat(data[0].lon), 'noaa');
            return;
          }
        } catch(e){}
      }
      attempts.push('noaa');
      // 2. OurAirports - public CSV listing every airport. We use a JSON wrapper.
      // airportdb.io doesn't need an API key for unauthenticated lookups
      fetchViaProxy('https://api.airportdb.io/api/v1/airport/'+icao+'?apiToken=public',
        function(text2){
          if(text2){
            try {
              var d2 = JSON.parse(text2);
              if(d2 && d2.latitude_deg && d2.longitude_deg){
                cb(parseFloat(d2.latitude_deg), parseFloat(d2.longitude_deg), 'airportdb');
                return;
              }
            } catch(e){}
          }
          attempts.push('airportdb');
          // 3. Nominatim - URL-encoded query (use %20 not +), via proxy
          var q = encodeURIComponent(icao + ' airport');
          fetchViaProxy('https://nominatim.openstreetmap.org/search?format=json&limit=1&q='+q,
            function(text3){
              if(text3){
                try {
                  var arr = JSON.parse(text3);
                  if(Array.isArray(arr) && arr.length && arr[0].lat && arr[0].lon){
                    cb(parseFloat(arr[0].lat), parseFloat(arr[0].lon), 'nominatim');
                    return;
                  }
                } catch(e){}
              }
              attempts.push('nominatim');
              // 4. Final attempt - Nominatim direct (Safari includes UA)
              fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&q='+q)
                .then(function(r){ return r.json(); })
                .then(function(arr){
                  if(arr && arr.length && arr[0].lat && arr[0].lon){
                    cb(parseFloat(arr[0].lat), parseFloat(arr[0].lon), 'nominatim-direct');
                    return;
                  }
                  attempts.push('nominatim-direct');
                  cb(null, null, attempts.join(','));
                })
                .catch(function(){
                  attempts.push('nominatim-direct-fail');
                  cb(null, null, attempts.join(','));
                });
            });
        });
    });
}


// Parse a "DDHHMMZ" or "HHMMZ" timestamp from a METAR line and return
// the time-of-day in decimal hours, or null.
function metarHour(line){
  var parts = line.trim().split(/\s+/);
  for(var i=0;i<parts.length;i++){
    var tok = parts[i];
    var m6 = tok.match(/^\d{2}(\d{2})(\d{2})Z$/);
    if(m6) return parseInt(m6[1])+parseInt(m6[2])/60;
    var m4 = tok.match(/^(\d{2})(\d{2})Z$/);
    if(m4) return parseInt(m4[1])+parseInt(m4[2])/60;
  }
  return null;
}

// Return the (start, end) filter window for a flight's weather.
// Uses planned takeoff -1hr / planned landing +1hr when available,
// else falls back to chocks-off / chocks-on.
function flightWxWindow(f){
  function shiftHM(hm, dHours){
    var p = parseUTC(hm);
    if(p===null) return hm;
    var v = p + dHours;
    if(v<0) v += 24;
    if(v>=24) v -= 24;
    var hh = Math.floor(v);
    var mm = Math.round((v-hh)*60);
    return ('0'+hh).slice(-2)+':'+('0'+mm).slice(-2);
  }
  if(f.pTakeoff && f.pLanding){
    return { start: shiftHM(f.pTakeoff, -1), end: shiftHM(f.pLanding, 1) };
  }
  return { start: f.chocksOff, end: f.chocksOn };
}

// Filter METAR text to only lines within ±MARGIN hr of the flight window.
// If no chocks times are set, falls back to current UTC ± MARGIN.
function filterMetars(txt, chocksOff, chocksOn){
  if(!txt) return txt;
  var off = parseUTC(chocksOff);
  var on = parseUTC(chocksOn);
  var MARGIN = 1.0;
  var ws, we;
  if(off===null && on===null){
    var d=new Date();
    var nowH = d.getUTCHours() + d.getUTCMinutes()/60;
    ws = nowH - MARGIN;
    we = nowH + MARGIN;
  } else {
    ws = (off!==null ? off : on) - MARGIN;
    we = (on!==null ? on : off) + MARGIN;
  }
  if(ws<0) ws+=24;
  if(we>=24) we-=24;
  var lines = txt.split('\n').filter(function(l){return l.trim().length>6;});
  var inWindow = function(h){
    if(h===null) return true;
    return ws<=we ? (h>=ws && h<=we) : (h>=ws || h<=we);
  };
  var keep = lines.filter(function(l){ return inWindow(metarHour(l)); });
  return keep.length ? keep.join('\n') : (lines[0]||txt);
}


// Returns {hwAbs, hwLabel:'HW'|'TW', xwAbs, xwLabel:'L'|'R'}
function rwyWind(rwyNum, windDir, windSpd){
  var r = parseFloat(rwyNum)*10;
  var d = parseFloat(windDir);
  var s = parseFloat(windSpd);
  if(isNaN(r)||isNaN(d)||isNaN(s)) return null;
  var angle = (d - r) * Math.PI / 180;
  var hw = s * Math.cos(angle);
  var xw = s * Math.sin(angle);
  return {
    hwAbs: Math.round(Math.abs(hw)),
    hwLabel: hw >= 0 ? 'HW' : 'TW',
    xwAbs: Math.round(Math.abs(xw)),
    xwLabel: xw >= 0 ? 'R' : 'L'
  };
}

var USG_TO_L = 3.785;

// Build a fuel input: single entry box + USG/L unit dropdown + read-only
