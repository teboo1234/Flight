// Wire a fuel input: keep canonical USG in dataset.usg; converting values
// on unit switch or user input; output span shows "X.XX USG / Y.YY L".
// onChange fires after the canonical value is up to date.
function wireFuelPair(baseId, ctx, onChange){
  var input = qs('#'+baseId, ctx);
  var unit = qs('#'+baseId+'-u', ctx);
  var out = qs('#'+baseId+'-out', ctx);
  if(!input || !unit) return;

  function refreshOut(){
    if(!out) return;
    var canonical = parseFloat(input.dataset.usg);
    if(isNaN(canonical)){ out.innerHTML = ''; return; }
    out.innerHTML = '<span class="fuel-usg">'+Math.round(canonical)+'</span> <span class="fuel-usg-lbl">USG</span> / '+
                    '<span class="fuel-l">'+Math.round(canonical*USG_TO_L)+'</span> <span class="fuel-l-lbl">L</span>';
  }

  // Initial: dataset.usg was set from HTML; if a value was pre-filled
  // in USG mode, dataset already matches
  refreshOut();

  input.addEventListener('input', function(){
    var v = parseFloat(input.value);
    if(isNaN(v)){
      input.dataset.usg = '';
    } else {
      // Convert to USG based on current unit
      input.dataset.usg = (unit.value === 'L') ? (v / USG_TO_L).toFixed(4) : String(v);
    }
    refreshOut();
    if(onChange) onChange();
  });

  unit.addEventListener('change', function(){
    var v = parseFloat(input.value);
    var prev = input.dataset.unit || 'USG';
    if(!isNaN(v) && prev !== unit.value){
      if(prev === 'USG' && unit.value === 'L'){
        input.value = String(Math.round(v * USG_TO_L));
      } else if(prev === 'L' && unit.value === 'USG'){
        input.value = String(Math.round(v / USG_TO_L));
      }
    }
    input.dataset.unit = unit.value;
    refreshOut();
    if(onChange) onChange();
  });
}
// Helper for collectFields: reads the canonical USG value from a fuel input
function fuelUSG(baseId, ctx){
  var el = qs('#'+baseId, ctx);
  if(!el) return '';
  return el.dataset.usg || '';
}

function fuelCalc(f){
  var burn=parseFloat(f.burnRate||settings.defaultBurnRate)||8;
  var initial=parseFloat(f.fob);
  var uplifted=parseFloat(f.fuelUplifted)||0;
  // Total FOB = initial + uplifted (canonical fuel available)
  var fob = isNaN(initial) ? null : initial + uplifted;
  var taxi=parseFloat(f.fuelTaxi)||0;
  var trip=parseFloat(f.fuelTrip)||0;
  var contPct=parseFloat(f.fuelContPct);
  if(isNaN(contPct)) contPct=5;
  var cont=trip*contPct/100;
  var alt=parseFloat(f.fuelAlt)||0;
  var fin=parseFloat(f.fuelFinal)||0;
  var extra=parseFloat(f.fuelExtra)||0;
  var total=taxi+trip+cont+alt+fin+extra;
  return{
    burn:burn,
    initial:isNaN(initial)?null:initial,
    uplifted:uplifted,
    fob:fob,
    taxi:taxi, trip:trip, cont:cont, contPct:contPct,
    alt:alt, final_:fin, extra:extra,
    total:total,
    surplus:fob===null?null:fob-total,
    endurance:(fob===null||burn<=0)?null:fob/burn
  };
}

// Fuel/time countdown table - shows fuel and endurance remaining at 30 min intervals
function fuelTable(fob, burn){
  if(isNaN(fob)||isNaN(burn)||burn<=0) return [];
  var rows=[];
  var hr=0;
  while(true){
    var fuelRem=fob - burn*hr;
    if(fuelRem<=0){
      rows.push({hr:hr, fuel:0, endurance:0, exhausted:true});
      break;
    }
    rows.push({hr:hr, fuel:fuelRem, endurance:fuelRem/burn, exhausted:false});
    hr+=0.5;
    if(hr>20) break; // safety cap
  }
  return rows;
}

// ============================================================
// FLIGHT CALCULATIONS (times)
// ============================================================
function flCalc(f){
  return {
    block: timeDiff(parseUTC(f.chocksOff), parseUTC(f.chocksOn)),
    air:   timeDiff(parseUTC(f.takeoff),   parseUTC(f.landing)),
    tacho: instrDiff(f.tachoStart, f.tachoEnd),
    hobbs: instrDiff(f.hobbsStart, f.hobbsEnd),
    lesson: timeDiff(parseUTC(f.lessonStart), parseUTC(f.lessonEnd)),
    circuit: timeDiff(parseUTC(f.circuitStart), parseUTC(f.circuitEnd))
  };
}

// ============================================================
// OpenAIP frequency database — cache all GB airport frequencies,
// then look up entered frequencies against the cache.
// ============================================================
var STATION_CACHE_KEY = 'fd_openaip_gb_stations';
function getStationCache(){
  try {
    var raw = localStorage.getItem(STATION_CACHE_KEY);
    if(!raw) return null;
    return JSON.parse(raw);
  } catch(e){ return null; }
}
// Parse a stored wind string like "240/12" or "240/12G18" into {dir,spd,gust}
function parseWind(w){
  if(!w) return null;
  var m = String(w).match(/^(\d{1,3})\/(\d{1,2})(?:G(\d{1,2}))?$/);
  if(!m) return null;
  return { dir: parseInt(m[1]), spd: parseInt(m[2]), gust: m[3] ? parseInt(m[3]) : null };
}
// Migration: pack legacy dir+spd fields into combined "DDD/SS" strings.
function migrateWindFields(f){
  ['Surf','W1k','W2k','W5k'].forEach(function(k){
    var winKey = 'wx'+k+'Wind';
    if(f[winKey]) return;
    var d = f['wx'+k+'Dir'], s = f['wx'+k+'Spd'];
    if(d && s){
      var ds = String(d).replace(/[^0-9]/g,'');
      while(ds.length<3) ds = '0'+ds;
      var ss = String(s).replace(/[^0-9]/g,'');
      while(ss.length<2) ss = '0'+ss;
      f[winKey] = ds+'/'+ss;
    }
  });
}

// (117-137 MHz, 5 kHz increments — covering all 8.33 kHz + 25 kHz + 50 kHz + 100 kHz channels).
function isValidComChannel(freqStr){
  var m = freqStr && freqStr.match(/^(\d+)\.(\d{1,3})$/);
  if(!m) return false;
  var mhz = parseInt(m[1]);
  if(mhz < 117 || mhz > 137) return false;
  var frac = m[2];
  while(frac.length<3) frac += '0';
  var k = parseInt(frac);
  if(isNaN(k)) return false;
  return k % 5 === 0;
}

function fetchOpenAipUKStations(key, cb){
  // GET /airports?country=GB&limit=1000 with fields we need
  var url = 'https://api.core.openaip.net/api/airports?country=GB&limit=1000&apiKey='+encodeURIComponent(key);
  fetch(url)
    .then(function(r){
      if(!r.ok) throw new Error('HTTP '+r.status);
      return r.json();
    })
    .then(function(json){
      var items = json.items || json.data || [];
      if(!Array.isArray(items)) items = [];
      var stations = [];
      var invalidExamples = [];
      var invalidCount = 0;
      items.forEach(function(ap){
        if(!ap.frequencies || !Array.isArray(ap.frequencies)) return;
        var icao = ap.icaoCode || '';
        var apName = ap.name || icao;
        ap.frequencies.forEach(function(fq){
          var v = fq.value || fq.frequency || '';
          if(!v) return;
          var num = parseFloat(v);
          if(isNaN(num)) return;
          var norm = num.toFixed(3);
          var typeName = fq.name || fq.type || '';
          if(typeof typeName !== 'string') typeName = '';
          var lbl = (icao ? icao+' ' : '') + (typeName ? typeName.toUpperCase() : apName);
          stations.push({ freq:norm, label:lbl, icao:icao, apName:apName });
          // Cross-reference: is this frequency selectable in our spinner?
          if(!isValidComChannel(norm)){
            invalidCount++;
            if(invalidExamples.length<5) invalidExamples.push(norm+' ('+lbl+')');
          }
        });
      });
      var cache = { ts: Date.now(), count: stations.length, invalidCount: invalidCount, stations: stations };
      try { localStorage.setItem(STATION_CACHE_KEY, JSON.stringify(cache)); }
      catch(e){ cb('Cache too big for localStorage', 0); return; }
      if(invalidCount>0){
        console.warn('OpenAIP: '+invalidCount+' UK frequencies fall outside the 117-137 MHz / 8.33 kHz spinner range. Examples:', invalidExamples);
      }
      cb(null, stations.length, invalidCount);
    })
    .catch(function(e){
      cb(String(e), 0, 0);
    });
}
// Look up a frequency string like "122.400" against the cache.
// Returns an array of matching station labels (may be multiple for shared freqs).
function lookupFrequency(freqStr){
  var cache = getStationCache();
  if(!cache || !cache.stations) return [];
  return cache.stations
    .filter(function(s){ return s.freq === freqStr; })
    .map(function(s){ return s.label; });
}

      badges+='<span class="badge b-am">Cct '+cTimes+cDur+'</span>';
    }
    // Spectrum strip - which sections have data filled in?
    var has1 = !!(f.student||f.oilLevel||f.oilAdded||f.eobt||f.ctot||f.pTakeoff||f.pLanding); // Info
    var has2 = !!(f.chocksOff||f.takeoff||f.landing||f.chocksOn||f.tachoStart||f.hobbsStart);     // Times
    var has3 = !!(f.wxSurfDir||f.wxSurfSpd||f.wxTAS||f.wxMetar1||f.wxMetar2||f.wxMetar3||f.wxMetar4); // Weather
    var has4 = !!(f.fob||f.fuelUplifted||f.burnRate||f.fuelTrip);                                 // Fuel
    var has5 = !!(f.defects && f.defects.toUpperCase().replace(/\s/g,'') !== 'NONE');             // Defects (only if non-"None")
    var spectrum = '<div class="spec">'+
      '<span class="s1'+(has1?' on':'')+'" title="Flight Info"></span>'+
      '<span class="s2'+(has2?' on':'')+'" title="Times"></span>'+
      '<span class="s3'+(has3?' on':'')+'" title="Weather"></span>'+
      '<span class="s4'+(has4?' on':'')+'" title="Fuel"></span>'+
      '<span class="s5'+(has5?' on':'')+'" title="Defects"></span>'+
    '</div>';
    card.innerHTML=
      spectrum+
      '<div class="ctitle">'+(f.date||'No date')+' &middot; '+(f.aircraft||'?')+'</div>'+
      '<div class="cmeta">'+
        '<span class="badge b-sky">'+(f.departure||'?')+'&#8594;'+(f.destination||'?')+'</span>'+
        (f.student?'<span class="badge b-sl">'+f.student+'</span>':'')+
      '</div>'+
      (badges?'<div style="display:flex;gap:5px;flex-wrap:wrap;margin-top:5px">'+badges+'</div>':'');
    card.addEventListener('click',function(){ flActive=f.id; renderFlList(); renderFlDetail(); });
    list.appendChild(card);
  });
}

function renderFlDetail(){
  var det=qs('#fl-detail');
  if(!flActive){
    det.innerHTML='<div class="empty"><div class="empty-icon">&#9992;</div><span>Select a flight or log a new one</span></div>';
    return;
  }
  var f=flights.filter(function(x){ return x.id===flActive; })[0];
  if(!f){ det.innerHTML='<div class="empty">Not found</div>'; return; }

  var c=flCalc(f);
  var fc=fuelCalc(f);

  det.innerHTML='';
  var box=el('div','dbox');

  // -- Header --
  var dh=el('div','dh');
  dh.innerHTML=
    '<div>'+
      '<div class="dtitle">'+(f.date||'--')+' &middot; '+(f.aircraft||'Unknown')+'</div>'+
      '<div class="cmeta" style="margin-top:6px">'+
        '<span class="badge b-sky">'+(f.departure||'?')+' &#8594; '+(f.destination||'?')+'</span>'+
        (f.student?'<span class="badge b-sl">'+f.student+'</span>':'')+
      '</div>'+
    '</div>'+
    '<div class="dactions">'+
      '<button class="btn btn-g" id="fl-edit-btn">Edit</button>'+
      '<button class="btn btn-g" id="fl-exp-btn">&#8595; Export</button>'+
      '<button class="btn btn-d" id="fl-del-btn">Delete</button>'+
    '</div>';
  box.appendChild(dh);

  // ============== FLIGHT INFO (slate-blue) ==============
  var info=el('div','scard s-info');
  var hasPlanned = f.eobt||f.ctot||f.pTakeoff||f.pLanding;
  // Build a normalised list of frequencies (from the array, or migrate from legacy)
  var freqList = [];
  if(Array.isArray(f.frequencies)){
    freqList = f.frequencies.filter(function(x){ return x && (x.value || x.label); });
  } else {
    [1,2,3,4,5].forEach(function(n){
      if(f['freq'+n]) freqList.push({ label: f['freq'+n+'Label']||'', value: f['freq'+n] });
    });
  }
  var hasFreqs = freqList.length > 0;
  var freqsHtml = '';
  if(hasFreqs){
    freqsHtml = '<div class="sec-lbl" style="margin-top:14px">Frequencies</div>'+
      '<div style="display:flex;flex-direction:column;gap:6px;margin-bottom:6px">'+
      freqList.map(function(fr, i){
        return '<div style="display:flex;justify-content:space-between;align-items:center;padding:6px 12px;background:rgba(255,255,255,.6);border-radius:7px;border:1px solid rgba(30,58,138,.15)">'+
          '<span style="font-size:13px;color:var(--text)">'+escapeHtml(fr.label||('Freq '+(i+1)))+'</span>'+
          '<span class="calc-num" style="color:#1e3a8a;font-size:15px">'+escapeHtml(fr.value||'--')+'</span>'+
        '</div>';
      }).join('')+'</div>';
  }
  info.innerHTML=
    '<div class="scard-head"><span class="ico">&#9992;</span> Flight Info</div>'+
    freqsHtml+
    '<div class="g2" style="margin-bottom:10px">'+
      '<div><div class="sec-lbl">Student / Co-pilot</div><div class="sec-box">'+(f.student||'--')+'</div></div>'+
    '</div>'+
    (hasPlanned ? '<div style="margin-top:14px;display:flex;flex-direction:column;gap:6px">'+
      '<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 12px;background:rgba(255,255,255,.6);border-radius:7px;border:1px solid rgba(30,58,138,.15)">'+
        '<span class="sec-lbl" style="margin:0">EOBT (Off-Block)</span>'+
        '<span class="calc-num" style="color:#1e3a8a;font-size:16px">'+(f.eobt||'--')+'</span>'+
      '</div>'+
      '<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 12px;background:rgba(255,255,255,.6);border-radius:7px;border:1px solid rgba(30,58,138,.15)">'+
        '<span class="sec-lbl" style="margin:0">CTOT (Slot)</span>'+
        '<span class="calc-num" style="color:#1e3a8a;font-size:16px">'+(f.ctot||'--')+'</span>'+
      '</div>'+
      '<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 12px;background:rgba(255,255,255,.6);border-radius:7px;border:1px solid rgba(30,58,138,.15)">'+
        '<span class="sec-lbl" style="margin:0">Planned Takeoff</span>'+
        '<span class="calc-num" style="color:#1e3a8a;font-size:16px">'+(f.pTakeoff||'--')+'</span>'+
      '</div>'+
      '<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 12px;background:rgba(255,255,255,.6);border-radius:7px;border:1px solid rgba(30,58,138,.15)">'+
        '<span class="sec-lbl" style="margin:0">Planned Landing</span>'+
        '<span class="calc-num" style="color:#1e3a8a;font-size:16px">'+(f.pLanding||'--')+'</span>'+
      '</div>'+
    '</div>' : '');
  box.appendChild(info);

  // ============== TIMES (cyan) ==============
  var tc=el('div','scard s-times');
  tc.innerHTML=
    '<div class="scard-head"><span class="ico">&#9201;</span> Times</div>'+
    '<div class="g4" style="margin-bottom:14px">'+
      '<div><div class="sec-lbl">Chocks Off</div><div class="sec-box">'+(f.chocksOff||'--')+'</div></div>'+
      '<div><div class="sec-lbl">Takeoff</div><div class="sec-box">'+(f.takeoff||'--')+'</div></div>'+
      '<div><div class="sec-lbl">Landing</div><div class="sec-box">'+(f.landing||'--')+'</div></div>'+
      '<div><div class="sec-lbl">Chocks On</div><div class="sec-box">'+(f.chocksOn||'--')+'</div></div>'+
    '</div>'+
    '<div class="g4" style="gap:14px;background:rgba(255,255,255,.55);border:1px dashed rgba(14,116,144,.3);border-radius:9px;padding:12px;margin-bottom:14px">'+
      '<div><div class="sec-lbl">Block Time</div><div class="calc-num" style="font-size:20px;color:#0e7490">'+decToHM(c.block)+'</div><div class="calc-sub">'+(c.block!==null?dec2(c.block)+' hrs':'')+'</div></div>'+
      '<div><div class="sec-lbl">Air Time</div><div class="calc-num" style="font-size:20px;color:#0e7490">'+decToHM(c.air)+'</div><div class="calc-sub">'+(c.air!==null?dec2(c.air)+' hrs':'')+'</div></div>'+
      '<div><div class="sec-lbl">Tacho</div><div class="calc-num" style="font-size:18px;color:#0e7490">'+dec2(c.tacho)+'</div><div class="calc-sub">'+(f.tachoStart||'?')+' &#8594; '+(f.tachoEnd||'?')+'</div></div>'+
      '<div><div class="sec-lbl">Hobbs</div><div class="calc-num" style="font-size:18px;color:#0e7490">'+dec2(c.hobbs)+'</div><div class="calc-sub">'+(f.hobbsStart||'?')+' &#8594; '+(f.hobbsEnd||'?')+'</div></div>'+
    '</div>'+
    // Lesson + Circuit
    ((c.lesson!==null||c.circuit!==null||f.lessonStart||f.circuitStart) ?
      '<div class="g2" style="gap:14px">'+
        '<div><div class="sec-lbl">Lesson Time</div><div class="sec-box"><span class="calc-num" style="color:#0e7490">'+(c.lesson!==null?decToHM(c.lesson):'--')+'</span>'+
          (f.lessonStart||f.lessonEnd ? '<div class="calc-sub">'+(f.lessonStart||'?')+' &#8594; '+(f.lessonEnd||'?')+' UTC</div>' : '')+'</div></div>'+
        '<div><div class="sec-lbl">Circuit Time</div><div class="sec-box"><span class="calc-num" style="color:#0e7490">'+(c.circuit!==null?decToHM(c.circuit):'--')+'</span>'+
          (f.circuitStart||f.circuitEnd ? '<div class="calc-sub">'+(f.circuitStart||'?')+' &#8594; '+(f.circuitEnd||'?')+' UTC</div>' : '')+'</div></div>'+
      '</div>' : '');
  box.appendChild(tc);

  // ============== FUEL (amber) ==============
  var burnLabel=fc.burn!==null ? fc.burn+' USG/hr' : 'not set';
  var fcard=el('div','scard s-fuel');
  fcard.innerHTML=
    '<div class="scard-head"><span class="ico">&#9981;</span> Fuel <span style="font-weight:400;font-size:12px;color:var(--muted);margin-left:8px;letter-spacing:.05em">Burn '+burnLabel+'</span></div>'+
    '<div class="g3" style="gap:10px;margin-bottom:10px">'+
      '<div><div class="sec-lbl">Initial Fuel</div>'+
        '<div class="sec-box">'+(fc.initial!==null?dec2(fc.initial)+' USG':'--')+'</div></div>'+
      '<div><div class="sec-lbl">Fuel Uplifted</div>'+
        '<div class="sec-box">'+(fc.uplifted?dec2(fc.uplifted)+' USG':'--')+'</div></div>'+
      '<div><div class="sec-lbl">Total Fuel on Board</div>'+
        '<div class="sec-box calc-num" style="color:#b45309">'+(fc.fob!==null?dec2(fc.fob)+' USG':'--')+'</div></div>'+
    '</div>'+
    '<div class="g3" style="gap:10px;margin-bottom:10px">'+
      '<div><div class="sec-lbl">Total Required</div>'+
        '<div class="sec-box calc-num" style="color:#b45309">'+dec2(fc.total)+' USG</div></div>'+
      '<div><div class="sec-lbl">Surplus / Deficit</div>'+
        '<div class="sec-box calc-num" style="color:'+(fc.surplus===null?'var(--muted)':fc.surplus>=0?'#047857':'#be123c')+'">'+
          (fc.surplus!==null?(fc.surplus>=0?'+':'')+dec2(fc.surplus)+' USG':'--')+'</div></div>'+
      '<div><div class="sec-lbl">Endurance</div>'+
        '<div class="sec-box calc-num" style="color:#0284c7">'+
          (fc.endurance!==null?decToHM(fc.endurance)+' ('+dec2(fc.endurance)+' hrs)':'--')+'</div></div>'+
    '</div>'+
    (f.fuelLanding ? '<div class="g3" style="gap:10px"><div><div class="sec-lbl">Actual Fuel on Landing</div><div class="sec-box calc-num" style="color:#6d28d9">'+dec2(parseFloat(f.fuelLanding))+' USG / '+dec2(parseFloat(f.fuelLanding)*USG_TO_L)+' L</div></div></div>' : '');
  box.appendChild(fcard);

  // ============== WEATHER (violet) ==============
  var hasWxData = f.wxTAS || f.wxSurfDir || f.wxW2kSpd || f.wxW5kSpd ||
                  f.rwy1 || f.rwy2 || f.rwy3 || f.rwy4 ||
                  f.wxMetar1 || f.wxMetar2 || f.wxMetar3 || f.wxMetar4 ||
                  f.wxTaf1 || f.wxTaf2 || f.wxTaf3 || f.wxTaf4;
  if(hasWxData){
    var wcard=el('div','scard s-wx');
    var html = '<div class="scard-head"><span class="ico">&#9925;</span> Weather</div>';
    if(f.wxTAS){
      var tasN = parseFloat(f.wxTAS);
      function driftTxt(spdRaw){
        var s = parseFloat(spdRaw);
        return (!isNaN(tasN)&&tasN>0&&!isNaN(s)) ? ((s/tasN)*60).toFixed(1)+'\u00b0' : '--';
      }
      html += '<div style="background:rgba(109,40,217,.06);border:1px solid rgba(109,40,217,.25);border-radius:9px;padding:10px 12px;margin-bottom:10px">'+
        '<div style="font-family:JetBrains Mono,monospace;font-size:11px;color:#6d28d9;text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px">Max Drift @ TAS '+f.wxTAS+' kt</div>'+
        '<div style="display:grid;grid-template-columns:repeat(2,1fr);gap:6px">'+
          '<div style="display:flex;justify-content:space-between"><span class="sec-lbl" style="margin:0">Surface</span><span class="calc-num" style="color:#6d28d9">'+driftTxt(f.wxSurfSpd)+'</span></div>'+
          '<div style="display:flex;justify-content:space-between"><span class="sec-lbl" style="margin:0">1000\'</span><span class="calc-num" style="color:#6d28d9">'+driftTxt(f.wxW1kSpd)+'</span></div>'+
          '<div style="display:flex;justify-content:space-between"><span class="sec-lbl" style="margin:0">2000\'</span><span class="calc-num" style="color:#6d28d9">'+driftTxt(f.wxW2kSpd)+'</span></div>'+
          '<div style="display:flex;justify-content:space-between"><span class="sec-lbl" style="margin:0">5000\'</span><span class="calc-num" style="color:#6d28d9">'+driftTxt(f.wxW5kSpd)+'</span></div>'+
        '</div>'+
      '</div>';
    }
    if(f.wxSurfDir||f.wxSurfSpd||f.wxW1kDir||f.wxW1kSpd||f.wxW2kDir||f.wxW2kSpd||f.wxW5kDir||f.wxW5kSpd){
      var windRows = [];
      if(f.wxSurfDir||f.wxSurfSpd) windRows.push(['Surface', (f.wxSurfDir||'--')+'\u00b0 / '+(f.wxSurfSpd||'--')+' kt']);
      if(f.wxW1kDir||f.wxW1kSpd)   windRows.push(["1000' wind", (f.wxW1kDir||'--')+'\u00b0 / '+(f.wxW1kSpd||'--')+' kt']);
      if(f.wxW2kDir||f.wxW2kSpd)   windRows.push(["2000' wind", (f.wxW2kDir||'--')+'\u00b0 / '+(f.wxW2kSpd||'--')+' kt']);
      if(f.wxW5kDir||f.wxW5kSpd)   windRows.push(["5000' wind", (f.wxW5kDir||'--')+'\u00b0 / '+(f.wxW5kSpd||'--')+' kt']);
      html += '<div style="display:flex;flex-direction:column;gap:6px;margin-bottom:10px">';
      windRows.forEach(function(r){
        html += '<div class="sec"><div class="sec-lbl">'+r[0]+'</div><div class="sec-box">'+r[1]+'</div></div>';
      });
      html += '</div>';
    }
    if(f.wxSurfDir||f.wxSurfSpd){
      var rwRows = [];
      [f.rwy1,f.rwy2,f.rwy3,f.rwy4].forEach(function(rwy){
        if(!rwy) return;
        var rw = rwyWind(rwy, f.wxSurfDir, f.wxSurfSpd);
        if(!rw) return;
        var hwCol = rw.hwLabel==='HW' ? '#047857' : '#be123c';
        rwRows.push(
          '<div style="display:flex;gap:14px;align-items:center;font-size:13px;font-family:JetBrains Mono,monospace;padding:7px 10px;background:rgba(255,255,255,.65);border-radius:7px">'+
            '<span style="color:#6d28d9;min-width:75px;font-weight:700">RWY '+('0'+rwy).slice(-2)+'</span>'+
            '<span><span style="color:var(--muted);font-size:12px">'+rw.hwLabel+': </span><span class="calc-num" style="color:'+hwCol+'">'+rw.hwAbs+' kt</span></span>'+
            '<span><span style="color:var(--muted);font-size:12px">XW: </span><span class="calc-num" style="color:#b45309">'+rw.xwAbs+' kt '+rw.xwLabel+'</span></span>'+
          '</div>'
        );
      });
      if(rwRows.length){
        html += '<div style="display:flex;flex-direction:column;gap:5px;margin-bottom:10px">' + rwRows.join('') + '</div>';
      }
    }
    [1,2,3,4].forEach(function(n){
      var icao = f['wxIcao'+n];
      var metar = f['wxMetar'+n];
      var taf = f['wxTaf'+n];
      if(!icao && !metar && !taf) return;
      var wxWin = flightWxWindow(f); var filtered = filterMetars(metar, wxWin.start, wxWin.end);
      html += '<div style="background:rgba(255,255,255,.7);border:1px solid rgba(109,40,217,.2);border-radius:9px;padding:11px;margin-bottom:7px">'+
        '<div style="font-family:JetBrains Mono,monospace;font-size:14px;color:#6d28d9;font-weight:700;margin-bottom:7px">'+(icao||'Station '+n)+'</div>';
      if(filtered){
        html += '<div class="sec-lbl">METAR</div>'+
          '<div style="background:var(--card);border:1px solid var(--border);border-radius:6px;padding:8px 10px;font-family:JetBrains Mono,monospace;font-size:13px;white-space:pre-wrap;line-height:1.55;margin-bottom:7px">'+escapeHtml(filtered)+'</div>';
      }
      if(taf){
        html += '<div class="sec-lbl">TAF</div>'+
          '<div style="background:var(--card);border:1px solid var(--border);border-radius:6px;padding:8px 10px;font-family:JetBrains Mono,monospace;font-size:13px;white-space:pre-wrap;line-height:1.55">'+escapeHtml(taf)+'</div>';
      }
      html += '</div>';
    });
    wcard.innerHTML = html;
    box.appendChild(wcard);
  }

  // ============== DEFECTS (rose) ==============
  if(f.defects){
    var dcard=el('div','scard s-defects');
    dcard.innerHTML =
      '<div class="scard-head"><span class="ico">&#9888;</span> Defects</div>'+
      '<div class="sec-box" style="border-color:rgba(190,18,60,.3)">'+escapeHtml(f.defects)+'</div>';
    box.appendChild(dcard);
  }

  // ============== MANEUVERS / NOTES (slate) ==============
  if(f.maneuvers||f.notes){
    var ncard=el('div','scard s-notes');
    var nh = '<div class="scard-head"><span class="ico">&#9998;</span> Notes</div>';
    if(f.maneuvers) nh += '<div class="sec" style="margin-bottom:10px"><div class="sec-lbl">Maneuvers / Exercises</div><div class="sec-box">'+escapeHtml(f.maneuvers)+'</div></div>';
    if(f.notes)     nh += '<div class="sec"><div class="sec-lbl">Instructor Notes</div><div class="sec-box">'+escapeHtml(f.notes)+'</div></div>';
    ncard.innerHTML = nh;
    box.appendChild(ncard);
  }

  // ============== SCRIBBLE / NOTES (slate) ==============
  // Build METAR-style summaries for all ATIS entries
  function _toMetar(e){
    var parts=[];
    if(e.icao) parts.push(e.icao);
    if(e.time) parts.push(e.time.replace(':','')+'Z');
    if(e.info) parts.push('INFO '+e.info);
    if(e.rwy) parts.push('RWY '+e.rwy);
    if(e.wind) parts.push(e.wind.replace('/','')+'KT');
    if(e.vis){ var v=parseInt(e.vis); if(!isNaN(v)) parts.push(v>=10?'9999':('0000'+(v*1000)).slice(-4)); }
    if(e.cloud1) parts.push(e.cloud1);
    if(e.cloud2) parts.push(e.cloud2);
    if(e.cloud3) parts.push(e.cloud3);
    if(e.tempDew) parts.push(e.tempDew);
    if(e.qnh) parts.push('Q'+e.qnh);
    var out = parts.join(' ');
    if(e.notes && e.notes.trim()) out += '\nRMK: '+e.notes.trim();
    return out;
  }
  // Determine the single ATIS entry to display: use f.atisEntry, or migrate from legacy array/flat fields
  var atisEntry = f.atisEntry || null;
  if(!atisEntry && Array.isArray(f.atisEntries) && f.atisEntries.length){
    atisEntry = f.atisEntries[f.atisEntries.length-1];
  }
  if(!atisEntry && (f.atisInfo||f.atisRwy||f.atisWind||f.atisVis||f.atisQnh||f.atisTemp||f.atisDew||f.atisCloud1||f.atisCloud2||f.atisCloud3||f.atisNotes||f.atis)){
    var tempDew = '';
    if(f.atisTemp||f.atisDew){
      var t=f.atisTemp||'', d=f.atisDew||'';
      var tn=t.charAt(0)==='-'; if(tn) t=t.substring(1);
      var dn=d.charAt(0)==='-'; if(dn) d=d.substring(1);
      if(t.length===1) t='0'+t;
      if(d.length===1) d='0'+d;
      tempDew = (t?(tn?'M':'')+t:'')+'/'+(d?(dn?'M':'')+d:'');
    }
    atisEntry = { icao:'', time:'', info:f.atisInfo||'', rwy:f.atisRwy||'', wind:f.atisWind||'', vis:f.atisVis||'', qnh:f.atisQnh||'', tempDew:tempDew, cloud1:f.atisCloud1||'', cloud2:f.atisCloud2||'', cloud3:f.atisCloud3||'', notes:f.atisNotes||f.atis||'' };
  }
  var atisMetar = atisEntry ? _toMetar(atisEntry).trim() : '';
  var hasAnyAtis = !!atisMetar;
  if(hasAnyAtis){
    var scard=el('div','scard s-notes');
    var sh = '<div class="scard-head"><span class="ico">&#9998;</span> Scribble &amp; Notes</div>';
    sh += '<div class="sec-lbl">ATIS</div>'+
      '<div class="sec-box" style="font-family:JetBrains Mono,monospace;font-size:14px;color:#1e3a8a;font-weight:600;margin-bottom:10px;white-space:pre-wrap">'+escapeHtml(atisMetar)+'</div>';
    scard.innerHTML = sh;
    box.appendChild(scard);
  }

  // Clearance card (rose) — scribbles + OCR text
  if(f.scribbleIfr || f.scribbleTaxi || f.scribbleIfrText || f.scribbleTaxiText){
    var clrCard = el('div', 'scard s-clr');
    var ch = '<div class="scard-head"><span class="ico">&#128075;</span> Clearance</div>';

  // Tab switching
  function switchTab(tab){
    var sections={
      info: [qs('#m-section-info',div), qs('#m-section-info-extra',div)],

      times: [qs('#m-section-times',div)],

    };
    var btns={
      info: qs('#m-tab-info',div),
      clr: qs('#m-tab-clr',div),
      times: qs('#m-tab-times',div),
      wx: qs('#m-tab-wx',div),
      fuel: qs('#m-tab-fuel',div)
    };
    Object.keys(sections).forEach(function(k){
      sections[k].forEach(function(el){ if(el) el.style.display = (k===tab ? '' : 'none'); });
      var b=btns[k];
      if(b){
        var col = b.getAttribute('data-color') || '#0284c7';
        if(k===tab){
          b.style.color=col;
          b.style.borderBottomColor=col;
          b.style.fontWeight='700';
        } else {
          b.style.color='var(--muted)';
          b.style.borderBottomColor='transparent';
          b.style.fontWeight='400';
        }
      }
    });
  }

    if(bi) bi.addEventListener('click', function(){ switchTab('info'); });
    if(bc) bc.addEventListener('click', function(){ switchTab('clr'); });

    div.querySelectorAll('.m-now-btn').forEach(function(btn){
      btn.addEventListener('click', function(){
        var target=btn.getAttribute('data-target');
        setTimeSpinnerNow(target, div);
        liveCalc();
      });
    });
    // Today button on the date field
    var todayBtn = qs('#m-date-today', div);
    if(todayBtn){
      todayBtn.addEventListener('click', function(){
        var d = new Date();
        var ymd = d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2);

      if(anyLegacy){
        var tempDew = '';
        if(f.atisTemp || f.atisDew){
          var t = f.atisTemp||'', d = f.atisDew||'';
          var tn = t.charAt(0)==='-'; if(tn) t = t.substring(1);
          var dn = d.charAt(0)==='-'; if(dn) d = d.substring(1);
          if(t.length===1) t = '0'+t;

          icao:'', time:'', info:f.atisInfo||'', rwy:f.atisRwy||'',

    function toMetar(e){
      var parts = [];
      if(e.icao) parts.push(e.icao);
      if(e.time) parts.push(e.time.replace(':','')+'Z');
      if(e.info) parts.push('INFO '+e.info);
      if(e.rwy) parts.push('RWY '+e.rwy);
      if(e.wind) parts.push(e.wind.replace('/','')+'KT');
      if(e.vis){
        var v = parseInt(e.vis);
        if(!isNaN(v)) parts.push(v>=10 ? '9999' : ('0000'+(v*1000)).slice(-4));
      }
      if(e.cloud1) parts.push(e.cloud1);
      if(e.cloud2) parts.push(e.cloud2);
      if(e.cloud3) parts.push(e.cloud3);
      if(e.tempDew) parts.push(e.tempDew);

      return out;

      function currentLblEl(){ return slot.querySelector('.freq-lbl'); }
      function autosizeLabel(){
        var el = currentLblEl();
        if(el && el.tagName === 'INPUT'){

      // Render label as a text input that grows with content
      function renderTextarea(value){

        t.className = 'inp freq-lbl';
        t.placeholder = 'Station';
        t.value = value || '';

        t.style.cssText = 'font-size:12px;font-family:inherit;padding:4px 6px;field-sizing:content;min-width:60px;width:auto';
        t.addEventListener('input', function(){

      // Render label as a dropdown showing all matches + a "Custom..." fallback

      function applyLabelLookup(freq){

            freqBtn.textContent = '1' + mhz + '.' + parts[1];

    // Render existing frequencies plus at least one trailing blank row
    if(f.frequencies.length){
      f.frequencies.forEach(addFreqRow);
      addFreqRow(null); // always keep a blank in hand
    } else {
      addFreqRow(null);
      addFreqRow(null);

    // Ensure there is always at least one empty row after any change.
    // Called after the keypad closes with a new value.
    function ensureBlankRow(){
      var rows = freqContainer.querySelectorAll('.freq-row');

    // + Add button

  // Duration dropdown -> fuel conversion for TTCAFE rows (except Contingency)
  // When user changes hours or minutes, compute fuel = duration x burn rate
  // and update the corresponding fuel input.
  var DUR_PAIRS = [
    {timeId:'m-fuelTaxi-time',  fuelId:'m-fuelTaxi'},
    {timeId:'m-fuelTrip-time',  fuelId:'m-fuelTrip'},
    {timeId:'m-fuelAlt-time',   fuelId:'m-fuelAlt'},
    {timeId:'m-fuelFinal-time', fuelId:'m-fuelFinal'},
    {timeId:'m-fuelExtra-time', fuelId:'m-fuelExtra'}
  ];
  DUR_PAIRS.forEach(function(p){
    ['-h','-m'].forEach(function(sfx){
      var sel = qs('#'+p.timeId+sfx, div);
      if(!sel) return;
      sel.addEventListener('change', function(){
        var hrs = getDuration(p.timeId, div);
        if(hrs === null) return;
        var burn = parseFloat(fuelUSG('m-burnRate',div));
        if(isNaN(burn) || burn<=0) burn = parseFloat(settings.defaultBurnRate);
        if(isNaN(burn) || burn<=0){ toast('Set a burn rate first'); return; }
        var fuelUSGval = hrs * burn;
        var fuelInp = qs('#'+p.fuelId, div);
        if(!fuelInp) return;
        fuelInp.dataset.usg = fuelUSGval.toFixed(4);
        var unitEl = qs('#'+p.fuelId+'-u', div);
        var currUnit = unitEl ? unitEl.value : 'USG';
        fuelInp.value = String(Math.round(currUnit === 'L' ? fuelUSGval * USG_TO_L : fuelUSGval));
        var out = qs('#'+p.fuelId+'-out', div);
        if(out) out.innerHTML = '<span class="fuel-usg">'+Math.round(fuelUSGval)+'</span> <span class="fuel-usg-lbl">USG</span> / '+
                                '<span class="fuel-l">'+Math.round(fuelUSGval*USG_TO_L)+'</span> <span class="fuel-l-lbl">L</span>';
        liveCalc();

  // ICAO inputs: uppercase + show/hide block based on whether code is entered

  // Auto-populate ICAO slots from Departure and Destination.
  // Only accepts complete 4-letter codes to avoid inserting partial values
  // mid-typing. Tracks which slots were filled by route-sync so we can
  // overwrite them cleanly when dep/dest change.
  function syncIcaosFromRoute(){
    var dep  = (qs('#m-dep',  div).value || '').trim().toUpperCase();
    var dest = (qs('#m-dest', div).value || '').trim().toUpperCase();
    var depOk  = /^[A-Z]{4}$/.test(dep)  ? dep  : '';
    var destOk = /^[A-Z]{4}$/.test(dest) ? dest : '';
    // Build canonical list: route codes first (deduped), then keep any
    // user-typed codes from slots that weren't auto-filled.
    var seen = {};
    var result = [];
    function add(code){
      if(!code || code.length!==4) return;
      if(seen[code]) return;
      if(result.length>=4) return;
      seen[code] = true;
      result.push(code);
    }
    add(depOk);
    add(destOk);
    // Keep manually-entered codes from slots not previously auto-filled
    [1,2,3,4].forEach(function(n){
      var el = qs('#m-wxIcao'+n, div);
      if(!el) return;
      if(el.dataset.autofill === '1') return; // was auto-filled, replace it
      var v = (el.value || '').trim().toUpperCase();
      if(/^[A-Z]{4}$/.test(v)) add(v);
    });
    [1,2,3,4].forEach(function(n,i){
      var el = qs('#m-wxIcao'+n, div);
      if(!el) return;
      var newVal = result[i] || '';
      // Mark slot as auto-filled if it came from dep/dest, otherwise clear flag
      var fromRoute = (i===0 && newVal===depOk && depOk) || (i===1 && newVal===destOk && destOk && destOk!==depOk);
      el.dataset.autofill = fromRoute ? '1' : '';
      if(el.value !== newVal) el.value = newVal;
    });
    syncWxBlocks();
  }
  ['m-dep','m-dest'].forEach(function(id){
    var el = qs('#'+id, div);
    if(!el) return;
    el.addEventListener('input', syncIcaosFromRoute);
  });
  syncIcaosFromRoute();

  // Auto-uppercase all text inputs and textareas in the modal.
  // Skip number/date/time fields and the AVWX key (which is case-sensitive).
  function makeUppercase(el){
    if(!el || el.dataset.upper === 'on') return;
    el.dataset.upper = 'on';
    el.style.textTransform = 'uppercase';
    el.addEventListener('input', function(){
      var ss = el.selectionStart, se = el.selectionEnd;
      var newVal = el.value.toUpperCase();
      if(el.value !== newVal){
        el.value = newVal;
        try { el.setSelectionRange(ss, se); } catch(e){}
      }
    });
  }

  // Set the weather status LED.
  // state: 'idle' (grey) | 'pending' (amber pulse) | 'ok' (green) | 'err' (red)
  function setWxLed(state){
    var led = qs('#m-wxLed', div);
    if(!led) return;
    var map = {
      idle:    {bg:'#cbd5e1', border:'#94a3b8', shadow:'none'},
      pending: {bg:'#fcd34d', border:'#b45309', shadow:'0 0 8px rgba(252,211,77,.7)'},
      ok:      {bg:'#22c55e', border:'#047857', shadow:'0 0 10px rgba(34,197,94,.7)'},
      err:     {bg:'#ef4444', border:'#be123c', shadow:'0 0 8px rgba(239,68,68,.6)'}
    };
    var s = map[state] || map.idle;
    led.style.background = s.bg;
    led.style.borderColor = s.border;
    led.style.boxShadow = s.shadow;
  }

  // Run a weather fetch. silent=true suppresses toasts/loud status messages
  // (used by the auto-trigger when times are entered).
  function doWxFetch(silent){
    var icaos = [1,2,3,4].map(function(n){
      return (qs('#m-wxIcao'+n,div).value||'').trim().toUpperCase();
    });
    var validCount = icaos.filter(function(s){return s.length>=3;}).length;
    if(!validCount){
      if(!silent) toast('Enter at least one ICAO code');
      return;
    }
    var status=qs('#m-wxStatus',div);
    status.textContent='Fetching... (this may take a few seconds)';
    status.style.color='#0369a1';
    setWxLed('pending');

    // Filter window = [planned takeoff - 1hr, planned landing + 1hr].
    // Fall back to chocks-off/-on if planned times aren't set.
    var pt = getTimeSpinner('m-pTakeoff',div);
    var pl = getTimeSpinner('m-pLanding',div);
    var off, on;
    function shiftHM(hm, dHours){
      var p = parseUTC(hm);
      if(p===null) return hm;
      var v = p + dHours;
      if(v<0) v += 24;
      if(v>=24) v -= 24;
      var hh = Math.floor(v);
      var mm = Math.round((v-hh)*60);
      return ('0'+hh).slice(-2)+':'+('0'+mm).slice(-2);
    }
    if(pt && pl){
      off = shiftHM(pt, -1);
      on = shiftHM(pl, 1);
    } else {
      off = getTimeSpinner('m-chocksOff',div);
      on = getTimeSpinner('m-chocksOn',div);
    }

    var done=0, expected=validCount, errors=[];
    icaos.forEach(function(icao,i){
      if(icao.length<3) return;
      var n = i+1;
      var block=qs('#m-wxBlock'+n,div);
      if(block) block.style.display='';
      var lbl=qs('#m-wxBlockTitle'+n,div);
      if(lbl) lbl.textContent = icao + '  (fetching...)';

      fetchWx(icao, function(metar, taf, errMsg){
        var filtered = filterMetars(metar, off, on);
        var mEl=qs('#m-wxMetar'+n,div);
        var tEl=qs('#m-wxTaf'+n,div);
        if(mEl) mEl.value = filtered || '';
        if(tEl) tEl.value = taf || '';
        if(lbl) lbl.textContent = icao + (errMsg?'  (FAILED)':'');
        if(errMsg) errors.push(icao+': '+errMsg);
        done++;
        if(done >= expected){
          if(errors.length){
            status.textContent = 'Errors: '+errors.join(' | ');
            status.style.color='#be123c';
            setWxLed('err');
          } else {
            var hasFlightTimes = (off||on) ? true : false;
            var t = new Date();
            var ts = ('0'+t.getHours()).slice(-2)+':'+('0'+t.getMinutes()).slice(-2);
            status.textContent = (hasFlightTimes ? 'Captured at '+ts+' (filtered to flight window)' : 'Captured at '+ts+' (filtered to now)');
            status.style.color='#047857';
            setWxLed('ok');
          }
        }
      });
    });
  }

  // Fetch button - manual trigger
  var fetchBtn=qs('#m-wxFetch',div);
  if(fetchBtn){
    fetchBtn.addEventListener('click', function(){ doWxFetch(false); });
  }

  // Fuel PDF export - opens a print-friendly window with the current
  // fuel plan and triggers the print dialog. On iPad Safari this gives
  // the "Save to Files" -> PDF option.
  var fuelPdfBtn = qs('#m-fuelPdfBtn', div);
  if(fuelPdfBtn){
    fuelPdfBtn.addEventListener('click', function(){
      // Make sure the current form state is captured first
      collectFields();
      var fc = fuelCalc(f);
      var c = flCalc(f);
      var win = window.open('', '_blank');
      if(!win){ toast('Allow popups to export PDF'); return; }
      function row(label, value, calc){
        return '<tr><th>'+label+'</th><td'+(calc?' class="calc"':'')+'>'+(value||'--')+'</td></tr>';
      }
      function dec(v, unit){
        if(v===null||v===undefined||isNaN(v)) return '--';
        return parseFloat(v).toFixed(2) + (unit?' '+unit:'');
      }
      // USG value -> "X.XX USG / Y.YY L"
      function usgL(v){
        if(v===null||v===undefined||isNaN(v)) return '--';
        var u = parseFloat(v);
        return u.toFixed(2)+' USG / '+(u*USG_TO_L).toFixed(2)+' L';
      }
      // Helper: time for a fuel value at current burn rate
      function fuelTime(v){
        if(fc.burn>0 && v!==null && v!==undefined && !isNaN(v)) return decToHM(v / fc.burn);
        return '--';
      }
      var burnRateTxt = (fc.burn!==null) ? fc.burn+' USG/hr ('+(fc.burn*USG_TO_L).toFixed(2)+' L/hr)' : 'not set';
      // Build time-remaining table
      var trRows = '';
      if(fc.fob!==null && fc.taxi!==null && fc.burn>0){
        var remaining = fc.fob - fc.taxi;
        var minutes = 0;
        var safetyLevel = fc.final_;
        while(remaining > 0 && minutes < 360){
          var clr = remaining >= safetyLevel ? '#047857' : (remaining > 0 ? '#b45309' : '#be123c');
          var endHrs = remaining / fc.burn;
          var endHM = decToHM(endHrs);
          trRows += '<tr><td>'+(minutes===0?'0:00':Math.floor(minutes/60)+':'+('0'+(minutes%60)).slice(-2))+'</td>'+
            '<td style="color:'+clr+'">'+dec(remaining, 'USG')+'</td>'+
            '<td style="color:'+clr+'">'+dec(remaining*USG_TO_L, 'L')+'</td>'+
            '<td>'+endHM+'</td></tr>';
          remaining -= fc.burn * 0.5;
          minutes += 30;
        }
      } else {
        trRows = '<tr><td colspan="4" style="color:#64748b;font-style:italic">Enter FOB, Taxi and Burn Rate to see fuel remaining over time.</td></tr>';
      }
      var html =
        '<!DOCTYPE html><html><head><meta charset="utf-8">'+
        '<title>Fuel Plan -- '+(f.date||'--')+' '+(f.aircraft||'')+'</title>'+
        '<style>'+
        '@page{size:A4;margin:14mm}'+
        'body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#0f172a;line-height:1.5;margin:0;padding:0}'+
        'h1{font-size:22px;margin:0 0 4px;color:#b45309}'+
        'h2{font-size:14px;text-transform:uppercase;letter-spacing:.1em;color:#b45309;border-bottom:2px solid #b45309;padding-bottom:4px;margin:20px 0 10px}'+
        '.hdr{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px;border-bottom:1px solid #cbd5e1;padding-bottom:10px}'+
        '.meta{font-size:13px;color:#475569}'+
        'table{width:100%;border-collapse:collapse;margin-bottom:14px}'+
        'th,td{text-align:left;padding:6px 10px;font-size:13px;border-bottom:1px solid #e2e8f0}'+
        'th{font-weight:600;color:#475569;text-transform:uppercase;font-size:11px;letter-spacing:.06em;width:45%}'+
        'td{font-family:"SF Mono","JetBrains Mono",monospace}'+
        'td.calc{font-weight:700;color:#b45309}'+
        '.tt-table th{width:14%}'+
        '.tt-table td{width:14%}'+
        '.ttcafe-tbl th:first-child{width:35%}'+
        '.ttcafe-tbl th:nth-child(2){width:45%}'+
        '.ttcafe-tbl th:last-child{width:20%;text-align:right}'+
        '.ttcafe-tbl td:nth-child(2){width:45%}'+
        '.ttcafe-tbl td:last-child{text-align:right}'+
        '.foot{margin-top:24px;font-size:11px;color:#64748b;text-align:center;border-top:1px solid #cbd5e1;padding-top:10px}'+
        '@media print{button{display:none}}'+
        '.printbtn{display:block;margin:14px auto;padding:10px 24px;background:#b45309;color:white;border:none;border-radius:7px;font-size:14px;font-weight:600;cursor:pointer}'+
        '</style></head><body>'+
        '<button class="printbtn" onclick="window.print()">Print / Save as PDF</button>'+
        '<h1>Fuel Plan</h1>'+
        '<div class="hdr">'+
          '<div>'+
            '<div style="font-size:18px;font-weight:600">'+(f.aircraft||'Aircraft ?')+' &middot; '+(f.departure||'?')+' &rarr; '+(f.destination||'?')+'</div>'+
            '<div class="meta">'+(f.date||'--')+(f.student?' &middot; Student '+f.student:'')+'</div>'+
          '</div>'+
          '<div class="meta">Burn rate: <strong>'+burnRateTxt+'</strong></div>'+
        '</div>'+

        '<h2>Fuel On Board</h2>'+
        '<table>'+
          row('Initial Fuel', usgL(fc.initial))+
          row('Fuel Uplifted', usgL(fc.uplifted))+
          row('<strong>Total Fuel on Board</strong>', usgL(fc.fob), true)+
        '</table>'+

        '<h2>TTCAFE Planning</h2>'+
        '<table class="ttcafe-tbl">'+
          '<thead><tr><th>Component</th><th>Fuel</th><th>Time</th></tr></thead>'+
          '<tbody>'+
            '<tr><th>T &mdash; Taxi</th><td>'+usgL(fc.taxi)+'</td><td>'+fuelTime(fc.taxi)+'</td></tr>'+
            '<tr><th>T &mdash; Trip</th><td>'+usgL(fc.trip)+'</td><td>'+fuelTime(fc.trip)+'</td></tr>'+
            '<tr><th>C &mdash; Contingency ('+dec(fc.contPct,'%')+')</th><td class="calc">'+usgL(fc.cont)+'</td><td class="calc">'+fuelTime(fc.cont)+'</td></tr>'+
            '<tr><th>A &mdash; Alternate</th><td>'+usgL(fc.alt)+'</td><td>'+fuelTime(fc.alt)+'</td></tr>'+
            '<tr><th>F &mdash; Final Reserve</th><td>'+usgL(fc.final_)+'</td><td>'+fuelTime(fc.final_)+'</td></tr>'+
            '<tr><th>E &mdash; Extra</th><td>'+usgL(fc.extra)+'</td><td>'+fuelTime(fc.extra)+'</td></tr>'+
            '<tr><th><strong>Total Required</strong></th><td class="calc">'+usgL(fc.total)+'</td><td class="calc">'+fuelTime(fc.total)+'</td></tr>'+
          '</tbody>'+
        '</table>'+

        '<h2>Summary</h2>'+
        '<table>'+
          row('Total Required', usgL(fc.total), true)+
          row('Surplus / Deficit',
            fc.surplus!==null ? (fc.surplus>=0?'+':'-')+usgL(Math.abs(fc.surplus)) : '--', true)+
          row('Endurance Required',
            fc.burn>0 ? decToHM(fc.total/fc.burn) : '--', true)+
          row('Endurance from Total FOB',
            fc.endurance!==null ? decToHM(fc.endurance) : '--', true)+
          // Expected Fuel on Landing = FOB - Taxi - Trip - Extra
          row('Expected Fuel on Landing<br><span style="font-size:10px;font-weight:400;color:#64748b">FOB &minus; Taxi &minus; Trip &minus; Extra</span>',
            (fc.fob!==null) ? (function(){
              var expU = fc.fob - fc.taxi - fc.trip - fc.extra;
              var sign = expU >= 0 ? '' : '-';
              return sign + usgL(Math.abs(expU));
            })() : '--', true)+
          // Expected Fuel from Flight Times = FOB - Taxi - (air_hr * burn)
          (function(){
            var to = parseUTC(f.takeoff), ld = parseUTC(f.landing);
            var airHr = (to!==null && ld!==null) ? timeDiff(to, ld) : null;
            if(fc.fob===null || airHr===null || !(fc.burn>0)) return '';
            var tripActual = airHr * fc.burn;
            var tfu = fc.fob - fc.taxi - tripActual;
            var sign = tfu >= 0 ? '' : '-';
            return row('Expected Fuel from Flight Times<br><span style="font-size:10px;font-weight:400;color:#64748b">FOB &minus; Taxi &minus; (Air '+decToHM(airHr)+' &times; '+fc.burn+' = '+tripActual.toFixed(2)+' USG)</span>',
              sign + usgL(Math.abs(tfu)), true);
          })()+
          (f.fuelLanding ? row('Actual Fuel on Landing', usgL(parseFloat(f.fuelLanding))) : '')+
        '</table>'+

        '<div style="page-break-before:always;break-before:page">'+
          '<h2>Fuel &amp; Time Remaining (every 30 min)</h2>'+
          '<table class="tt-table">'+
            '<thead><tr><th>Elapsed</th><th>Fuel (USG)</th><th>Fuel (L)</th><th>Endurance</th></tr></thead>'+
            '<tbody>'+trRows+'</tbody>'+

        '</div>'+

        '<div class="foot">FlightDeck v148 &middot; '+new Date().toLocaleString()+'</div>'+

      win.document.open();
      win.document.write(html);
      win.document.close();
    });
  }

  // If editing a flight that already has METAR/TAF saved, show green LED
  var hasSaved = [1,2,3,4].some(function(n){
    return (f['wxMetar'+n]||'').length>10 || (f['wxTaf'+n]||'').length>10;
  });
  if(hasSaved){
    setWxLed('ok');
    var s = qs('#m-wxStatus', div);
    if(s){ s.textContent = 'Loaded saved weather'; s.style.color = '#047857'; }
  }

  // Auto-trigger: when both chocks-off + chocks-on are set AND at least one
  // ICAO is filled in, fetch weather automatically (debounced).
  var autoWxTimer = null;
  function maybeAutoFetchWx(){
    var pt = getTimeSpinner('m-pTakeoff',div);
    var pl = getTimeSpinner('m-pLanding',div);
    if(!pt || !pl) return;
    var hasIcao = [1,2,3,4].some(function(n){
      var el=qs('#m-wxIcao'+n,div); return el && el.value.trim().length>=3;
    });
    if(!hasIcao) return;
    setWxLed('pending');
    clearTimeout(autoWxTimer);
    autoWxTimer = setTimeout(function(){ doWxFetch(true); }, 1500);
  }
  // Hook into the planned time spinners and ICAO inputs
  ['m-pTakeoff','m-pLanding'].forEach(function(id){
    ['-h','-m'].forEach(function(sfx){
      var el=qs('#'+id+sfx,div);
      if(el) el.addEventListener('change', maybeAutoFetchWx);
    });
  });
  [1,2,3,4].forEach(function(n){
    var el=qs('#m-wxIcao'+n,div);
    if(el) el.addEventListener('change', maybeAutoFetchWx);
  });

  function liveCalc(){
    var g=function(id){ return qs('#'+id,div).value; };

    // Times
    var block=timeDiff(parseUTC(getTimeSpinner('m-chocksOff',div)), parseUTC(getTimeSpinner('m-chocksOn',div)));
    var air  =timeDiff(parseUTC(getTimeSpinner('m-takeoff',  div)), parseUTC(getTimeSpinner('m-landing',  div)));
    var tacho=instrDiff(g('m-tachoStart'), g('m-tachoEnd'));
    var hobbs=instrDiff(g('m-hobbsStart'), g('m-hobbsEnd'));

    qs('#m-block-v',div).textContent=decToHM(block);
    qs('#m-block-d',div).textContent=block!==null?'('+dec2(block)+' hrs)':'';
    qs('#m-air-v',div).textContent=decToHM(air);
    qs('#m-air-d',div).textContent=air!==null?'('+dec2(air)+' hrs)':'';
    qs('#m-tacho-v',div).textContent=dec2(tacho);
    qs('#m-hobbs-v',div).textContent=dec2(hobbs);

    var lesson=timeDiff(parseUTC(getTimeSpinner('m-lessonStart',div)), parseUTC(getTimeSpinner('m-lessonEnd',div)));
    var circuit=timeDiff(parseUTC(getTimeSpinner('m-circuitStart',div)), parseUTC(getTimeSpinner('m-circuitEnd',div)));
    var lEl=qs('#m-lesson-v',div); if(lEl) lEl.textContent = lesson!==null ? decToHM(lesson)+' ('+dec2(lesson)+' hrs)' : '--';
    var cEl=qs('#m-circuit-v',div); if(cEl) cEl.textContent = circuit!==null ? decToHM(circuit)+' ('+dec2(circuit)+' hrs)' : '--';

    // Fuel
    var fuelF={
      burnRate:fuelUSG('m-burnRate',div),
      fob:fuelUSG('m-fob',div),
      fuelUplifted:fuelUSG('m-fuelUplifted',div),
      fuelTaxi:fuelUSG('m-fuelTaxi',div),
      fuelTrip:fuelUSG('m-fuelTrip',div),
      fuelContPct:g('m-fuelContPct'),
      fuelAlt:fuelUSG('m-fuelAlt',div),
      fuelFinal:fuelUSG('m-fuelFinal',div),
      fuelExtra:fuelUSG('m-fuelExtra',div)
    };
    var fc=fuelCalc(fuelF);
    // Total FOB display
    var tfu=qs('#m-totalFob',div), tfl=qs('#m-totalFobL',div);
    if(fc.fob!==null){
      tfu.textContent=Math.round(fc.fob);
      tfl.textContent=Math.round(fc.fob*USG_TO_L);
    } else {
      tfu.textContent='--';
      tfl.textContent='--';
    }
    function fmtUSGL(v){ return Math.round(v)+' USG / '+Math.round(v*USG_TO_L)+' L'; }
    // Live readout next to contingency % input
    qs('#m-contUSG',div).textContent=Math.round(fc.cont);
    qs('#m-contL',div).textContent=Math.round(fc.cont*USG_TO_L);

    // Time-equivalent for each TTCAFE component at current burn rate
    function setTime(id, fuel){
      var hours = (fc.burn>0 && fuel!==null && fuel!==undefined && !isNaN(fuel)) ? (fuel / fc.burn) : null;
      // Contingency uses a plain text span (not dropdowns)
      if(id === 'm-fuelCont-time'){
        var span = qs('#'+id, div);
        if(span) span.textContent = hours!==null ? decToHM(hours) : '--';
      } else {
        // TTCAFE rows use duration spinners
        setDuration(id, div, hours);
      }
    }
    setTime('m-fuelTaxi-time',  fc.taxi);
    setTime('m-fuelTrip-time',  fc.trip);
    setTime('m-fuelCont-time',  fc.cont);
    setTime('m-fuelAlt-time',   fc.alt);
    setTime('m-fuelFinal-time', fc.final_);
    setTime('m-fuelExtra-time', fc.extra);
    qs('#m-frTotal',div).textContent=fmtUSGL(fc.total);
    // Endurance for total required = total / burn
    var totEndEl=qs('#m-frTotalEnd',div);
    totEndEl.textContent=(fc.burn>0)?decToHM(fc.total/fc.burn):'--';
    var surEl=qs('#m-frSurplus',div);
    var surEndEl=qs('#m-frSurplusEnd',div);
    if(fc.surplus===null){
      surEl.textContent='--';
      surEl.style.color='var(--muted)';
      surEndEl.textContent='--';
      surEndEl.style.color='var(--muted)';
    } else {
      var sign=fc.surplus>=0?'+':'-';
      var abs=Math.abs(fc.surplus);
      surEl.textContent=sign+Math.round(abs)+' USG / '+sign+Math.round(abs*USG_TO_L)+' L';
      surEl.style.color=fc.surplus>=0?'#047857':'#be123c';
      // Surplus endurance = surplus / burn (signed)
      if(fc.burn>0){
        surEndEl.textContent=sign+decToHM(abs/fc.burn);
        surEndEl.style.color=fc.surplus>=0?'#047857':'#be123c';
      } else {
        surEndEl.textContent='--';
      }
    }
    qs('#m-frEnd',div).textContent=fc.endurance!==null?decToHM(fc.endurance):'--';

    // Expected fuel on landing = FOB - Taxi - Trip - Extra
    var expU = qs('#m-frExpLand',div);
    var expL = qs('#m-frExpLandL',div);
    var expVal = null;
    if(fc.fob!==null){
      expVal = fc.fob - fc.taxi - fc.trip - fc.extra;
      expU.textContent = (expVal>=0?'':'-') + Math.round(Math.abs(expVal));
      expL.textContent = ((expVal>=0?'':'-') + Math.round(Math.abs(expVal * USG_TO_L)));
      expU.style.color = expVal >= fc.final_ ? '#047857' : (expVal >= 0 ? '#b45309' : '#be123c');
    } else {
      expU.textContent = '--';
      expL.textContent = '--';
      expU.style.color = 'var(--muted)';
    }

    // Expected fuel from flight times = FOB - Taxi - (Air Time × Burn Rate)
    var tfuU = qs('#m-frTimeFuel',div);
    var tfuL = qs('#m-frTimeFuelL',div);
    var tfuAir = qs('#m-frTimeAir',div);
    if(tfuU){
      var to = parseUTC(getTimeSpinner('m-takeoff',div));
      var ld = parseUTC(getTimeSpinner('m-landing',div));
      var airHr = (to!==null && ld!==null) ? timeDiff(to, ld) : null;
      if(fc.fob!==null && airHr!==null && fc.burn>0){
        var tripActual = airHr * fc.burn;
        var tfuVal = fc.fob - fc.taxi - tripActual;
        tfuU.textContent = (tfuVal>=0?'':'-') + dec2(Math.abs(tfuVal));
        tfuL.textContent = (tfuVal>=0?'':'-') + dec2(Math.abs(tfuVal * USG_TO_L));
        tfuU.style.color = tfuVal >= fc.final_ ? '#047857' : (tfuVal >= 0 ? '#b45309' : '#be123c');
        tfuAir.textContent = 'Air ' + decToHM(airHr) + ' (' + dec2(airHr) + ' hrs) × ' + fc.burn + ' = ' + dec2(tripActual) + ' USG';
      } else {
        tfuU.textContent = '--';
        tfuL.textContent = '--';
        tfuU.style.color = 'var(--muted)';
        tfuAir.textContent = airHr===null ? 'Set takeoff & landing on Times tab' : '';
      }
    }

    // Actual fuel on landing variance vs expected
    var actEl = qs('#m-frActVar',div);
    var actPctEl = qs('#m-frActVarPct',div);
    var actVal = parseFloat(fuelUSG('m-fuelLanding',div));
    if(!isNaN(actVal) && expVal!==null){
      var diff = actVal - expVal;
      var sign = diff>=0?'+':'-';
      var absD = Math.abs(diff);
      actEl.textContent = sign+dec2(absD)+' USG / '+sign+dec2(absD*USG_TO_L)+' L';
      actEl.style.color = diff>=0 ? '#047857' : '#be123c';
      if(expVal !== 0){
        actPctEl.textContent = '('+sign+dec2(Math.abs(diff/expVal*100))+'%)';
      } else {
        actPctEl.textContent = '';
      }
    } else {
      actEl.textContent = '--';
      actEl.style.color = 'var(--muted)';
      actPctEl.textContent = '';
    }

    // Fuel & time remaining countdown table
    var rows=fuelTable(fc.fob, fc.burn);
    var tEl=qs('#m-fuelTable',div);
    if(!rows.length){
      tEl.innerHTML='<span style="color:var(--muted)">Enter FOB and burn rate to see countdown</span>';
    } else {
      var html='<table style="width:100%;border-collapse:collapse">'+
        '<thead><tr style="border-bottom:1px solid rgba(14,165,233,.3)">'+
        '<th style="text-align:left;padding:4px 8px;color:var(--muted);font-weight:500;font-size:12px;text-transform:uppercase">Time</th>'+
        '<th style="text-align:right;padding:4px 8px;color:var(--muted);font-weight:500;font-size:12px;text-transform:uppercase">Fuel Rem (USG)</th>'+
        '<th style="text-align:right;padding:4px 8px;color:var(--muted);font-weight:500;font-size:12px;text-transform:uppercase">Fuel Rem (L)</th>'+
        '<th style="text-align:right;padding:4px 8px;color:var(--muted);font-weight:500;font-size:12px;text-transform:uppercase">Endurance</th>'+
        '</tr></thead><tbody>';
      rows.forEach(function(r){
        var col=r.exhausted?'#be123c':(r.endurance<1?'#b45309':'#047857');
        html+='<tr style="border-bottom:1px solid rgba(51,65,85,.3)">'+
          '<td style="padding:4px 8px;color:#cbd5e1">'+decToHM(r.hr)+'</td>'+
          '<td style="text-align:right;padding:4px 8px;color:'+col+'">'+(r.exhausted?'EMPTY':dec2(r.fuel))+'</td>'+
          '<td style="text-align:right;padding:4px 8px;color:'+col+'">'+(r.exhausted?'EMPTY':dec2(r.fuel*USG_TO_L))+'</td>'+
          '<td style="text-align:right;padding:4px 8px;color:'+col+'">'+(r.exhausted?'0:00':decToHM(r.endurance))+'</td>'+
          '</tr>';
      });
      html+='</tbody></table>';
      tEl.innerHTML=html;
    }

    // Weather wind components for up to 4 runways (uses surface wind)
    var wxEl=qs('#m-wxComponents',div);
    if(wxEl){
      var surfBtn = div.querySelector('button.atis-fld[data-wxfld="Surf"]');
      var w = surfBtn ? parseWind(surfBtn.dataset.val) : null;
      var dir = w ? String(w.dir) : '';
      var spd = w ? String(w.spd) : '';
      var rows=[];
      ['m-rwy1','m-rwy2','m-rwy3','m-rwy4'].forEach(function(id,i){
        var rwy=qs('#'+id,div).value.trim();
        if(!rwy) return;
        var c=rwyWind(rwy,dir,spd);
        if(!c){
          rows.push('<div style="display:flex;gap:10px;align-items:center;font-size:12px"><span style="font-family:JetBrains Mono,monospace;color:var(--muted);min-width:75px">RWY '+('0'+rwy).slice(-2)+'</span><span style="color:var(--muted)">Enter wind direction and speed</span></div>');
          return;

        var hwCol=c.hwLabel==='HW'?'#047857':'#be123c';

          '<div style="display:flex;gap:14px;align-items:center;font-size:12px;font-family:JetBrains Mono,monospace">'+
            '<span style="color:#6d28d9;min-width:75px;font-weight:600">RWY '+('0'+rwy).slice(-2)+'</span>'+
            '<span><span style="color:var(--muted);font-size:12px">'+c.hwLabel+': </span><span style="color:'+hwCol+';font-weight:600">'+c.hwAbs+' kt</span></span>'+
            '<span><span style="color:var(--muted);font-size:12px">XW: </span><span style="color:#b45309;font-weight:600">'+c.xwAbs+' kt '+c.xwLabel+'</span></span>'+

  // Persist current form state without closing the modal

// Build weather text block for emails/exports. Returns array of lines.
function weatherTextLines(f){
  var lines = [];
  var hasAny = f.wxTAS||f.wxSurfDir||f.wxW2kSpd||f.wxW5kSpd||
               f.rwy1||f.rwy2||f.rwy3||f.rwy4||
               f.wxMetar1||f.wxMetar2||f.wxMetar3||f.wxMetar4||
               f.wxTaf1||f.wxTaf2||f.wxTaf3||f.wxTaf4;
  if(!hasAny) return lines;
  logBanner('WEATHER').forEach(function(l){ lines.push(l); });
  if(f.wxTAS) lines.push(logRow('TAS', f.wxTAS+' kt'));
  if(f.wxTAS){
    var tasN = parseFloat(f.wxTAS);
    function _dr(s){
      var n = parseFloat(s);
      return (!isNaN(tasN)&&tasN>0&&!isNaN(n)) ? ((n/tasN)*60).toFixed(1)+' deg' : '--';
    }
    if(f.wxSurfSpd) lines.push(logRow('Max Drift (Surface)', _dr(f.wxSurfSpd), true));
    if(f.wxW1kSpd)  lines.push(logRow("Max Drift (1000')", _dr(f.wxW1kSpd), true));
    if(f.wxW2kSpd)  lines.push(logRow("Max Drift (2000')", _dr(f.wxW2kSpd), true));
    if(f.wxW5kSpd)  lines.push(logRow("Max Drift (5000')", _dr(f.wxW5kSpd), true));
  }
  if(f.wxSurfDir||f.wxSurfSpd) lines.push(logRow('Surface Wind', (f.wxSurfDir||'--')+'deg / '+(f.wxSurfSpd||'--')+' kt'));
  if(f.wxW1kDir||f.wxW1kSpd)   lines.push(logRow("1000' Wind", (f.wxW1kDir||'--')+'deg / '+(f.wxW1kSpd||'--')+' kt'));
  if(f.wxW2kDir||f.wxW2kSpd)   lines.push(logRow("2000' Wind", (f.wxW2kDir||'--')+'deg / '+(f.wxW2kSpd||'--')+' kt'));
  if(f.wxW5kDir||f.wxW5kSpd)   lines.push(logRow("5000' Wind", (f.wxW5kDir||'--')+'deg / '+(f.wxW5kSpd||'--')+' kt'));
  if(f.wxSurfDir||f.wxSurfSpd){
    [f.rwy1,f.rwy2,f.rwy3,f.rwy4].forEach(function(rwy){
      if(!rwy) return;
      var c = rwyWind(rwy, f.wxSurfDir, f.wxSurfSpd);
      if(!c) return;
      lines.push(logRow('  RWY '+('0'+rwy).slice(-2),
        c.hwLabel+' '+c.hwAbs+' kt, XW '+c.xwAbs+' kt '+c.xwLabel, true));
    });
  }
  [1,2,3,4].forEach(function(n){
    var icao = f['wxIcao'+n];
    var metar = f['wxMetar'+n];
    var taf = f['wxTaf'+n];
    if(!icao && !metar && !taf) return;
    var wxWin = flightWxWindow(f); var filtered = filterMetars(metar, wxWin.start, wxWin.end);
    lines.push('', '── '+(icao||'Station '+n)+' ──');
    if(filtered){
      lines.push('METAR:');
      filtered.split('\n').forEach(function(l){ lines.push('  '+l); });
    }
    if(taf){
      lines.push('TAF:');
      taf.split('\n').forEach(function(l){ lines.push('  '+l); });
    }
  });
  return lines;
}

// Format a label/value row with consistent column width.
// Label is left-padded to LABEL_W chars, value is the raw string.
// If calc=true, wraps the value in **asterisks** as a "bold" marker that
// renders as visually emphasized in plain-text email and is preserved in
// downloaded text logs.
function logRow(label, value, calc){
  var LABEL_W = 22;
  var lbl = (label + ':').padEnd ? (label+':').padEnd(LABEL_W) : (label+':' + ' '.repeat(Math.max(0, LABEL_W - (label.length+1))));
  if(!String.prototype.padEnd){
    lbl = label+':'; while(lbl.length<LABEL_W) lbl+=' ';
  }
  var v = (value===null||value===undefined||value==='') ? '--' : String(value);
  if(calc) v = '*'+v+'*';
  return lbl + ' ' + v;
}

// Build a framed section banner using box-drawing chars.
// Returns an array of lines for a heading like:
//   ╭───────────────╮
//   │  FUEL         │
//   ╰───────────────╯
function logBanner(title){
  var inner = ' '+title+' ';
  while(inner.length < 38) inner += ' ';
  var bar = '';
  for(var i=0;i<inner.length;i++) bar += '─';
  return ['', '╭'+bar+'╮', '│'+inner+'│', '╰'+bar+'╯'];
}

// Pre-commit checks - shows a modal listing missing fields and lets the user
// fill them in or cancel. Calls done() when the user confirms.
// Uses its own overlay layer so it doesn't destroy the underlying flight modal.
function runPreCommitChecks(f, done){
  var missing = [];
  if(!f.fuelUplifted || f.fuelUplifted==='0' || f.fuelUplifted==='')
    missing.push({key:'fuelUplifted', label:'Fuel Uplifted (USG)', placeholder:'0', type:'number'});

  if(!f.defects)
    missing.push({key:'defects', label:'Defects (enter "None" if no issues)', placeholder:'None', type:'text'});
  var hasWx = f.wxSurfDir||f.wxSurfSpd||f.wxTAS||
              f.wxMetar1||f.wxMetar2||f.wxMetar3||f.wxMetar4||
              f.wxTaf1||f.wxTaf2||f.wxTaf3||f.wxTaf4;
  var wxFlag = !hasWx;

  if(missing.length===0 && !wxFlag){ done(); return; }

  // Build layered overlay - appended to body, not modal-root
  var ov = document.createElement('div');
  ov.style.cssText = 'position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:200;display:flex;align-items:center;justify-content:center;padding:16px';
  var box = document.createElement('div');
  box.style.cssText = 'background:var(--surface);border:1px solid var(--border);border-radius:10px;max-width:480px;width:100%;max-height:90vh;display:flex;flex-direction:column;box-shadow:0 12px 40px rgba(0,0,0,.25)';
  var hdr = document.createElement('div');
  hdr.style.cssText = 'padding:14px 16px;border-bottom:1px solid var(--border);font-weight:700;font-size:15px';
  hdr.textContent = 'Review Flight';
  var bodyEl = document.createElement('div');
  bodyEl.style.cssText = 'padding:16px;overflow-y:auto;flex:1';

  var inner = '<div style="font-size:14px;margin-bottom:12px;color:var(--text)">Quick check before logging. Fill in anything you want to add, or leave blank to skip.</div>';
  missing.forEach(function(m){
    inner += '<div class="field">'+
      '<label>'+m.label+'</label>'+
      '<input class="inp" id="pc-'+m.key+'" type="'+m.type+'" placeholder="'+m.placeholder+'"'+
        (m.type==='number'?' step="0.1"':'')+
      ' value=""/>'+
    '</div>';
  });
  if(wxFlag){
    inner += '<div style="background:rgba(180,83,9,.08);border:1px solid rgba(180,83,9,.3);border-radius:7px;padding:10px;margin-bottom:10px;font-size:13px;color:var(--text)">'+
      '<strong>No weather captured.</strong> Cancel to add METAR/TAF on the Weather tab, or confirm to proceed anyway.'+
    '</div>';
  }
  bodyEl.innerHTML = inner;

  var foot = document.createElement('div');
  foot.style.cssText = 'padding:10px 16px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end';
  var cancelBtn = document.createElement('button');
  cancelBtn.className = 'btn btn-g';
  cancelBtn.textContent = 'Cancel';
  cancelBtn.addEventListener('click', function(){ document.body.removeChild(ov); });
  var confirmBtn = document.createElement('button');
  confirmBtn.className = 'btn btn-p';
  confirmBtn.textContent = 'Confirm & Log';
  confirmBtn.addEventListener('click', function(){
    missing.forEach(function(m){
      var el = bodyEl.querySelector('#pc-'+m.key);
      if(el && el.value.trim()) f[m.key] = el.value.trim();
    });
    document.body.removeChild(ov);
    done();
  });
  foot.appendChild(cancelBtn);
  foot.appendChild(confirmBtn);

  box.appendChild(hdr);
  box.appendChild(bodyEl);
  box.appendChild(foot);
  ov.appendChild(box);
  document.body.appendChild(ov);
  setTimeout(function(){
    var first = bodyEl.querySelector('input');
    if(first) first.focus();
  }, 50);
}

function emailFlight(f){
  var c=flCalc(f);
  var fc=fuelCalc(f);
  var subj=encodeURIComponent('Flight Record -- '+( f.date||'?')+' - '+(f.aircraft||'?')+' - '+(f.departure||'?')+' to '+(f.destination||'?'));
  var lines=[
    ].concat(logBanner('FLIGHT RECORD'), [
    logRow('Date',         f.date),

  qs('#cl-add-inp',ar).addEventListener('keydown',function(e){ if(e.key==='Enter') ar.querySelector('.btn').click(); });
  box.appendChild(ar); el2.appendChild(box);
  qs('#cl-reset',box).addEventListener('click',function(){
    cl.items=cl.items.map(function(x){ return Object.assign({},x,{done:false}); });

var SW_CODE=[
  "var C='fd-sw-v2';",
  "self.addEventListener('install',function(e){",
  "  e.waitUntil(caches.open(C).then(function(c){ return c.addAll([self.location.pathname]); }).then(function(){ return self.skipWaiting(); }));",
  "});",
  "self.addEventListener('activate',function(e){",
  "  e.waitUntil(caches.keys().then(function(ks){",
  "    return Promise.all(ks.filter(function(k){ return k!==C; }).map(function(k){ return caches.delete(k); }));",
  "  }).then(function(){ return self.clients.claim(); }));",
  "});",
  "self.addEventListener('fetch',function(e){",
  "  if(e.request.method!=='GET') return;",
  "  e.respondWith(caches.match(e.request).then(function(r){",
  "    return r||fetch(e.request).then(function(res){",
  "      if(res.ok){ var cl=res.clone(); caches.open(C).then(function(c){ c.put(e.request,cl); }); }",
  "      return res;",
  "    }).catch(function(){ return caches.match(self.location.pathname); });",
  "  }));",
  "});"
].join('\n');

if('serviceWorker' in navigator){
  try{
    var swBlob=new Blob([SW_CODE],{type:'application/javascript'});
    var swURL=URL.createObjectURL(swBlob);
    navigator.serviceWorker.register(swURL);
  }catch(e){}
}

// Live UTC + local clock on the main page.
// Local offset comes from settings.tzOffset (hours). If not set, uses browser tz.
function updateClock(){
  var now = new Date();
  var utcH = now.getUTCHours();
  var utcM = now.getUTCMinutes();
  var utcS = now.getUTCSeconds();
  var utcEl = qs('#fl-clock-utc');
  var utcDateEl = qs('#fl-clock-utcdate');
  if(!utcEl) { updateCountdowns(now); return; }
  var pad = function(n){ return ('0'+n).slice(-2); };
  utcEl.textContent = pad(utcH)+':'+pad(utcM)+':'+pad(utcS);
  var utcDate = now.getUTCFullYear()+'-'+pad(now.getUTCMonth()+1)+'-'+pad(now.getUTCDate());
  if(utcDateEl) utcDateEl.textContent = utcDate;

  var tzOff = parseFloat(settings.tzOffset);
  if(isNaN(tzOff)) tzOff = -now.getTimezoneOffset()/60;
  var localMs = now.getTime() + (tzOff * 3600 * 1000);
  var l = new Date(localMs);
  var lH = l.getUTCHours(), lM = l.getUTCMinutes(), lS = l.getUTCSeconds();
  var localEl = qs('#fl-clock-local');
  var localDateEl = qs('#fl-clock-localdate');
  var tzLbl = qs('#fl-clock-tz');
  if(localEl) localEl.textContent = pad(lH)+':'+pad(lM)+':'+pad(lS);
  if(localDateEl){
    localDateEl.textContent = l.getUTCFullYear()+'-'+pad(l.getUTCMonth()+1)+'-'+pad(l.getUTCDate());
  }
  if(tzLbl){
    var sign = tzOff>=0?'+':'';
    tzLbl.textContent = 'UTC'+sign+tzOff;
  }
  updateCountdowns(now);
}

// Update countdown displays next to EOBT/CTOT inputs in the modal.
// Called every clock tick. If the input hasn't rendered (modal closed) this
// is a no-op.
function updateCountdowns(now){
  ['m-eobt','m-ctot'].forEach(function(id){
    var h = document.getElementById(id+'-h');
    var m = document.getElementById(id+'-m');
    var out = document.getElementById(id+'-cd');
    if(!out) return;
    if(!h || !m || !h.value || !m.value){
      out.textContent = '--';
      out.style.color = 'var(--muted)';
      return;
    }
    var target = new Date(now);
    target.setUTCHours(parseInt(h.value), parseInt(m.value), 0, 0);
    var diffMs = target.getTime() - now.getTime();
    // If target is more than 12 hours behind, assume tomorrow's slot
    if(diffMs < -12*3600*1000) diffMs += 24*3600*1000;
    var totalSec = Math.round(diffMs / 1000);
    var absSec = Math.abs(totalSec);
    var hrs = Math.floor(absSec / 3600);
    var mins = Math.floor((absSec % 3600) / 60);
    var secs = absSec % 60;
    var pad = function(n){ return ('0'+n).slice(-2); };
    var label = (totalSec >= 0) ? 'in ' : '-';
    var txt = label + (hrs>0 ? hrs+':' : '') + pad(mins) + ':' + pad(secs);
    if(totalSec < 0 && hrs === 0 && mins === 0) txt = 'now';
    out.textContent = txt;
    if(totalSec < 0) out.style.color = '#be123c';
    else if(totalSec < 600) out.style.color = '#b45309';
    else out.style.color = '#047857';
  });
}
setInterval(updateClock, 1000);
updateClock();

// ============================================================
// SCRIBBLE PAD — per-flight canvas notebook.
// Attaches to a specific field on the flight object (base64 PNG).
// Signature: openScribbleForFlight(f, fieldKey, onSaved)
// fieldKey defaults to 'scribble' for backwards compatibility.
// ============================================================

// Tesseract.js is lazy-loaded from CDN only when the user taps an OCR button.
var TESSERACT_URL = 'https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';
function loadTesseract(cb){
  if(window.Tesseract){ cb(null); return; }
  var s = document.createElement('script');
  s.src = TESSERACT_URL;
  s.onload = function(){ cb(null); };
  s.onerror = function(){ cb('Failed to load OCR library (check internet)'); };
  document.body.appendChild(s);
}
function runOCROnImage(pngDataUrl, statusEl, onDone){
  if(!pngDataUrl){
    if(statusEl){ statusEl.textContent = 'No scribble to read'; statusEl.style.color = '#b45309'; }
    onDone(null); return;
  }
  if(statusEl){ statusEl.textContent = 'Loading OCR...'; statusEl.style.color = '#0369a1'; }
  loadTesseract(function(err){
    if(err){
      if(statusEl){ statusEl.textContent = err; statusEl.style.color = '#be123c'; }
      onDone(null); return;
    }
    if(statusEl){ statusEl.textContent = 'Recognising...'; }
    window.Tesseract.recognize(pngDataUrl, 'eng', {
      logger: function(m){
        if(m.status === 'recognizing text' && statusEl){
          statusEl.textContent = 'Recognising... '+Math.round(m.progress*100)+'%';
        }
      }
    }).then(function(result){
      var text = (result && result.data && result.data.text || '').trim();
      if(statusEl){
        statusEl.textContent = text ? 'Done ('+text.length+' chars)' : 'No text detected';
        statusEl.style.color = text ? '#047857' : '#b45309';
      }
      onDone(text);
    }).catch(function(e){
      if(statusEl){ statusEl.textContent = 'OCR failed: '+e; statusEl.style.color = '#be123c'; }
      onDone(null);
    });
  });
}

function openScribbleForFlight(f, fieldKey, onSaved){
  // Back-compat: allow (f, cb) signature
  if(typeof fieldKey === 'function'){ onSaved = fieldKey; fieldKey = 'scribble'; }
  if(!fieldKey) fieldKey = 'scribble';
  var titleMap = { scribbleIfr:'IFR Scribble', scribbleTaxi:'Taxi Scribble', scribble:'Scribble' };
  var title = titleMap[fieldKey] || 'Scribble';

  var ov = document.createElement('div');
  ov.style.cssText = 'position:fixed;inset:0;background:var(--bg);z-index:180;display:flex;flex-direction:column';

  var bar = document.createElement('div');
  bar.style.cssText = 'display:flex;gap:8px;align-items:center;padding:10px 14px;background:var(--surface);border-bottom:1px solid var(--border);flex-wrap:wrap';
  var currentColor = '#0f172a';
  var currentSize = 3;
  var currentTool = 'pen';

  bar.innerHTML =
    '<button class="btn btn-g" id="sc-close" style="padding:6px 12px">&larr; Save &amp; Close</button>'+
    '<div style="width:1px;height:24px;background:var(--border)"></div>'+
    '<button class="btn btn-g" id="sc-eraser" style="padding:6px 12px">Eraser</button>'+
    '<button class="btn btn-g" id="sc-undo" style="padding:6px 12px">Undo</button>'+
    '<div style="flex:1"></div>'+
    '<span style="font-size:12px;color:var(--muted);font-family:JetBrains Mono,monospace">'+
      title+' &middot; '+(f.date||'?')+' '+(f.aircraft||'')+
    '</span>'+
    '<button class="btn btn-d" id="sc-clear" style="padding:6px 12px">Clear</button>';

  // Full-width canvas — no side text pane, no OCR
  var body = document.createElement('div');
  body.style.cssText = 'flex:1;display:flex;overflow:hidden';

  var canvasWrap = document.createElement('div');
  canvasWrap.style.cssText = 'flex:1;position:relative;background:#fff;overflow:hidden;min-width:0';
  var canvas = document.createElement('canvas');
  canvas.style.cssText = 'display:block;touch-action:none;background:#fff';
  canvasWrap.appendChild(canvas);

  body.appendChild(canvasWrap);
  ov.appendChild(bar);
  ov.appendChild(body);
  document.body.appendChild(ov);

  var ctx = canvas.getContext('2d');
  function sizeCanvas(){
    var r = canvasWrap.getBoundingClientRect();
    var tmp = document.createElement('canvas');
    tmp.width = canvas.width || 1;
    tmp.height = canvas.height || 1;
    tmp.getContext('2d').drawImage(canvas, 0, 0);
    var dpr = window.devicePixelRatio || 1;
    canvas.width = Math.floor(r.width * dpr);
    canvas.height = Math.floor(r.height * dpr);
    canvas.style.width = r.width+'px';
    canvas.style.height = r.height+'px';
    ctx = canvas.getContext('2d');
    ctx.scale(dpr, dpr);
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.drawImage(tmp, 0, 0, r.width, r.height);
  }
  sizeCanvas();

  var history = [];
  var HISTORY_MAX = 30;
  function snapshot(){
    try {
      history.push(canvas.toDataURL('image/png'));
      if(history.length>HISTORY_MAX) history.shift();
    } catch(e){}
  }

  // Load existing scribble from the target field
  if(f[fieldKey]){
    var img = new Image();
    img.onload = function(){
      var r = canvasWrap.getBoundingClientRect();
      ctx.drawImage(img, 0, 0, r.width, r.height);
      snapshot();
    };
    img.src = f[fieldKey];
  } else {
    snapshot();
  }

  var drawing = false, last = null;
  function ptFromEvent(e){
    var r = canvas.getBoundingClientRect();
    return { x: e.clientX - r.left, y: e.clientY - r.top };
  }
  canvas.addEventListener('pointerdown', function(e){
    if(e.pointerType === 'touch' && e.isPrimary === false) return;
    drawing = true;
    last = ptFromEvent(e);
    canvas.setPointerCapture(e.pointerId);
    ctx.beginPath();
    ctx.moveTo(last.x, last.y);
  });
  canvas.addEventListener('pointermove', function(e){
    if(!drawing) return;
    var p = ptFromEvent(e);
    if(currentTool === 'eraser'){
      ctx.globalCompositeOperation = 'destination-out';
      ctx.strokeStyle = 'rgba(0,0,0,1)';
      ctx.lineWidth = currentSize * 6;
    } else {
      ctx.globalCompositeOperation = 'source-over';
      ctx.strokeStyle = currentColor;
      ctx.lineWidth = currentSize;
    }
    ctx.lineTo(p.x, p.y);
    ctx.stroke();
    last = p;
  });
  function endStroke(){
    if(!drawing) return;
    drawing = false;
    snapshot();
  }
  canvas.addEventListener('pointerup', endStroke);
  canvas.addEventListener('pointercancel', endStroke);

  bar.querySelector('#sc-eraser').addEventListener('click', function(){
    if(currentTool === 'eraser'){
      currentTool = 'pen';
      bar.querySelector('#sc-eraser').style.background = '';
    } else {
      currentTool = 'eraser';
      bar.querySelector('#sc-eraser').style.background = 'rgba(239,68,68,.15)';
    }
  });
  bar.querySelector('#sc-undo').addEventListener('click', function(){
    if(history.length<=1) return;
    history.pop();
    var prev = history[history.length-1];
    var img = new Image();
    img.onload = function(){
      var r = canvasWrap.getBoundingClientRect();
      ctx.globalCompositeOperation = 'source-over';
      ctx.clearRect(0, 0, r.width, r.height);
      ctx.drawImage(img, 0, 0, r.width, r.height);
    };
    img.src = prev;
  });
  bar.querySelector('#sc-clear').addEventListener('click', function(){
    if(!confirm('Clear the entire scribble page?')) return;
    var r = canvasWrap.getBoundingClientRect();
    ctx.globalCompositeOperation = 'source-over';
    ctx.clearRect(0, 0, r.width, r.height);
    snapshot();
  });

  bar.querySelector('#sc-close').addEventListener('click', function(){
    // Persist canvas as PNG into the target field
    try { f[fieldKey] = canvas.toDataURL('image/png'); } catch(e){}
    if(typeof onSaved === 'function') onSaved();
    document.body.removeChild(ov);
  });

  window.addEventListener('resize', sizeCanvas);
}
